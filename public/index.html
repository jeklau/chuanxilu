","yong":"想对所有客户一视同仁、平均用力？先把最核心的几个老客户服务到极致，口碑才能长出枝叶。","con":"反方：墨家会反驳说，「爱有差等」恰恰是裙带、偏私和派系的根源，也是中国传统社会「人情大于规则」的思想基础。现代伦理学中的普遍主义（如对陌生人的公平义务）更接近墨子，而非儒家。","rec":"陆澄录","kj":[["r","苦","差","氏兼爱无"]]},{"n":94,"t":"当理即无私心","yw":"问：「延平云『当理而无私心』，『当理』与『无私心』，如何分别？」先生曰：「心即理也。无私心即是当理，未当理便是私心。若析心与理言之，恐亦未善。」又问：「释氏于世间一切情欲之私都不染着，似无私心，但外弃人伦，却是未当理。」曰：「亦只是一统事，都只是成就他一个私己的心。」","bh":"陆澄问：「李延平说『合乎天理而没有私心』，『合乎天理』和『没有私心』，怎么区别？」先生说：「心就是理。没有私心就是合乎天理，不合乎天理就是有私心。如果把心和理分开来说，恐怕也不太妥当。」陆澄又问：「佛家对世间一切情欲私心都不沾染，好像没有私心，但他们抛弃人伦，却又像是不合乎天理。」先生说：「这也只是一回事，都只是成就他自己一个私己的心。」","zs":[["当理而无私心","李侗（延平）语，原意是仁者既要合乎天理，又要没有私心。"],["释氏","佛家。佛教创始人释迦牟尼，故称佛家为释氏。"]],"gl":[3,33,49],"q":"佛家不染情欲，为什么阳明还说它有私心？","a":"因为抛弃人伦、只求自己解脱，本身就是成就一个「私己」的心，所以既未当理，也非无私。","con":"反方：大乘佛教以「普度众生」为志，菩萨道恰恰是为他而非为己，说佛家只求「私己」并不公平。阳明对佛家的批评主要针对出家离世的形式，而非佛学全部义理。","rec":"陆澄录","kj":[]},{"n":95,"t":"持志如心痛","yw":"侃问：「持志如心痛，一心在痛上，安有工夫说闲语、管闲事？」先生曰：「初学工夫如此用亦好，但要使知『出入无时，莫知其乡』，心之神明原是如此，工夫方有着落。若只死死守着，恐于工夫上又发病。」","bh":"薛侃问：「坚守志向就像心口疼一样，一心都在疼上，哪有工夫说闲话、管闲事？」先生说：「初学时这样用功也好，但要让他知道『心的出入没有定时，不知道它往哪里去』，心的神明本来就是这样，功夫才有着落。如果只是死死地守着，恐怕在功夫上又会出毛病。」","zs":[["侃","薛侃，字尚谦。从本条起至第129条为薛侃所录。"],["持志如心痛","朱熹语：「持志如心痛，一心在痛上。」"]],"gl":[48,81,16],"q":"「持志如心痛」有什么问题？","a":"初学可以这样，但死死守着会成为新毛病。心本来活泼灵明、出入无时，功夫要顺着心的本性，而不是捆住它。","yong":"专注不是咬牙死盯。盯得太死，人会绷断。","rec":"薛侃录","kj":[["r","人","上","一心在痛"],["r","力","方","如此工夫"],["d","着","","死死守着"]]},{"n":96,"t":"讲求亦只是涵养","yw":"侃问：「专涵养而不务讲求，将认欲作理，则如之何？」先生曰：「人须是知学，讲求亦只是涵养；不讲求，只是涵养之志不切。」曰：「何谓知学？」曰：「且道为何而学？学个甚？」曰：「尝闻先生教，学是学存天理。心之本体即是天理，体认天理只要自心地无私意。」曰：「如此则只须克去私意便是，又愁甚理欲不明？」曰：「正恐这些私意认不真。」曰：「总是志未切。志切，目视耳听皆在此，安有认不真的道理？『是非之心，人皆有之』，不假外求。讲求亦只是体当自心所见，不成去心外别有个见？」","bh":"薛侃问：「只专注于涵养而不去讲求学问，恐怕会把私欲当成天理，那怎么办？」先生说：「人必须懂得怎么学，讲求学问也只是涵养；不去讲求，只是因为涵养的志向不够迫切。」薛侃问：「什么叫懂得怎么学？」先生说：「你先说说，为什么而学？学的是什么？」薛侃说：「曾听先生教导，学就是学存天理。心的本体就是天理，体认天理只要自己心里没有私意。」先生说：「这样的话只要克去私意就是了，还愁什么天理人欲分不清？」薛侃说：「正是怕这些私意认不清。」先生说：「总是因为志向不够迫切。志向迫切了，眼睛看的、耳朵听的都在这上面，哪有认不清的道理？『是非之心，人人都有』，不需要向外寻求。讲求也只是体会自己心中所见，难道还能到心外另有个见解？」","zs":[["是非之心，人皆有之","《孟子·告子上》。"],["体当","体会、体认。"]],"gl":[3,31,65],"q":"担心认不清私欲，阳明怎么回答？","a":"根本在志不切。志真切了，眼看耳听都在这上面，是非之心人人都有，自然认得清。","yong":"「我不知道这样做对不对」，很多时候是你心里知道，只是不想面对。","rec":"薛侃录","kj":[]},{"n":97,"t":"光景与效验都不是功夫","yw":"先生问在坐之友：「此来工夫何似？」一友举虚明意思。先生曰：「此是说光景。」一友叙今昔异同。先生曰：「此是说效验。」二友惘然，请是。先生曰：「吾辈今日用功，只是要为善之心真切。此心真切，见善即迁，有过即改，方是真切工夫。如此则人欲日消，天理日明。若只管求光景、说效验，却是助长外驰病痛，不是工夫。」","bh":"先生问在座的朋友：「近来功夫做得怎样？」一位朋友讲了心中虚静明澈的感受。先生说：「这是在说光景。」另一位朋友讲了自己今昔的变化。先生说：「这是在说效验。」两位朋友都很茫然，请教怎样才对。先生说：「我们今天用功，只是要为善的心真切。这颗心真切了，见到善就去学，有了过错就改，这才是真切的功夫。这样做，人欲一天天消减，天理一天天明白。如果只管追求光景、谈论效验，那反而是助长向外追逐的毛病，不是功夫。」","zs":[["光景","修炼中出现的某种境界感受，如虚明、空灵之类。"],["效验","功夫带来的效果、变化。"]],"gl":[22,30,64],"q":"为什么说「虚明意思」和「今昔异同」都不是功夫？","a":"一个是追求境界感受，一个是盘点成效，都是在功夫之外看结果，助长了向外追逐。真功夫只是见善即迁、有过即改。","yong":"别在朋友圈晒「我今天冥想到了某种状态」「我今年进步了多少」。那是说光景、说效验。","rec":"薛侃录","kj":[["r","翡","辈","先生曰吾"],["r","力","方","有过即改"]]},{"n":98,"t":"我心与晦庵之心未尝异","yw":"朋友观书，多有摘议晦庵者。先生曰：「是有心求异，即不是。吾说与晦庵时有不同者，为入门下手处有毫厘千里之分，不得不辩。然吾之心与晦庵之心，未尝异也。若其余文义解得明当处，如何动得一字？」","bh":"朋友们读书时，常常有挑剔、议论朱熹的。先生说：「如果是存心要和他不一样，那就不对了。我的学说和朱熹有时不同，是因为在入门下手的地方有毫厘千里的差别，不得不辨明。但我的心和朱熹的心，从来没有不同。至于其他那些文义解释得明白恰当的地方，怎么能改动一个字？」","zs":[["晦庵","朱熹。"],["摘议","挑毛病、议论。"]],"gl":[100,6],"q":"阳明批评朱子，弟子们也跟着批，阳明怎么看？","a":"他反对为了标新立异而批评。他与朱子的分歧只在入门下手处，心是相同的，朱子讲得对的地方一字不能改。","yong":"批评竞争对手或前辈之前，问问自己是在辨是非，还是在找存在感。","con":"阳明对朱子的态度其实有复杂的一面：他编过《朱子晚年定论》，把朱熹说成晚年转向心学，被罗钦顺等人指出年代考订有误。可见他在「有心求异」与「求同」之间也不免牵合。","rec":"薛侃录","kj":[["r","羲","义","若其余文"]]},{"n":99,"t":"精金之喻：成色不在分两（核心条）","yw":"希渊问：「圣人可学而至，然伯夷、伊尹于孔子才力终不同，其同谓之圣者安在？」先生曰：「圣人之所以为圣，只是其心纯乎天理，而无人欲之杂，犹精金之所以为精，但以其成色足而无铜铅之杂也。人到纯乎天理方是圣，金到足色方是精。然圣人之才力，亦有大小不同，犹金之分两有轻重。尧、舜犹万镒，文王、孔子犹九千镒，禹、汤、武王犹七八千镒，伯夷、伊尹犹四五千镒。才力不同，而纯乎天理则同，皆可谓之圣人；犹分两虽不同，而足色则同，皆可谓之精金。以五千镒者而入于万镒之中，其足色同也；以夷、尹而厕之尧、孔之间，其纯乎天理同也。盖所以为精金者，在足色而不在分两；所以为圣者，在纯乎天理而不在才力也。故虽凡人，而肯为学，使此心纯乎天理，则亦可为圣人；犹一两之金，比之万镒，分两虽悬绝，而其到足色处，可以无愧。故曰『人皆可以为尧、舜』者以此。学者学圣人，不过是去人欲而存天理耳，犹炼金而求其足色。金之成色所争不多，则煅炼之工省而功易成；成色愈下，则煅炼愈难。人之气质清浊粹驳，有中人以上，中人以下；其于道有生知安行，学知利行，其下者必须人一己百，人十己千，及其成功则一。后世不知作圣之本是纯乎天理，却专去知识才能上求圣人，以为圣人无所不知，无所不能，我须是将圣人许多知识才能逐一理会始得。故不务去天理上着工夫，徒弊精竭力，从册子上钻研，名物上考索，形迹上比拟，知识愈广而人欲愈滋，才力愈多而天理愈蔽。正如见人有万镒精金，不务煅炼成色，求无愧于彼之精纯，而乃妄希分两，务同彼之万镒，锡、铅、铜、铁杂然而投，分两愈增而成色愈下，既其梢末，无复有金矣。」时曰仁在傍，曰：「先生此喻，足以破世儒支离之惑，大有功于后学。」先生又曰：「吾辈用力，只求日减，不求日增。减得一分人欲，便是复得一分天理，何等轻快脱洒，何等简易！」","bh":"蔡希渊问：「圣人可以通过学习达到，但伯夷、伊尹和孔子相比，才能力量终究不同，他们同样被称为圣人，相同在哪里？」先生说：「圣人之所以是圣人，只是因为他的心纯是天理，没有人欲的杂质，就像精金之所以是精金，只是因为它成色十足，没有铜铅的杂质。人到了纯是天理才是圣人，金到了成色十足才是精金。但圣人的才力也有大小不同，就像金子的分量有轻有重。尧舜好比一万镒，文王孔子好比九千镒，禹、汤、武王好比七八千镒，伯夷、伊尹好比四五千镒。才力不同，但纯是天理是相同的，所以都可以叫圣人；就像分量虽不同，但成色十足是相同的，所以都可以叫精金。把五千镒放进一万镒里，成色是一样的；把伯夷、伊尹放在尧和孔子中间，纯是天理是一样的。因为精金之所以为精金，在于成色而不在于分量；圣人之所以为圣人，在于纯是天理而不在于才力。所以即使是普通人，只要肯学，让这颗心纯是天理，也可以成为圣人；就像一两金子和一万镒相比，分量虽然相差悬殊，但在成色十足这一点上，毫无愧色。所以说『人人都可以成为尧舜』，就是这个道理。学者学圣人，不过是去人欲、存天理罢了，就像炼金求它成色十足。金子成色差得不多，冶炼的功夫就省，容易成功；成色越差，冶炼就越难。人的气质有清有浊、有纯有杂，有中等以上的人，有中等以下的人；对于道，有生来就懂、安然实行的，有学了才懂、因有好处才实行的，下等的人必须别人做一次自己做一百次，别人做十次自己做一千次，但等到成功时，结果是一样的。后世的人不知道成为圣人的根本在于纯是天理，却专门在知识才能上求做圣人，以为圣人无所不知、无所不能，我必须把圣人那许多知识才能一一弄懂才行。所以不在天理上下功夫，白白耗尽精力，在书本上钻研，在名物上考证，在形迹上模仿，知识越广，人欲越滋长；才力越多，天理越被遮蔽。这正像看见别人有一万镒精金，不去冶炼提高自己的成色，以求不愧于别人的精纯，却妄想追求分量，一定要和别人的一万镒一样多，把锡、铅、铜、铁胡乱地投进去，分量越增加，成色越低下，到最后，就再也没有金子了。」当时徐爱在旁边，说：「先生这个比喻，足以破除世俗儒者支离破碎的迷惑，对后来的学者大有功劳。」先生又说：「我们用功，只求每天减少，不求每天增加。减去一分人欲，就是恢复了一分天理，多么轻快洒脱，多么简单容易！」","zs":[["希渊","蔡宗兖，字希渊，浙江山阴人，阳明早期弟子。"],["伯夷、伊尹","伯夷是商末孤竹国君之子，不食周粟而死，孟子称为「圣之清者」；伊尹是商汤的贤相，孟子称为「圣之任者」。"],["镒","古代重量单位，一镒为二十两（一说二十四两）。"],["人一己百，人十己千","《中庸》：「人一能之己百之，人十能之己千之。果能此道矣，虽愚必明，虽柔必强。」"],["支离","支离破碎，这是心学批评朱子学的常用词。"]],"gl":[107,30,22],"q":"成圣看的是「成色」还是「分量」？普通人能成圣吗？","a":"看成色（心纯乎天理），不看分量（才力大小）。所以一两的金子成色足也是精金，普通人只要心纯乎天理也可成圣。","yong":"你一个人的工作室比不过大公司的规模（分两），但每一单都做到问心无愧（成色），这就是精金。","con":"反方：把「圣」与才能完全切开，在道德上是激励，但也有代价。明末一些王学后人以「满街都是圣人」自许，轻视学问和能力，被批评为空疏误国。而且「人一己百」的说法也承认了气质差异，并非人人都有同样的起点。","rec":"薛侃录","kj":[["r","人","入","千镒者而"],["r","角","色","金者在足"],["r","此","比","一两之金"],["r","看","着","去天理上"],["r","逃","迹","上考索形"],["r","此","比","索形逃上"]]},{"n":100,"t":"朱子晚年之悔","yw":"士德问曰：「格物之说，如先生所教，明白简易，人人见得。文公聪明绝世，于此反有未审，何也？」先生曰：「文公精神气魄大，是他早年合下便要继往开来，故一向只就考索著述上用功。若先切己自修，自然不暇及此。到得德盛后，果忧道之不明，如孔子退修六籍，删繁就简，开示来学，亦大段不费甚考索。文公早岁便着许多书，晚年方悔是倒做了。」士德曰：「晚年之悔，如谓『向来定本之误』，又谓『虽读得书，何益于吾事』，又谓『此与守书籍，泥言语，全无交涉』，是他到此方悔从前用功之错，方去切己自修矣。」曰：「然。此是文公不可及处，他力量大，一悔便转，可惜不久即去世，平日许多错处皆不及改正。」","bh":"杨士德问：「格物的道理，像先生所教的那样，明白简易，人人都能懂。朱文公聪明绝顶，在这上面反而没有弄清楚，为什么？」先生说：「文公精神气魄宏大，他早年一开始就要继承前人、开导后学，所以一直只在考证著述上下功夫。如果先切身自修，自然没有空闲做这些。等到德行盛大以后，果真担忧道不明，就像孔子晚年退而修订六经那样，删繁就简，开导后学，也基本不用费什么考证功夫。文公早年就写了很多书，到晚年才后悔是做反了。」士德说：「朱子晚年的悔悟，比如他说『以前定本的错误』，又说『即使读了书，对我自身的事有什么益处』，又说『这和死守书本、拘泥言语，完全没有关系』，这是他到这时才后悔以前用功的错误，才去切身自修了。」先生说：「对。这是文公别人比不上的地方，他力量大，一后悔就能转过来，可惜不久就去世了，平时许多错处都来不及改正。」","zs":[["士德","杨骥，字士德，广东饶平人，阳明弟子。"],["文公","朱熹谥号「文」，故称朱文公。"],["合下","一开始、本来。"],["六籍","六经。"],["朱子晚年之悔","阳明曾编《朱子晚年定论》，选录朱熹书信中表示悔悟、强调切己工夫的段落，认为朱子晚年与心学相合。"]],"gl":[98,6,11],"q":"阳明认为朱熹的问题出在哪里？","a":"顺序做反了：早年就急于著书立说、考索文献，而不是先切己自修。","con":"反方：罗钦顺、陈建等人指出，《朱子晚年定论》所选的书信很多并非朱熹晚年所作，阳明的考订不严谨，有为己说找依据之嫌。阳明本人后来也承认「年岁早晚，诚有所未考」。","rec":"薛侃录","kj":[["r","悟","误","来定本之"]]},{"n":101,"t":"侃去花间草：无善无恶（核心条）","yw":"侃去花间草，因曰：「天地间何善难培，恶难去？」先生曰：「未培未去耳。」少间，曰：「此等看善恶，皆从躯壳起念，便会错。」侃未达。曰：「天地生意，花草一般，何曾有善恶之分？子欲观花，则以花为善，以草为恶；如欲用草时，复以草为善矣。此等善恶，皆由汝心好恶所生，故知是错。」曰：「然则无善无恶乎？」曰：「无善无恶者理之静，有善有恶者气之动。不动于气，即无善无恶，是谓至善。」曰：「佛氏亦无善无恶，何以异？」曰：「佛氏着在无善无恶上，便一切都不管，不可以治天下。圣人无善无恶，只是『无有作好』，『无有作恶』，不动于气。然『遵王之道』，『会其有极』，便自一循天理，便有个裁成辅相。」曰：「草既非恶，即草不宜去矣？」曰：「如此却是佛、老意见。草若是碍，何妨汝去？」曰：「如此又是作好作恶。」曰：「不作好恶，非是全无好恶，却是无知觉的人。谓之不作者，只是好恶一循于理，不去又着一分意思。如此，即是不曾好恶一般。」曰：「去草如何是一循于理，不着意思？」曰：「草有妨碍，理亦宜去，去之而已；偶未即去，亦不累心。若着了一分意思，即心体便有贻累，便有许多动气处。」曰：「然则善恶全不在物？」曰：「只在汝心，循理便是善，动气便是恶。」曰：「毕竟物无善恶？」曰：「在心如此，在物亦然。世儒惟不知此，舍心逐物，将格物之学错看了，终日驰求于外，只做得个『义袭而取』，终身行不着，习不察。」曰：「『如好好色，如恶恶臭』，则如何？」曰：「此正是一循于理，是天理合如此，本无私意作好作恶。」曰：「『如好好色，如恶恶臭』，安得非意？」曰：「却是诚意，不是私意。诚意只是循天理。虽是循天理，亦着不得一分意。故有所忿懥好乐，则不得其正，须是廓然大公，方是心之本体。知此即知未发之中。」伯生曰：「先生云『草有妨碍，理亦宜去』，缘何又是躯壳起念？」曰：「此须汝心自体当。汝要去草，是甚么心？周茂叔窗前草不除，是甚么心？」","bh":"薛侃在花丛间除草，于是说：「天地之间，为什么善这么难培养，恶这么难去除？」先生说：「只是没去培养、没去除掉罢了。」过了一会儿，先生说：「像这样看善恶，都是从自己的躯壳上起念头，就会出错。」薛侃没听懂。先生说：「天地的生机，花和草是一样的，哪有善恶之分？你想赏花，就把花当作善，把草当作恶；如果要用草的时候，又会把草当作善了。这类善恶，都是由你心里的好恶生出来的，所以知道是错的。」薛侃说：「那么就是无善无恶了？」先生说：「无善无恶，是理的静止状态；有善有恶，是气的发动。不被气所扰动，就是无善无恶，这就叫至善。」薛侃说：「佛家也讲无善无恶，有什么不同？」先生说：「佛家执着在无善无恶上，就什么都不管了，不能用来治理天下。圣人的无善无恶，只是『不刻意去喜好』『不刻意去厌恶』，不被气所扰动。但『遵循王道』，『归于中正』，自然完全遵循天理，就有了裁度成就、辅助天地的作为。」薛侃说：「草既然不是恶，那草就不该除了？」先生说：「这样想就是佛家道家的见解了。草如果碍事，你除掉它又何妨？」薛侃说：「这样又是刻意喜好、刻意厌恶了。」先生说：「不刻意好恶，不是完全没有好恶，那样就成了没知觉的人。所谓不刻意，只是好恶完全遵循天理，不再另外加上一分私意。这样，就和没有好恶一样。」薛侃说：「除草怎样才是完全遵循天理、不加私意？」先生说：「草有妨碍，按理也应该除掉，除掉就是了；偶尔没有马上除掉，也不放在心上。如果加上了一分私意，心体就有了牵累，就有了许多动气的地方。」薛侃说：「那么善恶完全不在物上？」先生说：「只在你的心上，遵循天理就是善，动了气就是恶。」薛侃说：「归根到底，物是无善无恶的？」先生说：「在心上是这样，在物上也是这样。世俗儒者正因为不懂这一点，舍弃了心去追逐物，把格物之学看错了，整天向外寻求，只做到了『偶然合义就据为己有』，一辈子做了也不明白、习惯了也不省察。」薛侃说：「『就像喜欢美色，就像厌恶恶臭』，又怎么说？」先生说：「这正是完全遵循天理，是天理本该如此，本来没有私意刻意好恶。」薛侃说：「『如好好色，如恶恶臭』，怎么能不是意呢？」先生说：「那是诚意，不是私意。诚意只是遵循天理。虽然是遵循天理，也加不得一分私意。所以心中有愤怒、喜好，心就不能端正，必须廓然大公，才是心的本体。懂了这个，就懂了未发之中。」孟伯生说：「先生说『草有妨碍，按理也应除掉』，为什么又说是从躯壳起念？」先生说：「这要你自己心里去体会。你要除草，是什么心？周敦颐窗前的草不除，是什么心？」","zs":[["去花间草","除去花丛中的杂草。底本作「去花问草」，据通行本改。"],["躯壳起念","从个人的身体、私利、喜好出发产生的念头。"],["无有作好，无有作恶","《尚书·洪范》：「无有作好，遵王之道；无有作恶，遵王之路。」「会其有极，归其有极。」"],["裁成辅相","《周易·泰卦·象传》：「后以财（裁）成天地之道，辅相天地之宜。」"],["行不着，习不察","《孟子·尽心上》：「行之而不著焉，习矣而不察焉。」"],["伯生","孟源，字伯生，即第19条那位「好名」的弟子。"],["周茂叔窗前草不除","周敦颐（字茂叔）窗前杂草不除，有人问他，他说「与自家意思一般」，即草的生意与自己的心意相通。"]],"gl":[19,72,5],"q":"花是善、草是恶吗？那除草对不对？","a":"花草本无善恶，善恶是从自己的好恶起念。草碍事可以除，按理去除就是了，不加私意、不动气；不能因为「草不是恶」就什么都不管，那是佛老。","yong":"你讨厌的那个客户、同行、规则，是它本身「恶」，还是挡了你的路？分清楚，该处理就处理，别带着火气。","con":"反方：「无善无恶者理之静」是后来「四句教」首句「无善无恶心之体」的先声，引发了王门后学数百年的争议。东林党人顾宪成批评它会导致「以无善无恶为宗，则人皆可以为善，亦可以为恶」，模糊道德界限。","rec":"薛侃录","kj":[["r","问","间","侃去花"],["r","埋","理","是一循于"],["r","看","着","循于埋不"],["r","抑","物","恶曰毕竟"],["r","绛","终","学错看了"],["r","看","着","循天理亦"],["r","念","忿","意故有所"]]},{"n":102,"t":"头脑工夫如舟之有舵","yw":"先生谓学者曰：「为学须得个头脑工夫，方有着落。纵未能无间，如舟之有舵，一提便醒。不然，虽从事于学，只做个义袭而取，只是行不着，习不察，非大本达道也。」又曰：「见得时，横说竖说皆是。若于此处通，彼处不通，只是未见得。」","bh":"先生对学者说：「做学问必须找到一个根本的功夫，才有着落。即使还不能做到时时不间断，也像船有了舵，一提起来就能清醒过来。不然，即使在做学问，也只是偶然合义、据为己有，做了也不明白、习惯了也不省察，不是大本达道。」又说：「真看清楚了，横着说竖着说都对。如果这里说得通，那里说不通，只是还没有真看清楚。」","zs":[["头脑","根本、关键。"]],"gl":[3,31,84],"q":"「如舟之有舵」比喻什么？","a":"有了头脑功夫，即使偶尔偏离，一提就醒，能回到正路上。没有头脑，学得再多也是随波漂流。","yong":"检验你是否真懂一个道理：换个角度、换个场景还说得通吗？","rec":"薛侃录","kj":[["r","看","着","工夫方有"]]},{"n":103,"t":"科举不累学，只患夺志","yw":"或问：「为学以亲故，不免业举之累。」先生曰：「以亲之故而业举为累于学，则治田以养其亲者，亦有累于学乎？先正云『惟患夺志』，但恐为学之志不真切耳。」","bh":"有人问：「做学问因为要奉养父母，免不了被准备科举考试所拖累。」先生说：「因为父母的缘故准备科举，就算拖累了学问，那么种田来奉养父母的人，也拖累了学问吗？前贤说『只怕被夺走志向』，只怕做学问的志向不够真切罢了。」","zs":[["业举","为科举考试做准备。"],["先正","前代贤人。这里指程颐，他说「科举之事，不患妨功，惟患夺志」。"]],"gl":[56,16],"q":"为了生计做事，会不会拖累修身？","a":"不会。就像种田养亲不碍学问一样，问题不在做什么事，而在志向是否被夺走。","yong":"做外贸、接单、改网站，都不碍你修身。怕的是做着做着，只剩下钱了。","rec":"薛侃录","kj":[]},{"n":104,"t":"有事无事都忙","yw":"崇一问：「寻常意思多忙，有事固忙，无事亦忙，何也？」先生曰：「天地气机，元无一息之停，然有个主宰，故不先不后，不急不缓，虽千变万化，而主宰常定。人得此而生，若主宰定时，与天运一般不息，虽酬酢万变，常是从容自在，所谓『天君泰然，百体从令』。若无主宰，便只是这气奔放，如何不忙？」","bh":"欧阳崇一问：「平常心里总是很忙乱，有事时当然忙，没事时也忙，为什么？」先生说：「天地间气的运行，本来就没有一刻停止，但有个主宰，所以不早不晚、不急不慢，虽然千变万化，主宰却常常安定。人禀受这个而生，如果主宰安定了，就和天的运行一样永不停息，即使应对千变万化，也总是从容自在，这就是所谓『心君安泰，全身听令』。如果没有主宰，就只是这股气奔腾放纵，怎么能不忙？」","zs":[["崇一","欧阳德，字崇一，江西泰和人，阳明重要弟子，后官至礼部尚书。"],["酬酢","应对、应酬。"],["天君泰然，百体从令","出自范浚《心箴》，朱熹收入《孟子集注》。天君指心。"]],"gl":[70,41,48],"q":"没事的时候也觉得忙，原因是什么？","a":"心没有主宰，只是气在奔放。有主宰时，即使应对万变也从容；没主宰时，闲着也心慌。","yong":"你那种「什么都没干却很累」的感觉，就是这个。不是事多，是心里没主。","rec":"薛侃录","kj":[["r","忌","息","运一般不"]]},{"n":105,"t":"为学大病在好名","yw":"先生曰：「为学大病在好名。」侃曰：「从前岁自谓此病已轻，此来精察，乃知全未。岂必务外为人？只闻誉而喜，闻毁而闷，即是此病发来。」曰：「最是。名与实对，务实之心重一分，则务名之心轻一分；全是务实之心，即全无务名之心。若务实之心如饥之求食，渴之求饮，安得更有工夫好名？」又曰：「『疾没世而名不称』，『称』字去声读，亦『声闻过情，君子耻之』之意。实不称名，生犹可补，没则无及矣。『四十五十而无闻』，是不闻道，非无声闻也。孔子云『是闻也，非达也』，安肯以此望人？」","bh":"先生说：「做学问的大毛病在于好名。」薛侃说：「从前一年我自认为这个毛病已经轻了，近来仔细省察，才知道一点没好。难道一定要追求外在、做给别人看才算好名吗？只要听到称赞就高兴，听到批评就郁闷，就是这个毛病发作了。」先生说：「说得太对了。名和实相对，务实的心重一分，求名的心就轻一分；全是务实的心，就完全没有求名的心了。如果务实的心像饿了找吃的、渴了找喝的那样迫切，哪还有工夫去好名？」先生又说：「『君子担心死后名不副实』，这个『称』字读去声（相称），也就是『名声超过实际，君子以为耻』的意思。实际配不上名声，活着还可以弥补，死了就来不及了。孔子说『四五十岁还无闻』，是说没有闻道，不是说没有名声。孔子说『那是有名声，不是通达』，怎么会用名声来期望人呢？」","zs":[["疾没世而名不称","《论语·卫灵公》：「君子疾没世而名不称焉。」通常解为君子担心死后名声不被称道；阳明读「称」为去声 chèn，解为名实相称。"],["声闻过情，君子耻之","《孟子·离娄下》。"],["四十五十而无闻","《论语·子罕》：「四十五十而无闻焉，斯亦不足畏也已。」"],["是闻也，非达也","《论语·颜渊》。"]],"gl":[19,97,107],"q":"怎么判断自己有没有「好名」的毛病？","a":"不一定要刻意炫耀才算。听到称赞就喜、听到批评就闷，就是好名之病在发作。","yong":"客户给了五星好评你开心一整天，差评你郁闷一整周？病根就在这。把心思放回「实」上。","rec":"薛侃录","kj":[["r","忘","望","安肯以此"]]},{"n":106,"t":"悔悟是药，留滞成病","yw":"侃多悔。先生曰：「悔悟是去病之药，以改之为贵。若留滞于中，则又因药发病。」","bh":"薛侃常常后悔。先生说：「悔悟是治病的药，但贵在改正。如果悔恨一直留在心里，就又因为药而生出病来了。」","zs":[],"gl":[97,79],"q":"后悔是好事还是坏事？","a":"悔悟是药，但贵在改。改了就放下；如果一直留在心里反复咀嚼，药就变成了病。","yong":"搞砸了一单？复盘、改进、放下。别在凌晨三点还在跟自己算账。","rec":"薛侃录","kj":[]},{"n":107,"t":"替圣人争分两","yw":"德章曰：「闻先生以精金喻圣，以分两喻圣人之分量，以煅炼喻学者之工夫，最为深切。惟谓尧、舜为万镒，孔子为九千镒，疑未安。」先生曰：「此又是躯壳上起念，故替圣人争分两。若不从躯壳上起念，即尧、舜万镒不为多，孔子九千镒不为少。尧、舜万镒，只是孔子的；孔子九千镒，只是尧、舜的，原无彼我。所以谓之圣，只论精一，不论多寡。只要此心纯乎天理处同，便同谓之圣。若是力量气魄，如何尽同得？后儒只在分两上较量，所以流入功利。若除去了比较分两的心，各人尽着自己力量精神，只在此心纯天理上用功，即人人自有，个个圆成，便能大以成大，小以成小，不假外慕，无不具足。此便是实实落落明善诚身的事。后儒不明圣学，不知就自己心地良知良能上体认扩充，却去求知其所不知，求能其所不能，一味只是希高慕大，不知自己是桀、纣心地，动辄要做尧、舜事业，如何做得？终年碌碌，至于老死，竟不知成就了个甚么，可哀也已！」","bh":"刘德章说：「听说先生用精金比喻圣人，用分量比喻圣人的才力，用冶炼比喻学者的功夫，非常深刻贴切。只是说尧舜是一万镒、孔子是九千镒，我觉得不太妥当。」先生说：「这又是从躯壳上起念，所以替圣人争分量。如果不从躯壳上起念，那么尧舜一万镒不算多，孔子九千镒不算少。尧舜的一万镒，也就是孔子的；孔子的九千镒，也就是尧舜的，本来没有你我之分。之所以叫作圣人，只论是否精纯专一，不论多少。只要这颗心纯乎天理这一点相同，就同样叫作圣人。至于力量气魄，怎么能完全相同？后世儒者只在分量上比较，所以流入功利。如果去掉了比较分量的心，每个人都尽自己的力量精神，只在这颗心纯乎天理上用功，那就人人自足、个个圆满，大的成就大的，小的成就小的，不需要羡慕外面，没有不完备的。这才是实实在在的明善诚身的事。后世儒者不明白圣学，不知道在自己心中的良知良能上体认扩充，却去追求知道自己不知道的、追求做到自己做不到的，一味好高骛远，不知道自己是桀纣的心地，动不动就想做尧舜的事业，怎么做得到？一年到头忙忙碌碌，直到老死，竟然不知道成就了个什么，真是可悲啊！」","zs":[["德章","刘德章，阳明弟子，生平不详。"],["良知良能","《孟子·尽心上》：「人之所不学而能者，其良能也；所不虑而知者，其良知也。」"]],"gl":[99,105,19],"q":"弟子替孔子抱不平（为何只有九千镒），阳明为什么批评他？","a":"这是从躯壳起念，在分量上比较。圣人只论纯乎天理，不论多寡；比较分两的心，正是功利之心。","yong":"别老拿自己的营收、粉丝数、客户规模跟别人比。大以成大，小以成小。","con":"反方：这一条否定比较，但人类的进步离不开比较和竞争；完全不比，也可能导致自满停滞。阳明针对的是「以名利比较代替修身」，并非否定见贤思齐。","rec":"薛侃录","kj":[["d","郋","","上起念即"],["r","尢","九","子的孔子"],["r","此","比","若除去了"],["r","籿","纣","自己是桀"]]},{"n":108,"t":"心不可以动静为体用","yw":"侃问：「先儒以心之静为体，心之动为用，如何？」先生曰：「心不可以动静为体用。动静，时也。即体而言用在体，即用而言体在用，是谓『体用一源』。若说静可以见其体，动可以见其用，却不妨。」","bh":"薛侃问：「前代儒者把心静的状态当作本体，把心动的状态当作作用，对吗？」先生说：「心不能用动静来区分体用。动静只是时间上的不同。就本体说，作用就在本体之中；就作用说，本体就在作用之中，这就叫『体用一源』。如果说在静中可以看见它的本体，在动中可以看见它的作用，倒是无妨。」","zs":[["体用一源","程颐《易传序》。"]],"gl":[41,45,87],"q":"静是体、动是用，对吗？","a":"不对。动静只是时，体用不可分：即体而言用在体，即用而言体在用。只能说静时可见其体、动时可见其用。","rec":"薛侃录","kj":[]},{"n":109,"t":"不是不可移，只是不肯移","yw":"问：「上智下愚，如何不可移？」先生曰：「不是不可移，只是不肯移。」","bh":"有人问：「最聪明的人和最愚笨的人，为什么不能改变？」先生说：「不是不能改变，只是不肯改变。」","zs":[["上智下愚","《论语·阳货》：「唯上知与下愚不移。」"]],"gl":[99,65],"q":"「下愚不移」是天生注定的吗？","a":"不是不能移，而是不肯移。改变的关键在意愿，不在天资。","yong":"说「我就这样了，改不了」的时候，换成「我不肯改」，看看还说得出口吗？","rec":"薛侃录","kj":[]},{"n":110,"t":"子夏子张论交","yw":"问「子夏门人问交」章。先生曰：「子夏是言小子之交，子张是言成人之交。若善用之，亦俱是。」","bh":"有人问《论语》「子夏的门人问交友之道」那一章。先生说：「子夏说的是少年人的交友之道，子张说的是成年人的交友之道。如果善于运用，两种说法都对。」","zs":[["子夏门人问交","《论语·子张》：子夏的门人问子张交友之道，子张问子夏怎么说，答「可者与之，其不可者拒之」。子张说：「君子尊贤而容众，嘉善而矜不能。」"]],"gl":[18],"q":"子夏和子张的交友观谁对？","a":"都对，适用对象不同：子夏「可者与之，不可者拒之」适合年轻人择友；子张「尊贤容众」适合成年人。","yong":"刚起步时，挑合作伙伴要严；做大了，要能容人。","rec":"薛侃录","kj":[["r","星","是","生曰子夏"]]},{"n":111,"t":"学而时习之","yw":"子仁问：「『学而时习之，不亦说乎？』先儒以学为『效先觉之所为』，如何？」先生曰：「学是学去人欲、存天理。从事于去人欲、存天理，则自正诸先觉，考诸古训，自下许多问辨思索、存省克治工夫，然不过欲去此心之人欲，存吾心之天理耳。若曰『效先觉之所为』，则只说得学中一件事，亦似专求诸外了。『时习』者，『坐如尸』，非专习坐也，坐时习此心也；『立如斋』，非专习立也，立时习此心也。『说』是『理义之说我心』之『说』，人心本自说理义，如目本说色，耳本说声，惟为人欲所蔽所累，始有不说。今人欲日去，则理义日洽浃，安得不说？」","bh":"栾子仁问：「『学了又时时温习，不是很快乐吗？』朱子把『学』解释为『效法先知先觉者的所作所为』，对吗？」先生说：「学就是学去人欲、存天理。从事于去人欲、存天理，自然会向先觉者求正、到古训中考证，自然要下许多询问辨析、思考探索、存养省察、克制私欲的功夫，但这些都不过是要去掉这颗心里的人欲、保存我心里的天理罢了。如果说『效法先觉者的所作所为』，那只说到了学中的一件事，而且好像是专门向外寻求了。『时习』，就像『坐着要像祭祀时的尸那样端正』，不是专门练习坐，而是坐的时候修习这颗心；『站着要像斋戒时那样恭敬』，不是专门练习站，而是站的时候修习这颗心。『说』就是孟子『理义让我的心喜悦』中的『悦』，人心本来就喜欢理义，就像眼睛本来就喜欢美色、耳朵本来就喜欢美声，只是因为被人欲遮蔽拖累，才有不喜悦的时候。现在人欲一天天去掉，理义就一天天融洽浸润，怎么会不喜悦？」","zs":[["子仁","栾惠，字子仁，阳明弟子。"],["效先觉之所为","朱熹《论语集注》：「学之为言效也……后觉者必效先觉之所为。」"],["坐如尸，立如斋","《礼记·曲礼上》。尸是古代祭祀时代表死者受祭的人，须端坐不动。"],["理义之说我心","《孟子·告子上》：「理义之悦我心，犹刍豢之悦我口。」说，同「悦」。"],["洽浃","融洽、浸润。"]],"gl":[24,3,9],"q":"「时习」习的是什么？「说」从哪里来？","a":"时习是时时刻刻在坐立行止中习此心；悦是因为人心本来喜欢理义，人欲去掉，理义融洽，自然喜悦。","yong":"学习如果只让你焦虑，多半是在「效先觉之所为」（模仿别人）。真学到了心上，会有一种踏实的喜悦。","rec":"薛侃录","kj":[["r","舀","习","问学而时"],["r","间","问","自下许多"],["d","事","","学中一件"],["r","羲","义","日去则理"]]},{"n":112,"t":"曾子三省与一贯","yw":"国英问：「曾子三省虽切，恐是未闻一贯时工夫。」先生曰：「一贯是夫子见曾子未得用功之要，故告之。学者果能忠恕上用力，岂不是一贯？『一』如树之根本，『贯』如树之枝叶，未种根，何枝叶之可得？体用一源，体未立，用安从生？谓『曾子于其用处，盖已随事精察而力行之，但未知其体之一』，此恐未尽。」","bh":"陈国英问：「曾子每天多次反省自己，虽然很切实，恐怕是还没有听到孔子『一以贯之』时的功夫吧？」先生说：「一以贯之，是孔子看到曾子还没有掌握用功的要领，所以才告诉他的。学者如果真能在忠恕上用功，难道不就是一贯吗？『一』就像树的根本，『贯』就像树的枝叶，没有种下根，哪来的枝叶？体用出于同一本源，本体没有确立，作用从哪里生出来？朱子说『曾子在作用方面，大概已经随事精细省察并努力实行了，只是还不知道本体是一』，这话恐怕没说透。」","zs":[["国英","陈桀，字国英，福建莆田人，阳明弟子。"],["曾子三省","《论语·学而》：「吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？」"],["一贯","《论语·里仁》：「子曰：参乎！吾道一以贯之。」曾子曰：「夫子之道，忠恕而已矣。」"],["曾子于其用处……","朱熹《论语集注》中的话。"]],"gl":[108,45,25],"q":"阳明为什么不同意朱子对「一贯」的解释？","a":"朱子认为曾子已在用上做足、只是不知体之一；阳明认为体用一源，体未立用不可能有，在忠恕上用功本身就是一贯。","yong":"每天复盘三件事：为人谋忠不忠、与人交信不信、学的用没用。这就是一贯的功夫。","rec":"薛侃录","kj":[["r","慷","源","得体用一"]]},{"n":113,"t":"子贡与颜回孰愈","yw":"黄诚甫问「汝与回也孰愈」章。先生曰：「子贡多学而识，在闻见上用力，颜子在心地上用功，故圣人问以启之。而子贡所对又只在知见上，故圣人叹惜之，非许之也。」","bh":"黄诚甫问《论语》「你和颜回谁强」那一章。先生说：「子贡博学多识，在见闻上用功，颜回在心地上用功，所以孔子用这个问题来启发子贡。但子贡的回答又只在知识见解上，所以孔子为他叹息惋惜，并不是赞许他。」","zs":[["黄诚甫","黄宗明，字诚甫，浙江鄞县人，阳明弟子。"],["汝与回也孰愈","《论语·公冶长》：孔子问子贡：「女与回也孰愈？」子贡答：「赐也何敢望回？回也闻一以知十，赐也闻一以知二。」孔子说：「弗如也，吾与女弗如也。」"]],"gl":[77,99],"q":"孔子说「吾与女弗如也」是在夸子贡谦虚吗？","a":"阳明认为不是。子贡的回答仍在比较知见多少（闻一知几），没领会颜回是在心地上用功，孔子是在叹惜他。","yong":"别人比你强，你第一反应是比「他懂多少」，还是看「他的心怎么用」？","rec":"薛侃录","kj":[["r","间","问","功故圣人"]]},{"n":114,"t":"不迁怒，不贰过","yw":"颜子不迁怒，不贰过，亦是有未发之中始能。","bh":"颜回不把怒气转移到别人身上，同样的错误不犯第二次，这也是因为他有了未发之中才能做到。","zs":[["不迁怒，不贰过","《论语·雍也》：孔子称赞颜回「不迁怒，不贰过」。"]],"gl":[76,45,77],"q":"颜回为什么能不迁怒、不贰过？","a":"因为他有未发之中：内心中正，怒气发了不留滞，过错改了不再犯。体用一源。","yong":"被客户气到了，回家别冲家人发火。那是迁怒，说明你心里的「中」还不够。","rec":"薛侃录","kj":[]},{"n":115,"t":"种德如种树，先去外好","yw":"种树者必培其根，种德者必养其心。欲树之长，必于始生时删其繁枝；欲德之盛，必于始学时去夫外好。如外好诗文，则精神日渐漏泄在诗文上去，凡百外好皆然。又曰：「我此论学，是无中生有的工夫，诸公须要信得及，只是立志。学者一念为善之志，如树之种，但勿助勿忘，只管培植将去，自然日夜滋长，生气日完，枝叶日茂。树初生时，便抽繁枝，亦须刊落，然后根干能大。初学时亦然，故立志贵专一。」","bh":"种树的人一定要培植树根，培养德行的人一定要涵养内心。想让树长大，必须在它刚生长时剪掉繁杂的枝条；想让德行盛大，必须在刚开始学习时去掉对外物的嗜好。比如嗜好诗文，精神就会一天天泄漏到诗文上去，一切外在嗜好都是这样。先生又说：「我这样讲学问，是无中生有的功夫，各位必须信得过，只是要立志。学者一个为善的念头，就像树的种子，只要不揠苗助长、也不忘记，只管培植下去，自然日夜生长，生气一天天完足，枝叶一天天茂盛。树刚长出来时就抽出繁杂的枝条，也必须剪掉，然后根和干才能长大。初学时也是这样，所以立志贵在专一。」","zs":[["勿助勿忘","《孟子·公孙丑上》：「必有事焉而勿正，心勿忘，勿助长也。」"],["刊落","删除、砍掉。"]],"gl":[30,16,53],"q":"为什么初学时要「去夫外好」？","a":"精神有限，外好会把精神泄漏出去，就像树刚长时的繁枝会分走养分，必须剪掉，根干才能长大。","yong":"刚起步的业务，别同时铺十条线。剪掉繁枝，先让一条根扎深。","con":"反方：阳明自己就是一流的诗人和书法家，年轻时「泛滥于词章」。完全断绝外好，也可能让人生过于单调。比较平衡的理解是：在根基未立时克制分心，而不是一辈子拒绝艺术。","rec":"薛侃录","kj":[]},{"n":116,"t":"日不足者日有余","yw":"因论先生之门，某人在涵养上用功，某人在识见上用功。先生曰：「专涵养者，日见其不足；专识见者，日见其有余。日不足者，日有余矣；日有余者，日不足矣。」","bh":"大家谈论先生门下的弟子，某人在涵养上用功，某人在见识上用功。先生说：「专门在涵养上用功的人，每天都觉得自己不足；专门在见识上用功的人，每天都觉得自己有余。每天觉得不足的，其实一天天有余了；每天觉得有余的，其实一天天不足了。」","zs":[],"gl":[64,77,22],"q":"为什么「日不足者，日有余」？","a":"涵养越深，越看到自己的不足，于是越进步；见识越多，越觉得自己什么都懂，于是心越满，反而退步。","yong":"每天觉得「今天也没做好」的人，往往一年后进步最大。","rec":"薛侃录","kj":[]},{"n":117,"t":"居敬穷理是一事","yw":"梁日孚问：「居敬、穷理是两事，先生以为一事，何如？」先生曰：「天地间只有此一事，安有两事？若论万殊，礼仪三百，威仪三千，又何止两？公且道居敬是如何？穷理是如何？」曰：「居敬是存养工夫，穷理是穷事物之理。」曰：「存养个甚？」曰：「是存养此心之天理。」曰：「如此亦只是穷理矣。」曰：「且道如何穷事物之理？」曰：「如事亲便要穷孝之理，事君便要穷忠之理。」曰：「忠与孝之理，在君亲身上？在自己心上？若在自己心上，亦只是穷此心之理矣。且道如何是敬？」曰：「只是主一。」「如何是主一？」曰：「如读书便一心在读书上，接事便一心在接事上。」曰：「如此则饮酒便一心在饮酒上，好色便一心在好色上，却是逐物，成甚居敬功夫？」日孚请问。曰：「一者，天理。主一是一心在天理上。若只知主一，不知一即是理，有事时便是逐物，无事时便是悬空。惟其有事无事，一心皆在天理上用功，所以居敬亦即是穷理。就穷理专一处说，便谓之居敬；就居敬精密处说，便谓之穷理。却不是居敬了，别有个心穷理；穷理时，别有个心居敬。名虽不同，功夫只是一事。就如《易》言『敬以直内，义以方外』，敬即是无事时义，义即是有事时敬，两句合说一件。如孔子言『修己以敬』，即不须言义；孟子言『集义』，即不须言敬。会得时，横说竖说，工夫总是一般。若泥文逐句，不识本领，即支离决裂，工夫都无下落。」问：「穷理何以即是尽性？」曰：「心之体，性也，性即理也。穷仁之理，真要仁极仁；穷义之理，真要义极义。仁、义只是吾性，故穷理即是尽性。如孟子说『充其恻隐之心，至仁不可胜用』，这便是穷理工夫。」日孚曰：「先儒谓『一草一木亦皆有理，不可不察』，如何？」先生曰：「夫我则不暇。公且先去理会自己性情，须能尽人之性，然后能尽物之性。」日孚悚然有悟。","bh":"梁日孚问：「居敬和穷理是两件事，先生认为是一件事，为什么？」先生说：「天地间只有这一件事，哪有两件事？如果论千差万别，礼仪有三百条，威仪有三千条，又何止两件？你先说说居敬是怎样的？穷理是怎样的？」日孚说：「居敬是存养的功夫，穷理是穷究事物的道理。」先生问：「存养什么？」日孚说：「存养这颗心中的天理。」先生说：「这样说也只是穷理了。」先生又说：「你说说怎样穷究事物的道理？」日孚说：「比如侍奉父母就要穷究孝的道理，侍奉君主就要穷究忠的道理。」先生说：「忠和孝的道理，在君主和父母身上，还是在自己心上？如果在自己心上，那也只是穷究这颗心的道理了。你再说说什么是敬？」日孚说：「就是主一。」「什么是主一？」日孚说：「比如读书就一心在读书上，处理事情就一心在处理事情上。」先生说：「这样的话，喝酒就一心在喝酒上，好色就一心在好色上，这是追逐外物，算什么居敬功夫？」日孚请先生指教。先生说：「一，就是天理。主一是一心在天理上。如果只知道主一，不知道一就是理，那么有事时就是追逐外物，没事时就是悬空无着。只有有事没事都一心在天理上用功，所以居敬也就是穷理。从穷理的专一处说，就叫居敬；从居敬的精密处说，就叫穷理。并不是居敬之后另外有个心去穷理，穷理时另外有个心去居敬。名称虽然不同，功夫只是一件事。就像《易经》说的『用敬来端正内心，用义来规范外行』，敬就是无事时的义，义就是有事时的敬，两句话合起来说的是一件事。比如孔子说『用敬来修养自己』，就不必再说义；孟子说『集义』，就不必再说敬。领会了，横说竖说，功夫总是一样的。如果拘泥于文字、逐句去理解，不认识根本，就会支离破碎，功夫都没有着落。」日孚问：「穷理为什么就是尽性？」先生说：「心的本体就是性，性就是理。穷究仁的道理，真要做到仁到了极点；穷究义的道理，真要做到义到了极点。仁和义只是我的本性，所以穷理就是尽性。就像孟子说的『扩充恻隐之心，仁就用之不尽』，这就是穷理的功夫。」日孚说：「程子说『一草一木也都有理，不可不去考察』，这怎么样？」先生说：「我可没那个空闲。你先去理会自己的性情，必须能够充分发挥人的本性，然后才能充分发挥物的本性。」日孚听了猛然醒悟。","zs":[["梁日孚","梁焯，字日孚，广东南海人。"],["居敬穷理","朱子学的两大功夫：居敬是持守内心的恭敬专一，穷理是格物以穷究事物之理。"],["礼仪三百，威仪三千","《中庸》：「礼仪三百，威仪三千。」"],["敬以直内，义以方外","《周易·坤卦·文言》。"],["夫我则不暇","《论语·宪问》：子贡评论别人，孔子说「赐也贤乎哉？夫我则不暇」。"],["尽人之性，尽物之性","《中庸》：「能尽人之性，则能尽物之性。」"]],"gl":[15,3,25,9],"q":"居敬和穷理为什么是一件事？","a":"主一是一心在天理上，穷理是穷此心之理，二者都是在心上存天理。从专一处说叫居敬，从精密处说叫穷理。","yong":"别把「修心」和「做事」分成两个时间段。做事专一于天理就是修心，修心精密就是做事。","con":"反方：「一草一木亦皆有理」的探究精神，正是自然科学的萌芽。阳明一句「夫我则不暇」把物理探究推到道德修养之后，有学者认为心学的兴盛在一定程度上压抑了明代对自然知识的兴趣。","rec":"薛侃录","kj":[["r","兴","与","之理曰忠"],["r","看","悬","事时便是"],["r","睢","虽","心居敬名"],["r","羲羲","义义","是无事时"],["r","璧","竖","得时横说"]]},{"n":118,"t":"知是理之灵处","yw":"惟乾问：「知如何是心之本体？」先生曰：「知是理之灵处。就其主宰处说便谓之心，就其禀赋处说便谓之性。孩提之童，无不知爱其亲，无不知敬其兄，只是这个灵能不为私欲遮隔，充拓得尽，便完完是他本体，便与天地合德。自圣人以下，不能无蔽，故须格物以致其知。」","bh":"冀惟乾问：「为什么说知是心的本体？」先生说：「知是理的灵明之处。从它主宰的一面说，就叫作心；从它禀受于天的一面说，就叫作性。小孩子没有不知道爱父母的，没有不知道敬兄长的，只要这个灵明不被私欲遮隔，扩充到底，就完完全全是他的本体，就与天地的德性相合。圣人以下的人，不能没有遮蔽，所以必须格物来致其良知。」","zs":[["惟乾","冀元亨，字惟乾，湖南武陵人。后因阳明平宸濠之乱受牵连，冤死狱中。底本作「惟干」，据通行本作「惟乾」。"],["孩提之童……","《孟子·尽心上》：「孩提之童，无不知爱其亲者；及其长也，无不知敬其兄也。」"],["与天地合德","《周易·乾卦·文言》：「夫大人者，与天地合其德。」"]],"gl":[8,6,78],"q":"「知」为什么是心之本体？","a":"知是理的灵明之处，就是良知。小孩天然知爱亲敬兄，不被私欲遮隔、扩充到底，就是完整的本体。","rec":"薛侃录","kj":[["r","干","乾","惟"]]},{"n":119,"t":"诚意之中，正心何在","yw":"守衡问：「《大学》工夫只是诚意，诚意工夫只是格物，修齐治平只诚意尽矣。又有正心之功，『有所忿懥好乐，则不得其正』，何也？」先生曰：「此要自思得之，知此则知未发之中矣。」守衡再三请。曰：「为学工夫有浅深，初时若不着实用意去好善恶恶，如何能为善去恶？这着实用意便是诚意。然不知心之本体原无一物，一向着意去好善恶恶，便又多了这分意思，便不是廓然大公。《书》所谓『无有作好作恶』，方是本体。所以说『有所忿懥好乐，则不得其正』。正心只是诚意工夫里面体当自家心体，常要鉴空衡平，这便是未发之中。」","bh":"守衡问：「《大学》的功夫只是诚意，诚意的功夫只是格物，修身、齐家、治国、平天下，只要诚意就全了。为什么又有正心的功夫，说『心中有愤怒、喜好，心就不能端正』？」先生说：「这要你自己思考才能得到，懂了这个就懂了未发之中。」守衡再三请教。先生说：「做学问的功夫有浅有深，开始时如果不切实用意去喜好善、厌恶恶，怎么能为善去恶？这切实用意，就是诚意。但如果不知道心的本体原本空无一物，一味刻意去好善恶恶，就又多了这一分意思，就不是廓然大公了。《尚书》说的『不刻意去喜好、不刻意去厌恶』，才是本体。所以说『心中有愤怒、喜好，心就不能端正』。正心只是在诚意功夫里面体会自己的心体，要常常像镜子一样空明、像秤一样平衡，这就是未发之中。」","zs":[["守衡","阳明弟子，姓氏生平不详。"],["忿懥","愤怒。"],["鉴空衡平","镜子空明无物，秤杆平衡不偏。朱熹语。"]],"gl":[101,88,76],"q":"诚意已经包括了一切，为什么还要正心？","a":"诚意是着实用意去好善恶恶；但用意太过，又多了一分意思，就不是廓然大公。正心就是在诚意中体认心体本来无一物，鉴空衡平。","yong":"「我一定要做个好人！」这股劲是诚意；但如果绷得太紧、处处较劲，就又偏了。","rec":"薛侃录","kj":[["r","念","忿","之功有所"],["r","看","着","初时若不"],["r","念","忿","以说有所"]]},{"n":120,"t":"独知之地：诚伪善恶界头","yw":"正之问：「戒惧是己所不知时工夫，慎独是己所独知时工夫，此说如何？」先生曰：「只是一个工夫。无事时固是独知，有事时亦是独知。人若不知于此独知之地用力，只在人所共知处用功，便是作伪，便是『见君子而后厌然』。此独知处便是诚的萌芽，此处不论善念恶念，更无虚假，一是百是，一错百错，正是王霸、义利、诚伪、善恶界头。于此一立立定，便是端本澄源，便是立诚。古人许多诚身的工夫，精神命脉全体只在此处，真是莫见莫显，无时无处，无终无始，只是此个工夫。今若又分戒惧为己所不知，即工夫便支离，亦有间断。既戒惧即是知，己若不知，是谁戒惧？如此见解，便要流入断灭禅定。」曰：「不论善念恶念，更无虚假，则独知之地，更无无念时邪？」曰：「戒惧亦是念。戒惧之念，无时可息。若戒惧之心稍有不存，不是昏瞶，便已流入恶念。自朝至暮，自少至老，若要无念，即是己不知，此除是昏睡，除是槁木死灰。」","bh":"黄正之问：「朱子说戒惧是自己不知道（心未发）时的功夫，慎独是只有自己知道（心已发）时的功夫，这个说法怎么样？」先生说：「只是一个功夫。没事的时候固然是独知，有事的时候也是独知。人如果不知道在这个独知之处用力，只在别人都知道的地方用功，就是作假，就是《大学》说的『小人见到君子后才躲躲闪闪地掩饰』。这个独知之处就是诚的萌芽，在这里不论善念恶念，都没有半点虚假，一处对就处处对，一处错就处处错，这正是王道与霸道、义与利、诚与伪、善与恶的分界线。在这里一下子立定了，就是端正根本、澄清源头，就是确立诚。古人许多诚身的功夫，精神命脉全都在这里，真是没有比这更显现的了，无时无处、无终无始，只是这个功夫。现在如果又把戒惧分为自己不知道时的功夫，功夫就支离破碎，也会有间断。既然戒惧了就是知道，自己如果不知道，是谁在戒惧？这种见解，就要流入断灭一切的禅定了。」正之问：「不论善念恶念都没有虚假，那么独知之处，就没有无念的时候吗？」先生说：「戒惧也是念。戒惧的念头，没有一刻可以停息。如果戒惧之心稍有不在，不是昏昧糊涂，就已经流入恶念了。从早到晚，从小到老，如果要无念，就是自己不知道了，那除非是昏睡，除非是枯木死灰。」","zs":[["正之","黄弘纲，字正之，江西雩都人，阳明弟子。"],["戒惧、慎独","《中庸》：「君子戒慎乎其所不睹，恐惧乎其所不闻。……故君子慎其独也。」朱熹将戒惧与慎独分为两种功夫。"],["见君子而后厌然","《大学》：「小人闲居为不善，无所不至，见君子而后厌然，掩其不善而著其善。」厌然，躲闪掩藏的样子。"],["莫见莫显","《中庸》：「莫见乎隐，莫显乎微，故君子慎其独也。」"],["断灭禅定","佛教中追求断绝一切念头的禅定，儒者常批评其流于虚寂。"]],"gl":[37,36,71],"q":"「独知之地」为什么是王霸义利的分界？","a":"那是只有自己知道的念头起处，没有半点虚假。在这里诚，就处处诚；在这里伪，做给人看的都是伪。","yong":"一个人在没人看见时怎么对待客户的数据、怎么写报价，就决定了他是做生意还是做买卖。","rec":"薛侃录","kj":[["r","贝","见","作伪便是"],["r","虚","处","体只在此"]]},{"n":121,"t":"养心莫善于诚","yw":"志道问：「荀子云『养心莫善于诚』，先儒非之，何也？」先生曰：「此亦未可便以为非。『诚』字有以工夫说者。诚是心之本体，求复其本体，便是思诚的工夫。明道说『以诚敬存之』，亦是此意。《大学》『欲正其心，先诚其意』。荀子之言固多病，然不可一例吹毛求疵。大凡看人言语，若先有个意见，便有过当处。『为富不仁』之言，孟子有取于阳虎，此便见圣贤大公之心。」","bh":"管志道问：「荀子说『修养心性，没有比诚更好的』，程子却批评他，为什么？」先生说：「这也不能马上认为是错的。『诚』字有从功夫上说的。诚是心的本体，求恢复这个本体，就是『思诚』的功夫。程明道说『用诚和敬来保存它』，也是这个意思。《大学》说『要端正心，先要使意念真诚』。荀子的话固然有很多毛病，但不能一概吹毛求疵。大凡看别人的言论，如果先有一个成见，就会有过分的地方。『为富不仁』这句话，孟子就从阳虎那里采用了，这就显出圣贤大公无私的心。」","zs":[["志道","阳明弟子。"],["养心莫善于诚","《荀子·不苟》。程颐批评说「荀子元不识诚」。"],["以诚敬存之","程颢《识仁篇》：「识得此理，以诚敬存之而已。」"],["为富不仁","《孟子·滕文公上》引阳虎语：「为富不仁矣，为仁不富矣。」阳虎是鲁国权臣，品行不端。"]],"gl":[98,120],"q":"荀子有很多毛病，他说的这句话也该否定吗？","a":"不该。不能因人废言，先有成见就会过当。孟子都能采用阳虎的话，这就是大公之心。","yong":"讨厌的竞争对手说了句对的话，承认它。","rec":"薛侃录","kj":[]},{"n":122,"t":"真己与躯壳之己","yw":"萧惠问：「己私难克，奈何？」先生曰：「将汝己私来，替汝克。」又曰：「人须有为己之心，方能克己；能克己，方能成己。」萧惠曰：「惠亦颇有为己之心，不知缘何不能克己？」先生曰：「且说汝有为己之心是如何。」惠良久曰：「惠亦一心要做好人，便自谓颇有为己之心。今思之，看来亦只是为得个躯壳的己，不曾为个真己。」先生曰：「真己何曾离着躯壳？恐汝连那躯壳的己也不曾为。且道汝所谓躯壳的己，岂不是耳、目、口、鼻、四肢？」惠曰：「正是为此，目便要色，耳便要声，口便要味，四肢便要逸乐，所以不能克。」先生曰：「『美色令人目盲，美声令人耳聋，美味令人口爽，驰骋田猎令人发狂』，这都是害汝耳、目、口、鼻、四肢的，岂得是为汝耳、目、口、鼻、四肢？若为着耳、目、口、鼻、四肢时，便须思量耳如何听，目如何视，口如何言，四肢如何动，必须非礼勿视、听、言、动，方才成得个耳、目、口、鼻、四肢，这个才是为着耳、目、口、鼻、四肢。汝今终日向外驰求，为名为利，这都是为着躯壳外面的物事。汝若为着耳、目、口、鼻、四肢，要非礼勿视、听、言、动时，岂是汝之耳、目、口、鼻、四肢自能勿视、听、言、动？须由汝心。这视、听、言、动，皆是汝心：汝心之视发窍于目，汝心之听发窍于耳，汝心之言发窍于口，汝心之动发窍于四肢。若无汝心，便无耳、目、口、鼻。所谓汝心，亦不专是那一团血肉。若是那一团血肉，如今已死的人，那一团血肉还在，缘何不能视、听、言、动？所谓汝心，却是那能视、听、言、动的，这个便是性，便是天理。有这个性，才能生这性之生理，便谓之仁。这性之生理，发在目便会视，发在耳便会听，发在口便会言，发在四肢便会动，都只是那天理发生，以其主宰一身，故谓之心。这心之本体，原只是个天理，原无非礼，这个便是汝之真己。这个真己是躯壳的主宰，若无真己，便无躯壳，真是有之即生，无之即死。汝若真为那个躯壳的己，必须用着这个真己，便须常常保守着这个真己的本体，戒慎不睹，恐惧不闻，惟恐亏损了他一些。才有一毫非礼萌动，便如刀割，如针刺，忍耐不过，必须去了刀，拔了针，这才是有为己之心，方能克己。汝今正是认贼作子，缘何却说有为己之心，不能克己？」","bh":"萧惠问：「自己的私欲很难克制，怎么办？」先生说：「把你的私欲拿来，我替你克。」又说：「人必须有为自己的心，才能克己；能克己，才能成就自己。」萧惠说：「我也很有为自己的心，不知道为什么不能克己？」先生说：「你先说说你为自己的心是怎样的。」萧惠过了好久才说：「我也一心想做个好人，就自以为很有为自己的心。现在想来，好像也只是为了躯壳的自己，不曾为真正的自己。」先生说：「真正的自己何曾离开过躯壳？恐怕你连那躯壳的自己也没有真为过。你说的躯壳的自己，难道不就是耳、目、口、鼻、四肢吗？」萧惠说：「正是为了这些：眼睛想看美色，耳朵想听美声，嘴巴想尝美味，四肢想要安逸享乐，所以不能克制。」先生说：「『五彩缤纷让人眼瞎，五音繁杂让人耳聋，五味浓厚让人口味败坏，纵马打猎让人心发狂』，这些都是伤害你耳目口鼻四肢的，怎么能说是为了你的耳目口鼻四肢？如果真是为了耳目口鼻四肢，就必须想想耳朵该怎么听、眼睛该怎么看、嘴巴该怎么说、四肢该怎么动，必须不合礼的不看、不听、不说、不做，才能成就耳目口鼻四肢，这才是真正为了耳目口鼻四肢。你现在整天向外追求，为名为利，这都是为了躯壳外面的东西。你如果为了耳目口鼻四肢，要做到非礼勿视听言动，难道是你的耳目口鼻四肢自己能做到不看不听不说不动吗？必须由你的心。这看、听、说、动，都是你的心：你心的看通过眼睛表现，你心的听通过耳朵表现，你心的说通过嘴巴表现，你心的动通过四肢表现。如果没有你的心，就没有耳目口鼻。所谓你的心，也不单是那一团血肉。如果是那一团血肉，现在已经死了的人，那一团血肉还在，为什么不能看听说动？所谓你的心，就是那个能看听说动的东西，这就是性，就是天理。有了这个性，才能生出这性的生生之理，这就叫作仁。这性的生生之理，表现在眼睛就会看，表现在耳朵就会听，表现在嘴巴就会说，表现在四肢就会动，都只是那天理在发生作用，因为它主宰一身，所以叫作心。这心的本体，原本只是个天理，原本没有不合礼的，这就是你的真己。这个真己是躯壳的主宰，没有真己就没有躯壳，真是有了它就生，没有它就死。你如果真为了那个躯壳的自己，就必须用这个真己，就必须常常保守这个真己的本体，在不被看见时也戒慎，在不被听见时也恐惧，唯恐对它有一点点亏损。刚有一丝一毫不合礼的念头萌动，就像刀割、像针刺一样，忍受不了，必须拿掉刀、拔出针，这才是有为己之心，才能克己。你现在正是把贼当成了儿子，怎么还说有为己之心却不能克己？」","zs":[["萧惠","阳明弟子，好道家佛家之学。"],["为己","《论语·宪问》：「古之学者为己，今之学者为人。」为己指为了修养自己，而非做给别人看。"],["美色令人目盲……","化用《老子》第十二章：「五色令人目盲，五音令人耳聋，五味令人口爽，驰骋畋猎令人心发狂。」爽，败坏。"],["非礼勿视听言动","《论语·颜渊》：「非礼勿视，非礼勿听，非礼勿言，非礼勿动。」"],["发窍","通过孔窍表现出来。"],["认贼作子","佛教语，把害自己的东西当成亲人。"]],"gl":[3,8,39,120],"q":"阳明说的「真己」是什么？和身体是什么关系？","a":"真己是能视听言动的那个心，即性、即天理。它是躯壳的主宰，不离躯壳；真为躯壳着想，就要守护真己，而不是放纵感官。","yong":"熬夜刷剧、暴饮暴食，你以为在「对自己好」，其实是在害躯壳。真为自己，就听真己的。","con":"反方：阳明把「心」等同于天理，而把感官欲望视为「贼」，这种身心观在现代看来有压抑身体之嫌。当代哲学和心理学更倾向于把欲望视为人性中正当的一部分，需要的是调节而非清除。","rec":"薛侃录","kj":[["r","东","克","私来替汝"],["r","顶","须","东又曰人"],["r","囗","口","不是耳目"],["r","囗","口","耳便要声"],["r","囗","口","美味令人"],["r","囗","口","害汝耳目"],["r","囗","口","为汝耳目"],["r","看","着","四肢若为"],["r","囗","口","为看耳目"],["r","祝囗","视口","听目如何"],["r","囗","口","得个耳目"],["r","囗","口","为着耳目"],["r","一逼","这","为名为利"],["r","囗","口","为着耳目"],["r","囗","口","汝之耳目"],["r","动","视","心汝心之"],["r","囗","口","言发窍于"],["r","囗","口","便无耳目"],["r","囗","口","会听发在"],["r","力","方","为己之心"]]},{"n":123,"t":"贵目贱心","yw":"有一学者病目，戚戚甚忧。先生曰：「尔乃贵目贱心。」","bh":"有一个学者眼睛生病，非常忧愁。先生说：「你这是看重眼睛而轻视心。」","zs":[["戚戚","忧愁的样子。"]],"gl":[122,44],"q":"眼睛病了忧愁，为什么是「贵目贱心」？","a":"为眼病忧愁到心神不宁，说明把眼睛看得比心还重，心被外物所役。","yong":"网站排名掉了，焦虑到睡不着？那是贵排名贱心。该改就改，心别跟着掉。","rec":"薛侃录","kj":[["r","二苖","尔","忧先生曰"]]},{"n":124,"t":"悔错用了三十年气力","yw":"萧惠好仙、释。先生警之曰：「吾亦自幼笃志二氏，自谓既有所得，谓儒者为不足学。其后居夷三载，见得圣人之学若是其简易广大，始自叹悔错用了三十年气力。大抵二氏之学，其妙与圣人只有毫厘之间。汝今所学，乃其土苴，辄自信自好若此，真鸱鸮窃腐鼠耳。」惠请问二氏之妙。先生曰：「向汝说圣人之学简易广大，汝却不问我悟的，只问我悔的！」惠惭谢，请问圣人之学。先生曰：「汝今只是了人事问，待汝辨个真要求为圣人的心，来与汝说。」惠再三请。先生曰：「已与汝一句道尽，汝尚自不会！」","bh":"萧惠喜好道家和佛家。先生警告他说：「我也从小就专心学习佛道两家，自认为已经有所收获，认为儒家不值得学。后来在贵州龙场住了三年，看到圣人之学是这样简易广大，才感叹后悔白白用错了三十年力气。大体来说，佛道两家的学问，它的精妙之处和圣人之学只有毫厘之差。你现在学的，只是他们的糟粕，就这样自信自喜，真像猫头鹰叼着一只腐烂的老鼠（还当宝贝）。」萧惠请教佛道两家的精妙之处。先生说：「刚才跟你说圣人之学简易广大，你不问我领悟了什么，却只问我后悔的东西！」萧惠惭愧地道歉，请教圣人之学。先生说：「你现在只是敷衍应付地问，等你真有了一颗要成为圣人的心，再来跟你说。」萧惠再三请教。先生说：「已经用一句话跟你说尽了，你自己还不明白！」","zs":[["土苴","糟粕、渣滓。"],["鸱鸮窃腐鼠","典出《庄子·秋水》：猫头鹰得到一只腐鼠，看到凤凰飞过，以为凤凰要抢，就仰头吓它。比喻把低贱的东西当成宝贝。"],["了人事","应付、敷衍了事。"],["一句道尽","指前面所说「圣人之学简易广大」，或指「辨个真要求为圣人的心」。"]],"gl":[49,94,122],"q":"萧惠问「二氏之妙」，阳明为什么不高兴？","a":"阳明刚说了自己悟到圣学简易广大、后悔学佛道，萧惠却偏问他后悔的东西，说明心思还在佛道上，没有真要求圣学的心。","yong":"向高手请教时，你问的是他「成功的核心」，还是他「走过的弯路里好玩的部分」？","rec":"薛侃录","kj":[["r","贝","见","居夷三载"]]},{"n":125,"t":"哑子吃苦瓜","yw":"刘观时问：「未发之中是如何？」先生曰：「汝但戒慎不睹，恐惧不闻，养得此心纯是天理，便自然见。」观时请略示气象。先生曰：「哑子吃苦瓜，与你说不得。你要知此苦，还须你自吃。」时曰仁在傍，曰：「如此才是真知，即是行矣。」一时在座诸友皆有省。","bh":"刘观时问：「未发之中是什么样子？」先生说：「你只要在没人看见时戒慎、没人听见时恐惧，把这颗心养得纯是天理，自然就看见了。」刘观时请先生大略描述一下它的气象。先生说：「哑巴吃苦瓜，没法跟你说。你要知道这个苦，还得你自己去吃。」当时徐爱在旁边，说：「这样才是真知，也就是行了。」当时在座的朋友都有所领悟。","zs":[["刘观时","阳明弟子，湖南武陵人。"]],"gl":[5,76,28],"q":"「哑子吃苦瓜」说明了什么？","a":"心体的境界只能亲自体验，无法用语言传达。亲自吃了才知苦，这样的知就是行，正是知行合一。","yong":"这本书里每一条，都是别人吃苦瓜的记录。不自己去吃，读一百遍也不知道苦。","rec":"薛侃录","kj":[]},{"n":126,"t":"知昼夜即知死生","yw":"萧惠问死生之道。先生曰：「知昼夜即知死生。」问昼夜之道。曰：「知昼则知夜。」曰：「昼亦有所不知乎？」先生曰：「汝能知昼？懵懵而兴，蠢蠢而食，行不着，习不察，终日昏昏，只是梦昼。惟『息有养，瞬有存』，此心惺惺明明，天理无一息间断，才是能知昼。这便是天德，便是通乎昼夜之道而知，更有甚么死生？」","bh":"萧惠问生死的道理。先生说：「知道白天黑夜，就知道生死。」萧惠问白天黑夜的道理。先生说：「知道白天就知道黑夜。」萧惠问：「白天也有不知道的吗？」先生说：「你能知道白天？迷迷糊糊地起床，傻傻地吃饭，做了也不明白、习惯了也不省察，整天昏昏沉沉，只是在白天做梦。只有『每一次呼吸都有涵养，每一个瞬间都有存守』，这颗心清醒明白，天理没有一刻间断，才是能知道白天。这就是天德，就是通晓昼夜之道而知，还有什么生死可言？」","zs":[["通乎昼夜之道而知","《周易·系辞上》：「通乎昼夜之道而知，故神无方而易无体。」"],["息有养，瞬有存","张载《正蒙·有德》：「言有教，动有法，昼有为，宵有得，息有养，瞬有存。」"],["惺惺","清醒、警觉。"]],"gl":[47,69,79],"q":"为什么说多数人「只是梦昼」？","a":"白天虽然醒着，却迷迷糊糊、行不着习不察，心没有主宰，跟做梦一样。只有心时时清明、天理不间断，才是真知昼。","yong":"今天你有几个小时是「醒着」的？不是指没睡觉，是指心在。","con":"反方：这一条对「死生」问题的回答相当回避：把生死问题转化为当下的清醒问题。萧惠问的是生死，阳明答的是修养。对于真正面对死亡焦虑的人，这种回答可能显得不够有温度，也没有回答死后怎样的问题。","rec":"薛侃录","kj":[["r","忌","息","天理无一"]]},{"n":127,"t":"性、道、教","yw":"马子莘问：「『修道之教』，旧说谓圣人品节吾性之固有，以为法于天下，若礼、乐、刑、政之属，此意如何？」先生曰：「道即性即命，本是完完全全，增减不得，不假修饰的，何须要圣人品节？却是不完全的物件。礼、乐、刑、政是治天下之法，固亦可谓之教，但不是子思本旨。若如先儒之说，下面由教入道的，缘何舍了圣人礼、乐、刑、政之教，别说出一段戒慎恐惧工夫？却是圣人之教为虚设矣。」子莘请问。先生曰：「子思性、道、教，皆从本原上说。天命于人，则命便谓之性；率性而行，则性便谓之道；修道而学，则道便谓之教。率性是诚者事，所谓『自诚明，谓之性』也；修道是诚之者事，所谓『自明诚，谓之教』也。圣人率性而行，即是道；圣人以下，未能率性，于道未免有过不及，故须修道。修道则贤知者不得而过，愚不肖者不得而不及，都要循着这个道，则道便是个教。此『教』字与『天道至教』、『风雨霜露，无非教也』之『教』同，『修道』字与『修道以仁』同。人能修道，然后能不违于道，以复其性之本体，则亦是圣人率性之道矣。下面戒慎恐惧便是修道的工夫，中和便是复其性之本体，如《易》所谓『穷理尽性以至于命』，中和位育便是尽性至命。」","bh":"马子莘问：「《中庸》说的『修道之谓教』，旧说认为是圣人对我们本性中固有的东西加以品评节制，作为天下的法度，比如礼、乐、刑、政之类，这个意思怎么样？」先生说：「道就是性，就是命，本来就是完完全全、增减不得、不需要修饰的，哪里需要圣人去品评节制？那样就成了不完整的东西了。礼乐刑政是治理天下的方法，当然也可以叫作教，但不是子思的本意。如果按照朱子的说法，下文讲由教入道的部分，为什么撇开圣人礼乐刑政的教化，另外说出一段戒慎恐惧的功夫？那圣人的教化就成了虚设了。」子莘请先生解释。先生说：「子思说的性、道、教，都是从本原上说的。天赋予人的，这个命就叫作性；顺着本性去做，这个性就叫作道；修养这个道去学习，这个道就叫作教。率性是『诚者』（圣人）的事，就是《中庸》说的『由真诚而明白，叫作性』；修道是『诚之者』（求诚的人）的事，就是『由明白而真诚，叫作教』。圣人顺着本性去做，就是道；圣人以下的人，不能完全顺着本性，对于道难免有过分或不及，所以必须修道。修道就能让贤人智者不至于过分，愚笨不肖的人不至于不及，大家都循着这个道，这个道就是教。这个『教』字和『天道是最好的教化』、『风雨霜露，无不是教化』的『教』一样，『修道』二字和『用仁来修道』的『修道』一样。人能修道，然后能不违背道，来恢复本性的本体，也就是圣人率性之道了。下文的戒慎恐惧就是修道的功夫，中和就是恢复本性的本体，就像《易经》说的『穷究事理、充分发挥本性，以至于通达天命』，中和、天地各安其位、万物生长发育，就是尽性至命。」","zs":[["修道之教","《中庸》首章：「天命之谓性，率性之谓道，修道之谓教。」"],["品节","品评节制、加以规范。朱熹《中庸章句》：「修，品节之也。……圣人因人物之所当行者而品节之，以为法于天下，则谓之教，若礼乐刑政之属是也。」"],["自诚明，自明诚","《中庸》：「自诚明，谓之性；自明诚，谓之教。」"],["天道至教","《礼记·礼器》。"],["风雨霜露，无非教也","《礼记·孔子闲居》。"],["修道以仁","《中庸》：「修身以道，修道以仁。」"],["穷理尽性以至于命","《周易·说卦》。"]],"gl":[3,28,120,38],"q":"阳明对「修道之谓教」的理解与朱子有何不同？","a":"朱子认为「教」是圣人制定的礼乐刑政；阳明认为「教」是常人修道以复性的功夫本身，戒慎恐惧就是修道。","con":"反方：朱子的解释把「教」落实到制度层面，重视外在规范对人的塑造，这一点在社会治理上有其合理性。阳明把「教」完全收归内心修养，有学者认为这削弱了儒家对制度建设的关注。","rec":"薛侃录","kj":[["r","对象","物件","不完全的"],["r","敢","教","是圣人之"],["r","肯","肖","而过愚不"]]},{"n":128,"t":"颜渊问为邦","yw":"黄诚甫问：「先儒以孔子告颜渊为邦之问，是立万世常行之道，如何？」先生曰：「颜子具体圣人，其于为邦的大本大原都已完备，夫子平日知之已深，到此都不必言，只就制度文为上说。此等处亦不可忽略，须要是如此方尽善。又不可因自己本领是当了，便于防范上疏阔，须是要『放郑声，远佞人』。盖颜子是个克己向里、德上用心的人，孔子恐其外面末节或有疏略，故就他不足处帮补说。若在他人，须告以『为政在人，取人以身，修身以道，修道以仁』，『达道九经』及『诚身』许多工夫，方始做得这个，方是万世常行之道。不然，只去行了夏时，乘了殷辂，服了周冕，作了《韶》舞，天下便治得？后人但见颜子是孔门第一人，又问个为邦，便把做天大事看了。」","bh":"黄诚甫问：「朱子认为孔子回答颜渊如何治国的问题，是确立了万世通行的大道，怎么理解？」先生说：「颜回已经具备了圣人的全体，他对治国的根本大原都已完备，孔子平时早已深知，到这时都不必再说，只在制度礼文上说说。这些地方也不能忽略，必须这样才算尽善。又不能因为自己根本已经正当了，就在防范上疏忽大意，必须要『废弃郑国的音乐，远离奸佞小人』。因为颜回是个克制自己、向内用功、在德行上用心的人，孔子怕他在外面的细节上有疏忽，所以就他不足的地方帮他补充说明。如果是对别人，就必须告诉他『治理政事在于得人，得人在于修身，修身在于行道，行道在于仁』，以及『五达道、九经』和『诚身』等许多功夫，才能做好治国这件事，这才是万世通行的大道。不然，难道只要实行夏朝的历法、乘坐商朝的车子、戴上周朝的礼帽、演奏《韶》乐，天下就能治理好吗？后人只看到颜回是孔门第一人，又问了治国的问题，就把这当成天大的事来看了。」","zs":[["颜渊问为邦","《论语·卫灵公》：「颜渊问为邦。子曰：行夏之时，乘殷之辂，服周之冕，乐则《韶》舞。放郑声，远佞人。郑声淫，佞人殆。」"],["辂","古代的大车。"],["为政在人……达道九经","均出自《中庸》第二十章。五达道指君臣、父子、夫妇、昆弟、朋友；九经指治天下的九项常道。"]],"gl":[14,113,127],"q":"孔子为什么只跟颜回讲制度礼文？","a":"因为颜回根本已立，孔子只就他不足之处（外在末节）帮补。对别人则必须先讲修身、诚身的根本。","yong":"带徒弟要因人施教：对基础扎实的人讲细节规范，对新手先讲做人做事的根本。","rec":"薛侃录","kj":[]},{"n":129,"t":"诚意为主，不必补敬字","yw":"蔡希渊问：「文公《大学》新本，先格致而后诚意工夫，似与首章次第相合。若如先生从旧本之说，即诚意反在格致之前，于此尚未释然。」先生曰：「《大学》工夫即是明明德，明明德只是个诚意，诚意的工夫只是格物致知。若以诚意为主，去用格物致知的工夫，即工夫始有下落，即为善去恶无非是诚意的事。如新本先去穷格事物之理，即茫茫荡荡，都无着落处，须用添个『敬』字，方才牵扯得向身心上来，然终是没根原。若须用添个『敬』字，缘何孔门倒将一个最紧要的字落了，直待千余年后要人来补出？正谓以诚意为主，即不须添『敬』字。所以举出个诚意来说，正是学问的大头脑处。于此不察，真所谓『毫厘之差，千里之缪』。大抵《中庸》工夫只是诚身，诚身之极便是至诚；《大学》工夫只是诚意，诚意之极便是至善。工夫总是一般。今说这里补个『敬』字，那里补个『诚』字，未免画蛇添足。」","bh":"蔡希渊问：「朱文公的《大学》新本，先讲格物致知，然后讲诚意功夫，似乎和第一章的次序相符。如果像先生那样依从旧本，诚意反而在格物致知之前，我对这一点还没有想通。」先生说：「《大学》的功夫就是明明德，明明德只是个诚意，诚意的功夫只是格物致知。如果以诚意为主，去用格物致知的功夫，功夫才有着落，为善去恶无非都是诚意的事。如果像新本那样先去穷究事物的道理，就茫茫然没有着落，必须添一个『敬』字，才能牵扯到身心上来，但终究没有根源。如果必须添一个『敬』字，为什么孔门反而把一个最紧要的字漏掉了，直到一千多年后要人来补上？正是因为以诚意为主，就不需要添『敬』字。之所以特别提出诚意来说，正是学问的最大关键。在这里不明察，真是所谓『差之毫厘，谬以千里』。大体上，《中庸》的功夫只是诚身，诚身到了极点就是至诚；《大学》的功夫只是诚意，诚意到了极点就是至善。功夫总是一样的。现在这里补个『敬』字，那里补个『诚』字，未免画蛇添足了。」","zs":[["《大学》新本与旧本","朱熹的《大学章句》调整了古本章节顺序，并补写「格物致知传」，强调先格物致知再诚意。阳明于正德十三年（1518）刊刻《大学古本》，主张以诚意为主。"],["敬","朱熹以「敬」为贯穿《大学》的功夫：「敬者，圣学之所以成始而成终者也。」"]],"gl":[6,1,117,25],"q":"阳明为什么说朱子补「敬」字是画蛇添足？","a":"朱子先向外格物，茫无着落，只好补个「敬」字拉回身心；阳明以诚意为主，格物致知本身就是诚意功夫，不需要再补。","yong":"一套方法如果需要不断打补丁才能用，可能是起点就错了。","con":"反方：朱子的新本是在文本有错简、缺文的判断上做的整理，有一定文献学依据；阳明恢复古本，是出于义理需要，而非更好的文献证据。现代学者对《大学》文本是否有错简仍有争论，两家各有道理。","rec":"薛侃录","kj":[["r","昼","画","诚字未免"]]}],"kjTotal":235};

    <div class="meter"><span class="muted" style="font-size:.85rem">已读</span><span class="track"><i style="width:${pct}%"></i></span><span>${read} / ${E.length}</span></div>
  </section>
  <section class="sec"><h2>今日三条 <small>${next.length?'从第 '+next[0]+' 条接着读':'卷上已读完'}</small></h2>
    <div class="today">${next.length?next.map(n=>card(n,KEY.has(n)?'<span class="pill">有反方</span>':'')).join(''):'<p class="muted">一百二十九条都读过了。去复习，或者等卷下上线。</p>'}</div>
  </section>
  <section class="sec"><h2>到期复习 <small>${due.length?due.length+' 条':'今天没有'}</small></h2>
    ${due.length?`<div class="today">${due.slice(0,3).map(n=>card(n,'<span class="pill due">待复习</span>')).join('')}</div><div class="btnrow" style="margin-top:12px"><a class="btn" href="#review">开始复习 ${due.length} 条</a></div>`
      :`<p class="muted" style="margin:0">读完一条点「读完了」，它会在 1、3、7、16、35 天后回来考你一次。</p>`}
  </section>
  <section class="sec"><h2>卷首</h2><div class="today">
    <a class="card" href="#intro"><span class="no">序</span><span class="tt"><b>徐爱引言</b><span>先生于《大学》格物诸说，悉以旧本为正…</span></span></a>
    <a class="card" href="#ba"><span class="no">跋</span><span class="tt"><b>徐爱跋</b><span>爱因旧说汩没，始闻先生之教…</span></span></a>
  </div></section>`;
}
function vToc(){
  return `<section class="sec"><h2>目录 <small>卷上 · 一百二十九条</small></h2>
  ${RECS.map(([name,a,b])=>`<div class="rec"><h3>${name} <span class="muted" style="font-size:.85rem">第 ${a}–${b} 条</span></h3><div class="grid">${
    E.filter(e=>e.n>=a&&e.n<=b).map(e=>`<a class="cell${P[e.n]?' read':''}${KEY.has(e.n)?' key':''}" href="#e${e.n}" title="${esc(e.t)}">${e.n}</a>`).join('')
  }</div></div>`).join('')}
  <div class="legend"><span><i style="background:var(--qing-soft)"></i>已读</span><span><i style="background:var(--zhu);border-radius:50%;width:7px;height:7px"></i>附反方驳论</span></div></section>`;
}
function vEntry(n){
  const e=BYN[n]; if(!e) return vHome();
  const pv=BYN[n-1], nx=BYN[n+1], r=P[n];
  return `<article class="leaf">
    <div class="eyebrow">${recOf(n)} · 第 ${n} 条 / 129</div>
    <div class="ehead"><span class="big">${n}</span><h1>${esc(e.t)}</h1>${r?'<span class="stamp">已读</span>':''}</div>
    <div class="yw">${paras(e.yw)}</div>
    <section class="blk bhblk"><h2>白话</h2><div class="bh">${paras(e.bh)}</div></section>
    ${S.bh==='0'?`<div class="actions"><button class="btn ghost" id="showBh">看白话</button></div>`:''}
    ${e.zs&&e.zs.length?`<section class="blk"><h2>注释</h2><ul class="zs">${e.zs.map(([k,v])=>`<li><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></li>`).join('')}</ul></section>`:''}
    ${e.yong?`<section class="blk"><h2>今天怎么用</h2><div class="yong">${esc(e.yong)}</div></section>`:''}
    ${e.con?`<section class="blk con"><h2>反方怎么驳</h2><div class="txt">${esc(e.con)}</div></section>`:''}
    <section class="blk"><h2>自测</h2><button class="flip" id="flip" aria-expanded="false"><div class="q">${esc(e.q)}</div><div class="a" hidden>${esc(e.a)}</div><div class="hint">先自己答，再点开看</div></button></section>
    ${e.gl.length?`<section class="blk"><h2>参看</h2><div class="links">${e.gl.map(g=>`<a href="#e${g}">${g} · ${esc(BYN[g].t)}</a>`).join('')}</div></section>`:''}
    <section class="blk kj"><h2>校勘</h2><details class="kjd"${e.kj.length?'':' open'}><summary>与底本相比改动 ${e.kj.length} 处</summary><div style="margin-top:8px">${kjHtml(e.kj)}</div></details></section>
    <div class="actions">${r?`<button class="btn ghost" id="unread">取消已读</button><span class="muted" style="font-size:.85rem">下次复习：${new Date(r.d).toLocaleDateString('zh-CN')}</span>`:`<button class="btn" id="read">读完了</button>`}</div>
  </article>
  <nav class="pager">${pv?`<a href="#e${pv.n}">← ${pv.n} ${esc(pv.t)}</a>`:'<a href="#ba">← 徐爱跋</a>'}${nx?`<a href="#e${nx.n}" style="text-align:right">${nx.n} ${esc(nx.t)} →</a>`:'<span></span>'}</nav>`;
}
function vFront(k){
  const f=D.front[k];
  return `<article class="leaf"><div class="eyebrow">卷首</div><div class="ehead"><h1>${esc(f.title)}</h1></div>
    <div class="yw">${paras(f.yw)}</div>
    <section class="blk bhblk"><h2>白话</h2><div class="bh">${paras(f.bh)}</div></section>
    ${S.bh==='0'?`<div class="actions"><button class="btn ghost" id="showBh">看白话</button></div>`:''}
    <section class="blk"><h2>注释</h2><ul class="zs">${f.zs.map(([a,b])=>`<li><span class="k">${esc(a)}</span><span class="v">${esc(b)}</span></li>`).join('')}</ul></section>
    <section class="blk kj"><h2>校勘</h2><details class="kjd"><summary>与底本相比改动 ${f.kj.length} 处</summary><div style="margin-top:8px">${kjHtml(f.kj)}</div></details></section>
  </article><nav class="pager">${k==='intro'?'<span></span><a href="#ba" style="text-align:right">徐爱跋 →</a>':'<a href="#intro">← 徐爱引言</a><a href="#e1" style="text-align:right">1 亲民还是新民 →</a>'}</nav>`;
}
let lastQ = load('q','');
function vSearch(){
  return `<section class="sec search"><h2>搜索 <small>原文、白话、注释、标题</small></h2>
    <label for="q" class="muted" style="font-size:.85rem">输入关键词，比如「良知」「事上磨」「种树」</label>
    <input id="q" type="search" autocomplete="off" value="${esc(lastQ)}" placeholder="搜点什么">
    <div class="res" id="res"></div></section>`;
}
function doSearch(q){
  lastQ=q; save('q',q);
  const box=$('#res'); if(!box) return;
  q=q.trim(); if(!q){box.innerHTML='<p class="muted">共 129 条可搜。</p>';return}
  const hits=[];
  for(const e of E){
    const zs=(e.zs||[]).map(z=>z.join('：')).join('；');
    const hay=[['原文',e.yw],['白话',e.bh],['注释',zs],['标题',e.t]];
    for(const [lab,t] of hay){const i=t.indexOf(q);if(i>=0){hits.push([e,lab,t,i]);break}}
  }
  const hl=s=>esc(s).split(esc(q)).join('<mark>'+esc(q)+'</mark>');
  box.innerHTML = `<p class="muted" style="margin:0">找到 ${hits.length} 条</p>`+hits.map(([e,lab,t,i])=>{
    const s=Math.max(0,i-18), frag=(s?'…':'')+t.slice(s,i+q.length+30).replace(/\n/g,' ')+'…';
    return `<a href="#e${e.n}"><b>${e.n} · ${esc(e.t)}</b> <span class="pill">${lab}</span><div class="snip">${hl(frag)}</div></a>`}).join('');
}
let rvQueue=[], rvShow=false;
function vReview(){
  if(!rvQueue.length) rvQueue=dueList();
  if(!rvQueue.length) return `<section class="sec"><h2>复习</h2><p class="muted">今天没有到期的条目。读完新的条目后，它们会按 1、3、7、16、35 天的间隔回来。</p><a class="btn" href="#home">回首页</a></section>`;
  const n=rvQueue[0], e=BYN[n];
  return `<div class="rv"><div class="eyebrow">复习 · 还剩 ${rvQueue.length} 条 · 第 ${n} 条「${esc(e.t)}」</div>
    <div class="q">${esc(e.q)}</div>
    ${rvShow?`<div class="a">${esc(e.a)}</div><div class="btnrow" style="margin-top:16px"><button class="btn" id="ok">记得</button><button class="btn ghost" id="ng">忘了，明天再来</button><a class="btn ghost" href="#e${n}">回看原文</a></div>`
      :`<div class="btnrow"><button class="btn" id="reveal">看答案</button></div>`}
  </div>`;
}
function vAbout(){
  const kjT=D.kjTotal;
  return `<section class="sec prose"><h2>关于这个译注本</h2>
  <p>这是王阳明《传习录》卷上的白话译注阅读站，包括徐爱引言、徐爱跋和正文 129 条，按陈荣捷《王阳明传习录详注集评》的编号排列。</p>
  <h2>底本与校勘</h2>
  <p>原文取自殆知阁古籍库的公版电子文本。这个底本是 OCR 识读的，错字很多，例如「心即理也」被识成「心即埋也」，「伏羲画卦」成了「伏义昼卦」。整理时依通行本逐条改正，全卷共改 ${kjT} 处。</p>
  <p>每一处改动都是程序把成稿和底本逐字比对后自动列出的，挂在每条末尾的「校勘」里，没有不留记录的改动。比对只看汉字，不计标点。</p>
  <p>校改依据的是整理者对通行本的了解，没有逐字对照纸本。如果要引用，请用陈荣捷《详注集评》或邓艾民《传习录注疏》核对。</p>
  <h2>白话、注释和反方</h2>
  <p>白话以直译为主，个别长条（如第 11 条）分段意译。注释说明人名、典故和术语。「反方怎么驳」选了 ${KEY.size} 条争议较大的条目，列出朱子学者、清代考据家或现代心理学可能提出的质疑，好让你读的时候不只是点头。</p>
  <p>白话、注释、反方、自测题和「今天怎么用」都由 AI 撰写，不是出版译本。</p>
  <h2>阅读进度保存在哪</h2>
  <p>已读记录、复习日程和设置只存在这台设备的浏览器里，不上传。电脑和手机的进度不相通；清除浏览器数据会丢失进度。</p>
  <h2>离线阅读</h2>
  <p>部署到自己的域名后，第一次打开会把全书缓存下来，之后没网也能打开。手机浏览器里选「添加到主屏幕」，用起来就像一个 App。</p>
  <h2>接下来</h2>
  <p>卷下（陈九川、黄直、黄修易、黄省曾、钱德洪等录）和卷中（书信）会按同样体例陆续加入。</p>
  </section>`;
}

/* —— 路由 —— */
function route(){
  const h=(location.hash||'#home').slice(1);
  let html, m;
  if((m=h.match(/^e(\d+)$/))) html=vEntry(+m[1]);
  else if(h==='toc') html=vToc();
  else if(h==='search') html=vSearch();
  else if(h==='review') html=vReview();
  else if(h==='about') html=vAbout();
  else if(h==='intro'||h==='ba') html=vFront(h);
  else html=vHome();
  $('#app').innerHTML=html;
  if(h!=='review'){rvQueue=[];rvShow=false}
  bind(h,m);
  window.scrollTo(0,0);
  save('last',h);
}
function bind(h,m){
  const f=$('#flip'); if(f) f.addEventListener('click',()=>{const a=f.querySelector('.a'),hi=f.querySelector('.hint');a.hidden=!a.hidden;hi.hidden=!a.hidden;f.setAttribute('aria-expanded',String(!a.hidden))});
  const sb=$('#showBh'); if(sb) sb.addEventListener('click',()=>{document.querySelectorAll('.bhblk').forEach(x=>x.style.display='block');sb.remove()});
  if(m){const n=+m[1];
    const r=$('#read'); if(r) r.addEventListener('click',()=>{markRead(n);route();});
    const u=$('#unread'); if(u) u.addEventListener('click',()=>{unmark(n);route();});
  }
  if(h==='search'){const q=$('#q');doSearch(q.value);q.addEventListener('input',()=>doSearch(q.value));q.focus({preventScroll:true});}
  if(h==='review'){
    const rv=$('#reveal'); if(rv) rv.addEventListener('click',()=>{rvShow=true;$('#app').innerHTML=vReview();bind('review')});
    const ok=$('#ok'),ng=$('#ng');
    const step=good=>{grade(rvQueue[0],good);rvQueue.shift();rvShow=false;if(!rvQueue.length)rvQueue=[-1];$('#app').innerHTML=rvQueue[0]===-1?`<section class="sec"><h2>今天复习完了</h2><p class="muted">答不上来的，明天会再来。</p><a class="btn" href="#home">回首页</a></section>`:vReview();bind('review')};
    if(ok) ok.addEventListener('click',()=>step(true)); if(ng) ng.addEventListener('click',()=>step(false));
  }
}
document.addEventListener('keydown',ev=>{
  if(ev.target.closest('input,textarea')) return;
  const m=(location.hash||'').match(/^#e(\d+)$/); if(!m) return;
  const n=+m[1];
  if(ev.key==='ArrowRight'&&BYN[n+1]) location.hash='e'+(n+1);
  if(ev.key==='ArrowLeft'&&BYN[n-1]) location.hash='e'+(n-1);
});
window.addEventListener('hashchange',route);
applySettings();
if(!location.hash){const last=load('last','');if(last&&last!=='home')history.replaceState(null,'','#'+last);}
route();
if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>

</body>
