"","体","来却于本"],["r","真","良","些子意在"],["r","慏","俱","天地万物"],["r","真","良","物慏在我"],["r","起","超","又有一物"],["r","怍","作","知之外能"]]},{"n":270,"t":"释氏不可治天下","yw":"或问：「释氏亦务养心，然要之不可以治天下，何也？」先生曰：「吾儒养心，未尝离却事物，只顺其天则自然，就是功夫。释氏却要尽绝事物，把心看做幻相，渐入虚寂去了，与世间若无些子交涉，所以不可治天下。」","bh":"有人问：「佛家也致力于养心，但总之不能用来治理天下，为什么？」先生说：「我们儒家养心，从来不离开事物，只是顺着天理自然的法则，这就是功夫。佛家却要完全断绝事物，把心看成虚幻的相，渐渐进入虚寂中去了，和世间好像一点关系都没有，所以不能治理天下。」","zs":[["天则","天然的法则。"]],"gl":[94,269,236],"q":"儒佛养心的根本区别是什么？","a":"儒家养心不离事物，顺天则自然；佛家要尽绝事物、视心为幻，所以不能治天下。","rec":"黄省曾录","kj":[["r","懦","儒","先生曰吾"],["r","妩","无","与世间若"],["r","冶","治","所以不可"]]},{"n":271,"t":"与愚夫愚妇同的是同德","yw":"或问「异端」。先生曰：「与愚夫愚妇同的，是谓同德；与愚夫愚妇异的，是谓异端。」","bh":"有人问什么是「异端」。先生说：「与普通百姓相同的，叫作同德；与普通百姓不同的，叫作异端。」","zs":[["愚夫愚妇","普通百姓。《中庸》：「夫妇之愚，可以与知焉。」"]],"gl":[313,49],"q":"阳明怎样定义「异端」？","a":"与愚夫愚妇（普通人的良知）相同的是同德，不同的才是异端。正道就在百姓日用之中。","yong":"你的产品如果只有内行才能看懂，那可能是「异端」。普通客户能懂、能用，才是正道。","rec":"黄省曾录","kj":[]},{"n":272,"t":"孟子与告子的不动心（续）","yw":"先生曰：「孟子不动心与告子不动心，所异只在毫厘间。告子只在不动心上着功，孟子便直从此心原不动处分晓。心之本体原是不动的，只为所行有不合义，便动了。孟子不论心之动与不动，只是『集义』，所行无不是义，此心自然无可动处。若告子只要此心不动，便是把捉此心，将他生生不息之根反阻挠了，此非徒无益，而又害之。孟子『集义』工夫，自是养得充满，并无馁歉，自是纵横自在，活泼泼地，此便是浩然之气。」","bh":"先生说：「孟子的不动心和告子的不动心，差别只在毫厘之间。告子只在『不动心』上用功，孟子却直接从这颗心原本不动的地方去明白。心的本体原本就是不动的，只因为所做的事有不合乎义的，才动了。孟子不管心动不动，只是『集义』，所做的没有不合乎义的，这颗心自然没有可动的地方。像告子那样只要这颗心不动，就是硬抓着这颗心，反而把它生生不息的根阻挡住了，这不仅没有益处，反而有害。孟子集义的功夫，自然养得充满，没有一点亏欠，自然纵横自在、活泼泼的，这就是浩然之气。」","zs":[["馁歉","气不足、有亏欠。《孟子》：「行有不慊于心，则馁矣。」"]],"gl":[81,273,40],"q":"告子和孟子的不动心差在哪里？","a":"告子硬把捉心不动，反而阻碍了生机；孟子只集义，所行皆义，心自然不动，纵横自在。","yong":"想要遇事不慌，别练「憋住」，要练「平时做事都对得起良心」。","rec":"黄省曾录","kj":[["r","闲","间","只在毫厘"],["r","扈","处","然无可动"],["r","桡","挠","之根反阻"],["r","伊","便","泼泼地此"]]},{"n":273,"t":"告子病源：一个性在内，一个物在外","yw":"又曰：「告子病源，从性无善无不善上见来。性无善无不善，虽如此说，亦无大差。但告子执定看了，便有个无善无不善的性在内，有善有恶又在物感上看，便有个物在外，却做两边看了，便会差。无善无不善，性原是如此，悟得及时，只此一句便尽了，更无有内外之间。告子见一个性在内，见一个物在外，便见他于性有未透彻处。」","bh":"先生又说：「告子的病根，是从『性无善无不善』上来的。说性无善无不善，虽然这样说，也没有大错。但告子把它执定了来看，就有一个无善无不善的性在里面，又在外物的感应上看有善有恶，就有一个物在外面，于是把它当作两边来看，就会出错。无善无不善，性原本就是这样，如果领悟得到，只这一句就说尽了，再没有内外的分隔。告子看到一个性在里面，看到一个物在外面，就可见他对性还没有看透彻。」","zs":[["性无善无不善","《孟子·告子上》告子语。"]],"gl":[272,242,101],"q":"阳明认为「性无善无不善」本身错吗？","a":"不错，性原是如此。告子的错在把性和物分成内外两边。这一条与后来「四句教」的「无善无恶心之体」直接相关。","con":"反方：阳明说「性无善无不善，亦无大差」，似乎与孟子「性善」正面冲突，这也是后来王门「四无说」和东林党人争论的源头。如果性无善无恶，道德的根据在哪里？阳明的回答是「无善无恶是谓至善」，但这个说法本身就很容易被误解。","rec":"黄省曾录","kj":[["r","闲","间","有内外之"],["r","虚","处","有未透彻"]]},{"n":274,"t":"草木瓦石也有良知？","yw":"朱本思问：「人有虚灵，方有良知。若草木瓦石之类，亦有良知否？」先生曰：「人的良知，就是草木瓦石的良知。若草木瓦石无人的良知，不可以为草木瓦石矣。岂惟草木瓦石为然，天地无人的良知，亦不可为天地矣。盖天地万物与人原是一体，其发窍之最精处，是人心一点灵明。风雨露雷，日月星辰，禽兽草木，山川土石，与人原只一体。故五谷禽兽之类，皆可以养人；药石之类，皆可以疗疾：只为同此一气，故能相通耳。」","bh":"朱本思问：「人有虚灵的心，才有良知。像草木瓦石之类，也有良知吗？」先生说：「人的良知，就是草木瓦石的良知。如果草木瓦石没有人的良知，就不能成为草木瓦石了。岂止草木瓦石是这样，天地如果没有人的良知，也不能成为天地了。因为天地万物和人原本是一体的，其中发窍最精妙的地方，就是人心这一点灵明。风雨露雷、日月星辰、禽兽草木、山川土石，和人原本只是一体。所以五谷禽兽之类都可以养人，药石之类都可以治病：只因为同是这一气，所以能够相通。」","zs":[["朱本思","朱得之，字本思，江苏靖江人。"],["发窍","开出的孔窍，这里指天地万物灵明集中显现之处。"],["养人","底本作「责人」，据通行本改。"]],"gl":[275,89,261],"q":"阳明说草木瓦石也有良知，是什么意思？","a":"不是说石头会思考，而是天地万物与人一体，人心一点灵明是万物发窍最精处；没有这点灵明，草木瓦石的意义也无从显现。","con":"反方：这种说法很容易被理解为泛心论或神秘主义，从现代科学的角度很难成立。即使作意义论解释（草木的意义需人心来显现），也会遇到问题：人类出现之前，天地万物难道不存在、或没有意义吗？","rec":"黄省曾录","kj":[["r","顼","类","木瓦石之"],["r","真","良","木瓦石的"],["r","扈","处","窍之最精"],["r","责","养","类皆可以"]]},{"n":275,"t":"岩中花树（核心条）","yw":"先生游南镇，一友指岩中花树问曰：「天下无心外之物，如此花树，在深山中自开自落，于我心亦何相关？」先生曰：「你未看此花时，此花与汝心同归于寂；你来看此花时，则此花颜色一时明白起来：便知此花不在你的心外。」","bh":"先生游览会稽山南镇，一位朋友指着山岩中的花树问：「先生说天下没有心外之物，像这棵花树，在深山中自己开、自己落，和我的心又有什么关系？」先生说：「你没有看这花的时候，这花和你的心一同归于寂静；你来看这花的时候，这花的颜色一下子就鲜明起来了：由此可知这花不在你的心外。」","zs":[["南镇","会稽山，在浙江绍兴。"],["寂","寂静、沉寂，指未被感知、未显现意义的状态。"]],"gl":[274,6,83,32],"q":"「岩中花树」是说花不看就不存在吗？","a":"不是。是说花的颜色、意义是在心与花相遇时才「明白起来」的，没有看时，花和心同归于寂。花的意义世界不在心外。","yong":"同一个市场，你没用心去看，它就「同归于寂」；你认真研究客户，机会的颜色就一下子明白起来。","con":"反方：这是心学被批评为主观唯心主义最常引用的一条。如果「不在心外」指花的存在依赖于人的观看，那就与常识和科学冲突（花在没人看时照样开落）。辩护者认为阳明讲的是意义论而非存在论：花的「颜色明白」是指它进入人的意义世界。但阳明原文没有作这种区分，这正是争论数百年的原因。","rec":"黄省曾录","kj":[]},{"n":276,"t":"大人与物同体，为何有厚薄","yw":"问：「大人与物同体，如何《大学》又说个厚薄？」先生曰：「惟是道理自有厚薄。比如身是一体，把手足捍头目，岂是偏要薄手足？其道理合如此。禽兽与草木同是爱的，把草木去养禽兽，心又忍得；人与禽兽同是爱的，宰禽兽以养亲与供祭祀、燕宾客，心又忍得；至亲与路人同是爱的，如箪食豆羹，得则生，不得则死，不能两全，宁救至亲，不救路人，心又忍得：这是道理合该如此。及至吾身与至亲，更不得分别彼此厚薄。盖以仁民爱物皆从此出，此处可忍，更无所不忍矣。《大学》所谓厚薄，是良知上自然的条理，不可逾越，此便谓之义；顺这个条理，便谓之礼；知此条理，便谓之智；终始是这个条理，便谓之信。」","bh":"有人问：「大人与万物同为一体，为什么《大学》又讲厚薄？」先生说：「只因为道理本身就有厚薄。比如身体是一体的，却用手脚去保护头和眼睛，难道是偏要轻视手脚？是道理本该如此。禽兽和草木同样是爱的，但拿草木去喂养禽兽，心里又忍得下；人和禽兽同样是爱的，但宰杀禽兽来奉养父母、供奉祭祀、招待宾客，心里又忍得下；至亲和路人同样是爱的，但如果只有一筐饭一碗汤，得到就活、得不到就死，不能两全，宁可救至亲，不救路人，心里又忍得下：这是道理本该如此。至于我自身和至亲之间，就再不能分彼此厚薄了。因为仁民爱物都是从这里出发的，这里如果忍得下，就没有什么忍不下的了。《大学》所说的厚薄，是良知上自然的条理，不可逾越，这就叫作义；顺着这个条理，就叫作礼；知道这个条理，就叫作智；始终坚持这个条理，就叫作信。」","zs":[["厚薄","《大学》：「其所厚者薄，而其所薄者厚，未之有也。」"],["箪食豆羹","一筐饭、一碗汤。《孟子·告子上》：「一箪食，一豆羹，得之则生，弗得则死。」"]],"gl":[93,89,274],"q":"万物一体，为什么还有亲疏厚薄？","a":"厚薄是良知上自然的条理，就像用手脚护头目，不是轻视手脚。顺这个条理就是义、礼、智、信。","yong":"资源有限时，先保核心客户、核心产品，这不是不公平，是条理。","con":"反方：「宁救至亲，不救路人」是儒家伦理的标志性立场，与墨家「兼爱」和现代普遍主义伦理都有冲突。伦理学中的「电车难题」类讨论显示，许多人并不认同亲疏应决定生死抉择。阳明称之为「良知上自然的条理」，但这种「自然」可能也是文化塑造的结果。","rec":"黄省曾录","kj":[["r","隔","偏","头目岂是"],["r","踰","逾","条理不可"],["r","言","这","谓之义顺"],["r","牒","条","义顺言个"]]},{"n":277,"t":"心无体，以感应之是非为体","yw":"又曰：「目无体，以万物之色为体；耳无体，以万物之声为体；鼻无体，以万物之臭为体；口无体，以万物之味为体；心无体，以天地万物感应之是非为体。」","bh":"先生又说：「眼睛没有固定的本体，以万物的颜色为本体；耳朵没有固定的本体，以万物的声音为本体；鼻子没有固定的本体，以万物的气味为本体；嘴巴没有固定的本体，以万物的味道为本体；心没有固定的本体，以天地万物感应的是非为本体。」","zs":[["感应","底本脱「应」字，据通行本补。"]],"gl":[274,275,288],"q":"「心无体」是什么意思？","a":"心没有一个孤立存在的实体，它就在与天地万物感应时所生的是非判断中显现。","yong":"你是什么样的人，不看你说，看你每天对一件件事作出的是非判断。","rec":"黄省曾录","kj":[["i","","应","地万物感"]]},{"n":278,"t":"生死念头","yw":"问「夭寿不贰」。先生曰：「学问功夫，于一切声利嗜好，俱能脱落殆尽，尚有一种生死念头毫发挂带，便于全体有未融释处。人于生死念头，本从生身命根上带来，故不易去。若于此处见得破，透得过，此心全体方是流行无碍，方是尽性至命之学。」","bh":"有人问「不论短命长寿都不改变心志」。先生说：「做学问功夫，对一切名声利益、嗜好，都能摆脱干净，但还有一种生死的念头有一丝一毫挂着，就在心的全体上还有没融化的地方。人的生死念头，本来是从生身性命的根子上带来的，所以不容易去掉。如果在这里看得破、透得过，这颗心的全体才能流行无碍，才是尽性至命的学问。」","zs":[["夭寿不贰","《孟子·尽心上》：「夭寿不贰，修身以俟之，所以立命也。」"]],"gl":[6,126,254],"q":"为什么生死念头最难去？","a":"它是从生身命根上带来的。声利嗜好都放下了，生死念头还可能挂带着；看破这一层，心体才流行无碍。","con":"反方：怕死是生物的本能，也是人珍惜生命、规避风险的基础。要求「看破」生死，对普通人可能是过高甚至不健康的标准。当代心理学更倾向于接纳死亡焦虑，而不是消除它。","rec":"黄省曾录","kj":[["r","天","夭","问"],["r","末","未","于全体有"],["r","桹","根","从生身命"],["r","悾","性","碍方是尽"]]},{"n":279,"t":"这是我医人的方子","yw":"一友问：「欲于静坐时，将好名、好色、好货等根逐一搜寻，扫除廓清，恐是剜肉做疮否？」先生正色曰：「这是我医人的方子，真是去得人病根，更有大本事人，过了十数年，亦还用得着。你如不用，且放起，不要作坏我的方子！」是友愧谢。少间，曰：「此量非你事，必吾门稍知意思者为此说以误汝。」在坐者皆悚然。","bh":"一位朋友问：「想在静坐时，把好名、好色、贪财这些病根一个个搜出来，扫除干净，恐怕是挖好肉做疮吧？」先生严肃地说：「这是我医人的药方，真能去掉人的病根，就是有大本事的人，过了十几年，也还用得着。你如果不用，就先收起来，不要败坏我的药方！」这位朋友惭愧地道歉。过了一会儿，先生说：「这想来不是你自己的想法，一定是我门下稍微懂一点意思的人这样说来误导你。」在座的人都很惊惧。","zs":[["剜肉做疮","挖掉好肉做成疮口，比喻没病找病、自寻伤害。"],["吾门","底本作「吾们」，据通行本改。"]],"gl":[39,72],"q":"阳明为什么对「剜肉做疮」的说法这么严厉？","a":"搜寻病根、扫除廓清是他治人病根的方子，说它是剜肉做疮，等于败坏这个方子，误导学人。","yong":"有人说「复盘没用，反省多了内耗」？反省本身不是内耗，只反省不改才是。","rec":"黄省曾录","kj":[["r","怍","作","放起不要"],["r","力","方","怍坏我的"],["r","闲","间","友愧谢少"],["r","们","门","你事必吾"]]},{"n":280,"t":"我麈尾安在","yw":"一友问功夫不切。先生曰：「学问功夫，我已曾一句道尽，如何今日转说转远，都不着根？」对曰：「致良知，盖闻教矣，然亦须讲明。」先生曰：「既知致良知，又何可讲明？良知本是明白，实落用功便是；不肯用功，只在语言上转说转糊涂。」曰：「正求讲明致之之功。」先生曰：「此亦须你自家求，我亦无别法可道。昔有禅师，人来问法，只把麈尾提起。一日，其徒将其麈尾藏过，试他如何设法。禅师寻麈尾不见，又只空手提起。我这个良知，就是设法的麈尾，舍了这个，有何可提得？」少间，又一友请问功夫切要。先生旁顾曰：「我麈尾安在？」一时在坐者皆跃然。","bh":"一位朋友问做功夫不得要领的问题。先生说：「做学问的功夫，我已经用一句话说完了，怎么今天越说越远，都扎不下根？」那人回答：「致良知，我已经听过您的教导了，但也需要讲明白。」先生说：「既然知道致良知，又有什么可讲明的？良知本来就是明白的，踏实用功就是了；不肯用功，只在言语上越说越糊涂。」那人说：「正是要请您讲明致良知的功夫。」先生说：「这也要你自己去求，我也没有别的方法可说。从前有个禅师，有人来问佛法，他只是把拂尘提起来。有一天，他的徒弟把拂尘藏起来，看他怎么办。禅师找不到拂尘，就空着手提起来。我这个良知，就是用来说法的拂尘，舍了这个，还有什么可提的？」过了一会儿，又有一位朋友请问功夫的要领。先生朝旁边看了看说：「我的拂尘在哪里？」一时间在座的人都高兴得跳起来。","zs":[["麈尾","拂尘，古代清谈和禅师说法时手持的器物。"],["设法","说法、施教。"]],"gl":[206,262,10],"q":"「我麈尾安在」是什么意思？","a":"致良知就是那根麈尾，一提就是全部。再要讲「怎么致」，就是麈尾不在手里还在找麈尾，答案只是：去做。","yong":"你问「怎么才能执行力强」？没有比「现在就做」更好的答案。","rec":"黄省曾录","kj":[["d","一","","功只在语"],["r","楜","糊","上转说转"],["r","尘","麈","问法只把"],["r","尘","麈","其徒将其"],["r","尘","麈","法禅师寻"],["r","尘","麈","是设法的"],["r","闲","间","可提得少"],["r","尘","麈","旁顾曰我"],["r","着","者","一时在坐"]]},{"n":281,"t":"圣人不贵前知","yw":"或问「至诚前知」。先生曰：「诚是实理，只是一个良知。实理之妙用流行就是神，其萌动处就是几，诚、神、几曰圣人。圣人不贵前知，祸福之来，虽圣人有所不免。圣人只是知几，遇变而通耳。良知无前后，只知得见在的几，便是一了百了。若有个前知的心，就是私心，就有趋避利害的意。邵子必于前知，终是利害心未尽处。」","bh":"有人问《中庸》说的「至诚的人能预知未来」。先生说：「诚是实在的天理，只是一个良知。实理的妙用流行就是神，它的萌动之处就是几，诚、神、几兼备就是圣人。圣人不看重预知，祸福来临，即使圣人也有免不了的。圣人只是能察知几微，遇到变化能通达应对罢了。良知没有前后，只要知道当下的几微，就一了百了。如果有一个想预知的心，就是私心，就有趋利避害的意思。邵雍一定要预知未来，终究是利害之心没有去尽的地方。」","zs":[["至诚前知","《中庸》：「至诚之道，可以前知。」"],["诚、神、几曰圣人","周敦颐《通书》：「诚、神、几，曰圣人。」底本作「诙神几」，据《通书》改。"],["邵子","邵雍，北宋理学家，精于象数之学，传说能预知未来。"]],"gl":[247,282,331],"q":"圣人能预知未来吗？","a":"圣人不贵前知，只知当下的几，遇变而通。想预知未来，本身就是趋利避害的私心。","yong":"别花太多精力预测市场下半年怎样。看清当下客户在说什么、在烦什么，这才是「几」。","con":"反方：预测和规划对企业和国家至关重要，「只知见在的几」在复杂系统中可能远远不够。阳明反对的是为个人趋利避害的占卜式「前知」，若推广成反对一切预测，就站不住了。","rec":"黄省曾录","kj":[["r","诙","诚","处就是几"],["r","扈","处","害心未尽"]]},{"n":282,"t":"无知无不知","yw":"先生曰：「无知无不知，本体原是如此。譬如日未尝有心照物，而自无物不照。无照无不照，原是日的本体。良知本无知，今却要有知；本无不知，今却疑有不知：只是信不及耳。」","bh":"先生说：「没有刻意的知，却又无所不知，本体原本就是这样。好比太阳从来没有存心去照什么东西，却自然没有照不到的东西。没有刻意照，却无所不照，这原是太阳的本体。良知本来没有刻意的知，现在却要它有知；本来无所不知，现在却怀疑它有不知：只是信不过它罢了。」","zs":[],"gl":[213,281,289],"q":"「无知无不知」怎么理解？","a":"像太阳无心照物却无物不照。良知不刻意去知，却自然无所不知。问题是人对它信不及。","rec":"黄省曾录","kj":[]},{"n":283,"t":"聪明睿知人人自有","yw":"先生曰：「『惟天下至圣，为能聪明睿知』，旧看何等玄妙，今看来原是人人自有的。耳原是聪，目原是明，心思原是睿知，圣人只是一能之尔，能处正是良知。众人不能，只是个不致知。何等明白简易！」","bh":"先生说：「《中庸》说『只有天下最高的圣人，才能聪明睿智』，以前看觉得多么玄妙，现在看来原本是人人自有的。耳朵本来就聪，眼睛本来就明，心思本来就睿智，圣人只是能够把它发挥出来罢了，能发挥的地方正是良知。普通人不能，只是因为没有致良知。多么明白简易！」","zs":[["惟天下至圣，为能聪明睿知","《中庸》第三十一章。"]],"gl":[7,21],"q":"聪明睿知是圣人专有的吗？","a":"不是。耳本聪、目本明、心本睿知，人人自有。圣人只是能发挥出来，众人只是不致知。","rec":"黄省曾录","kj":[["r","之","至","曰惟天下"]]},{"n":284,"t":"远虑与将迎","yw":"问：「孔子所谓远虑，周公夜以继日，与将迎不同，何如？」先生曰：「远虑不是茫茫荡荡去思虑，只是要存这天理。天理在人心，亘古亘今，无有终始。天理即是良知，千思万虑，只是要致良知。良知愈思愈精明，若不精思，漫然随事应去，良知便粗了。若只着在事上茫茫荡荡去思，教做远虑，便不免有毁誉、得丧、人欲搀入其中，就是将迎了。周公终夜以思，只是『戒慎不睹，恐惧不闻』的功夫，见得时，其气象与将迎自别。」","bh":"有人问：「孔子说的『远虑』，周公『夜以继日地思考』，和『将迎』（预先迎合、事后挂念）有什么不同？」先生说：「远虑不是茫茫然地去思虑，只是要保存这个天理。天理在人心中，从古到今，没有开始也没有结束。天理就是良知，千思万虑，只是要致良知。良知越思考越精明，如果不精心思考，随随便便地应付事情，良知就粗疏了。如果只是在事情上茫茫然地去想，把这叫作远虑，就难免有毁誉、得失、人欲掺杂进去，那就是将迎了。周公整夜思考，只是『在不被看见时戒慎，在不被听见时恐惧』的功夫，看清了这一点，他的气象自然和将迎不同。」","zs":[["远虑","《论语·卫灵公》：「人无远虑，必有近忧。」"],["周公夜以继日","《孟子·离娄下》：「周公思兼三王……其有不合者，仰而思之，夜以继日。」"],["将迎","见第219条注。"]],"gl":[219,281,79],"q":"深谋远虑和焦虑计较，区别在哪里？","a":"远虑是存天理、致良知，越思越精明；在事上茫茫荡荡去想、掺进毁誉得失，就成了将迎。","yong":"做年度规划是远虑；半夜翻来覆去想「万一客户不续约怎么办」是将迎。","rec":"黄省曾录","kj":[["i","","继","周公夜以"],["r","互","亘","理在人心"],["r","郥","即","终始天理"],["r","真","良","随事应去"]]},{"n":285,"t":"天下归仁不是效验","yw":"问：「『一日克己复礼，天下归仁』，朱子作效验说，如何？」先生曰：「圣贤只是为己之学，重功夫不重效验。仁者以万物为体，不能一体，只是己私未忘。全得仁体，则天下皆归于吾仁，就是『八荒皆在我闼』意。天下皆与，其仁亦在其中。如『在邦无怨，在家无怨』，亦只是自家不怨，如『不怨天，不尤人』之意；然家邦无怨于我，亦在其中，但所重不在此。」","bh":"有人问：「『一旦克己复礼，天下的人都会称许他是仁人』，朱子把它当作效验来解释，怎么样？」先生说：「圣贤只是为己之学，重视功夫，不重视效验。仁者以万物为一体，不能一体，只是自己的私心没有去掉。完全得到了仁的本体，那么天下都归于我的仁中，就是『八方荒远之地都在我的门内』的意思。天下都称许他，这个仁也在其中了。比如『在诸侯国没有怨恨，在大夫家没有怨恨』，也只是自己不怨恨，就像『不怨天，不怪人』的意思；当然家国也就不怨恨我了，这也在其中，但重点不在这里。」","zs":[["一日克己复礼，天下归仁","《论语·颜渊》。朱熹注：「一日克己复礼，则天下之人皆与其仁。」"],["八荒皆在我闼","吕大临《克己铭》。闼，门内。"],["在邦无怨，在家无怨","《论语·颜渊》。"]],"gl":[89,111],"q":"「天下归仁」是克己复礼的效果吗？","a":"阳明认为不是讲效果，是讲仁体本身：全得仁体，天下自然在我的仁中。圣学重功夫不重效验。","yong":"服务好客户，好评自然会来。但如果你做服务就是为了要好评，心思就偏了。","rec":"黄省曾录","kj":[["i","","夫","之学重功"]]},{"n":286,"t":"巧力圣智","yw":"问：「孟子『巧力圣智』之说，朱子云『三子力有余而巧不足』，何如？」先生曰：「三子固有力，亦有巧。巧、力实非两事，巧亦只在用力处，力而不巧，亦是徒力。三子譬如射，一能步箭，一能马箭，一能远箭。他射得到，俱谓之力；中处，俱可谓之巧。但步不能马，马不能远，各有所长，便是才力分限有不同处。孔子则三者皆长，然孔子之和，只到得柳下惠而极；清，只到得伯夷而极；任，只到得伊尹而极：何曾加得些子？若谓『三子力有余而巧不足』，则其力反过孔子了。『巧、力』只是发明『圣、知』之义，若识得『圣、知』本体是何物，便自了然。」","bh":"有人问：「孟子关于『巧、力、圣、智』的说法，朱子说『伯夷、伊尹、柳下惠三人力量有余而技巧不足』，对吗？」先生说：「三人固然有力，也有巧。巧和力其实不是两件事，巧也只在用力的地方，有力而不巧，也是白费力气。这三个人好比射箭，一个擅长步射，一个擅长骑射，一个擅长远射。他们都能射到，都可以叫作力；都能射中，都可以叫作巧。只是步射的不能骑射，骑射的不能远射，各有所长，这就是才力分限不同的地方。孔子则三样都擅长，但孔子的『和』，只到柳下惠的程度就到顶了；『清』，只到伯夷的程度就到顶了；『任』，只到伊尹的程度就到顶了：何曾多出一点？如果说『三人力有余而巧不足』，那他们的力反而超过孔子了。『巧、力』只是用来阐明『圣、智』的含义，如果认识了『圣、智』的本体是什么，自然就明白了。」","zs":[["巧力圣智","《孟子·万章下》：「智，譬则巧也；圣，譬则力也。由射于百步之外也，其至，尔力也；其中，非尔力也。」孟子称伯夷「圣之清者」、伊尹「圣之任者」、柳下惠「圣之和者」、孔子「圣之时者」。"]],"gl":[99,107],"q":"阳明为什么不同意「三子力有余而巧不足」？","a":"巧力不是两事，三子各有巧有力，只是各有所长。说他们力有余，反而等于说他们力胜过孔子，不通。","rec":"黄省曾录","kj":[["r","虚","处","谓之力中"],["r","斫","所","能远各有"]]},{"n":287,"t":"良知即天","yw":"先生曰：「『先天而天弗违』，天即良知也；『后天而奉天时』，良知即天也。」","bh":"先生说：「《易经》说『在天之先行动，天也不违背他』，这里的天就是良知；『在天之后行动，奉行天时』，这里的良知就是天。」","zs":[["先天而天弗违，后天而奉天时","《周易·乾卦·文言》。"]],"gl":[261,266],"q":"阳明怎样解释「先天而天弗违，后天而奉天时」？","a":"良知即天，天即良知。依良知而行，就是与天合一。","rec":"黄省曾录","kj":[["r","郥真","即良","天弗违天"]]},{"n":288,"t":"良知只是个是非之心","yw":"「良知只是个是非之心，是非只是个好恶。只好恶就尽了是非，只是非就尽了万事万变。」又曰：「『是非』两字是个大规矩，巧处则存乎其人。」","bh":"「良知只是一个辨别是非的心，是非只是一个喜好和厌恶。只要有好恶，就穷尽了是非；只要有是非，就穷尽了万事万变。」先生又说：「『是非』两个字是个大规矩，至于运用的巧妙，就在于各人了。」","zs":[["是非之心","《孟子·公孙丑上》：「是非之心，智之端也。」"]],"gl":[6,229,277],"q":"良知归根到底是什么？","a":"一个是非之心；是非归根到底是好恶。规矩只有是非两字，巧处在各人。","yong":"做决策不用搞复杂的框架，先问：我真心觉得这事对不对？","rec":"黄省曾录","kj":[]},{"n":289,"t":"日光与云：圣贤愚","yw":"「圣人之知，如青天之日；贤人如浮云天日；愚人如阴霾天日。虽有昏明不同，其能辨黑白则一。虽昏黑夜里，亦影影见得黑白，就是日之余光未尽处。困学功夫，亦只从这点明处精察去耳。」","bh":"「圣人的良知，像晴天的太阳；贤人的良知，像有浮云的天上的太阳；愚人的良知，像阴霾天的太阳。虽然有昏暗明亮的不同，但能辨别黑白是一样的。即使在昏黑的夜里，也能隐隐约约看见黑白，这就是太阳的余光没有完全消失的地方。困而学之的功夫，也只是从这一点明亮处仔细省察下去罢了。」","zs":[["困学","困而学之，即困知勉行。"]],"gl":[282,290,7],"q":"愚人的良知还在吗？","a":"在。即使是阴霾天，甚至黑夜，也能影影见得黑白。困学功夫就从这一点明处入手。","yong":"再迷茫的时候，你心里总还有一点「这个不对」的感觉。从那一点开始。","rec":"黄省曾录","kj":[["r","因","困","光未尽处"]]},{"n":290,"t":"七情是良知之用，但不可有所着","yw":"问：「知譬日，欲譬云，云虽能蔽日，亦是天之一气合有的，欲亦莫非人心合有否？」先生曰：「喜、怒、哀、惧、爱、恶、欲，谓之七情，七者俱是人心合有的，但要认得良知明白。比如日光，亦不可指着方所，一隙通明，皆是日光所在；虽云雾四塞，太虚中色象可辨，亦是日光不灭处。不可以云能蔽日，教天不要生云。七情顺其自然之流行，皆是良知之用，不可分别善恶，但不可有所着。七情有着，俱谓之欲，俱为良知之蔽。然才有着时，良知亦自会觉，觉即蔽去，复其体矣。此处能勘得破，方是简易透彻功夫。」","bh":"有人问：「良知好比太阳，私欲好比云，云虽然能遮蔽太阳，但也是天上之气应当有的，私欲莫非也是人心应当有的？」先生说：「喜、怒、哀、惧、爱、恶、欲，叫作七情，这七种都是人心应当有的，只是要把良知认清楚。比如阳光，也不能指定在哪个地方，只要有一条缝透亮，都是阳光所在；即使云雾四面堵塞，天空中还能分辨颜色形象，这也是阳光不灭的地方。不能因为云能遮住太阳，就叫天不要生云。七情顺着自然流行，都是良知的作用，不能分善恶，只是不能有所执着。七情一有执着，都叫作欲，都是良知的遮蔽。但刚一执着，良知也会自己察觉，察觉了遮蔽就去掉了，就恢复了本体。在这里能看得透，才是简易透彻的功夫。」","zs":[["良知之用","底本作「良知之目」，据通行本改。"],["勘得破","看得透。"]],"gl":[58,235,289],"q":"七情是良知的障碍吗？","a":"七情本是人心合有的，顺其自然流行都是良知之用；只是一有执着就成了欲，成了遮蔽。良知会自觉，觉了就去蔽。","yong":"不用压抑情绪。开心就开心，难过就难过，只是别抓着不放。","con":"这一条其实修正了许多人对理学「存天理、灭人欲」的刻板印象：阳明明确说七情不可分善恶、不可教天不生云。这比宋儒更接近现代心理学对情绪的看法。","rec":"黄省曾录","kj":[["r","台","合","莫非人心"],["r","谞","谓","惧爱恶欲"],["r","台","合","俱是人心"],["r","力斫","方所","不可指着"],["r","目","用","是良知之"],["r","纔","才","知之蔽然"],["r","力","方","能勘得破"]]},{"n":291,"t":"生知安行也有功夫","yw":"问：「圣人生知安行，是自然的，如何有甚功夫？」先生曰：「知行二字，即是功夫，但有浅深难易之殊耳。良知原是精精明明的，如欲孝亲，生知安行的只是依此良知，实落尽孝而已；学知利行者，只是时时省觉，务要依此良知尽孝而已；至于困知勉行者，蔽锢已深，虽要依此良知去孝，又为私欲所阻，是以不能，必须加人一己百、人十己千之功，方能依此良知以尽其孝。圣人虽是生知安行，然其心不敢自是，肯做困知勉行的功夫。困知勉行的却要思量做生知安行的事，怎生成得？」","bh":"有人问：「圣人生而知之、安然行之，是自然的，还有什么功夫？」先生说：「知、行两个字就是功夫，只是有深浅难易的不同罢了。良知原本是精精明明的，比如要孝顺父母，生知安行的人只是依着良知踏实尽孝罢了；学知利行的人，只是时时省察觉悟，务必依着良知尽孝罢了；至于困知勉行的人，被遮蔽禁锢已经很深，虽然想依着良知去孝顺，又被私欲阻碍，所以做不到，必须下别人一分自己百分、别人十分自己千分的功夫，才能依着良知尽孝。圣人虽然是生知安行，但他心里不敢自以为是，肯做困知勉行的功夫。困知勉行的人却想着做生知安行的事，怎么做得成？」","zs":[],"gl":[221,6,99],"q":"圣人和普通人在功夫上最大的差别是什么？","a":"圣人自以为不足，肯做困知勉行的功夫；普通人困知勉行，却想做生知安行的事。","yong":"高手都在练基本功，新手都在找捷径。","rec":"黄省曾录","kj":[["r","真","良","只是依此"],["i","","实","依此真知"],["d","实","","此真知落"],["r","真","良","务要依此"],["i","","而","真知尽孝"],["r","真","良","方能依此"]]},{"n":292,"t":"大哭一番了方乐","yw":"问：「乐是心之本体，不知遇大故，于哀哭时，此乐还在否？」先生曰：「须是大哭一番了方乐，不哭便不乐矣。虽哭，此心安处是乐也，本体未尝有动。」","bh":"有人问：「快乐是心的本体，不知道遇到父母去世这样的大变故，在哀哭的时候，这个快乐还在吗？」先生说：「必须大哭一场之后才快乐，不哭就不快乐了。虽然在哭，这颗心安然的地方就是快乐，本体从来没有动过。」","zs":[["大故","重大变故，特指父母之丧。"],["乐是心之本体","阳明在《与黄勉之书》中提出的重要命题。"]],"gl":[44,59,215],"q":"父母去世时大哭，心之本体的「乐」还在吗？","a":"在。该哭而哭，心才安，安处就是乐。不哭反而不乐。本体的乐不是笑，是心安。","yong":"该难过的时候就难过。压着不哭，心反而不安。","rec":"黄省曾录","kj":[]},{"n":293,"t":"一园竹：良知同，不妨有异","yw":"问：「良知一而已。文王作彖，周公系爻，孔子赞《易》，何以各自看理不同？」先生曰：「圣人何能拘得死格？大要出于良知同，便各为说，何害？且如一园竹，只要同此枝节，便是大同。若拘定枝枝节节，都要高下大小一样，便非造化妙手矣。汝辈只要去培养良知。良知同，更不妨有异处。汝辈若不肯用功，连笋也不曾抽得，何处去论枝节？」","bh":"有人问：「良知只有一个，文王作卦辞，周公作爻辞，孔子作《易传》，为什么各自看出的道理不同？」先生说：「圣人怎么能拘泥于死板的格式？大体上都出于相同的良知，各说各的又有什么妨碍？比如一园竹子，只要都有这样的枝节，就是大同。如果硬要每根枝每个节都一样高低大小，就不是造化的妙手了。你们只要去培养良知。良知相同，更不妨有不同的地方。你们如果不肯用功，连笋都还没长出来，到哪里去谈枝节？」","zs":[["彖、爻","《周易》的卦辞（彖辞）和爻辞。相传文王作卦辞，周公作爻辞，孔子作《十翼》。"]],"gl":[307],"q":"圣人们说法不同，说明良知不止一个吗？","a":"不是。良知同，枝节可以异，就像一园竹子各不相同却同是竹。拘定一样，反非造化。","yong":"团队里每个人做事风格不同没关系，只要价值观一致。","rec":"黄省曾录","kj":[["r","同","何","孔子赞易"],["r","忮","枝","只要同此"],["r","芛","笋","肯用功连"]]},{"n":294,"t":"舜是大不孝的子，瞽瞍是大慈的父","yw":"乡人有父子讼狱，请诉于先生。侍者欲阻之，先生听之，言不终辞，其父子相抱恸哭而去。柴鸣治入问曰：「先生何言，致伊感悔之速？」先生曰：「我言舜是世间大不孝的子，瞽瞍是世间大慈的父。」鸣治愕然请问。先生曰：「舜常自以为大不孝，所以能孝；瞽瞍常自以为大慈，所以不能慈。瞽瞍只记得舜是我提孩长的，今何不曾豫悦我，不知自心已为后妻所移了，尚谓自家能慈，所以愈不能慈。舜只思父提孩我时如何爱我，今日不爱，只是我不能尽孝，日思所以不能尽孝处，所以愈能孝。及至瞽瞍底豫时，又不过复得此心原慈的本体。所以后世称舜是个古今大孝的子，瞽瞍亦做成个慈父。」","bh":"有一对乡下父子打官司，来找先生申诉。侍从想阻拦，先生听了他们的话，话还没说完，这对父子就相抱痛哭着走了。柴鸣治进来问：「先生说了什么，让他们这么快就感动悔悟了？」先生说：「我说舜是世上最不孝的儿子，瞽瞍是世上最慈爱的父亲。」鸣治很惊讶，请先生解释。先生说：「舜常常认为自己最不孝，所以能孝；瞽瞍常常认为自己最慈爱，所以不能慈。瞽瞍只记得舜是我抱大的，现在为什么不让我高兴，不知道自己的心已经被后妻改变了，还说自己慈爱，所以越来越不慈爱。舜只想着父亲抱着我的时候是多么爱我，现在不爱我了，只是因为我没能尽孝，每天想自己没能尽孝的地方，所以越来越孝顺。等到瞽瞍终于高兴的时候，也不过是恢复了他心中原本慈爱的本体。所以后世称舜是古今最孝的儿子，瞽瞍也成了一个慈父。」","zs":[["瞽瞍","舜的父亲，偏爱后妻和后妻之子象，多次想害死舜。"],["柴鸣治","阳明弟子。"],["提孩","抱在怀中养育。"],["底豫","终于和乐。"]],"gl":[245,296,43],"q":"阳明用一句什么话就化解了父子官司？","a":"「舜是世间大不孝的子，瞽瞍是世间大慈的父。」自以为不孝的才能孝，自以为慈的反而不能慈。父子听了各自反省。","yong":"和合伙人、家人起冲突时，先问「我哪里没做好」，而不是「我已经对他够好了」。","rec":"黄省曾录","kj":[["r","人","入","去柴鸣治"],["i","","瞍","孝的子瞽"],["r","冶","治","慈的父鸣"],["r","下","不","大慈所以"],["i","","只","能慈瞽瞍"],["r","斫","所","自家能慈"],["r","虚","处","不能尽孝"]]},{"n":295,"t":"鄙夫来问，空空而已","yw":"先生曰：「孔子有鄙夫来问，未尝先有知识以应之，其心只空空而已，但叩他自知的是非两端，与之一剖决，鄙夫之心便已了然。鄙夫自知的是非，便是他本来天则，虽圣人聪明，如何可与增减得一毫？他只不能自信，夫子与之一剖决，便已竭尽无余了。若夫子与鄙夫言时，留得些子知识在，便不能竭他的良知，道体即有二了。」","bh":"先生说：「孔子遇到粗鄙的人来问，从不先准备好知识来应对，他的心只是空空的，只是叩问对方自己知道的是非两端，帮他一剖析判断，对方的心就明白了。粗鄙之人自己知道的是非，就是他本来的天理法则，即使圣人聪明，又怎么能给他增减一丝一毫？他只是不能自信，孔子帮他一剖析，就已经竭尽无余了。如果孔子跟他说话时，留着一点自己的知识在，就不能竭尽他的良知，道体就成了两个了。」","zs":[["鄙夫来问","《论语·子罕》：「有鄙夫问于我，空空如也，我叩其两端而竭焉。」"]],"gl":[227,251],"q":"孔子回答鄙夫，为什么「空空而已」？","a":"答案在对方的良知里，孔子只是帮他把是非两端剖开。若先带着自己的知识去灌，反而竭不尽对方的良知。","yong":"客户问「我该怎么做」，先问他「你觉得问题出在哪」。很多时候他心里有数，你只需要帮他理清。","rec":"黄省曾录","kj":[["r","尥","他","是非便是"],["r","失","夫","夫子与鄙"],["d","是","","知识在便"],["r","挂","能","在便是不"]]},{"n":296,"t":"象的奸恶与舜之过","yw":"先生曰：「『烝烝乂，不格奸』，本注说象已进于义，不至大为奸恶。舜征庸后，象犹日以杀舜为事，何大奸恶如之！舜只是自进于乂，以乂熏烝，不去正他奸恶。凡文过掩慝，此是恶人常态，若要指摘他是非，反去激他恶性。舜初时致得象要杀己，亦是要象好的心太急，此就是舜之过处。经过来，乃知功夫只在自己，不去责人，所以致得『克谐』。此是舜『动心忍性，增益不能』处。古人言语，俱是自家经历过来，所以说得亲切，遗之后世，曲当人情。若非自家经过，如何得他许多苦心处？」","bh":"先生说：「《尚书》说舜『用孝道使家人逐渐美善，不至于做出奸恶的事』，朱子的注解说象已经逐渐向善，不至于大做奸恶。可是舜被任用之后，象还每天想着杀舜，还有比这更大的奸恶吗？舜只是让自己不断向善，用善来熏陶感化，不去纠正象的奸恶。凡是文饰过错、掩盖恶行，这是恶人的常态，如果去指责他的是非，反而会激起他的恶性。舜起初招致象要杀自己，也是因为希望象变好的心太急了，这就是舜的过错之处。经历过来之后，才知道功夫只在自己，不去责备别人，所以才达到了『和谐』。这就是孟子说的舜『震动其心、坚忍其性，增加了他原来不具备的能力』的地方。古人的话，都是自己亲身经历过来的，所以说得亲切，留给后世，委婉地切合人情。如果不是亲身经历，怎么能体会他那许多苦心？」","zs":[["烝烝乂，不格奸","《尚书·尧典》。烝烝，渐进；乂，治、美善；格，至。"],["征庸","被征召任用。"],["动心忍性，增益不能","《孟子·告子下》：「所以动心忍性，曾益其所不能。」"]],"gl":[245,294,44],"q":"阳明说舜也有过错，是什么过错？","a":"一开始希望象变好的心太急，去纠正象，反而激起象要杀他。后来才明白功夫只在自己，不去责人。","yong":"想改造一个人，越急越适得其反。先改自己，对方往往跟着变。","con":"反方：这一条为「不责人」提供了一个极端案例：对一再想杀自己的人也只反求诸己。现代人际关系研究会指出，面对持续的伤害，设立边界和远离加害者往往比单方面「感化」更健康、更安全。","rec":"黄省曾录","kj":[["r","地","他","烝不去正"],["r","揜","掩","恶凡文过"],["r","尥","他","非反去激"]]},{"n":297,"t":"今之戏子与古乐","yw":"先生曰：「古乐不作久矣，今之戏子，尚与古乐意思相近。」未达，请问。先生曰：「《韶》之九成，便是舜的一本戏子；《武》之九变，便是武王的一本戏子。圣人一生实事，俱播在乐中，所以有德者闻之，便知他尽善尽美与尽美未尽善处。若后世作乐，只是做些词调，于民俗风化绝无关涉，何以化民善俗？今要民俗反朴还淳，取今之戏子，将妖淫词调俱去了，只取忠臣孝子故事，使愚俗百姓人人易晓，无意中感激他良知起来，却于风化有益，然后古乐渐次可复矣。」曰：「洪要求元声不可得，恐于古乐亦难复。」先生曰：「你说元声在何处求？」对曰：「古人制管候气，恐是求元声之法。」先生曰：「若要去葭灰黍粒中求元声，却如水底捞月，如何可得？元声只在你心上求。」曰：「心如何求？」先生曰：「古人为治，先养得人心和平，然后作乐。比如在此歌诗，你的心气和平，听者自然悦怿兴起，只此便是元声之始。《书》云『诗言志』，志便是乐的本；『歌永言』，歌便是作乐的本；『声依永，律和声』，律只要和声，和声便是制律的本：何尝求之于外？」曰：「古人制候气法，是意何取？」先生曰：「古人具中和之体以作乐，我的中和原与天地之气相应，候天地之气，协凤凰之音，不过去验我的气果和否。此是成律已后事，非必待此以成律也。今要候灰管，必须定至日，然至日子时，恐又不准，又何处取得准来？」","bh":"先生说：「古代的音乐已经很久不演奏了，现在的戏曲，倒还和古乐的意思相近。」学生不明白，请问。先生说：「舜的《韶》乐九章，就是舜的一本戏；武王的《武》乐九变，就是武王的一本戏。圣人一生的实事，都传播在音乐里，所以有德的人一听，就知道它尽善尽美和尽美未尽善的地方。后世作乐，只是写些词调，和民风教化毫无关系，怎么能教化百姓、改善风俗？现在要让民风返璞归真，就拿现在的戏曲，把妖艳淫荡的词调都去掉，只取忠臣孝子的故事，让普通百姓人人容易明白，无意中激发他们的良知，这样对教化有益，然后古乐就可以逐渐恢复了。」钱德洪说：「我想求得音乐的元声却求不到，恐怕古乐也难以恢复。」先生说：「你说元声在哪里求？」德洪回答：「古人制作律管来测候节气，恐怕就是求元声的方法。」先生说：「如果要到芦灰黍粒里去求元声，就像在水底捞月亮，怎么能得到？元声只在你心上求。」德洪问：「心上怎么求？」先生说：「古人治理国家，先培养得人心平和，然后作乐。比如在这里唱诗，你的心气平和，听的人自然喜悦振奋，这就是元声的开始。《尚书》说『诗是表达志向的』，志就是乐的根本；『歌是拉长声调吟咏诗句的』，歌就是作乐的根本；『声调依照吟咏，音律调和声调』，律只要调和声调，调和声调就是制定音律的根本：何曾向外求？」德洪问：「那古人制定候气的方法，用意是什么？」先生说：「古人具备中和的本体来作乐，我的中和原本就和天地之气相应，测候天地之气，协和凤凰的鸣声，不过是检验我的气是否真的和谐。这是音律制成以后的事，不是一定要靠它来制定音律。现在要测候灰管，必须先确定冬至那天，但冬至那天的子时，恐怕又不准确，又到哪里去找准确的标准？」","zs":[["《韶》之九成","《尚书·益稷》：「箫韶九成，凤皇来仪。」九成即九章。"],["元声","音乐的基准音，即黄钟律。"],["葭灰黍粒","古代以芦苇灰候气、以黍粒定律管长度。参见第61条。"],["诗言志……律和声","《尚书·舜典》。"]],"gl":[61,11],"q":"阳明为什么说元声要在心上求？","a":"乐的根本是志、是心气和平。心和了，歌诗就和，这就是元声之始；候气定律只是事后检验，不是根本。","yong":"写网站文案也一样：先想清楚要对客户说什么（志），再去琢磨措辞和排版（律）。","con":"反方：阳明认为可以改编戏曲、去掉「妖淫词调」来教化百姓，这实质上是主张用道德标准审查文艺。后世对戏曲的禁毁、对文艺「有益风化」的要求，与这种思路一脉相承。艺术的价值是否只在于教化，这是一个长期争论的问题。","rec":"黄省曾录","kj":[["r","侯","候","古人制管"],["r","侯","候","曰古人制"],["r","侯","候","律也今要"],["r","曰","日","必须定至"]]},{"n":298,"t":"点化不如自家解化","yw":"先生曰：「学问也要点化，但不如自家解化者，自一了百当。不然，亦点化许多不得。」","bh":"先生说：「学问也需要别人点拨，但不如自己领悟化解的，自然一了百当。否则，点拨也点拨不了太多。」","zs":[["点化","点拨开导。"]],"gl":[280,252],"q":"别人点拨和自己领悟，哪个更重要？","a":"自家解化更重要，一了百当。没有自己的体会，点化也用处有限。","rec":"黄省曾录","kj":[]},{"n":299,"t":"学孔子不在学气魄","yw":"「孔子气魄极大，凡帝王事业，无不一一理会，也只从那心上来。譬如大树有多少枝叶，也只是根本上用得培养功夫，故自然能如此，非是从枝叶上用功做得根本也。学者学孔子，不在心上用功，汲汲然去学那气魄，却倒做了。」","bh":"「孔子的气魄极大，凡是帝王的事业，没有不一一领会的，也只是从那颗心上来的。比如大树有多少枝叶，也只是在根本上下了培养功夫，所以自然能这样，不是在枝叶上用功能做成根本的。学者学孔子，不在心上用功，急急忙忙去学他的气魄，就做反了。」","zs":[],"gl":[30,240,107],"q":"学孔子，学什么？","a":"学他在心上用功，不是学他的气魄。气魄是枝叶，心是根。","yong":"学成功人士别学他的口头禅和穿搭，学他怎么对待手头的每件事。","rec":"黄省曾录","kj":[]},{"n":300,"t":"补甑","yw":"「人有过，多于过上用功，就是补甑，其流必归于文过。」","bh":"「人有了过错，大多在过错上下功夫，这就像修补破了的甑子，发展下去必然会变成掩饰过错。」","zs":[["甑","古代蒸饭的瓦器。补甑，修补已破的甑，比喻在已成的过错上弥缝。"]],"gl":[106,296],"q":"在过错上用功有什么问题？","a":"那是补甑，补来补去就成了文过饰非。真功夫是回到心上，去掉过错的根。","yong":"项目出问题了，别只想着怎么跟客户解释。先找出你哪里起了偷懒或侥幸的心。","rec":"黄省曾录","kj":[]},{"n":301,"t":"无一事而心不宁","yw":"「今人于吃饭时，虽无一事在前，其心常役役不宁，只缘此心忙惯了，所以收摄不住。」","bh":"「现在的人吃饭的时候，即使面前没有一件事，心里也常常忙乱不安，只因为这颗心忙惯了，所以收不住。」","zs":[["役役","劳碌不息的样子。"],["忙惯","底本作「忙愦」，据通行本改。"]],"gl":[104,79],"q":"吃饭时心也静不下来，原因是什么？","a":"心忙惯了，没有主宰，所以收摄不住。","yong":"吃饭时放下手机。这顿饭，就是今天的功夫。","rec":"黄省曾录","kj":[["r","伏二","无一","吃饭时虽"],["r","没","役","前其心常"],["r","愦","惯","缘此心忙"]]},{"n":302,"t":"有业以居之","yw":"「琴瑟简编，学者不可无，盖有业以居之，心就不放。」","bh":"「琴瑟和书籍，学者不能没有，因为有一份事业来安顿身心，心就不会放逸。」","zs":[["简编","书籍。"]],"gl":[240,115],"q":"阳明为什么说琴瑟书籍不可无？","a":"有正当的事业安顿身心，心就不会放逸。","yong":"给自己留一个正经爱好。手上有事，心才不乱跑。","rec":"黄省曾录","kj":[]},{"n":303,"t":"好高不能忘己","yw":"先生叹曰：「世间知学的人，只有这些病痛打不破，就不是善与人同。」崇一曰：「这病痛只是个好高不能忘己尔。」","bh":"先生感叹说：「世上懂得学问的人，只有这个毛病打不破，就不能『与人一同为善』。」欧阳崇一说：「这个毛病只是好高骛远、不能忘掉自己罢了。」","zs":[["善与人同","《孟子·公孙丑上》：「大舜有大焉，善与人同，舍己从人，乐取于人以为善。」"]],"gl":[105,107],"q":"知学的人最难打破的病痛是什么？","a":"好高、不能忘己，所以不能善与人同。","yong":"别人的好主意，你能不能痛快地说「这比我的好」？","rec":"黄省曾录","kj":[]},{"n":304,"t":"知得过不及就是中和","yw":"问：「良知原是中和的，如何却有过不及？」先生曰：「知得过不及处，就是中和。」","bh":"有人问：「良知本来是中和的，为什么还会有过和不及？」先生说：「能知道哪里过了、哪里不及，就是中和。」","zs":[],"gl":[58,44],"q":"良知本是中和，为何还有过不及？","a":"过不及是情念的事，知得过不及处的那个，就是良知的中和。","yong":"你察觉到「我刚才说话太冲了」，这个察觉本身就是你的分寸。","rec":"黄省曾录","kj":[]},{"n":305,"t":"所恶于上，毋以使下","yw":"「『所恶于上』是良知，『毋以使下』即是致知。」","bh":"「『厌恶上级对待自己的方式』，这是良知；『不用这种方式去对待下级』，这就是致知。」","zs":[["所恶于上，毋以使下","《大学》「絜矩之道」：「所恶于上，毋以使下；所恶于下，毋以事上。」"]],"gl":[6,226],"q":"用《大学》絜矩之道说明良知和致知。","a":"知道自己厌恶上级的什么，是良知；不拿它去对待下级，是致知。","yong":"你讨厌客户压价压到底，那你对供应商呢？","rec":"黄省曾录","kj":[]},{"n":306,"t":"仪秦也窥见良知妙用","yw":"先生曰：「苏秦、张仪之智，也是圣人之资。后世事业文章，许多豪杰名家，只是学得仪、秦故智。仪、秦学术，善揣摸人情，无一些不中人肯綮，故其说不能穷。仪、秦亦是窥见得良知妙用处，但用之于不善尔。」","bh":"先生说：「苏秦、张仪的智慧，也是圣人的资质。后世的事业文章，许多豪杰名家，只是学到了张仪、苏秦的旧智谋。张仪、苏秦的学术，善于揣摩人情，没有一点不切中人心要害，所以他们的说辞无穷无尽。张仪、苏秦也是窥见了良知的妙用之处，只是用在了不善的地方罢了。」","zs":[["苏秦、张仪","战国纵横家，以游说诸侯、合纵连横著称。"],["肯綮","筋骨结合处，比喻要害关键。"]],"gl":[261,290],"q":"阳明为什么说苏秦张仪的智慧也是「圣人之资」？","a":"他们揣摩人情无不中肯，说明窥见了良知的妙用；只是用在了不善处。","yong":"懂得揣摩客户心理是本事，但用来操纵客户还是帮客户解决问题，区别就在良知。","con":"反方：这条说法很大胆，把纵横家的权谋也归为良知妙用的误用，会模糊「良知」与「聪明」的界限。如果连苏秦张仪的揣摩人心都算良知，良知的道德内涵就被稀释了。","rec":"黄省曾录","kj":[]},{"n":307,"t":"未扣时惊天动地，既扣时寂天默地","yw":"或问未发已发。先生曰：「只缘后儒将未发已发分说了，只得劈头说个无未发已发，使人自思得之。若说有个已发未发，听者依旧落在后儒见解。若真见得无未发已发，说个有未发已发，原不妨，原有个未发已发在。」问曰：「未发未尝不和，已发未尝不中。譬如钟声，未扣不可谓无，既扣不可谓有，毕竟有个扣与不扣，何如？」先生曰：「未扣时原是惊天动地，既扣时也只是寂天默地。」","bh":"有人问未发和已发。先生说：「只因为后世儒者把未发和已发分开来讲了，我只好开门见山地说个无未发已发，让人自己去思考领悟。如果说有个已发未发，听的人依旧落在后儒的见解里。如果真的见得无未发已发，那么说个有未发已发，原本也不妨，原本就有个未发已发在。」那人问：「未发的时候未尝不和，已发的时候未尝不中。好比钟声，没敲时不能说没有声，敲了也不能说就有声，但毕竟有个敲和不敲，这怎么说？」先生说：「没敲的时候原本就是惊天动地的，敲了的时候也只是寂天寞地的。」","zs":[["寂天默地","寂静无声。"]],"gl":[28,108,327],"q":"「未扣时惊天动地，既扣时寂天寞地」是什么意思？","a":"本体动静一如：未发时已具全部之用，已发时本体仍然寂静。不能把未发已发截然分开。","rec":"黄省曾录","kj":[["r","付","可","声未扣不"],["r","即","既","不付谓无"],["r","付","可","无即扣不"],["r","即","既","惊天动地"]]},{"n":308,"t":"性无定体，论亦无定体","yw":"问：「古人论性，各有异同，何者乃为定论？」先生曰：「性无定体，论亦无定体。有自本体上说者，有自发用上说者，有自源头上说者，有自流弊处说者。总而言之，只是一个性，但所见有浅深尔。若执定一边，便不是了。性之本体，原是无善无恶的；发用上，也原是可以为善、可以为不善的；其流弊，也原是一定善、一定恶的。譬如眼，有喜时的眼，有怒时的眼，直视就是看的眼，微视就是觑的眼。总而言之，只是这个眼。若见得怒时眼，就说未尝有喜的眼，见得看时眼，就说未尝有觑的眼，皆是执定，就知是错。孟子说性，直从源头上说来，亦是说个大概如此；荀子性恶之说，是从流弊上说来，也未可尽说他不是，只是见得未精耳。众人则失了心之本体。」问：「孟子从源头上说性，要人用功在源头上明彻；荀子从流弊说性，功夫只在末流上救正，便费力了。」先生曰：「然。」","bh":"有人问：「古人讨论人性，各有异同，哪一个才是定论？」先生说：「性没有固定的形体，讨论性也没有固定的说法。有从本体上说的，有从发用上说的，有从源头上说的，有从流弊上说的。总而言之，只是一个性，只是各人所见有深有浅罢了。如果执定一边，就不对了。性的本体，原本是无善无恶的；在发用上，也原本是可以为善、可以为不善的；在流弊上，也原本是一定善、一定恶的。好比眼睛，有高兴时的眼睛，有发怒时的眼睛，直视就是看的眼睛，眯着眼就是偷看的眼睛。总而言之，只是这个眼睛。如果看见了发怒时的眼睛，就说从来没有高兴的眼睛，看见了直视的眼睛，就说从来没有偷看的眼睛，都是执定一边，就知道是错的。孟子说性善，是直接从源头上说的，也是说个大概如此；荀子的性恶说，是从流弊上说的，也不能说他全错，只是看得还不精。普通人则是丢失了心的本体。」那人问：「孟子从源头上说性，是要人在源头上用功明白透彻；荀子从流弊上说性，功夫只在末流上补救纠正，就费力了。」先生说：「对。」","zs":[["孟子性善、荀子性恶","孟子主张人性本善，荀子主张「人之性恶，其善者伪也」。"],["觑","眯着眼看、偷看。"]],"gl":[273,242,315],"q":"孟子性善、荀子性恶，谁对？","a":"都看到了性的一个面向：孟子从源头说，荀子从流弊说。性只是一个，执定一边就错。但孟子从源头用功，比荀子从末流救正省力。","con":"反方：阳明在这里说「性之本体原是无善无恶的」，又说孟子性善是「说个大概」，这在当时是很大胆的说法，实际上把孟子性善降为一种说法。后来批评者认为这正是王学「无善无恶」之说导致道德标准模糊的根源。","rec":"黄省曾录","kj":[["r","悾","性","便不是了"],["r","溉","概","是说个大"],["i","","说","从流弊上"]]},{"n":309,"t":"用功到精处愈着不得言语","yw":"先生曰：「用功到精处，愈着不得言语，说理愈难。若着意在精微上，全体功夫反蔽泥了。」","bh":"先生说：「用功到精深的地方，越是用不上言语，说理越难。如果刻意在精微处下功夫，整体的功夫反而被遮蔽拘泥了。」","zs":[],"gl":[125,280],"q":"功夫越精，越要讲得精细吗？","a":"相反，越精越难用言语说。刻意追求精微，反而蔽泥了全体功夫。","rec":"黄省曾录","kj":[]},{"n":310,"t":"杨慈湖着在无声无臭上","yw":"「杨慈湖不为无见，又着在无声无臭上见了。」","bh":"「杨慈湖不是没有见地，只是又执着在『无声无臭』上去看了。」","zs":[["杨慈湖","杨简，号慈湖，陆象山的弟子，主张「心之精神是谓圣」，被认为近于禅。"],["无声无臭","《诗经·大雅·文王》：「上天之载，无声无臭。」"]],"gl":[269,309],"q":"阳明怎样评价杨慈湖？","a":"他有见地，但执着在无声无臭上，也就是执着于虚无，落了一边。","rec":"黄省曾录","kj":[]},{"n":311,"t":"一日之间经过古今世界","yw":"「人一日间，古今世界都经过一番，只是人不见耳。夜气清明时，无视无听，无思无作，淡然平怀，就是羲皇世界；平旦时，神清气朗，雍雍穆穆，就是尧、舜世界；日中以前，礼仪交会，气象秩然，就是三代世界；日中以后，神气渐昏，往来杂扰，就是春秋、战国世界；渐渐昏夜，万物寝息，景象寂寥，就是人消物尽世界。学者信得良知过，不为气所乱，便常做个羲皇已上人。」","bh":"「人在一天之中，古往今来的世界都经历一遍，只是人看不到罢了。夜气清明的时候，不看不听，不思不做，淡然平和，就是伏羲的世界；清晨时，神清气爽，和睦庄重，就是尧舜的世界；中午以前，礼仪交往，秩序井然，就是夏商周三代的世界；中午以后，精神渐渐昏沉，往来纷杂扰攘，就是春秋战国的世界；渐渐到了黄昏夜晚，万物休息，景象寂寥，就是人消物尽的世界。学者如果信得过良知，不被气所扰乱，就能常常做个伏羲以前的人。」","zs":[["羲皇世界","伏羲时代，古人心目中最淳朴的太古之世。陶渊明自称「羲皇上人」。"],["雍雍穆穆","和睦庄重的样子。"]],"gl":[69,47,268],"q":"一天之中怎样经过古今世界？","a":"夜气清明是羲皇，清晨是尧舜，上午是三代，下午是春秋战国，夜晚是人消物尽。信得良知，就能常保羲皇气象。","yong":"下午三点脑子乱成春秋战国时，停下来喝杯茶，找回清晨的那份清明。","rec":"黄省曾录","kj":[["r","怍","作","听无思无"],["r","岩","仪","中以前礼"]]},{"n":312,"t":"狂者胸次","yw":"薛尚谦、邹谦之、马子莘、王汝止侍坐，因叹先生自征宁藩以来，天下谤议益众，请各言其故。有言先生功业势位日隆，天下忌之者日众；有言先生之学日明，故为宋儒争是非者亦日博；有言先生自南都以后，同志信从者日众，而四方排阻者日力。先生曰：「诸君之言，信皆有之，但吾一段自知处，诸君俱未道及耳。」诸友请问。先生曰：「我在南都已前，尚有些子乡愿的意思在。我今信得这良知真是真非，信手行去，更不着些覆藏。我今才做得个狂者的胸次，使天下之人都说我行不掩言也罢。」尚谦出曰：「信得此过，方是圣人的真血脉。」","bh":"薛尚谦、邹谦之、马子莘、王汝止陪先生坐着，感叹先生自从平定宁王之乱以来，天下的诽谤议论越来越多，请大家各自说说原因。有人说先生功业地位一天天升高，天下嫉妒的人一天天增多；有人说先生的学说一天天彰明，所以为宋儒争是非的人也一天天多起来；有人说先生自从在南京以后，信从的同志一天天增多，而四方排斥阻挠的也一天天加力。先生说：「各位说的，确实都有，但我自己知道的一层原因，各位都还没说到。」大家请问。先生说：「我在南京以前，还有一点乡愿的意思在。我现在相信这良知是真是、真非，信手做去，再不加一点掩藏。我现在才算有了狂者的胸怀，就让天下人都说我言行不一也罢。」尚谦出来说：「能信得过这一点，才是圣人的真正血脉。」","zs":[["宁藩","宁王朱宸濠。正德十四年（1519）宁王叛乱，阳明率兵四十余日平定，功高反遭朝中忌恨诽谤。"],["王汝止","王艮，字汝止，号心斋，泰州学派创始人。"],["乡愿","《论语·阳货》：「乡愿，德之贼也。」指八面玲珑、讨好所有人的伪君子。"],["狂者","《孟子·尽心下》：「狂者进取。」孟子说狂者「行不掩焉」，即言行不能完全相符，但志向高远。"]],"gl":[257,255,6],"q":"阳明自己认为遭谤的真正原因是什么？","a":"他不再有乡愿之意，信得良知真是真非，信手行去不再掩藏，有了狂者胸次，所以招人非议，他也不在乎。","yong":"做事想让所有人满意，就是乡愿。认准了对的事，被人说几句就说吧。","con":"反方：「信手行去，更不着些覆藏」「使天下之人都说我行不掩言也罢」，对阳明这样的人或许是境界，但对良知未必纯熟的人，可能成为任性和不顾他人意见的借口。明末泰州学派一些人的狂放言行，就被批评为由此而来。","rec":"黄省曾录","kj":[["r","萃","莘","谦之马子"],["r","待","侍","萃王汝止"],["i","","生","者日力先"],["r","绕","才","覆藏我今"]]},{"n":313,"t":"满街人都是圣人（核心条）","yw":"先生锻炼人处，一言之下，感人最深。一日，王汝止出游归，先生问曰：「游何见？」对曰：「见满街人都是圣人。」先生曰：「你看满街人是圣人，满街人倒看你是圣人在。」又一日，董萝石出游而归，见先生曰：「今日见一异事。」先生曰：「何异？」对曰：「见满街人都是圣人。」先生曰：「此亦常事耳，何足为异？」盖汝止圭角未融，萝石恍见有悟，故问同答异，皆反其言而进之。洪与黄正之、张叔谦、汝中丙戌会试归，为先生道途中讲学，有信有不信。先生曰：「你们拿一个圣人去与人讲学，人见圣人来，都怕走了，如何讲得行？须做得个愚夫愚妇，方可与人讲学。」洪又言：「今日要见人品高下最易。」先生曰：「何以见之？」对曰：「先生譬如泰山在前，有不知仰者，须是无目人。」先生曰：「泰山不如平地大，平地有何可见？」先生一言剪裁，剖破终年为外好高之病，在座者莫不悚惧。","bh":"先生锤炼人的地方，一句话下去，感人最深。有一天，王汝止出游回来，先生问：「出游看到了什么？」汝止回答：「看到满街的人都是圣人。」先生说：「你看满街的人是圣人，满街的人倒看你是圣人呢。」又有一天，董萝石出游回来，见到先生说：「今天看到一件奇怪的事。」先生说：「什么奇怪的事？」萝石回答：「看到满街的人都是圣人。」先生说：「这也是平常事，有什么奇怪的？」因为王汝止棱角还没磨圆，董萝石则是恍然有所领悟，所以同一个说法，先生的回答却不同，都是反着他们的话来引导他们进步。我（钱德洪）和黄正之、张叔谦、王汝中丙戌年参加会试回来，跟先生说在路上讲学，有人信有人不信。先生说：「你们端着一个圣人的架子去跟人讲学，人家看见圣人来了，都吓跑了，怎么讲得通？必须做个普通百姓，才能跟人讲学。」我又说：「现在要看出人品的高下最容易了。」先生问：「怎么看出来？」我回答：「先生就像泰山在前，有不知道仰望的，一定是没长眼睛的人。」先生说：「泰山不如平地大，平地有什么可看的？」先生一句话剪裁，剖破了我们长年向外好高的毛病，在座的人没有不惊惧的。","zs":[["董萝石","董沄，号萝石，浙江海宁人，六十八岁才拜阳明为师，以诗名。"],["圭角未融","棱角还没磨圆，指锋芒外露。"],["丙戌","嘉靖五年（1526）。"]],"gl":[7,271,99],"q":"同样说「满街都是圣人」，阳明为什么对两人回答不同？","a":"王汝止棱角未融，说这话带着傲气，阳明就说「满街人倒看你是圣人」；董萝石恍然有悟，阳明就说「这是常事」，不让他以为稀奇。因人施教，都是反其言而进之。","yong":"带人要看对方的状态：骄傲的要压一压，刚开窍的要稳一稳。","con":"反方：「满街都是圣人」后来在泰州学派中被发挥到极致，有人据此轻视礼法和学问修养，造成明末「满街圣人」式的狂禅之风。阳明本人对王汝止的回应其实是在纠偏，但这句话一旦脱离语境流传，就很难控制其含义。","rec":"黄省曾录","kj":[["r","涂","途","为先生道"],["r","拏","拿","生曰你们"],["r","翦","剪","先生一言"]]},{"n":314,"t":"犯而不校","yw":"癸未春，邹谦之来越问学，居数日，先生送别于浮峰。是夕与希渊诸友移舟宿延寿寺，秉烛夜坐，先生慨怅不已，曰：「江涛烟柳，故人倏在百里外矣！」一友问曰：「先生何念谦之之深也？」先生曰：「曾子所谓『以能问于不能，以多问于寡，有若无，实若虚，犯而不校』，若谦之者良近之矣。」","bh":"嘉靖二年（1523）春天，邹谦之来绍兴求学，住了几天，先生在浮峰送别他。当晚先生和蔡希渊几位朋友移船住在延寿寺，点着蜡烛夜坐，先生感慨惆怅不已，说：「江涛滚滚，烟柳依依，老朋友转眼已在百里之外了！」一位朋友问：「先生为什么这么深切地想念谦之？」先生说：「曾子说的『自己有才能却向没才能的人请教，自己知识多却向知识少的人请教，有学问却像没有，充实却像空虚，被人冒犯也不计较』，像谦之这样的人，真是很接近了。」","zs":[["癸未","嘉靖二年（1523）。"],["以能问于不能……","《论语·泰伯》曾子称赞颜回的话。底本作「宜若虚」，据《论语》作「实若虚」。"]],"gl":[7,303],"q":"阳明为什么特别想念邹谦之？","a":"因为谦之谦虚、能问于不能、犯而不校，接近颜回的境界。","yong":"真正值得珍惜的伙伴，往往是那个比你懂但还向你请教的人。","rec":"黄省曾录","kj":[["r","末","未","癸"],["r","宜","实","寡有若无"]]},{"n":315,"t":"天泉证道：四句教（核心条）","yw":"丁亥年九月，先生起复征思、田。将命行时，德洪与汝中论学。汝中举先生教言曰：「无善无恶是心之体，有善有恶是意之动，知善知恶是良知，为善去恶是格物。」德洪曰：「此意如何？」汝中曰：「此恐未是究竟话头。若说心体是无善无恶，意亦是无善无恶的意，知亦是无善无恶的知，物亦是无善无恶的物矣。若说意有善恶，毕竟心体还有善恶在。」德洪曰：「心体是天命之性，原是无善无恶的。但人有习心，意念上见有善恶在，格、致、诚、正、修，此正是复那性体功夫。若原无善恶，功夫亦不消说矣。」是夕侍坐天泉桥，各举请正。先生曰：「我今将行，正要你们来讲破此意。二君之见，正好相资为用，不可各执一边。我这里接人，原有此二种：利根之人，直从本原上悟入，人心本体原是明莹无滞的，原是个未发之中，利根之人一悟本体，即是功夫，人己内外，一齐俱透了；其次不免有习心在，本体受蔽，故且教在意念上实落为善去恶，功夫熟后，渣滓去得尽时，本体亦明尽了。汝中之见，是我这里接利根人的；德洪之见，是我这里为其次立法的。二君相取为用，则中人上下皆可引入于道；若各执一边，眼前便有失人，便于道体各有未尽。」既而曰：「已后与朋友讲学，切不可失了我的宗旨：无善无恶是心之体，有善有恶是意之动，知善知恶是良知，为善去恶是格物。只依我这话头随人指点，自没病痛，此原是彻上彻下功夫。利根之人，世亦难遇，本体功夫，一悟尽透，此颜子、明道所不敢承当，岂可轻易望人？人有习心，不教他在良知上实用为善去恶功夫，只去悬空想个本体，一切事为俱不着实，不过养成一个虚寂。此个病痛不是小小，不可不早说破。」是日德洪、汝中俱有省。","bh":"嘉靖六年（1527）九月，先生重新被起用，奉命征讨广西思恩、田州的叛乱。将要出发时，钱德洪和王汝中讨论学问。汝中举出先生的教言：「无善无恶是心之体，有善有恶是意之动，知善知恶是良知，为善去恶是格物。」德洪说：「这话的意思怎样理解？」汝中说：「这恐怕还不是究竟的说法。如果说心体是无善无恶的，那么意也是无善无恶的意，知也是无善无恶的知，物也是无善无恶的物了。如果说意有善有恶，那毕竟心体还是有善有恶的。」德洪说：「心体是天命之性，原本是无善无恶的。但人有习染之心，在意念上就看到有善有恶，格物、致知、诚意、正心、修身，正是恢复那性体的功夫。如果原本就无善无恶，功夫也就不用说了。」\n\n当晚，两人陪先生坐在天泉桥上，各自说出看法请先生指正。先生说：「我现在要走了，正要你们来把这个意思讲透。你们两人的见解，正好互相补充、互为所用，不能各执一边。我这里接引人，原本就有这两种：天资高的人，直接从本原上领悟进去，人心的本体原本是明亮晶莹、毫无滞碍的，原本就是个未发之中，天资高的人一领悟本体，就是功夫，自己和他人、内和外，全都通透了；其次的人免不了有习染之心，本体被遮蔽，所以暂且教他们在意念上踏实地为善去恶，功夫纯熟以后，渣滓去除干净时，本体也就全部明亮了。汝中的见解，是我这里接引天资高的人的；德洪的见解，是我这里为其次的人设立的方法。你们两人互相取用，那么中等以上和以下的人都可以引入正道；如果各执一边，眼前就会失去一部分人，在道体上也各有不完备的地方。」\n\n接着又说：「以后和朋友讲学，千万不可丢了我的宗旨：无善无恶是心之体，有善有恶是意之动，知善知恶是良知，为善去恶是格物。只要依我这个话头因人指点，自然不会出毛病，这原本就是上下贯通的功夫。天资高的人，世上也很难遇到，对本体和功夫一悟就全部通透，这是颜回、程明道都不敢承当的，怎么可以轻易期望别人？人有习染之心，不教他在良知上切实做为善去恶的功夫，只去悬空想象一个本体，一切行为都不踏实，不过是养成一个虚寂的毛病。这个毛病不是小事，不能不早点说破。」这一天，德洪和汝中都有所领悟。","zs":[["思、田","广西思恩府、田州府。阳明此行平定叛乱后，于次年（1528）病逝于归途。"],["天泉桥","在绍兴阳明府第中。这次讨论史称「天泉证道」。"],["四句教","阳明晚年对其学说的总结。王畿（汝中）由此发展出「四无说」（心、意、知、物皆无善无恶），钱德洪坚持「四有」的功夫路径。"],["利根之人","佛教语，天资聪颖、悟性高的人。"],["明莹无滞","底本作「明莹无湍」，据通行本改。"]],"gl":[101,273,308,316],"q":"背出四句教。王汝中和钱德洪的分歧是什么？阳明怎么裁决？","a":"无善无恶是心之体，有善有恶是意之动，知善知恶是良知，为善去恶是格物。汝中认为心意知物都无善无恶（四无），德洪认为要在意念上实落为善去恶。阳明说两者相资为用：汝中之见接利根人，德洪之见为其次立法；但利根人世所难遇，一般人必须实落用功，不可悬空想本体。","yong":"你我都不是利根人，老老实实走钱德洪的路：每天在念头上为善去恶。","con":"反方：「无善无恶是心之体」是阳明学说中争议最大的一句。东林党人顾宪成、高攀龙认为它与孟子性善论相悖，会导致「以无善无恶为宗，则人可以无所不为」。刘宗周甚至怀疑四句教并非阳明定论。王畿的「四无说」后来流于禅学，也印证了阳明自己的担忧：「悬空想个本体……不过养成一个虚寂」。","rec":"黄省曾录","kj":[["i","","曰","先生教言"],["r","贝","见","心意念上"],["r","诗","请","泉桥各举"],["r","湍","滞","是明莹无"],["r","跟","眼","各执一边"],["r","夫","失","跟前便有"],["r","矢","失","学切不可"],["r","礼","体","恶是心之"]]},{"n":316,"t":"讲学之盛","yw":"先生初归越时，朋友踪迹尚寥落。既后四方来游者日进，癸未年已后，环先生而居者比屋，如天妃、光相诸刹，每当一室，常合食者数十人，夜无卧处，更相就席，歌声彻昏旦。南镇、禹穴、阳明洞诸山远近寺刹，徒足所到，无非同志游寓所在。先生每临讲座，前后左右环坐而听者，常不下数百人，送往迎来，月无虚日，至有在侍更岁，不能遍记其姓名者。每临别，先生常叹曰：「君等虽别，不出天地间，苟同此志，吾亦可以忘形似矣。」诸生每听讲出门，未尝不跳跃称快。尝闻之同门先辈曰：「南都以前，朋友从游者虽众，未有如在越之盛者。此虽讲学日久，孚信渐博，要亦先生之学日进，感召之机，神变无方，亦自有不同也。」","bh":"先生刚回到绍兴时，来往的朋友还很稀少。后来四方前来求学的人一天天增多，嘉靖二年以后，围绕着先生住的房子一间挨着一间，比如天妃宫、光相寺等寺庙，每一间屋子里，常常有几十人一起吃饭，晚上没地方睡，就轮流挤着睡，歌声从黄昏一直响到天亮。南镇、禹穴、阳明洞等各座山远近的寺庙，只要脚步能走到的地方，无不是同道之人游学寄住的处所。先生每次登上讲座，前后左右围坐着听讲的，常常不下几百人，送走的迎来的，一个月里没有一天空闲，甚至有陪侍了一年多，先生还记不全他名字的。每次临别，先生常常感叹说：「你们虽然离开了，但离不开天地之间，如果志同道合，我也就可以忘记形迹上的分别了。」学生们每次听完讲出门，没有不欢欣跳跃、大呼痛快的。我曾听同门前辈说：「在南京以前，跟随先生学习的朋友虽然多，但没有像在绍兴时这样兴盛的。这虽然是因为讲学久了，信服的人渐渐多了，但主要也是因为先生的学问日益精进，感召人的机缘，神妙变化而没有固定方式，所以自然有所不同。」","zs":[["本条","钱德洪所记，描述阳明晚年在绍兴讲学的盛况。底本把它当作序文放在第315条之后、黄以方录之前，通行本（陈荣捷编号）列为第316条。"],["就席","底本作「就帟」，据通行本改。"],["徒足所到","底本作「徒足所列」，据文意改。"]],"gl":[315,312],"q":"阳明晚年在绍兴讲学有多盛？","a":"四方来学者住满周围寺庙，一室数十人同食，夜无卧处；每次讲座听者数百人，一月无虚日。","rec":"钱德洪录","kj":[["r","末","未","者日进癸"],["r","剎","刹","妃光相诸"],["r","帟","席","处更相就"],["r","剎","刹","山远近寺"],["r","列","到","剎徒足所"],["r","曰","日","来月无虚"],["r","日","曰","先生常叹"],["r","末","未","游者虽众"],["r","申","神","感召之机"],["r","力","方","机申变无"],["d","此后门人黄以方录","","有不同也"]]},{"n":317,"t":"博学于文与思学一事","yw":"黄以方问：「『博学于文』为随事学存此天理，然则谓『行有余力，则以学文』，其说似不相合。」先生曰：「《诗》《书》六艺皆是天理之发见，文字都包在其中。考之《诗》《书》六艺，皆所以学存此天理也，不特发见于事为者方为文耳。『余力学文』，亦只『博学于文』中事。」或问「学而不思」二句。曰：「此亦有为而言，其实思即学也。学有所疑，便须思之。『思而不学』者，盖有此等人，只悬空去思，要想出一个道理，却不在身心上实用其力，以学存此天理，思与学作两事做，故有『罔』与『殆』之病。其实思只是思其所学，原非两事也。」","bh":"黄以方问：「先生说『博学于文』是随事学习保存天理，那么孔子说『做完了这些还有余力，就去学文』，这个说法似乎对不上。」先生说：「《诗》《书》和六艺都是天理的显现，文字都包含在其中。考究《诗》《书》六艺，都是为了学习保存这个天理，不是只有表现在行事上的才算文。『有余力就学文』，也只是『博学于文』中的事。」有人问「学而不思则罔，思而不学则殆」两句。先生说：「这也是针对某种情况说的，其实思就是学。学习有疑问，就必须思考。『思而不学』的，是有这样一种人，只是悬空去想，要想出一个道理来，却不在身心上切实用力，学习保存天理，把思和学当成两件事来做，所以有『迷惑』和『危险』的毛病。其实思只是思考所学的东西，原本不是两件事。」","zs":[["黄以方","黄直。本条起至第343条为黄以方所录（底本未标，据通行本）。"],["行有余力，则以学文","《论语·学而》。"],["学而不思则罔，思而不学则殆","《论语·为政》。"]],"gl":[9,111,318],"q":"「学」与「思」是两件事吗？","a":"不是。思只是思其所学；悬空去思而不在身心上实用力，就是把思学分成两事，才有罔殆之病。","rec":"黄以方录","kj":[["r","恩","思","所疑便须"],["r","宜","实","在身心上"],["r","穴","实","殆之病其"]]},{"n":318,"t":"格物、致知、诚意、正心、修身一贯（核心条）","yw":"先生曰：「先儒解『格物』为『格天下之物』，天下之物如何格得？且谓一草一木亦皆有理，今如何去格？纵格得草木来，如何反来诚得自家意？我解『格』作『正』字义，『物』作『事』字义。《大学》之所谓『身』，即耳、目、口、鼻、四肢是也。欲修身，便是要目非礼勿视，耳非礼勿听，口非礼勿言，四肢非礼勿动。要修这个身，身上如何用得工夫？心者身之主宰，目虽视而所以视者心也，耳虽听而所以听者心也，口与四肢虽言动而所以言动者心也，故欲修身在于体当自家心体，常令廓然大公，无有些子不正处。主宰一正，则发窍于目，自无非礼之视；发窍于耳，自无非礼之听；发窍于口与四肢，自无非礼之言动：此便是『修身在正其心』。然至善者，心之本体也，心之本体那有不善？如今要正心，本体上何处用得功？必就心之发动处才可着力也。心之发动不能无不善，故须就此处着力，便是在诚意。如一念发在好善上，便实实落落去好善；一念发在恶恶上，便实实落落去恶恶。意之所发，既无不诚，则其本体如何有不正的？故欲正其心在诚意。工夫到诚意，始有着落处。然诚意之本，又在于致知也。所谓『人虽不知而己所独知』者，此正是吾心良知处。然知得善，却不依这个良知便做去；知得不善，却不依这个良知便不去做：则这个良知便遮蔽了，是不能致知也。吾心良知既不得扩充到底，则善虽知好，不能着实好了；恶虽知恶，不能着实恶了：如何得意诚？故致知者，意诚之本也。然亦不是悬空的致知，致知在实事上格。如意在于为善，便就这件事上去为；意在于去恶，便就这件事上去不为。去恶固是格不正以归于正，为善则不善正了，亦是格不正以归于正也。如此，则吾心良知无私欲蔽了，得以致其极，而意之所发，好善去恶，无有不诚矣。诚意工夫实下手处在格物也。若如此格物，人人便做得。『人皆可以为尧舜』，正在此也。」","bh":"先生说：「前代儒者把『格物』解释为『格天下之物』，天下的东西怎么格得完？而且说一草一木都有理，现在怎么去格？就算把草木格明白了，怎么反过来使自己的意念真诚？我把『格』解释为『正』，把『物』解释为『事』。《大学》所说的『身』，就是耳目口鼻四肢。要修身，就是要眼睛不看不合礼的，耳朵不听不合礼的，嘴巴不说不合礼的，四肢不做不合礼的。要修这个身，在身上怎么下功夫？心是身的主宰，眼睛虽然在看，但让它看的是心；耳朵虽然在听，但让它听的是心；嘴巴和四肢虽然在说在动，但让它们说和动的是心。所以要修身，就在于体会自己的心体，常常让它廓然大公，没有一点不正的地方。主宰一端正，表现在眼睛上，自然没有不合礼的看；表现在耳朵上，自然没有不合礼的听；表现在嘴巴和四肢上，自然没有不合礼的言行：这就是『修身在于正心』。\n\n但至善是心的本体，心的本体哪有不善？现在要正心，在本体上哪里用得上功夫？必须在心的发动处才能着力。心的发动不能没有不善，所以必须在这里着力，这就是诚意。比如一个念头发在好善上，就实实在在地去好善；一个念头发在恶恶上，就实实在在地去恶恶。意念所发，既然没有不真诚的，那本体怎么会有不正的？所以要正心在于诚意。功夫做到诚意，才有了着落。\n\n但诚意的根本，又在于致知。所谓『别人虽然不知道而自己独自知道的』，这正是我心的良知所在。可是知道是善的，却不依着这个良知去做；知道是不善的，却不依着这个良知不去做：这个良知就被遮蔽了，这就是不能致知。我心的良知既然不能扩充到底，那么善虽然知道该好，却不能切实地好；恶虽然知道该恶，却不能切实地恶：怎么能意诚？所以致知是意诚的根本。\n\n但也不是悬空地致知，致知要在实际的事情上格。比如意念在于为善，就在这件事上去做；意念在于去恶，就在这件事上不去做。去恶固然是纠正不正、使之归于正，为善就是把不善纠正了，也是纠正不正、使之归于正。这样，我心的良知就没有私欲遮蔽了，能够推致到极点，而意念所发，好善去恶，就没有不真诚的了。诚意功夫的实际下手处在格物。如果这样格物，人人都做得到。『人人都可以成为尧舜』，正在于此。」","zs":[["人虽不知而己所独知","朱熹《大学章句》注「慎独」语。"],["人皆可以为尧舜","《孟子·告子下》。"]],"gl":[6,7,86,319,201],"q":"按阳明的思路，从格物到修身是怎样一环扣一环的？","a":"修身在正心（心是身之主宰）；正心在诚意（心体至善，只能在发动处用功）；诚意在致知（依良知好善恶恶）；致知在格物（在实事上为善去恶、正其不正）。","yong":"这是阳明对《大学》的完整解读，值得反复读。把它画成一条链：身←心←意←知←物。","rec":"黄以方录","kj":[["r","恺","体","当自家心"],["r","援","发","必就心之"],["r","纔","才","之援动处"],["r","斫","所","于致知也"],["r","已","己","虽不知而"],["r","真","良","不依这个"],["r","真","良","做则这个"],["r","孙","悬","然亦不是"],["r","挌","格","下手处在"]]},{"n":319,"t":"格竹子","yw":"先生曰：「众人只说格物要依晦翁，何曾把他的说去用？我着实曾用来。初年与钱友同论做圣贤，要格天下之物，如今安得这等大的力量？因指亭前竹子，令去格看。钱子早夜去穷格竹子的道理，竭其心思，至于三日，便致劳神成疾。当初说他这是精力不足，某因自去穷格，早夜不得其理，到七日，亦以劳思致疾。遂相与叹圣贤是做不得的，无他大力量去格物了。及在夷中三年，颇见得此意思，方知天下之物本无可格者，其格物之功，只在身心上做，决然以圣人为人人可到，便自有担当了。这里意思，却要说与诸公知道。」","bh":"先生说：「大家只说格物要依照朱熹，何曾把他的说法拿来用过？我是切切实实用过的。早年和一位姓钱的朋友一起讨论做圣贤，要格天下的事物，可现在哪有这么大的力量？于是指着亭子前的竹子，让他去格格看。钱朋友早晚去穷究竹子的道理，用尽心思，到了第三天，就劳累得生病了。当时我说这是他精力不够，于是自己去穷究，早晚都找不到其中的道理，到第七天，也因为思虑过度而生病了。于是两人一起感叹圣贤是做不成的，没有那么大的力量去格物。等到在贵州龙场三年，颇有些领悟，才知道天下的事物本来就没有什么可格的，格物的功夫只在身心上做，坚定地认为圣人是人人都可以达到的，自然就有了担当。这个意思，倒要说给各位知道。」","zs":[["格竹子","阳明早年按朱熹格物之说对着竹子穷理七天，病倒，这是他学术转向的著名故事，一般认为发生在他二十一岁左右（1492）。"],["夷中三年","在贵州龙场三年（1506–1509），有龙场悟道。"]],"gl":[318,6,7],"q":"「格竹子」失败给了阳明什么启示？","a":"天下之物本无可格，格物之功只在身心上做。圣人人人可到。","yong":"对着竞争对手的网站研究七天不如对着自己的客户研究一天。","con":"反方：朱熹的「格物穷理」本意并非对着一根竹子枯坐冥想，而是广泛读书、观察、积累后豁然贯通。阳明格竹子的方法本身就误解了朱熹，以此来否定朱子格物说，有学者认为并不公平。","rec":"黄以方录","kj":[["r","挌","格","竹子令去"],["r","箬","穷","某因自去"],["i","","无","做不得的"]]},{"n":320,"t":"童子也有格物致知","yw":"门人有言邵端峰论童子不能格物，只教以洒扫应对之说。先生曰：「洒扫应对，就是一件物。童子良知只到此，便教去洒扫应对，就是致他这一点良知了。又如童子知畏先生长者，此亦是他良知了。故虽嬉戏中见了先生长者，便去作揖恭敬，是他能格物以致敬师长之良知了。童子自有童子的格物致知。」又曰：「我这里言格物，自童子以至圣人，皆是此等工夫，但圣人格物，便更熟得些子，不消费力。如此格物，虽卖柴人亦是做得，虽公卿大夫以至天子，皆是如此做。」","bh":"有门人说邵端峰认为小孩不能格物，只能教他们洒扫应对的事。先生说：「洒扫应对就是一件物。小孩的良知只能到这一步，就教他去洒扫应对，这就是推致他这一点良知了。又比如小孩知道敬畏老师长辈，这也是他的良知所在。所以即使在嬉戏中看见老师长辈，就去作揖行礼，这就是他能格物来推致尊敬师长的良知了。小孩自有小孩的格物致知。」又说：「我这里讲格物，从小孩到圣人，都是这样的功夫，只是圣人格物，更纯熟一些，不用费力。这样格物，即使是卖柴的人也做得到，即使是公卿大夫以至天子，也都是这样做。」","zs":[["邵端峰","邵锐，号端峰，浙江仁和人。"],["洒扫应对","《论语·子张》：子夏之门人「当洒扫应对进退则可矣」。朱熹认为这是「小学」功夫，与「大学」的格物致知有别。"]],"gl":[318,225,251],"q":"小孩能不能格物？","a":"能。洒扫应对就是一件物，见长者作揖恭敬就是格物致知。从童子到圣人到卖柴人到天子，都是这个功夫，只是熟不熟。","yong":"教孩子收拾玩具、见人打招呼，就是在教他致良知。","rec":"黄以方录","kj":[["r","俪","洒","物只教以"],["r","俪","洒","说先生曰"],["r","俪","洒","此便教去"],["r","页","良","他这一点"],["r","页","良","敬师长之"],["r","挌","格","有童子的"],["r","挌","格","我这里言"],["r","夬","夫","是此等工"]]},{"n":321,"t":"知之匪艰，行之惟艰","yw":"或疑知行不合一，以「知之匪艰」二句为问。先生曰：「良知自知，原是容易的，只是不能致那良知，便是『知之匪艰，行之惟艰』。」","bh":"有人怀疑知行不合一，拿《尚书》「知道不难，做到才难」两句来问。先生说：「良知自己知道，原本是容易的，只是不能推致那个良知，这就是『知道不难，做到才难』。」","zs":[["知之匪艰，行之惟艰","《尚书·说命中》。"]],"gl":[5,322],"q":"「知之匪艰，行之惟艰」是不是证明知行是两件事？","a":"不是。良知自知是容易的，难的是致良知。这不是知和行分开，而是知了没致。","rec":"黄以方录","kj":[]},{"n":322,"t":"心即理：立言宗旨","yw":"门人问曰：「知行如何得合一？且如《中庸》言『博学之』，又说个『笃行之』，分明知行是两件。」先生曰：「博学只是事事学存此天理，笃行只是学之不已之意。」又问：「《易》『学以聚之』，又言『仁以行之』，此是如何？」先生曰：「也是如此。事事去学存此天理，则此心更无放失时，故曰『学以聚之』；然常常学存此天理，更无私欲间断，此即是此心不息处，故曰『仁以行之』。」又问：「孔子言『知及之，仁不能守之』，知行却是两个了。」先生曰：「说『及之』，已是行了，但不能常常行，已为私欲间断，便是『仁不能守』。」又问：「心即理之说，程子云『在物为理』，如何谓心即理？」先生曰：「『在物为理』，『在』字上当添一『心』字：此心在物则为理。如此心在事父则为孝，在事君则为忠之类。」先生因谓之曰：「诸君要识得我立言宗旨。我如今说个心即理是如何？只为世人分心与理为二，故便有许多病痛。如五伯攘夷狄，尊周室，都是一个私心，便不当理。人却说他做得当理，只心有未纯，往往悦慕其所为，要来外面做得好看，却与心全不相干。分心与理为二，其流至于伯道之伪而不自知。故我说个心即理，要使知心理是一个，便来心上做工夫，不去袭义于外，便是王道之真。此我立言宗旨。」又问：「圣贤言语许多，如何却要打做一个？」曰：「我不是要打做一个，如曰『夫道，一而已矣』，又曰『其为物不贰，则其生物不测』，天地圣人皆是一个，如何二得？」","bh":"门人问：「知行怎么能合一？比如《中庸》说『广博地学』，又说『切实地行』，分明知和行是两件事。」先生说：「博学只是每件事都学习保存这个天理，笃行只是学习不停止的意思。」又问：「《易经》说『通过学习来积累』，又说『用仁来践行』，这怎么理解？」先生说：「也是这样。每件事都去学习保存这个天理，这颗心就再也不会放失，所以说『学以聚之』；常常学习保存这个天理，没有私欲间断，这就是这颗心不停息的地方，所以说『仁以行之』。」又问：「孔子说『智慧足以达到，仁德却不能守住』，知行就是两个了。」先生说：「说『达到』，已经是行了，只是不能常常行，已被私欲间断，就是『仁不能守』。」又问：「心即理的说法，程子说『在物为理』，怎么说心即理？」先生说：「『在物为理』，『在』字前面应当加一个『心』字：这颗心在物上就是理。比如这颗心在侍奉父亲上就是孝，在侍奉君主上就是忠之类。」\n\n先生于是对他们说：「各位要了解我立言的宗旨。我现在说个心即理是为什么？只因为世人把心和理分成两个，所以就有许多毛病。比如春秋五霸打着『攘夷狄、尊周室』的旗号，都是出于一个私心，就不合理。可人们却说他们做得合理，只是心还不够纯，往往羡慕他们的所作所为，要在外面做得好看，却和心完全不相干。把心和理分成两个，发展下去就流于霸道的虚伪而自己不知道。所以我说个心即理，是要让人知道心和理是一个，就来心上做功夫，不到外面去袭取义，这就是王道的真谛。这是我立言的宗旨。」又问：「圣贤的话那么多，为什么要合成一个？」先生说：「不是我要合成一个，比如孟子说『道只有一个』，《中庸》说『天地之道纯一不二，所以生成万物不可测度』，天地和圣人都是一个，怎么能分成两个？」","zs":[["学以聚之，仁以行之","《周易·乾卦·文言》：「君子学以聚之，问以辨之，宽以居之，仁以行之。」"],["知及之，仁不能守之","《论语·卫灵公》。"],["在物为理","程颐语。"],["五伯","春秋五霸。"],["其为物不贰，则其生物不测","《中庸》第二十六章。"]],"gl":[3,5,226,84],"q":"阳明提出「心即理」的立言宗旨是什么？","a":"世人分心与理为二，就会只求外面做得好看（像五霸那样以私心行义），流于霸道之伪。说心即理，是要人回到心上做功夫，这才是王道之真。","yong":"做品牌做 E-E-A-T，如果只是在网页上「看起来专业」而不是真专业，那就是五霸之伪。","con":"反方：把齐桓公、晋文公「尊王攘夷」的功业一概斥为私心，忽视了他们客观上维护秩序、保护华夏文明的贡献。孔子本人也称赞管仲「如其仁」。阳明以动机论定功业，在历史评价上失之偏激。","rec":"黄以方录","kj":[["r","矢","失","心更无放"],["r","郥","即","守又问心"],["r","掇","攘","痛如五伯"],["r","弅","尊","伯掇夷狄"],["r","使","便","一个私心"],["r","英","袭","工夫不去"],["r","日","曰","做一个如"],["r","二","贰","其为物不"]]},{"n":323,"t":"心不是一块血肉","yw":"「心不是一块血肉，凡知觉处便是心。如耳目之知视听，手足之知痛痒，此知觉便是心也。」","bh":"「心不是一块血肉，凡是有知觉的地方就是心。比如耳朵眼睛能知道看和听，手脚能知道痛和痒，这个知觉就是心。」","zs":[],"gl":[122,277],"q":"阳明说的「心」是心脏吗？","a":"不是。凡知觉处便是心，耳目能视听、手足知痛痒的那个知觉就是心。","rec":"黄以方录","kj":[]},{"n":324,"t":"格物即慎独","yw":"以方问曰：「先生之说格物，凡《中庸》之『慎独』及『集义』『博约』等说，皆为格物之事。」先生曰：「非也。格物即慎独，即戒惧。至于『集义』『博约』，工夫只一般，不是以那数件都做格物底事。」","bh":"黄以方问：「先生讲格物，凡是《中庸》的『慎独』以及『集义』『博约』等说法，都是格物的事。」先生说：「不是的。格物就是慎独，就是戒惧。至于『集义』『博约』，功夫是一样的，不是把那几件都当成格物的事。」","zs":[],"gl":[120,9,318],"q":"慎独、集义、博约都是格物的一部分吗？","a":"不是「一部分」，格物本身就是慎独、戒惧；集义、博约是同一个功夫的不同说法。","rec":"黄以方录","kj":[["r","擉","独","格物即慎"]]},{"n":325,"t":"道问学即所以尊德性","yw":"以方问「尊德性」一条。先生曰：「『道问学』即所以『尊德性』也。晦翁言『子静以尊德性诲人，某教人岂不是道问学处多了些子』，是分『尊德性』『道问学』作两件。且如今讲习讨论，下许多工夫，无非只是存此心，不失其德性而已，岂有『尊德性』只空空去尊，更不去问学？问学只是空空去问学，更与德性无关涉？如此，则不知今之所以讲习讨论者，更学何事？」问「致广大」二句。曰：「『尽精微』即所以『致广大』也，『道中庸』即所以『极高明』也。盖心之本体自是广大底，人不能『尽精微』，则便为私欲所蔽，有不胜其小者矣。故能细微曲折，无所不尽，则私意不足以蔽之，自无许多障碍遮隔处，如何广大不致？」又问：「精微还是念虑之精微，事理之精微？」曰：「念虑之精微，即事理之精微也。」","bh":"黄以方问《中庸》「尊德性而道问学」那一条。先生说：「『道问学』就是用来『尊德性』的。朱熹说『陆子静用尊德性教人，我教人难道不是道问学的地方多了一些』，这是把『尊德性』和『道问学』分成两件事了。比如现在我们讲习讨论，下了许多功夫，无非只是保存这颗心，不失掉它的德性罢了，哪有『尊德性』只是空空地去尊，而不去问学？问学只是空空地去问学，而和德性没有关系？如果这样，就不知道现在讲习讨论的，到底在学什么了！」又问「致广大而尽精微，极高明而道中庸」两句。先生说：「『尽精微』就是用来『致广大』的，『道中庸』就是用来『极高明』的。因为心的本体本来是广大的，人不能『尽精微』，就会被私欲遮蔽，就会有许多狭小的地方。所以能在细微曲折处无所不尽，私意就不能遮蔽它，自然没有那么多障碍遮隔，怎么会不广大？」又问：「精微是指念头的精微，还是事理的精微？」先生说：「念头的精微，就是事理的精微。」","zs":[["尊德性而道问学","《中庸》第二十七章：「故君子尊德性而道问学，致广大而尽精微，极高明而道中庸。」"],["子静","陆九渊，字子静。"]],"gl":[9,25,99],"q":"「尊德性」与「道问学」是两件事吗？","a":"不是。问学就是为了尊德性；尽精微就是为了致广大。念虑的精微就是事理的精微。","yong":"把细节做到位（尽精微），格局自然就大了（致广大）。","rec":"黄以方录","kj":[["r","咠","尊","以方问"],["r","晦","诲","以尊德性"],["d","气","","分尊德性"],["r","郥","即","也道中庸"]]},{"n":326,"t":"说性与见性","yw":"先生曰：「今之论性者，纷纷异同，皆是说性，非见性也。见性者无异同之可言矣。」","bh":"先生说：「现在讨论人性的人，众说纷纭，都只是在说性，不是见到了性。真正见到性的人，就没有什么异同可说了。」","zs":[],"gl":[308,252],"q":"为什么论性纷纷异同？","a":"都在说性，没有见性。真见性的人，无异同可言。","rec":"黄以方录","kj":[]},{"n":327,"t":"声色货利与良知","yw":"问：「声色货利，恐良知亦不能无。」先生曰：「固然。但初学用功，却须扫除荡涤，勿使留积，则适然来遇，始不为累，自然顺而应之。良知只在声色货利上用功，能致得良知精精明明，毫发无蔽，则声色货利之交，无非天则流行矣。」","bh":"有人问：「声色货利，恐怕良知也不能完全没有。」先生说：「当然。但初学用功，必须扫除干净，不让它们留存积累，那么偶然遇到时，才不会被它们所累，自然顺而应之。良知只在声色货利上用功，能把良知推致得精精明明，没有一丝遮蔽，那么与声色货利的交往，无非都是天理法则的流行了。」","zs":[["声色货利","音乐、美色、财货、利益，泛指感官和物质欲望。"]],"gl":[290,39,60],"q":"良知与声色货利是对立的吗？","a":"不是。初学要扫除不让它们留积，但良知本就在声色货利上用功；良知精明时，与声色货利交往无非天则流行。","yong":"做生意赚钱不是罪过。只要钱是按良知赚的，赚钱本身就是天理流行。","con":"这一条值得注意：阳明在晚年明确肯定声色货利之交可以是「天则流行」，这与「存天理灭人欲」的刻板印象不同，也是后来泰州学派肯定百姓日用、肯定人欲正当性的思想源头之一。","rec":"黄以方录","kj":[]},{"n":328,"t":"讲一番，长进一番","yw":"先生曰：「吾与诸公讲致知格物，日日是此，讲一二十年俱是如此。诸君听吾言，实去用功，见吾讲一番，自觉长进一番，否则只作一场话说，虽听之亦何用？」","bh":"先生说：「我和各位讲致知格物，天天都是这个，讲上一二十年也都是这个。各位听了我的话，切实去用功，那么听我讲一次，自己就觉得长进一次；否则只当成一场谈话，即使听了又有什么用？」","zs":[],"gl":[10,280,84],"q":"同样的道理反复听，有没有用？","a":"实去用功的人，每听一番都长进一番；不用功的，听了只是一场话说。","yong":"每天读三条，重点不在读，在用。读一条用一条，比读完全书强。","rec":"黄以方录","kj":[["r","怍","作","番否则只"],["r","一同","亦何","说虽听之"]]},{"n":329,"t":"未应不是先，已应不是后","yw":"先生曰：「人之本体，常常是寂然不动的，常常是感而遂通的。未应不是先，已应不是后。」","bh":"先生说：「人的本体，常常是寂然不动的，也常常是感而遂通的。没有回应时不是在前，已经回应了也不是在后。」","zs":[["寂然不动，感而遂通","《周易·系辞上》。"]],"gl":[307,108,72],"q":"本体的寂与感有先后吗？","a":"没有。本体常寂常感，未应不是先，已应不是后。","rec":"黄以方录","kj":[]},{"n":330,"t":"手指有见有不见","yw":"一友举佛家以手指显出，问曰：「众曾见否？」众曰：「见之。」复以手指入袖，问曰：「众还见否？」众曰：「不见。」佛说还未见性。此义未明。先生曰：「手指有见有不见，尔之见性常在。人之心神只在有睹有闻上驰骛，不在不睹不闻上着实用功。盖不睹不闻是良知本体，戒慎恐惧是致良知的功夫。学者时时刻刻常睹其所不睹，常闻其所不闻，功夫方有个实落处。久久成熟后，则不须着力，不待防检，而真性自不息矣。岂以在外者之闻见为累哉？」","bh":"一位朋友举佛家的一个故事：伸出手指问大家：「各位看见了吗？」大家说：「看见了。」又把手指缩进袖子里，问：「各位还看见吗？」大家说：「看不见。」佛说大家还没有见性。这个意思他不明白。先生说：「手指有看得见、看不见的时候，你那个能见的本性却是常在的。人的心神只在有看有听的地方奔驰，不在不看不听的地方切实用功。不睹不闻是良知的本体，戒慎恐惧是致良知的功夫。学者时时刻刻常常看见那看不见的，常常听见那听不见的，功夫才有个着落的地方。久而久之纯熟以后，就不用费力，不用防备检点，真性自然不停息了。怎么会被外在的见闻所累呢？」","zs":[["手指见性","禅宗公案，类似《楞严经》中佛以手指、拳示阿难，说明见性常在、不随外物生灭。"]],"gl":[266,120,202],"q":"手指藏进袖子看不见，为什么佛说还没见性？","a":"因为人只在有睹有闻上驰骛。手指有见有不见，能见的本性却常在。功夫要在不睹不闻的本体上用。","rec":"黄以方录","kj":[["r","尽","盖","着实用功"],["r","实","是","不睹不闻"],["r","亦","矣","性自不息"]]},{"n":331,"t":"鸢飞鱼跃，必有事焉","yw":"问：「先儒谓『鸢飞鱼跃』与『必有事焉』同一活泼泼地。」先生曰：「亦是。天地间活泼泼地，无非此理，便是吾良知的流行不息。『致良知』便是『必有事』的工夫。此理非惟不可离，实亦不得而离也。无往而非道，无往而非工夫。」","bh":"有人问：「程子说『鸢飞戾天，鱼跃于渊』和孟子的『必有事焉』，同是活泼泼的。」先生说：「也对。天地之间活泼泼的，无非是这个理，就是我良知的流行不息。『致良知』就是『必有事焉』的功夫。这个理不但不可离开，实际上也离不开。没有一处不是道，没有一处不是功夫。」","zs":[["鸢飞鱼跃","《诗经·大雅·旱麓》：「鸢飞戾天，鱼跃于渊。」《中庸》引之说明道的流行。程颢说：「鸢飞鱼跃，与必有事焉而勿正心同，活泼泼地。」"]],"gl":[253,87],"q":"「鸢飞鱼跃」和致良知有什么关系？","a":"天地间活泼泼的就是良知流行不息；致良知就是必有事焉的功夫。无往而非道，无往而非工夫。","rec":"黄以方录","kj":[["r","闲","间","亦是天地"]]},{"n":332,"t":"一棒一条痕，一掴一掌血","yw":"先生曰：「诸公在此，务要立个必为圣人之心，时时刻刻须是一棒一条痕，一掴一掌血，方能听吾说话，句句得力。若茫茫荡荡度日，譬如一块死肉，打也不知得痛痒，恐终不济事，回家只寻得旧时伎俩而已，岂不惜哉？」","bh":"先生说：「各位在这里，一定要立一个必定要成为圣人的心，时时刻刻都必须像一棒下去就是一道伤痕，一巴掌下去就是一手掌血，才能听我的话，句句得力。如果迷迷糊糊地过日子，就像一块死肉，打也不知道痛痒，恐怕终究没用，回家后也只是找回过去那些老一套罢了，岂不可惜？」","zs":[["一棒一条痕，一掴一掌血","禅宗常用语，形容切实、毫不含糊。底本作「一拳血」，据通行本改。"]],"gl":[260,16,243],"q":"「一棒一条痕」形容什么样的学习态度？","a":"每一句话都要落到实处、触动自己，像挨打留痕一样。茫茫荡荡就像死肉，打也不知痛。","yong":"读完这条，想一件让你「痛」的事。不痛，就是还在茫茫荡荡。","rec":"黄以方录","kj":[["r","拳","掌","痕一掴一"],["r","症","痒","不知得痛"]]},{"n":333,"t":"着实用功，不论效验","yw":"问：「近来妄念也觉少，亦觉不曾着想定要如何用功，不知此是工夫否？」先生曰：「汝且去着实用功，便多这些着想也不妨，久久自会妥帖。若才下得些功，便说效验，何足为恃？」","bh":"有人问：「最近妄念觉得少了，也觉得没有刻意想着一定要怎样用功，不知道这算不算功夫？」先生说：「你只管切实去用功，即使多了些刻意的想法也无妨，时间长了自然会妥帖。如果刚下了一点功夫，就谈效果，有什么可依靠的？」","zs":[],"gl":[97,238,243],"q":"刚觉得有点效果，阳明为什么泼冷水？","a":"才下得些功便说效验，不可靠。只管着实用功，久久自会妥帖。","yong":"刚坚持了一周就发朋友圈说「我变了」？再坚持一个月再说。","rec":"黄以方录","kj":[["r","纔","才","会妥帖若"]]},{"n":334,"t":"这一知处便是你的命根","yw":"一友自叹：「私意萌时，分明自心知得，只是不能使他即去。」先生曰：「你萌时，这一知处便是你的命根，当下即去消磨，便是立命工夫。」","bh":"一位朋友自己感叹：「私意萌生时，明明自己心里知道，只是不能让它马上去掉。」先生说：「私意萌生时，你那一下知道的地方，就是你的命根，当下就去消磨它，这就是立命的功夫。」","zs":[["立命","《孟子·尽心上》：「夭寿不贰，修身以俟之，所以立命也。」"]],"gl":[209,216,226],"q":"知道私意萌生却去不掉，怎么办？","a":"知道它萌生的那一下，就是你的命根。当下就去消磨，就是立命功夫。","yong":"察觉到自己想偷懒的那一刻，别放过它。就在那一刻站起来。","rec":"黄以方录","kj":[]},{"n":335,"t":"性相近即性善","yw":"「夫子说『性相近』，即孟子说『性善』，不可专在气质上说。若说气质，如刚与柔对，如何相近得？惟性善则同耳。人生初时，善原是同的，但刚的习于善则为刚善，习于恶则为刚恶；柔的习于善则为柔善，习于恶则为柔恶：便日相远了。」","bh":"「孔子说『人性相近』，就是孟子说的『性善』，不能只从气质上说。如果说气质，比如刚和柔是相对的，怎么能相近？只有性善是相同的。人刚出生时，善原本是相同的，但刚的人习于善就成为刚善，习于恶就成为刚恶；柔的人习于善就成为柔善，习于恶就成为柔恶：于是一天天相差远了。」","zs":[["性相近，习相远","《论语·阳货》。朱熹认为「性相近」是兼气质而言。"]],"gl":[308,242],"q":"孔子的「性相近」和孟子的「性善」是一回事吗？","a":"阳明认为是。气质刚柔相对，不能说相近；只有性善是同。后天习染才使人相远。","con":"反方：朱熹认为「性相近」说的是气质之性，因为纯善的本然之性应该是「相同」而不是「相近」。阳明的解释更直接地把孔孟统一起来，但「相近」二字本身似乎更支持朱熹的读法。","rec":"黄以方录","kj":[]},{"n":336,"t":"金玉屑也会迷眼","yw":"先生尝语学者曰：「心体上着不得一念留滞，就如眼着不得些子尘沙。些子能得几多？满眼便昏天黑地了。」又曰：「这一念不但是私念，便好的念头，亦着不得些子。如眼中放些金玉屑，眼亦开不得了。」","bh":"先生曾对学者说：「心体上容不得一个念头留滞，就像眼睛里容不得一点沙尘。一点沙尘能有多少？却会让满眼都昏天黑地。」又说：「这个念头不仅是指私念，即使是好的念头，也容不得一点留滞。就像眼睛里放一些金玉的碎屑，眼睛也睁不开了。」","zs":[["金玉屑","禅宗语：「金屑虽贵，落眼成翳。」"]],"gl":[237,235,101],"q":"好的念头留滞在心里也不行吗？","a":"也不行。就像金玉屑进了眼睛，再贵重也让眼睛睁不开。心体要廓然无滞。","yong":"一次大成功也会成为负担：总想着复制它，就看不清新的局面了。","rec":"黄以方录","kj":[["r","礼","体","学者曰心"]]},{"n":337,"t":"我的灵明便是天地鬼神的主宰","yw":"问：「人心与物同体，如吾身原是血气流通的，所以谓之同体。若于人便异体了，禽兽草木益远矣，而何谓之同体？」先生曰：「你只在感应之几上看，岂但禽兽草木，虽天地也与我同体的，鬼神也与我同体的。」请问。先生曰：「你看这个天地中间，甚么是天地的心？」对曰：「尝闻人是天地的心。」曰：「人又甚么叫做心？」对曰：「只是一个灵明。」「可知充天塞地中间，只有这个灵明，人只为形体自间隔了。我的灵明，便是天地鬼神的主宰。天没有我的灵明，谁去仰他高？地没有我的灵明，谁去俯他深？鬼神没有我的灵明，谁去辩他吉凶灾祥？天地鬼神万物离却我的灵明，便没有天地鬼神万物了。我的灵明离却天地鬼神万物，亦没有我的灵明。如此，便是一气流通的，如何与他间隔得？」又问：「天地鬼神万物，千古见在，何没了我的灵明，便俱无了？」曰：「今看死的人，他这些精灵游散了，他的天地鬼神万物尚在何处？」","bh":"有人问：「人心和万物同体，比如我的身体原本是血气流通的，所以叫同体。如果对别人就是异体了，禽兽草木就更远了，怎么能说是同体？」先生说：「你只在感应的几微上看，岂止禽兽草木，即使天地也和我同体，鬼神也和我同体。」那人请问。先生说：「你看这天地之间，什么是天地的心？」回答：「曾听说人是天地的心。」先生问：「人又是什么叫作心？」回答：「只是一个灵明。」先生说：「可知充满天地之间的，只有这个灵明，人只是因为形体而自己隔开了。我的灵明，就是天地鬼神的主宰。天没有我的灵明，谁去仰望它的高？地没有我的灵明，谁去俯视它的深？鬼神没有我的灵明，谁去分辨它的吉凶灾祥？天地鬼神万物离开了我的灵明，就没有天地鬼神万物了。我的灵明离开了天地鬼神万物，也没有我的灵明。这样，就是一气流通的，怎么能和它们隔开？」又问：「天地鬼神万物，千古以来一直存在，为什么没了我的灵明，就都没有了？」先生说：「你看现在死去的人，他的那些精灵游散了，他的天地鬼神万物还在哪里？」","zs":[["人是天地的心","《礼记·礼运》：「故人者，天地之心也。」"],["灵明","灵妙明觉，即良知。"]],"gl":[274,275,261,89],"q":"「天地鬼神万物离却我的灵明，便没有天地鬼神万物了」怎么理解？","a":"天的高、地的深、鬼神的吉凶，都是在人的灵明中显现的；没有灵明，这些意义就不存在。反过来，灵明离开万物也无所显现。二者一气流通。","con":"反方：这是心学最常被批评为主观唯心论的一段。弟子的追问「天地万物千古见在，为何没了我的灵明便俱无了」非常有力，阳明的回答「他的天地万物尚在何处」实际上转换了问题：从「天地是否存在」转为「对死者而言天地是否还有意义」。很多学者认为阳明讲的是意义论，但这一回答并没有正面处理存在论的追问。","rec":"黄以方录","kj":[["r","妯","知","个灵明可"],["r","问","间","为形体自"],["r","苨","鬼","便是天地"],["r","地","他","明谁去仰"],["r","亚","灵","物了我的"]]},{"n":338,"t":"严滩问答：有心无心，实相幻相","yw":"先生起行征思、田，德洪与汝中追送严滩。汝中举佛家实相幻相之说。先生曰：「有心俱是实，无心俱是幻；无心俱是实，有心俱是幻。」汝中曰：「『有心俱是实，无心俱是幻』，是本体上说工夫；『无心俱是实，有心俱是幻』，是工夫上说本体。」先生然其言。洪于是时尚未了达，数年用功，始信本体工夫合一。但先生是时因问偶谈，若吾儒指点人处，不必借此立言耳。","bh":"先生起程去征讨广西思恩、田州，钱德洪和王汝中追送到严滩。汝中举出佛家实相、幻相的说法。先生说：「有心都是实，无心都是幻；无心都是实，有心都是幻。」汝中说：「『有心都是实，无心都是幻』，是从本体上说功夫；『无心都是实，有心都是幻』，是从功夫上说本体。」先生同意他的话。我（钱德洪）那时还没有领悟透，用功几年后，才相信本体和功夫是合一的。不过先生当时是因为有人问而偶然谈到，像我们儒家指点人的地方，不必借用这些来立论。","zs":[["严滩","在浙江桐庐，东汉严子陵垂钓处。天泉证道后不久，阳明出征经此。史称「严滩问答」。"],["实相、幻相","佛教术语。实相指诸法真实不虚的本相，幻相指如幻如化的现象。"]],"gl":[315,269],"q":"「有心俱是实，无心俱是幻；无心俱是实，有心俱是幻」怎么理解？","a":"按王汝中的解释：从本体说功夫，用心（戒慎恐惧）才实，不用心就落空；从功夫说本体，不着意（无私心）才实，刻意执着就是幻。本体功夫合一。","con":"这四句话极为玄妙，历来解释不一。钱德洪自己说当时没懂，又补充说「吾儒指点人处，不必借此立言」，似乎对阳明借用佛家语言有所保留。这也是阳明晚年思想「近禅」争议的一个例证。","rec":"黄以方录","kj":[["r","寅","实","中举佛家"],["r","穴","实","有心俱是"],["r","寅","实","无心俱是"]]},{"n":339,"t":"圆凿方枘","yw":"尝见先生送二三耆宿出门，退坐于中轩，若有忧色。德洪趋进请问。先生曰：「顷与诸老论及此学，真圆凿方枘。此道坦如道路，世儒往往自加荒塞，终身陷荆棘之场而不悔，吾不知其何说也！」德洪退谓朋友曰：「先生诲人，不择衰朽，仁人悯物之心也。」","bh":"曾看到先生送两三位老先生出门，回来坐在中轩，好像面有忧色。我（钱德洪）赶紧上前请问。先生说：「刚才和几位老先生讨论这门学问，真是圆的榫眼对方的榫头，完全对不上。这个道平坦得像大路一样，世俗儒者往往自己给它加上荒草堵塞，一辈子陷在荆棘丛中也不后悔，我不知道这是为什么！」我退下来对朋友说：「先生教诲人，不挑年老衰朽的，这是仁人怜悯万物的心啊。」","zs":[["耆宿","年高有德望的人。"],["圆凿方枘","圆形的榫眼，方形的榫头，比喻格格不入。"]],"gl":[258,99],"q":"阳明为什么对几位老先生忧心？","a":"道本来坦如大路，他们却自加荒塞，终身陷在荆棘中而不悔。","yong":"跟固执的老客户讲新方法讲不通？别急，阳明也遇到过。","rec":"黄以方录","kj":[["r","员","圆","及此学真"],["r","柄","枘","真员凿方"]]},{"n":340,"t":"人生大病只是一傲字","yw":"先生曰：「人生大病，只是一『傲』字。为子而傲必不孝，为臣而傲必不忠，为父而傲必不慈，为友而傲必不信。故象与丹朱俱不肖，亦只一『傲』字，便结果了此生。诸君常要体此人心本是天然之理，精精明明，无纤介染着，只是一无我而已。胸中切不可有，有即傲也。古先圣人许多好处，也只是无我而已，无我自能谦。谦者众善之基，傲者众恶之魁。」","bh":"先生说：「人生最大的病，只是一个『傲』字。做儿子而傲慢必定不孝，做臣子而傲慢必定不忠，做父亲而傲慢必定不慈，做朋友而傲慢必定不守信。所以象和丹朱都不成器，也只是一个『傲』字，就断送了一生。各位要常常体会，人心本来是天然的理，精精明明，没有一丝一毫沾染，只是一个无我罢了。心中千万不可有『我』，有了就是傲。古代圣人的许多好处，也只是无我罢了，无我自然能谦虚。谦虚是众善的基础，傲慢是众恶的魁首。」","zs":[["丹朱","尧的儿子，傲慢不肖，尧因此传位于舜。"],["纤介","细微。"]],"gl":[105,107,303,245],"q":"阳明说人生大病是什么？根治的办法是什么？","a":"一个「傲」字。根治在无我：胸中不存一个「我」，自能谦。谦是众善之基，傲是众恶之魁。","yong":"做出了点成绩之后，最要防的就是这个字。","rec":"黄以方录","kj":[["r","致","纤","精明明无"]]},{"n":341,"t":"良知如掌中文理","yw":"又曰：「此道至简至易的，亦至精至微的。孔子曰：『其如示诸掌乎！』且人于掌何日不见？及至问他掌中多少文理，却便不知。即如我『良知』二字，一讲便明，谁不知得？若欲的见良知，却谁能见得？」问曰：「此知恐是无方体的，最难捉摸。」先生曰：「良知即是《易》，『其为道也屡迁，变动不居，周流六虚，上下无常，刚柔相易，不可为典要，惟变所适』，此知如何捉摸得？见得透时，便是圣人。」","bh":"先生又说：「这个道是最简单最容易的，也是最精深最微妙的。孔子说：『就像把东西放在手掌上给人看一样！』人对自己的手掌哪一天看不见？可是问他手掌中有多少纹理，却不知道了。就像我『良知』两个字，一讲就明白，谁不知道？可是要真切地见到良知，谁能见到？」有人问：「这个良知恐怕是没有方所形体的，最难捉摸。」先生说：「良知就是《易》，『它作为道，屡屡变迁，变动不居，周流于六爻之间，上下没有定准，刚柔互相变易，不能当作固定的典则，只随变化而适应』，这个良知怎么捉摸得到？见得透了，就是圣人。」","zs":[["其如示诸掌乎","《论语·八佾》。"],["其为道也屡迁……","《周易·系辞下》。六虚指卦的六个爻位。"]],"gl":[282,6,24],"q":"良知为什么既简易又难见？","a":"像手掌，天天看见，问掌中纹理却不知。良知一讲就明，但它变动不居、不可为典要，真见得透的就是圣人。","rec":"黄以方录","kj":[["r","离","难","方体的最"],["r","二真","良","摸先生曰"]]},{"n":342,"t":"回也非助我者","yw":"问：「孔子曰『回也非助我者也』，是圣人果以相助望门弟子否？」先生曰：「亦是实话。此道本无穷尽，问难愈多，则精微愈显。圣人之言本自周遍，但有问难的人胸中窒碍，圣人被他一难，发挥得愈加精神。若颜子闻一知十，胸中了然，如何得问难？故圣人亦寂然不动，无所发挥，故曰『非助』。」","bh":"有人问：「孔子说『颜回不是能帮助我的人』，难道圣人真的希望弟子帮助他吗？」先生说：「这也是实话。这个道本来无穷无尽，提问辩难越多，精微之处就越显露。圣人的话本来就很周全，但有提问辩难的人心中有阻碍，圣人被他一问，发挥得越发精彩。像颜回那样听一知十，心中明白透彻，哪里会提问辩难？所以圣人也就寂然不动，没有什么发挥，所以说『不是帮助我的』。」","zs":[["回也非助我者也","《论语·先进》：「回也非助我者也，于吾言无所不说。」"]],"gl":[77,113,246],"q":"孔子说颜回「非助我者」，是批评颜回吗？","a":"不是批评，是实话。问难越多道越显；颜回闻一知十，不问难，孔子就没有发挥的机会。","yong":"最能逼你成长的，往往是那个总给你挑刺的客户。","rec":"黄以方录","kj":[["r","日","曰","所发挥故"]]},{"n":343,"t":"国裳读书中过状元","yw":"邹谦之尝语德洪曰：「舒国裳曾持一张纸，请先生写『拱把之桐梓』一章。先生悬笔为书到『至于身而不知所以养之者』，顾而笑曰：『国裳读书，中过状元来，岂诚不知身之所以当养，还须诵此以求警。』一时在侍诸友皆惕然。」","bh":"邹谦之曾对我（钱德洪）说：「舒国裳曾拿着一张纸，请先生写《孟子》『拱把之桐梓』那一章。先生提笔写到『至于自身却不知道怎样修养』这一句时，回头笑着说：『国裳读书，还中过状元，难道真的不知道该怎样修养自身吗？还要背诵这句来警醒自己。』当时在旁陪侍的朋友都悚然警惕。」","zs":[["拱把之桐梓","《孟子·告子上》：「拱把之桐梓，人苟欲生之，皆知所以养之者。至于身，而不知所以养之者，岂爱身不若桐梓哉？弗思甚也。」"],["舒国裳","舒芬，正德十二年（1517）状元。"]],"gl":[20,252,232],"q":"阳明笑舒国裳，笑的是什么？","a":"状元当然读过、懂这句话，却还要写来警醒，说明知而未行。读书再多，修身还是要自己做。","yong":"这是《传习录》最后一条。读完全书，别把它挂在墙上当警句，去做。","rec":"黄以方录","kj":[["r","恫","桐","写拱把之"]]}],"kjTotal":623,"kjByJuan":{"上":235,"下":388}};

    <div class="today">${next.length?next.map(n=>card(n,KEY.has(n)?'<span class="pill">有反方</span>':'')).join(''):'<p class="muted">卷上、卷下都读过了。去复习，或者等卷中上线。</p>'}</div>
  </section>
  <section class="sec"><h2>到期复习 <small>${due.length?due.length+' 条':'今天没有'}</small></h2>
    ${due.length?`<div class="today">${due.slice(0,3).map(n=>card(n,'<span class="pill due">待复习</span>')).join('')}</div><div class="btnrow" style="margin-top:12px"><a class="btn" href="#review">开始复习 ${due.length} 条</a></div>`
      :`<p class="muted" style="margin:0">读完一条点「读完了」，它会在 1、3、7、16、35 天后回来考你一次。</p>`}
  </section>
  <section class="sec"><h2>序跋</h2><div class="today">
    <a class="card" href="#intro"><span class="no">序</span><span class="tt"><b>徐爱引言</b><span>先生于《大学》格物诸说，悉以旧本为正…</span></span></a>
    <a class="card" href="#ba"><span class="no">跋</span><span class="tt"><b>徐爱跋</b><span>爱因旧说汩没，始闻先生之教…</span></span></a>
    <a class="card" href="#qba"><span class="no">跋</span><span class="tt"><b>钱德洪跋（卷下）</b><span>嘉靖戊子冬，德洪与王汝中奔师丧至广信…</span></span></a>
  </div></section>`;
}
function vToc(){
  return JUAN.map(([jn,who,ja,jb])=>`<section class="sec"><h2>${jn} <small>${who} · ${E.filter(e=>e.n>=ja&&e.n<=jb).length} 条</small></h2>
  ${RECS.filter(r=>r[0]===jn).map(([j,name,a,b])=>`<div class="rec"><h3>${name} <span class="muted" style="font-size:.85rem">第 ${a}–${b} 条</span></h3><div class="grid">${
    E.filter(e=>e.n>=a&&e.n<=b).map(e=>`<a class="cell${P[e.n]?' read':''}${KEY.has(e.n)?' key':''}" href="#e${e.n}" title="${esc(e.t)}">${e.n}</a>`).join('')
  }</div></div>`).join('')}</section>`).join('')+
  `<div class="legend"><span><i style="background:var(--qing-soft)"></i>已读</span><span><i style="background:var(--zhu);border-radius:50%;width:7px;height:7px"></i>附反方驳论</span><span>编号依陈荣捷《详注集评》，卷中（第 130–200 条）尚未收录</span></div>`;
}
function vEntry(n){
  const e=BYN[n]; if(!e) return vHome();
  const pv=E[IDX[n]-1], nx=E[IDX[n]+1], r=P[n];
  return `<article class="leaf">
    <div class="eyebrow">${recOf(n)} · 第 ${n} 条</div>
    <div class="ehead"><span class="big">${n}</span><h1>${esc(e.t)}</h1>${r?'<span class="stamp">已读</span>':''}</div>
    <div class="yw">${paras(e.yw)}</div>
    <section class="blk bhblk"><h2>白话</h2><div class="bh">${paras(e.bh)}</div></section>
    ${S.bh==='0'?`<div class="actions"><button class="btn ghost" id="showBh">看白话</button></div>`:''}
    ${e.zs&&e.zs.length?`<section class="blk"><h2>注释</h2><ul class="zs">${e.zs.map(([k,v])=>`<li><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></li>`).join('')}</ul></section>`:''}
    ${e.yong?`<section class="blk"><h2>今天怎么用</h2><div class="yong">${esc(e.yong)}</div></section>`:''}
    ${e.con?`<section class="blk con"><h2>反方怎么驳</h2><div class="txt">${esc(e.con)}</div></section>`:''}
    <section class="blk"><h2>自测</h2><button class="flip" id="flip" aria-expanded="false"><div class="q">${esc(e.q)}</div><div class="a" hidden>${esc(e.a)}</div><div class="hint">先自己答，再点开看</div></button></section>
    ${e.gl.length?`<section class="blk"><h2>参看</h2><div class="links">${e.gl.map(g=>`<a href="#e${g}">${g} · ${esc(BYN[g].t)}</a>`).join('')}</div></section>`:''}
    <section class="blk kj"><h2>校勘</h2><details class="kjd"${e.kj.length?'':' open'}><summary>与底本相比改动 ${e.kj.length} 处</summary><div style="margin-top:8px">${kjHtml(e.kj)}</div></details></section>
    <div class="actions">${r?`<button class="btn ghost" id="unread">取消已读</button><span class="muted" style="font-size:.85rem">下次复习：${new Date(r.d).toLocaleDateString('zh-CN')}</span>`:`<button class="btn" id="read">读完了</button>`}</div>
  </article>
  <nav class="pager">${pv?`<a href="#e${pv.n}">← ${pv.n} ${esc(pv.t)}</a>`:'<a href="#ba">← 徐爱跋</a>'}${nx?`<a href="#e${nx.n}" style="text-align:right">${nx.n} ${esc(nx.t)} →</a>`:'<a href="#qba" style="text-align:right">钱德洪跋 →</a>'}</nav>`;
}
function vFront(k){
  const f=k==='qba'?D.back:D.front[k];
  const label=k==='qba'?'卷下 · 跋':'卷上 · 卷首';
  const pager=k==='intro'?'<span></span><a href="#ba" style="text-align:right">徐爱跋 →</a>'
    :k==='ba'?'<a href="#intro">← 徐爱引言</a><a href="#e1" style="text-align:right">1 亲民还是新民 →</a>'
    :'<a href="#e343">← 343 '+esc(BYN[343].t)+'</a><a href="#toc" style="text-align:right">回目录 →</a>';
  return `<article class="leaf"><div class="eyebrow">${label}</div><div class="ehead"><h1>${esc(f.title)}</h1></div>
    <div class="yw">${paras(f.yw)}</div>
    <section class="blk bhblk"><h2>白话</h2><div class="bh">${paras(f.bh)}</div></section>
    ${S.bh==='0'?`<div class="actions"><button class="btn ghost" id="showBh">看白话</button></div>`:''}
    <section class="blk"><h2>注释</h2><ul class="zs">${f.zs.map(([a,b])=>`<li><span class="k">${esc(a)}</span><span class="v">${esc(b)}</span></li>`).join('')}</ul></section>
    <section class="blk kj"><h2>校勘</h2><details class="kjd"><summary>与底本相比改动 ${f.kj.length} 处</summary><div style="margin-top:8px">${kjHtml(f.kj)}</div></details></section>
  </article><nav class="pager">${pager}</nav>`;
}
let lastQ = load('q','');
function vSearch(){
  return `<section class="sec search"><h2>搜索 <small>原文、白话、注释、标题</small></h2>
    <label for="q" class="muted" style="font-size:.85rem">输入关键词，比如「良知」「事上磨」「种树」</label>
    <input id="q" type="search" autocomplete="off" value="${esc(lastQ)}" placeholder="搜点什么">
    <div class="res" id="res"></div></section>`;
}
function doSearch(q){
  lastQ=q; save('q',q);
  const box=$('#res'); if(!box) return;
  q=q.trim(); if(!q){box.innerHTML='<p class="muted">共 '+TOTAL+' 条可搜。</p>';return}
  const hits=[];
  for(const e of E){
    const zs=(e.zs||[]).map(z=>z.join('：')).join('；');
    const hay=[['原文',e.yw],['白话',e.bh],['注释',zs],['标题',e.t]];
    for(const [lab,t] of hay){const i=t.indexOf(q);if(i>=0){hits.push([e,lab,t,i]);break}}
  }
  const hl=s=>esc(s).split(esc(q)).join('<mark>'+esc(q)+'</mark>');
  box.innerHTML = `<p class="muted" style="margin:0">找到 ${hits.length} 条</p>`+hits.map(([e,lab,t,i])=>{
    const s=Math.max(0,i-18), frag=(s?'…':'')+t.slice(s,i+q.length+30).replace(/\n/g,' ')+'…';
    return `<a href="#e${e.n}"><b>${e.n} · ${esc(e.t)}</b> <span class="pill">${lab}</span><div class="snip">${hl(frag)}</div></a>`}).join('');
}
let rvQueue=[], rvShow=false;
function vReview(){
  if(!rvQueue.length) rvQueue=dueList();
  if(!rvQueue.length) return `<section class="sec"><h2>复习</h2><p class="muted">今天没有到期的条目。读完新的条目后，它们会按 1、3、7、16、35 天的间隔回来。</p><a class="btn" href="#home">回首页</a></section>`;
  const n=rvQueue[0], e=BYN[n];
  return `<div class="rv"><div class="eyebrow">复习 · 还剩 ${rvQueue.length} 条 · 第 ${n} 条「${esc(e.t)}」</div>
    <div class="q">${esc(e.q)}</div>
    ${rvShow?`<div class="a">${esc(e.a)}</div><div class="btnrow" style="margin-top:16px"><button class="btn" id="ok">记得</button><button class="btn ghost" id="ng">忘了，明天再来</button><a class="btn ghost" href="#e${n}">回看原文</a></div>`
      :`<div class="btnrow"><button class="btn" id="reveal">看答案</button></div>`}
  </div>`;
}
function vAbout(){
  const J=D.kjByJuan;
  return `<section class="sec prose"><h2>关于这个译注本</h2>
  <p>这是王阳明《传习录》的白话译注阅读站，目前收录卷上（徐爱引言、徐爱跋、正文 129 条）和卷下（正文 143 条、钱德洪跋），共 ${TOTAL} 条。条目编号依陈荣捷《王阳明传习录详注集评》：卷上 1–129，卷下 201–343。卷中是阳明的书信（第 130–200 条），尚未收录。</p>
  <h2>底本与校勘</h2>
  <p>原文取自殆知阁古籍库的公版电子文本。这个底本是 OCR 识读的，错字很多，卷下尤其严重，例如「良知」常被识成「真知」，「麈尾」成了「尘尾」，「癸未」成了「癸末」。整理时依通行本逐条改正，卷上改 ${J['上']} 处，卷下改 ${J['下']} 处。</p>
  <p>每一处改动都是程序把成稿和底本逐字比对后自动列出的，挂在每条末尾的「校勘」里，没有不留记录的改动。比对只看汉字，不计标点。</p>
  <p>卷下的分条与通行本有两处不同，已按陈荣捷编号调整：底本把第 228、229 两条连成一条，中间以「○」隔开，这里拆开；底本把钱德洪记阳明在越讲学盛况的一段当作序文，这里按通行本列为第 316 条。另外，底本没有标出钱德洪录的起点，所以目录里把第 248–316 条合称「黄省曾、钱德洪录」；第 317–343 条底本也未标录者，据通行本定为黄以方录。</p>
  <p>校改依据的是整理者对通行本的了解，没有逐字对照纸本。如果要引用，请用陈荣捷《详注集评》或邓艾民《传习录注疏》核对。</p>
  <h2>白话、注释和反方</h2>
  <p>白话以直译为主，个别长条分段意译。注释说明人名、典故和术语。「反方怎么驳」选了 ${KEY.size} 条争议较大的条目，列出朱子学者、清代考据家、东林学者或现代心理学可能提出的质疑，好让你读的时候不只是点头。</p>
  <p>白话、注释、反方、自测题和「今天怎么用」都由 AI 撰写，不是出版译本。</p>
  <h2>阅读进度保存在哪</h2>
  <p>已读记录、复习日程和设置只存在这台设备的浏览器里，不上传。电脑和手机的进度不相通；清除浏览器数据会丢失进度。</p>
  <h2>离线阅读</h2>
  <p>部署到自己的域名后，第一次打开会把全书缓存下来，之后没网也能打开。手机浏览器里选「添加到主屏幕」，用起来就像一个 App。</p>
  </section>`;
}
/* —— 路由 —— */
function route(){
  const h=(location.hash||'#home').slice(1);
  let html, m;
  if((m=h.match(/^e(\d+)$/))) html=vEntry(+m[1]);
  else if(h==='toc') html=vToc();
  else if(h==='search') html=vSearch();
  else if(h==='review') html=vReview();
  else if(h==='about') html=vAbout();
  else if(h==='intro'||h==='ba'||h==='qba') html=vFront(h);
  else html=vHome();
  $('#app').innerHTML=html;
  if(h!=='review'){rvQueue=[];rvShow=false}
  bind(h,m);
  window.scrollTo(0,0);
  save('last',h);
}
function bind(h,m){
  const f=$('#flip'); if(f) f.addEventListener('click',()=>{const a=f.querySelector('.a'),hi=f.querySelector('.hint');a.hidden=!a.hidden;hi.hidden=!a.hidden;f.setAttribute('aria-expanded',String(!a.hidden))});
  const sb=$('#showBh'); if(sb) sb.addEventListener('click',()=>{document.querySelectorAll('.bhblk').forEach(x=>x.style.display='block');sb.remove()});
  if(m){const n=+m[1];
    const r=$('#read'); if(r) r.addEventListener('click',()=>{markRead(n);route();});
    const u=$('#unread'); if(u) u.addEventListener('click',()=>{unmark(n);route();});
  }
  if(h==='search'){const q=$('#q');doSearch(q.value);q.addEventListener('input',()=>doSearch(q.value));q.focus({preventScroll:true});}
  if(h==='review'){
    const rv=$('#reveal'); if(rv) rv.addEventListener('click',()=>{rvShow=true;$('#app').innerHTML=vReview();bind('review')});
    const ok=$('#ok'),ng=$('#ng');
    const step=good=>{grade(rvQueue[0],good);rvQueue.shift();rvShow=false;if(!rvQueue.length)rvQueue=[-1];$('#app').innerHTML=rvQueue[0]===-1?`<section class="sec"><h2>今天复习完了</h2><p class="muted">答不上来的，明天会再来。</p><a class="btn" href="#home">回首页</a></section>`:vReview();bind('review')};
    if(ok) ok.addEventListener('click',()=>step(true)); if(ng) ng.addEventListener('click',()=>step(false));
  }
}
document.addEventListener('keydown',ev=>{
  if(ev.target.closest('input,textarea')) return;
  const m=(location.hash||'').match(/^#e(\d+)$/); if(!m) return;
  const n=+m[1];
  const i=IDX[n];
  if(ev.key==='ArrowRight'&&E[i+1]) location.hash='e'+E[i+1].n;
  if(ev.key==='ArrowLeft'&&E[i-1]) location.hash='e'+E[i-1].n;
});
window.addEventListener('hashchange',route);
applySettings();
if(!location.hash){const last=load('last','');if(last&&last!=='home')history.replaceState(null,'','#'+last);}
route();
if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>

</body>
