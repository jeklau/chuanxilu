<style>
/* 版式：一栏书页，左缘留「书口」，原文用宋体大字，白话用无衬线小一号，像古籍的「经」与「疏」两层 */
:root{
  --paper:#E9ECE6;      /* 宣纸，略带青灰 */
  --leaf:#F6F7F3;       /* 书页 */
  --ink:#1D2320;        /* 墨 */
  --ink-2:#4A544F;      /* 淡墨 */
  --ink-3:#7C8681;      /* 枯墨 */
  --rule:#CDD3CC;       /* 界栏 */
  --qing:#2D6A64;       /* 石青，主色 */
  --qing-soft:#DCE8E4;
  --zhu:#B23A2C;        /* 朱，只用于印章与校勘 */
  --zhu-soft:#F3E2DE;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --display:"ZCOOL XiaoWei","Noto Serif SC","Songti SC",serif;
  --fs:17px;
  --measure:36em;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#151917;--leaf:#1C211F;--ink:#E3E7E2;--ink-2:#B5BDB8;--ink-3:#85908A;--rule:#323A36;
  --qing:#7FC1B7;--qing-soft:#203431;--zhu:#E2735F;--zhu-soft:#3A2521;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#151917;--leaf:#1C211F;--ink:#E3E7E2;--ink-2:#B5BDB8;--ink-3:#85908A;--rule:#323A36;
  --qing:#7FC1B7;--qing-soft:#203431;--zhu:#E2735F;--zhu-soft:#3A2521;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:var(--fs)/1.75 var(--sans);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:var(--qing)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--qing);outline-offset:2px;border-radius:4px}
.wrap{max-width:46rem;margin:0 auto}

/* 顶栏 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;align-items:center;gap:8px;padding-block:10px;border-bottom:1px solid var(--rule)}
.brand{font-family:var(--display);font-size:1.25rem;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px;margin-right:auto;white-space:nowrap}
.seal{display:inline-grid;place-items:center;width:1.6em;height:1.6em;background:var(--zhu);color:var(--leaf);font-family:var(--serif);font-weight:700;font-size:.8em;border-radius:3px}
.ibtn{border:1px solid var(--rule);background:var(--leaf);border-radius:8px;min-width:40px;height:38px;padding:0 10px;cursor:pointer;font-size:.9rem;color:var(--ink-2)}
.ibtn:hover{border-color:var(--qing);color:var(--qing)}
.ibtn[aria-pressed="true"]{background:var(--qing);color:var(--leaf);border-color:var(--qing)}

/* 设置面板 */
.panel{background:var(--leaf);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;margin-top:10px;display:grid;gap:12px;font-size:.92rem}
.panel .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.panel .lab{color:var(--ink-3);width:4.5em;flex:none}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--qing);color:var(--leaf)}

/* 通用 */
h1,h2,h3{text-wrap:balance;font-weight:400}
.eyebrow{font-size:.78rem;letter-spacing:.12em;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.sec{margin-top:28px}
.sec>h2{font-family:var(--display);font-size:1.35rem;margin:0 0 12px;display:flex;align-items:baseline;gap:10px}
.sec>h2 small{font-family:var(--sans);font-size:.8rem;color:var(--ink-3)}

/* 首页 */
.hero{padding-block:28px 6px}
.hero h1{font-family:var(--display);font-size:clamp(2rem,7vw,2.8rem);line-height:1.2;margin:6px 0 10px}
.hero p{margin:0;color:var(--ink-2);max-width:var(--measure)}
.meter{margin-top:18px;display:flex;align-items:center;gap:12px;font-variant-numeric:tabular-nums}
.track{flex:1;height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--qing);border-radius:3px}
.today{display:grid;gap:10px}
.card{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;text-decoration:none;color:inherit;background:var(--leaf);border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
.card:hover{border-color:var(--qing)}
.card .no{font-family:var(--serif);font-size:1.4rem;color:var(--qing);font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.card .tt{min-width:0}
.card .tt b{font-weight:600;display:block}
.card .tt span{font-size:.85rem;color:var(--ink-3);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--serif)}
.pill{font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--qing-soft);color:var(--qing);white-space:nowrap}
.pill.due{background:var(--zhu-soft);color:var(--zhu)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--qing);background:var(--qing);color:var(--leaf);border-radius:8px;padding:8px 16px;cursor:pointer;text-decoration:none;font-size:.95rem}
.btn.ghost{background:transparent;color:var(--qing)}
.btn:disabled{opacity:.45;cursor:default}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}

/* 目录 */
.rec{margin-top:18px}
.rec h3{font-family:var(--serif);font-size:1rem;margin:0 0 8px;color:var(--ink-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(2.9rem,1fr));gap:6px}
.cell{display:grid;place-items:center;height:2.6rem;border:1px solid var(--rule);border-radius:6px;background:var(--leaf);text-decoration:none;color:var(--ink-2);font-variant-numeric:tabular-nums;font-size:.9rem;position:relative}
.cell:hover{border-color:var(--qing);color:var(--qing)}
.cell.read{background:var(--qing-soft);color:var(--qing);border-color:transparent}
.cell.key::after{content:"";position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--zhu)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--ink-3);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px}

/* 条目页：书页 */
.leaf{background:var(--leaf);border:1px solid var(--rule);border-radius:12px;margin-top:16px;padding:22px clamp(16px,4vw,36px) 26px}
.ehead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.ehead .big{font-family:var(--serif);font-size:2.4rem;line-height:1;color:var(--qing);font-variant-numeric:tabular-nums}
.ehead h1{font-family:var(--display);font-size:1.6rem;margin:0;flex:1;min-width:10em}
.stamp{font-family:var(--serif);font-size:.8rem;border:1.5px solid var(--zhu);color:var(--zhu);padding:1px 6px;border-radius:3px;transform:rotate(-4deg);display:inline-block}
.yw{font-family:var(--serif);font-size:calc(var(--fs)*1.12);line-height:2.05;letter-spacing:.02em;margin:18px 0 0;max-width:var(--measure);text-align:justify}
.yw p{margin:0 0 .6em}
.blk{margin-top:22px;border-top:1px solid var(--rule);padding-top:14px}
.blk>h2{font-size:.82rem;letter-spacing:.14em;color:var(--ink-3);margin:0 0 8px;font-weight:600;display:flex;align-items:center;gap:8px}
.blk>h2::before{content:"";width:3px;height:.9em;background:var(--qing);border-radius:2px}
.blk.con>h2::before,.blk.kj>h2::before{background:var(--zhu)}
.bh{max-width:var(--measure);color:var(--ink)}
.bh p{margin:0 0 .7em}
.zs{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.zs li{display:grid;grid-template-columns:minmax(4.5em,max-content) 1fr;gap:4px 12px;font-size:.92rem}
.zs dt,.zs .k{font-family:var(--serif);font-weight:600;color:var(--qing)}
.zs .v{min-width:0;color:var(--ink-2)}
.con .txt{background:var(--zhu-soft);border-radius:8px;padding:12px 14px;font-size:.95rem;color:var(--ink)}
.yong{background:var(--qing-soft);border-radius:8px;padding:12px 14px;font-size:.95rem}
.flip{border:1px dashed var(--qing);border-radius:10px;padding:14px;cursor:pointer;background:transparent;width:100%;text-align:left}
.flip .q{font-weight:600}
.flip .a{margin-top:8px;color:var(--ink-2)}
.flip .hint{font-size:.8rem;color:var(--ink-3);margin-top:6px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{font-size:.88rem;text-decoration:none;border:1px solid var(--rule);border-radius:99px;padding:3px 10px;color:var(--ink-2)}
.links a:hover{border-color:var(--qing);color:var(--qing)}
.kjl{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:.88rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.kjl b{font-family:var(--serif);color:var(--zhu);font-weight:600}
.kjl s{font-family:var(--serif);color:var(--ink-3)}
details.kjd summary{cursor:pointer;color:var(--ink-3);font-size:.9rem}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.pager a{text-decoration:none;color:var(--ink-2);font-size:.92rem;max-width:48%}
.pager a:hover{color:var(--qing)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}

/* 搜索 */
.search input{width:100%;font:inherit;padding:10px 14px;border:1px solid var(--rule);border-radius:10px;background:var(--leaf);color:var(--ink)}
.res{display:grid;gap:8px;margin-top:12px}
.res a{display:block;text-decoration:none;color:inherit;background:var(--leaf);border:1px solid var(--rule);border-radius:10px;padding:10px 14px}
.res a:hover{border-color:var(--qing)}
.res .snip{font-family:var(--serif);font-size:.92rem;color:var(--ink-2)}
mark{background:var(--zhu-soft);color:var(--zhu);border-radius:2px;padding:0 1px}

/* 复习 */
.rv{background:var(--leaf);border:1px solid var(--rule);border-radius:12px;padding:20px;margin-top:16px}
.rv .q{font-size:1.15rem;font-family:var(--serif);margin:10px 0 16px}
.rv .a{border-top:1px solid var(--rule);padding-top:12px;margin-top:4px}

.prose{max-width:var(--measure)}
.prose h2{font-family:var(--display);font-size:1.3rem;margin:26px 0 8px}
.prose p,.prose li{color:var(--ink-2)}
.foot{margin-top:40px;font-size:.8rem;color:var(--ink-3);border-top:1px solid var(--rule);padding-top:12px}
.hide-bh .bhblk{display:none}
@media (max-width:480px){.ehead .big{font-size:2rem}.zs li{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.leaf,.rv{animation:in .25s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>

</head>

<script>
const D = {"front":{"intro":{"title":"徐爱引言","yw":"先生于《大学》格物诸说，悉以旧本为正，盖先儒所谓误本者也。爱始闻而骇，既而疑，已而殚精竭思，参互错综，以质于先生，然后知先生之说，若水之寒，若火之热，断断乎百世以俟圣人而不惑者也。先生明睿天授，然和乐坦易，不事边幅。人见其少时豪迈不羁，又尝泛滥于词章，出入二氏之学，骤闻是说，皆目以为立异好奇，漫不省究。不知先生居夷三载，处困养静，精一之功，固已超入圣域，粹然大中至正之归矣。爱朝夕炙门下，但见先生之道，即之若易，而仰之愈高；见之若粗，而探之愈精；就之若近，而造之愈益无穷。十余年来，竟未能窥其藩篱。世之君子，或与先生仅交一面，或犹未闻其謦欬，或先怀忽易愤激之心，而遽欲于立谈之间，传闻之说，臆断悬度，如之何其可得也？从游之士，闻先生之教，往往得一而遗二，见其牝牡骊黄，而弃其所谓千里者。故爱备录平日之所闻，私以示夫同志，相与考正之，庶无负先生之教云。门人徐爱书。","bh":"先生讲《大学》的「格物」等学说，全部以古本为准，也就是前辈儒者（指朱熹）认为有错简的那个版本。我刚听到时很吃惊，接着怀疑，后来绞尽脑汁，反复对照比较，再向先生请教，才明白先生的说法就像水是冷的、火是热的一样确凿，就算等上一百代后的圣人来检验，也不会有疑问。先生天资聪明，却和蔼平易，不拘小节。别人看他年轻时豪放不羁，又沉迷过诗文辞章，出入过佛道两家，乍一听他的学说，都当他是标新立异，懒得深究。他们不知道先生在贵州龙场住了三年，在困境里静心修养，下过「精一」的功夫，早已进入圣贤境界，达到纯正中和的归宿。我早晚在先生门下受教，只觉得先生的道，走近看好像很容易，抬头仰望却越来越高；看着好像粗浅，探究下去却越来越精微；靠近了似乎触手可及，真要达到却无穷无尽。十几年来，我连他的门墙都还没摸到。世上有些君子，和先生只见过一面，有的连他说话都没听过，有的先就怀着轻视和愤激的心，却想凭几句闲谈、几句传闻就下判断，这怎么可能懂呢？跟随先生学习的人，听了先生的教导，也常常只得一半、漏一半，就像相马只看见公母和毛色，却丢掉了它能日行千里的本事。所以我把平日听到的详细记录下来，私下给志同道合的朋友看，一起考证订正，希望不辜负先生的教诲。门人徐爱书。","zs":[["旧本","指《礼记》中《大学》的原本，即「古本大学」。朱熹认为它有错简和缺文，重新调整了章节，并补写了「格物致知」传。阳明主张恢复古本。"],["二氏","佛家和道家。"],["居夷三载","正德元年（1506），阳明上疏救人，触怒宦官刘瑾，被廷杖后贬为贵州龙场驿丞，在当地三年，期间有「龙场悟道」。"],["精一","出自《尚书·大禹谟》「惟精惟一，允执厥中」，指精纯专一的修养功夫。"],["謦欬","咳嗽声，引申为亲口说话、言谈。"],["牝牡骊黄","典出《列子·说符》：九方皋相马，不记马的公母和毛色，却能识出千里马。比喻只看表面，抓不住本质。"]],"kj":[["r","萶桌取","养静","三载处困"],["r","韾","謦","犹未闻其"],["r","潡","激","怀忽易愤"],["r","远","遽","潡之心而"]]},"ba":{"title":"徐爱跋","yw":"爱因旧说汩没，始闻先生之教，实是骇愕不定，无入头处。其后闻之既久，渐知反身实践，然后始信先生之学为孔门嫡传，舍是皆傍蹊小径、断港绝河矣。如说格物是诚意的工夫，明善是诚身的工夫，穷理是尽性的工夫，道问学是尊德性的工夫，博文是约礼的工夫，惟精是惟一的工夫，诸如此类，始皆落落难合，其后思之既久，不觉手舞足蹈。","bh":"我原先被旧说淹没，刚听先生的教导时，真是又惊又疑，心神不定，找不到入门的地方。后来听久了，慢慢懂得回到自己身上去实践，这才相信先生的学问是孔门的正宗嫡传，除此之外都是旁门小路、断了的港湾和河道，走不通。比如先生说：格物是诚意的功夫，明善是诚身的功夫，穷理是尽性的功夫，道问学是尊德性的功夫，博文是约礼的功夫，惟精是惟一的功夫。这类说法，一开始我都觉得格格不入，后来想得久了，不知不觉高兴得手舞足蹈。","zs":[["汩没","沉没、埋没。"],["道问学、尊德性","出自《中庸》「君子尊德性而道问学」。朱子偏重「道问学」（读书求知），陆九渊偏重「尊德性」（涵养本心）。阳明认为两者是一件事：问学就是尊德性的功夫。"],["功夫","这几句话的格式都是「A 是 B 的功夫」，意思是 A 不是 B 之外的另一件事，而是达成 B 的具体做法。这是阳明「合一」思路的典型表达。"]],"kj":[["r","人","入","愕不定无"],["r","絽","绝","小径断港"]]}},"back":{"title":"钱德洪跋","yw":"嘉靖戊子冬，德洪与王汝中奔师丧至广信，讣告同门，约三年收录遗言。后同门各以所记寄来。洪择其切于问正者，合所私录，得若干条。居吴时，将与文录并刻矣，适以忧去，未遂。当是时也，四方讲学日众，师门宗旨既明，若无事于赘刻者，故不复萦念。去年，同门曾才汉得洪手抄，复傍为采辑，名曰《遗言》，以刻行于荆。洪读之，觉当时采录未精，乃为删其重复，削去芜蔓，存其三分之一，名曰《传习续录》，复刻于宁国之水西精舍。今年夏，洪来游蕲，沈君思畏曰：「师门之教，久行于四方，而独未及于蕲。蕲之士得读《遗言》，若亲炙夫子之教，指见良知，若重睹日月之光。惟恐传习之不博，而不以重复之为繁也。请裒其所逸者增刻之，若何？」洪曰：「然。师门致知格物之旨，开示来学，学者躬修默悟，不敢以知解承，而惟以实体得，故吾师终日言是而不惮其烦，学者终日听是而不厌其数。盖指示专一，则体悟日精，机迎于言前，神发于言外，感遇之诚也。今吾师之没未及三纪，而格言微旨渐觉沦晦，岂非吾党身践之不力，多言有以病之耶？学者之趋不一，师门之教不宣也。」乃复取逸稿，采其语之不背者，得一卷。其余影响不真，与文录既载者，皆削之。并易中卷为问答语，以付黄梅尹张君增刻之。庶几读者不以知解承，而惟以实体得，则无疑于是录矣。嘉靖丙辰夏四月，门人钱德洪拜书于蕲之崇正书院。","bh":"嘉靖七年（1528）冬天，我（钱德洪）和王汝中赶去奔先生的丧，到了广信，向同门发出讣告，约定三年内收集先生的遗言。后来同门各自把所记的寄来。我选出其中切实请教指正的，合上自己私下记录的，得到若干条。住在苏州时，原打算和先生的文集一起刊刻，正好因为家中丧事离开，没有完成。那时候，各地讲学的人越来越多，先生的宗旨已经很明白了，好像不需要再多刻了，所以就不再挂念。去年，同门曾才汉得到了我的手抄本，又从旁收集，取名《遗言》，在湖北刊刻。我读了以后，觉得当时收录得不够精，于是删去重复的，去掉芜杂的，保留了三分之一，取名《传习续录》，又在宁国的水西精舍刊刻。今年夏天，我来到蕲州，沈思畏先生说：「先生的教导早已在四方流行，唯独还没到蕲州。蕲州的士人读了《遗言》，就像亲身受教于先生，被指点看见良知，像重新见到日月的光明。只怕传习得不够广，不嫌重复繁多。请把那些散佚的收集起来增刻，怎么样？」我说：「好的。先生致知格物的宗旨，开导后学，学者亲身修养、默默领悟，不敢用知解去承接，只用实际体验去获得，所以先生整天讲这个也不嫌烦，学者整天听这个也不嫌多。因为指点专一，体悟就日益精深，机缘在言语之前就已迎合，神妙在言语之外就已发出，这是感应相遇的诚意。现在先生去世还不到三十六年，他的格言和精微的宗旨就渐渐沉沦晦暗了，难道不是因为我们这些人亲身实践不够，言语太多反而成了病吗？学者的趋向不一，先生的教导就不能宣明了。」于是又取出散佚的稿子，选出那些不违背宗旨的话，编成一卷。其余影响模糊、不够真实的，以及文集中已经收录的，都删去了。并把中卷改成问答形式，交给黄梅县令张君增刻。希望读者不用知解去承接，而只用实际体验去获得，那么对这部书就没有疑问了。嘉靖三十五年（1556）夏四月，门人钱德洪拜书于蕲州崇正书院。","zs":[["嘉靖戊子","嘉靖七年（1528），阳明于该年十一月病逝于江西南安。"],["广信","今江西上饶。"],["三纪","古以十二年为一纪，三纪为三十六年。"],["校勘说明","此跋底本错讹极多（如「洪诳之」「各靖丙辰」「拜古于斩」），据通行本逐一校改，均列于校勘记中。"]],"kj":[["r","遗","寄来","各以所记"],["i","","切","遗洪择其"],["i","","四","当是时也"],["r","子","才","年同门曾"],["r","诳","读","行于荆洪"],["i","","未","当时采录"],["r","力","乃","时采录精"],["i","","复","为删其重"],["r","沉","沈","洪来游蕲"],["r","长","畏","蕲沉君思"],["i","","炙","遗言若亲"],["r","靓","睹","良知若重"],["r","未","不","之不博而"],["r","哀","裒","为繁也请"],["r","皑","体","示专一则"],["r","几","机","皑悟日精"],["r","诳","读","刻之庶几"],["r","各","嘉","于是录矣"],["r","古","书","钱德洪拜"],["r","斩","蕲","洪拜古于"]]},"entries":[{"n":1,"t":"亲民还是新民","yw":"爱问：「『在亲民』，朱子谓当作『新民』，后章『作新民』之文似亦有据。先生以为宜从旧本作『亲民』，亦有所据否？」先生曰：「『作新民』之『新』，是自新之民，与『在新民』之『新』不同，此岂足为据？『作』字却与『亲』字相对，然非『亲』字义。下面『治国平天下』处，皆于『新』字无发明，如云『君子贤其贤而亲其亲，小人乐其乐而利其利』，『如保赤子』，『民之所好好之，民之所恶恶之，此之谓民之父母』之类，皆是『亲』字意。『亲民』犹孟子『亲亲仁民』之谓，亲之即仁之也。百姓不亲，舜使契为司徒，敬敷五教，所以亲之也。《尧典》『克明峻德』便是『明明德』，『以亲九族』至『平章协和』，便是『亲民』，便是『明明德于天下』。又如孔子言『修己以安百姓』，『修己』便是『明明德』，『安百姓』便是『亲民』。说『亲民』便是兼教养意，说『新民』便觉偏了。」","bh":"徐爱问：「《大学》开头说『在亲民』，朱子认为应该改成『新民』，后面章节有『作新民』的话，好像也有根据。先生认为应该依照古本作『亲民』，也有根据吗？」先生说：「『作新民』的『新』，是指自我更新的百姓，和『在新民』的『新』（使百姓更新）意思不一样，怎么能拿来当证据？『作』字倒是和『亲』字相对应，但并不是『亲』的意思。《大学》后文讲治国平天下的地方，都没有发挥『新』字的意思。比如说『君子尊敬他所尊敬的贤人，亲近他所亲近的亲人；小人享受他所享受的快乐，获得他所求的利益』，『像保护婴儿一样』，『百姓喜欢的就喜欢，百姓厌恶的就厌恶，这才叫百姓的父母』，这些全是『亲』的意思。『亲民』就像孟子说的『亲爱亲人，进而仁爱百姓』，亲爱他们就是仁爱他们。百姓之间不亲睦，舜就派契做司徒，恭敬地推行五伦教化，这就是亲民。《尚书·尧典》说的『能发扬崇高的德行』就是『明明德』，从『使九族亲睦』到『辨明百官、协和万邦』，就是『亲民』，也就是『在天下彰明光明的德性』。再比如孔子说『修养自己来安定百姓』，『修己』就是『明明德』，『安百姓』就是『亲民』。说『亲民』，就同时包含了教化和养育两层意思；说『新民』，就只剩教化，显得偏了。」","zs":[["亲民 / 新民","《大学》首句「大学之道，在明明德，在亲民，在止于至善」。程颐、朱熹认为「亲」当作「新」，意为使百姓革除旧习、自我更新。阳明坚持古本「亲民」。"],["契、司徒、五教","契是舜的大臣，司徒是掌管教化的官。五教指父子有亲、君臣有义、夫妇有别、长幼有序、朋友有信。"],["教养","教化与养育。阳明认为「亲」字含有像父母那样照顾、爱护的意思，所以比「新」更全面。"]],"gl":[2,6],"q":"阳明为什么认为「亲民」比「新民」更好？","a":"「新民」只有教化、改造百姓的意思，「亲民」同时包含亲爱、养育和教化。爱人在先，教化在其中，所以「新民」偏了。","yong":"带团队、服务客户时，你是想「改造」对方，还是先「亲」对方？先照顾，再引导。","rec":"徐爱录","kj":[]},{"n":2,"t":"至善在心不在物","yw":"爱问：「『知止而后有定』，朱子以为『事事物物皆有定理』，似与先生之说相戾。」先生曰：「于事事物物上求至善，却是义外也。至善是心之本体，只是『明明德』到至精至一处便是。然亦未尝离却事物，本注所谓『尽夫天理之极，而无一毫人欲之私』者得之。」","bh":"徐爱问：「《大学》说『知道该停在哪里，然后心志才有定向』，朱子解释为『每件事每样东西都有一定的道理』，好像和先生的说法相抵触。」先生说：「到每件事每样东西上去寻求至善，那就是把义当成外在的东西了。至善是心的本来面目，只要把『明明德』的功夫做到最精纯、最专一的地步就是了。不过这也从来没有离开具体的事物。朱子注里说的『穷尽天理到极点，没有一丝人欲的私心』，这句话倒是说对了。」","zs":[["知止而后有定","出自《大学》：「知止而后有定，定而后能静……」"],["义外","孟子批评告子「仁内义外」，主张仁义都出于内心。阳明借此批评向外物求理的做法。"],["本注","指朱熹《大学章句》的注文。阳明并不全盘否定朱子，这里就肯定了朱注的一句话。"]],"gl":[1,3,4],"q":"阳明说至善在心，那还用不用管具体的事？","a":"要管。至善是心之本体，但功夫「未尝离却事物」，是在做事的时候让心纯乎天理，而不是撇开事情空守内心。","yong":"做决策时，先问「我这念头纯不纯」，而不是先翻十本手册找标准答案。","rec":"徐爱录","kj":[]},{"n":3,"t":"心即理：孝不在父亲身上","yw":"爱问：「至善只求诸心，恐于天下事理有不能尽。」先生曰：「心即理也。天下又有心外之事、心外之理乎？」爱曰：「如事父之孝，事君之忠，交友之信，治民之仁，其间有许多理在，恐亦不可不察。」先生叹曰：「此说之蔽久矣，岂一语所能悟？今姑就所问者言之：且如事父，不成去父上求个孝的理；事君，不成去君上求个忠的理；交友治民，不成去友上、民上求个信与仁的理。都只在此心，心即理也。此心无私欲之蔽，即是天理，不须外面添一分。以此纯乎天理之心，发之事父便是孝，发之事君便是忠，发之交友治民便是信与仁。只在此心去人欲、存天理上用功便是。」爱曰：「闻先生如此说，爱已觉有省悟处。但旧说缠于胸中，尚有未脱然者。如事父一事，其间温凊定省之类，有许多节目，不知亦须讲求否？」先生曰：「如何不讲求？只是有个头脑，只是就此心去人欲、存天理上讲求。就如讲求冬温，也只是要尽此心之孝，恐怕有一毫人欲间杂；讲求夏清，也只是要尽此心之孝，恐怕有一毫人欲间杂：只是讲求得此心。此心若无人欲，纯是天理，是个诚于孝亲的心，冬时自然思量父母的寒，便自要求个温的道理；夏时自然思量父母的热，便自要求个清的道理。这都是那诚孝的心发出来的条件。却是须有这诚孝的心，然后有这条件发出来。譬之树木，这诚孝的心便是根，许多条件便是枝叶，须先有根，然后有枝叶，不是先寻了枝叶，然后去种根。《礼记》言：『孝子之有深爱者，必有和气；有和气者，必有愉色；有愉色者，必有婉容。』须是有个深爱做根，便自然如此。」","bh":"徐爱问：「至善只在心里求，恐怕对天下事物的道理不能全部穷尽。」先生说：「心就是理。天下难道还有心外的事、心外的理吗？」徐爱说：「比如侍奉父亲的孝、侍奉君主的忠、结交朋友的信、治理百姓的仁，这中间有很多道理，恐怕也不能不去考察。」先生叹气说：「这种说法蒙蔽人已经很久了，哪是一句话能说明白的？现在姑且就你问的来说。比如侍奉父亲，总不能到父亲身上去找一个孝的道理；侍奉君主，总不能到君主身上去找一个忠的道理；交朋友、治百姓，总不能到朋友、百姓身上去找信和仁的道理。这些都只在自己这颗心里，心就是理。这颗心没有被私欲遮蔽，就是天理，不需要从外面添加一分一毫。用这颗纯是天理的心，表现在侍奉父亲上就是孝，表现在侍奉君主上就是忠，表现在交友治民上就是信和仁。只要在这颗心上去除人欲、保存天理下功夫就行了。」徐爱说：「听先生这样讲，我已经有些醒悟了。但旧的说法缠在心里，还没完全摆脱。比如侍奉父亲，冬天要让他温暖，夏天要让他凉爽，晚上替他铺床，早上向他问安，这里面有很多细节，不知道是不是也要讲究研究？」先生说：「怎么不讲究？只是要有个根本，只是在这颗心去人欲、存天理上去讲究。比如研究冬天怎么保暖，也只是要尽这颗心的孝，怕有一丝人欲夹杂；研究夏天怎么清凉，也只是要尽这颗心的孝，怕有一丝人欲夹杂。讲究来讲究去，讲究的只是这颗心。这颗心如果没有私欲，纯是天理，是一颗真诚孝顺父母的心，那么冬天自然会想到父母冷，自然会去找保暖的办法；夏天自然会想到父母热，自然会去找清凉的办法。这些都是那颗真诚孝顺的心生发出来的具体条目。但必须先有这颗真诚孝顺的心，然后才有这些条目生发出来。拿树木来比，这颗诚孝的心就是根，许多具体条目就是枝叶。必须先有根，然后才有枝叶，不是先找好枝叶，再去种根。《礼记》说：『孝子对父母有深切的爱，必定有和顺的气色；有和顺的气色，必定有愉悦的神色；有愉悦的神色，必定有温婉的仪容。』必须有深爱做根，自然就会这样。」","zs":[["心即理","阳明心学的第一命题。与朱子「性即理」相对：朱子认为理在万物之中，需要向外「格物穷理」；阳明认为理就在本心，心无私欲即是天理。"],["温凊定省","出自《礼记·曲礼》：「凡为人子之礼，冬温而夏凊，昏定而晨省。」冬天让父母暖和，夏天让父母凉爽，晚上安顿床铺，早上问候请安。"],["头脑","阳明常用语，指根本、主宰、关键所在。"],["条件","这里是「条目、细节」的意思，不是现代汉语的「前提条件」。"]],"gl":[2,4,6,8],"q":"「心即理」是不是说不用学习具体知识了？","a":"不是。阳明明确说「如何不讲求」，具体做法照样要学，只是要有头脑：先有诚心做根，具体知识是从根上长出的枝叶。","yong":"想把客户服务做好？先问自己是真想帮客户解决问题，还是只想走完流程。心对了，细节你自然会去抠。","con":"朱子一系的回应：心会被私欲遮蔽，凭什么断定此刻的心就是天理？如果不向外读书、考察事理来校正，「心即理」很容易滑向自以为是。阳明的回答是「去人欲」的功夫本身就是校正，但这一质疑在后来的王门流弊中确实应验过。","rec":"徐爱录","kj":[["r","埋","理","生曰心即"],["r","顶","须","是天理不"],["d","叫","","之类有许"],["d","便","","孝的心便"],["i","","是","多条件便"],["d","欲","","气者必有"]]},{"n":4,"t":"扮戏子也能扮得周到","yw":"郑朝朔问：「至善亦须有从事物上求者？」先生曰：「至善只是此心纯乎天理之极便是，更于事物上怎生求？且试说几件看。」朝朔曰：「且如事亲，如何而为温凊之节，如何而为奉养之宜，须求个是当，方是至善，所以有学问思辨之功。」先生曰：「若只是温凊之节、奉养之宜，可一日二日讲之而尽，用得甚学问思辨？惟于温凊时也只要此心纯乎天理之极，奉养时也只要此心纯乎天理之极，此则非有学问思辨之功，将不免于毫厘千里之缪，所以虽在圣人犹加『精一』之训。若只是那些仪节求得是当，便谓至善，即如今扮戏子扮得许多温凊奉养的仪节是当，亦可谓之至善矣。」爱于是日又有省。","bh":"郑朝朔问：「至善是不是也要从事物上去寻求？」先生说：「至善只是这颗心纯是天理到了极点，还要到事物上怎么求？你说几件来看看。」朝朔说：「比如侍奉父母，怎样做才算冬温夏凉的礼节，怎样才算奉养得当，必须求个恰当，才是至善，所以才需要学、问、思、辨的功夫。」先生说：「如果只是冬温夏凉的礼节、奉养的分寸，一两天就能讲完，哪用得着学问思辨？只有在冬温夏凉时要这颗心纯是天理，在奉养时也要这颗心纯是天理，这一点要是没有学问思辨的功夫，就难免差之毫厘、谬以千里，所以就算是圣人，也还要加上『惟精惟一』的告诫。如果只是把那些礼节仪式做得恰当，就叫至善，那么现在戏台上演戏的人，把冬温夏凉、奉养父母的仪式演得样样到位，也可以叫至善了。」我（徐爱）这一天又有所醒悟。","zs":[["郑朝朔","名一初，广东揭阳人，阳明早年在京师的弟子。"],["学问思辨","《中庸》：「博学之，审问之，慎思之，明辨之，笃行之。」"],["毫厘千里","「失之毫厘，谬以千里」，开始差一点点，结果差得极远。"]],"gl":[3,9],"q":"「扮戏子」这个比喻要说明什么？","a":"只把外在礼节做得到位不等于至善，演员也能演得一样到位。区别在于心是否真诚、纯乎天理。","yong":"检查一下你的「客户关怀」流程：节日问候、跟进邮件做得再标准，心不在，就是在演戏，客户感觉得到。","rec":"徐爱录","kj":[["r","清","凊","何而为温"],["r","清","凊","若只是温"],["r","清","凊","辨惟于温"],["r","清","凊","得许多温"],["r","得","的","温清奉养"]]},{"n":5,"t":"知行合一（核心条）","yw":"爱因未会先生『知行合一』之训，与宗贤、惟贤往复辩论，未能决，以问于先生。先生曰：「试举看。」爱曰：「如今人尽有知得父当孝、兄当弟者，却不能孝、不能弟，便是知与行分明是两件。」先生曰：「此已被私欲隔断，不是知行的本体了。未有知而不行者，知而不行，只是未知。圣贤教人知行，正是要复那本体，不是着你只恁的便罢。故《大学》指个真知行与人看，说『如好好色，如恶恶臭』。见好色属知，好好色属行，只见那好色时已自好了，不是见了后又立个心去好；闻恶臭属知，恶恶臭属行，只闻那恶臭时已自恶了，不是闻了后别立个心去恶。如鼻塞人虽见恶臭在前，鼻中不曾闻得，便亦不甚恶，亦只是不曾知臭。就如称某人知孝、某人知弟，必是其人已曾行孝行弟，方可称他知孝知弟，不成只是晓得说些孝弟的话，便可称为知孝弟。又如知痛，必已自痛了方知痛；知寒，必已自寒了；知饥，必已自饥了。知行如何分得开？此便是知行的本体，不曾有私意隔断的。圣人教人，必要是如此，方可谓之知，不然，只是不曾知。此却是何等紧切着实的工夫！如今苦苦定要说知行做两个，是甚么意？某要说做一个，是什么意？若不知立言宗旨，只管说一个两个，亦有甚用？」爱曰：「古人说知行做两个，亦是要人见个分晓，一行做知的功夫，一行做行的功夫，即功夫始有下落。」先生曰：「此却失了古人宗旨也。某尝说知是行的主意，行是知的功夫；知是行之始，行是知之成。若会得时，只说一个知，已自有行在；只说一个行，已自有知在。古人所以既说一个知又说一个行者，只为世间有一种人，懵懵懂懂的任意去做，全不解思惟省察，也只是个冥行妄作，所以必说个知，方才行得是；又有一种人，茫茫荡荡悬空去思索，全不肯着实躬行，也只是个揣摸影响，所以必说一个行，方才知得真。此是古人不得已补偏救弊的说话，若见得这个意时，即一言而足。今人却就将知行分作两件去做，以为必先知了然后能行，我如今且去讲习讨论做知的工夫，待知得真了方去做行的工夫，故遂终身不行，亦遂终身不知。此不是小病痛，其来已非一日矣。某今说个知行合一，正是对病的药。又不是某凿空杜撰，知行本体原是如此。今若知得宗旨时，即说两个亦不妨，亦只是一个；若不会宗旨，便说一个，亦济得甚事？只是闲说话。」","bh":"我因为没领会先生「知行合一」的教导，和宗贤、惟贤反复辩论，没有结果，就去问先生。先生说：「举个例子看看。」我说：「现在有很多人知道对父亲应该孝顺、对兄长应该恭敬，却做不到孝顺和恭敬，可见知和行分明是两件事。」先生说：「这已经被私欲隔断了，不是知行的本来面目了。从来没有知道了却不去做的，知道却不做，只是还不知道。圣贤教人知和行，正是要恢复那个本来面目，不是让你这样随便知道一下就算了。所以《大学》指出真正的知行给人看，说『就像喜欢美色，就像厌恶恶臭』。看见美色属于知，喜欢美色属于行，只要看见美色的那一刻，已经喜欢上了，不是看见之后又另外立一个心去喜欢。闻到恶臭属于知，厌恶恶臭属于行，只要闻到恶臭的那一刻，已经厌恶了，不是闻到之后又另立一个心去厌恶。比如鼻塞的人，即使看见臭东西在面前，鼻子没闻到，也就不怎么厌恶，这只是因为他还不曾知道臭。又比如说某人懂孝、某人懂悌，必定是这个人已经做过孝顺恭敬的事，才能说他懂孝懂悌，总不能只是会说几句孝悌的话，就说他懂孝悌了。再比如知道痛，一定是自己已经痛过才知道痛；知道冷，一定是自己已经冷过；知道饿，一定是自己已经饿过。知和行怎么分得开？这就是知行的本来面目，没有被私心隔断的状态。圣人教人，一定要做到这样，才能叫作知，不然就只是不曾知。这是多么紧要、多么实在的功夫！现在有人苦苦坚持要把知行说成两个，是什么用意？我要说成一个，又是什么用意？如果不明白说话的宗旨，只管争论是一个还是两个，又有什么用？」我说：「古人把知行说成两个，也是要人看个清楚，一方面做知的功夫，一方面做行的功夫，这样功夫才有着落。」先生说：「这恰恰丢了古人的宗旨。我曾说过：知是行的主意，行是知的功夫；知是行的开始，行是知的完成。如果领会了，只说一个知，行已经在里面了；只说一个行，知也已经在里面了。古人之所以既说知又说行，是因为世上有一种人，懵懵懂懂地任意去做，完全不懂思考反省，只是盲目乱干，所以一定要说个知，他才能做得对；又有一种人，茫茫然悬在空中去想，完全不肯切实去做，只是捕风捉影，所以一定要说个行，他才能知得真切。这是古人不得已、为了纠正偏差而说的话，如果明白了这层用意，一句话就够了。现在的人却把知行分成两件事去做，以为必须先知道了才能去做，『我现在先去讲习讨论，做知的功夫，等知得真切了再去做行的功夫』，结果一辈子都没去做，也就一辈子都没真正知道。这不是小毛病，由来已久。我现在提出知行合一，正是对症下药。这也不是我凭空捏造，知行的本来面目原本就是这样。现在如果明白了宗旨，就算说成两个也无妨，其实还是一个；如果不明白宗旨，就算说成一个，又有什么用？只是空话罢了。」","zs":[["宗贤、惟贤","宗贤即黄绾，惟贤即顾应祥，都是阳明的友人和弟子。"],["弟","同「悌」，敬爱兄长。"],["如好好色，如恶恶臭","出自《大学》「所谓诚其意者，毋自欺也，如恶恶臭，如好好色」。前一个「好」「恶」是动词（喜欢、厌恶），后一个是形容词（美好的、难闻的）。"],["本体","本来的样子、原初状态。「知行的本体」指知和行在没有私欲干扰时本来合一的状态。"],["冥行妄作","闭着眼睛乱干。"],["揣摸影响","影是影子，响是回声，比喻凭空揣测、不着实际。"]],"gl":[6,26],"q":"「知而不行，只是未知」，那我知道该健身却没去，阳明会怎么说？","a":"你并没有真知道健身的必要，就像鼻塞的人没闻到臭。真知必然带出行动；做不到，要么是私欲隔断，要么是根本没真懂。","yong":"列出一件你「知道该做但一直没做」的事。问自己：我真知道它的后果吗？还是只是会说？然后现在就做第一步。","con":"反方：现代心理学有大量「意图与行为之间的鸿沟」研究，很多人确实真心知道却做不到（如成瘾），原因是自控资源、环境、习惯，而非「未知」。阳明的「知」定义得很强，几乎把「知」定义成「已经在行」，有循环定义之嫌。为阳明辩护的一面是：他本就把这当作一剂「对病的药」，是功夫论，而不是认知科学命题。","rec":"徐爱录","kj":[["i","","知","体了未有"],["r","耆","者","有而不行"],["r","和","知","行只是未"],["r","蒉","贤","是未和圣"],["r","贝","见","鼻塞人虽"],["r","矶","饥","饥必已自"],["r","苫苫","苦苦","工夫如今"],["r","七","世","行者只为"],["r","纔","才","说个知方"],["d","一","","悬空去思"],["r","纔","才","一个行方"]]},{"n":6,"t":"格物就是正念头","yw":"爱问：「昨闻先生『止至善』之教，已觉功夫有用力处，但与朱子『格物』之训，思之终不能合。」先生曰：「格物是止至善之功，既知至善，即知格物矣。」爱曰：「昨以先生之教推之格物之说，似亦见得大略。但朱子之训，其于《书》之『精一』，《论语》之『博约』，《孟子》之『尽心知性』，皆有所证据，以是未能释然。」先生曰：「子夏笃信圣人，曾子反求诸己。笃信固亦是，然不如反求之切。今既不得于心，安可狃于旧闻，不求是当？就如朱子亦尊信程子，至其不得于心处，亦何尝苟从？『精一』『博约』『尽心』，本自与吾说吻合，但未之思耳。朱子格物之训，未免牵合附会，非其本旨。精是一之功，博是约之功，曰仁既明知行合一之说，此可一言而喻。『尽心知性知天』是生知安行事，『存心养性事天』是学知利行事，『夭寿不贰，修身以俟』是困知勉行事。朱子错训格物，只为倒看了此意，以『尽心知性』为『物格知至』，要初学便去做生知安行事，如何做得？」爱问：「『尽心知性』，何以为生知安行？」先生曰：「性是心之体，天是性之原，尽心即是尽性。『惟天下至诚为能尽其性』，『知天地之化育』。存心者，心有未尽也。知天，如知州、知县之『知』，是自己分上事，己与天为一；事天，如子之事父、臣之事君，须是恭敬奉承，然后能无失，尚与天为二，此便是圣贤之别。至于『夭寿不贰』其心，乃是教学者一心为善，不可以穷通夭寿之故，便把为善的心变动了，只去修身以俟命，见得穷通寿夭有个命在，我亦不必以此动心。事天虽与天为二，已自见得个天在面前；俟命便是未曾见面，在此等候相似。此便是初学立心之始，有个困勉的意在。今却倒做了，所以使学者无下手处。」爱曰：「昨闻先生之教，亦影影见得功夫须是如此。今闻此说，益无可疑。爱昨晓思，『格物』的『物』字即是『事』字，皆从心上说。」先生曰：「然。身之主宰便是心，心之所发便是意，意之本体便是知，意之所在便是物。如意在于事亲，即事亲便是一物；意在于事君，即事君便是一物；意在于仁民爱物，即仁民爱物便是一物；意在于视听言动，即视听言动便是一物。所以某说无心外之理，无心外之物。《中庸》言『不诚无物』，《大学》『明明德』之功，只是个诚意，诚意之功，只是个格物。」","bh":"我问：「昨天听了先生『止于至善』的教导，已经觉得功夫有了着力点，但和朱子对『格物』的解释，想来想去总对不上。」先生说：「格物是达到至善的功夫，既然懂了至善，也就懂了格物。」我说：「昨天用先生的教导去推演格物的学说，好像也看到了个大概。但朱子的解释，在《尚书》的『精一』、《论语》的『博约』、《孟子》的『尽心知性』上都有证据，所以我还是不能释怀。」先生说：「子夏笃信圣人，曾子反过来向自己内心求。笃信固然也对，但不如反求自己来得切实。现在你心里既然想不通，怎么能拘泥于旧说，而不去求个恰当呢？就连朱子也尊信程子，但在他心里想不通的地方，又何尝随便盲从？『精一』『博约』『尽心』，本来就和我的说法吻合，只是你没去想罢了。朱子对格物的解释，难免牵强附会，不是《大学》的本意。『精』是『一』的功夫，『博』是『约』的功夫，你既然已经明白知行合一的说法，这一点一句话就能懂。『尽心、知性、知天』是天生就懂、自然而然去做的圣人境界；『存心、养性、事天』是通过学习而懂、因看到好处而去做的贤人境界；『不管短命长寿都不改变心志，修养自身以等待天命』，是经过困苦才懂、勉强自己去做的初学者境界。朱子错解格物，只因为把这个次序看反了，把『尽心知性』当成『物格知至』，要初学者一上来就去做圣人才能做的事，怎么做得到？」我问：「『尽心知性』为什么是生知安行？」先生说：「性是心的本体，天是性的本原，尽心就是尽性。《中庸》说『只有天下最真诚的人才能完全发挥他的本性』，才能『了解天地化育万物的道理』。说『存心』，是因为心还没有完全发挥。『知天』的『知』，就像知州、知县的『知』（主管），是自己分内的事，自己和天已经合一了；『事天』就像儿子侍奉父亲、臣子侍奉君主，必须恭恭敬敬地奉承，才能不出差错，这时自己和天还是两个，这就是圣人和贤人的区别。至于『不管短命长寿都不改变心志』，是教导学者一心向善，不能因为穷困显达、短命长寿的缘故，就动摇向善的心，只管修养自身来等待天命，明白穷通寿夭自有命数，自己不必因此动心。『事天』虽然自己和天是两个，但已经看见天就在面前；『俟命』则是还没见到面，在这里等候的样子。这是初学者立定心志的开始，带有困知勉行的意味。现在朱子却倒过来做，所以让学者无从下手。」我说：「昨天听先生的教导，也隐约觉得功夫应该是这样。今天听了这番话，更加没有疑问了。我昨天早上想到，『格物』的『物』就是『事』，都是从心上说的。」先生说：「对。身体的主宰是心，心所发动的是意，意的本体是知，意所指向的是物。比如意念在侍奉父母上，侍奉父母就是一物；意念在侍奉君主上，侍奉君主就是一物；意念在仁爱百姓、爱惜万物上，仁民爱物就是一物；意念在看听说动上，看听说动就是一物。所以我说没有心外之理，没有心外之物。《中庸》说『不真诚就没有物』，《大学》『明明德』的功夫只是诚意，诚意的功夫只是格物。」","zs":[["子夏笃信、曾子反求","这是朱熹自己对两人学风的概括。阳明借来说明：与其盲信权威，不如反求诸己。"],["狃于旧闻","拘泥于过去听到的说法。"],["曰仁","徐爱的字。"],["生知安行、学知利行、困知勉行","出自《中庸》，指三种人：生来就懂、安然去做；学了才懂、因有好处去做；困惑后才懂、勉强去做。阳明把孟子的三句话分别对应这三层。"],["物格知至","《大学》「物格而后知至」。朱子把「尽心知性」解释成格物致知后达到的境界，阳明认为这是把最高境界当成入门功夫。"],["心、意、知、物","这是阳明的四个核心概念：身之主宰是心，心之所发是意，意之本体是知（良知），意之所在是物。所以「物」不是外在客观对象，而是意念所涉及的事。"]],"gl":[5,7,8],"q":"阳明说的「物」和我们今天说的「物体」一样吗？","a":"不一样。阳明的「物」是「意之所在」，也就是意念指向的那件事，比如事亲、事君。所以格物就是在念头所在的事上把不正的扳正。","yong":"把今天要做的三件事写下来，每件事后面写：我做这件事时的「意」是什么？那个「意」就是你要格的「物」。","rec":"徐爱录","kj":[["r","礜宋","与朱","用力处但"],["r","茍","苟","处亦何尝"],["r","二","一","己与天为"],["r","贀","贤","此便是圣"],["r","敢","教","其心乃是"]]},{"n":7,"t":"格者，正也","yw":"先生又曰：「『格物』如《孟子》『大人格君心』之『格』，是去其心之不正，以全其本体之正。但意念所在，即要去其不正，以全其正，即无时无处不是存天理，即是穷理。天理即是明德，穷理即是明明德。」","bh":"先生又说：「『格物』的『格』，就像《孟子》『大人能纠正君主的错误思想』中的『格』，意思是去掉心中不正的东西，来保全本体的端正。只要是意念所在之处，就要去掉不正，保全其正，这样就无时无刻、无处不在保存天理，这就是穷理。天理就是明德，穷理就是明明德。」","zs":[["大人格君心","《孟子·离娄上》：「惟大人为能格君心之非。」格，纠正。"],["格物新解","朱子训「格」为「至」，格物是「即物而穷其理」；阳明训「格」为「正」，格物是「正其不正以归于正」。这是两家分歧的关键。"]],"gl":[6,8,317],"q":"阳明的「格」字是什么意思？和朱子有何不同？","a":"阳明训「格」为「正」，即纠正意念的不正；朱子训「格」为「至」，即到事物上去穷究道理。","yong":"今天发现自己一个歪念头（比如想推卸责任），当场把它扳回来，这就是一次格物。","rec":"徐爱录","kj":[["r","埋","理","是明德穷"]]},{"n":8,"t":"良知：见孺子入井","yw":"又曰：「知是心之本体，心自然会知：见父自然知孝，见兄自然知弟，见孺子入井自然知恻隐，此便是良知，不假外求。若良知之发，更无私意障碍，即所谓『充其恻隐之心，而仁不可胜用矣』。然在常人不能无私意障碍，所以须用致知格物之功，胜私复理。即心之良知更无障碍，得以充塞流行，便是致其知。知致则意诚。」","bh":"先生又说：「知是心的本体，心自然就会知：见到父亲自然知道孝，见到兄长自然知道敬，见到小孩要掉进井里自然生出同情心，这就是良知，不需要向外寻求。如果良知发动出来，没有私意阻碍，就是孟子说的『把恻隐之心扩充开来，仁就用之不尽了』。但普通人不可能没有私意阻碍，所以必须用致知格物的功夫，战胜私欲，恢复天理。这样心的良知就不再有障碍，能够充满流行，这就是致知。知达到了，意也就真诚了。」","zs":[["良知","出自《孟子·尽心上》：「人之所不虑而知者，其良知也。」不用思虑就能知道的，就是良知。阳明晚年以「致良知」为学说宗旨。"],["孺子入井","《孟子·公孙丑上》：「今人乍见孺子将入于井，皆有怵惕恻隐之心。」"],["致知","阳明解为「致良知」，即把良知推到实际事物中去，让它不受遮蔽地发挥作用。"]],"gl":[3,6,7],"q":"既然人人都有良知，为什么还要下功夫？","a":"因为普通人有私意障碍，良知被遮住了。功夫不是去外面找良知，而是去掉障碍，让良知充分流行。","yong":"遇到一件事，第一反应往往是良知，第二反应才开始算计。下次留意那个「第一反应」。","rec":"徐爱录","kj":[]},{"n":9,"t":"博文就是约礼","yw":"爱问：「先生以『博文』为『约礼』功夫，深思之未能得，略请开示。」先生曰：「『礼』字即是『理』字。理之发见可见者谓之文，文之隐微不可见者谓之理，只是一物。约礼只是要此心纯是一个天理，要此心纯是天理，须就理之发见处用功。如发见于事亲时，就在事亲上学存此天理；发见于事君时，就在事君上学存此天理；发见于处富贵贫贱时，就在处富贵贫贱上学存此天理；发见于处患难夷狄时，就在处患难夷狄上学存此天理。至于作止语默，无处不然，随他发见处，即就那上面学个存天理。这便是博学之于文，便是约礼的功夫。博文即是惟精，约礼即是惟一。」","bh":"我问：「先生把『博文』当作『约礼』的功夫，我深思后还是没想通，请您稍加开导。」先生说：「『礼』字就是『理』字。理表现出来、能看得见的叫作文；文中隐微、看不见的叫作理，二者只是一个东西。约礼只是要这颗心纯是一个天理，要这颗心纯是天理，就必须在理表现出来的地方下功夫。比如理表现在侍奉父母时，就在侍奉父母上学习保存天理；表现在侍奉君主时，就在侍奉君主上学习保存天理；表现在身处富贵贫贱时，就在处富贵贫贱上学习保存天理；表现在身处患难、身居边远时，就在处患难夷狄上学习保存天理。甚至一举一动、说话沉默，无处不是这样，理在哪里表现出来，就在哪里学着保存天理。这就是广泛地学习于文，也就是约礼的功夫。博文就是惟精，约礼就是惟一。」","zs":[["博文约礼","《论语·雍也》：「君子博学于文，约之以礼。」朱子理解为先广泛学习，再用礼来约束，是两步；阳明认为博文就是约礼的功夫，是一件事。"],["发见","同「发现」，显现出来。"],["处患难夷狄","《中庸》：「素患难，行乎患难；素夷狄，行乎夷狄。」"]],"gl":[4,5,10],"q":"博文和约礼是先后两步吗？","a":"不是。在每件事上学存天理，既是博文（广泛），又是约礼（归于一个天理），是同一个功夫的两面。","yong":"你今天处理的每件杂事——回邮件、改报价、跟供应商扯皮——都是「博文」的现场。","rec":"徐爱录","kj":[["r","贝","见","隐微不可"],["r","贝","见","此天理发"],["r","看","君","时就在事"],["r","贝","见","此天理发"]]},{"n":10,"t":"只有一个心","yw":"爱问：「『道心常为一身之主，而人心每听命』，以先生精一之训推之，此语似有弊。」先生曰：「然。心一也，未杂于人谓之道心，杂以人伪谓之人心。人心之得其正者即道心，道心之失其正者即人心，初非有二心也。程子谓『人心即人欲，道心即天理』，语若分析，而意实得之。今曰『道心为主，而人心听命』，是二心也。天理人欲不并立，安有天理为主，人欲又从而听命者？」","bh":"我问：「朱子说『道心常常做一身的主宰，人心总是听从它的命令』，用先生精一的教导来推论，这话好像有毛病。」先生说：「是的。心只有一个，没有掺杂人为私欲的叫道心，掺杂了人为虚伪的叫人心。人心得其正就是道心，道心失其正就是人心，本来就不是有两个心。程子说『人心就是人欲，道心就是天理』，话虽然分开说了，意思其实是对的。现在说『道心做主，人心听命』，就成了两个心了。天理和人欲不能同时并存，哪有天理做主、人欲又跟着听命的道理？」","zs":[["道心、人心","出自《尚书·大禹谟》「人心惟危，道心惟微，惟精惟一，允执厥中」，即宋儒所谓「十六字心传」。朱熹《中庸章句序》说「必使道心常为一身之主，而人心每听命焉」。"],["人伪","人为的造作。"]],"gl":[9,6],"q":"阳明为什么反对「道心为主，人心听命」？","a":"这样就假设了两个心同时存在，而心只有一个：纯正时是道心，被私欲杂入就是人心。天理人欲不能同时并立。","yong":"别跟自己说「我理智上想 A，情绪上想 B，让理智管住情绪」。那是两个心在打架，只能把杂念去掉，回到一个心。","rec":"徐爱录","kj":[["r","矢","失","心道心之"],["r","三","二","心初非有"],["r","生","主","曰道心为"],["r","三","二","心听命是"]]},{"n":11,"t":"删繁就简：文盛实衰","yw":"爱问文中子、韩退之。先生曰：「退之，文人之雄耳；文中子，贤儒也。后人徒以文词之故，推尊退之，其实退之去文中子远甚。」爱问：「何以有拟经之失？」先生曰：「拟经恐未可尽非。且说后世儒者著述之意，与拟经如何？」爱曰：「世儒著述，近名之意不无，然期以明道；拟经纯若为名。」先生曰：「著述以明道，亦何所效法？」曰：「孔子删述六经，以明道也。」先生曰：「然则拟经独非效法孔子乎？」爱曰：「著述即于道有所发明，拟经似徒拟其迹，恐于道无补。」先生曰：「子以明道者，使其反朴还淳而见诸行事之实乎？抑将美其言辞，而徒以譊譊于世也？天下之大乱，由虚文胜而实行衰也。使道明于天下，则六经不必述。删述六经，孔子不得已也。自伏羲画卦，至于文王、周公，其间言《易》如《连山》《归藏》之属，纷纷籍籍，不知其几，《易》道大乱。孔子以天下好文之风日盛，知其说之将无纪极，于是取文王、周公之说而赞之，以为惟此为得其宗，于是纷纷之说尽废，而天下之言《易》者始一。《书》《诗》《礼》《乐》《春秋》皆然。《书》自《典》《谟》以后，《诗》自《二南》以降，如《九丘》《八索》，一切淫哇逸荡之词，盖不知其几千百篇；《礼》《乐》之名物度数，至是亦不可胜穷。孔子皆删削而述正之，然后其说始废。如《书》《诗》《礼》《乐》中，孔子何尝加一语？今之《礼记》诸说，皆后儒附会而成，已非孔子之旧。至于《春秋》，虽称孔子作之，其实皆鲁史旧文，所谓『笔』者，笔其旧；所谓『削』者，削其繁，是有减无增。孔子述六经，惧繁文之乱天下，惟简之而不得，使天下务去其文以求其实，非以文教之也。春秋以后，繁文益盛，天下益乱。始皇焚书得罪，是出于私意，又不合焚六经。若当时志在明道，其诸反经叛理之说，悉取而焚之，亦正暗合删述之意。自秦汉以降，文又日盛，若欲尽去之，断不能去，只宜取法孔子，录其近是者而表章之，则其诸怪悖之说，亦宜渐渐自废。不知文中子当时拟经之意如何，某切深有取于其事，以为圣人复起，不能易也。天下所以不治，只因文盛实衰，人出己见，新奇相高，以眩俗取誉，徒以乱天下之聪明，涂天下之耳目，使天下靡然争务修饰文词，以求知于世，而不复知有敦本尚实、反朴还淳之行，是皆著述者有以启之。」爱曰：「著述亦有不可缺者，如《春秋》一经，若无《左传》，恐亦难晓。」先生曰：「《春秋》必待传而后明，是歇后谜语矣，圣人何苦为此艰深隐晦之词？《左传》多是鲁史旧文，若《春秋》须此而后明，孔子何必削之？」爱曰：「伊川亦云『传是案，经是断』，如书『弑某君』『伐某国』，若不明其事，恐亦难断。」先生曰：「伊川此言，恐亦是相沿世儒之说，未得圣人作经之意。如书『弑君』，即弑君便是罪，何必更问其弑君之详？征伐当自天子出，书『伐国』，即伐国便是罪，何必更问其伐国之详？圣人述六经，只是要正人心，只是要存天理、去人欲。于存天理、去人欲之事，则尝言之；或因人请问，各随分量而说，亦不肯多道，恐人专求之言语，故曰『予欲无言』。若是一切纵人欲、灭天理的事，又安肯详以示人？是长乱导奸也。故孟子云：『仲尼之门，无道桓、文之事者，是以后世无传焉。』此便是孔门家法。世儒只讲得一个伯者的学问，所以要知得许多阴谋诡计，纯是一片功利的心，与圣人作经的意思正相反，如何思量得通？」因叹曰：「此非达天德者，未易与言此也！」又曰：「孔子云：『吾犹及史之阙文也。』孟子云：『尽信书，不如无书，吾于《武成》取二三策而已。』孔子删《书》，于唐、虞、夏四五百年间，不过数篇，岂更无一事，而所述止此？圣人之意可知矣。圣人只是要删去繁文，后儒却只要添上。」爱曰：「圣人作经，只是要去人欲、存天理，如五伯以下事，圣人不欲详以示人，则诚然矣。至如尧、舜以前事，如何略不少见？」先生曰：「羲、黄之世，其事阔疏，传之者鲜矣。此亦可以想见其时全是淳庞朴素，略无文采的气象，此便是太古之治，非后世可及。」爱曰：「如《三坟》之类，亦有传者，孔子何以删之？」先生曰：「纵有传者，亦于世变渐非所宜。风气益开，文采日胜，至于周末，虽欲变以夏、商之俗，已不可挽，况唐、虞乎？又况羲、黄之世乎？然其治不同，其道则一。孔子于尧、舜则祖述之，于文、武则宪章之。文、武之法，即是尧、舜之道，但因时致治，其设施政令已自不同，即夏、商事业施之于周，已有不合，故周公思兼三王，其有不合，仰而思之，夜以继日。况太古之治，岂复能行？斯固圣人之所可略也。」又曰：「专事无为，不能如三王之因时致治，而必欲行以太古之俗，即是佛、老的学术；因时致治，不能如三王之一本于道，而以功利之心行之，即是伯者以下事业。后世儒者许多讲来讲去，只是讲得个伯术。」","bh":"（本条较长，这里按段意译）\n\n【文中子与韩愈】我问文中子（王通）和韩愈谁高。先生说：「韩愈只是文人中的佼佼者，文中子才是贤能的儒者。后人只因文章的缘故推崇韩愈，其实韩愈比文中子差得远。」\n\n【模仿经书错在哪？】我问：「文中子模仿经书写书，错在哪里？」先生说：「模仿经书恐怕不能全盘否定。你先说说，后世儒者著书立说的用意，和模仿经书相比怎么样？」我说：「世儒著述，不免有求名之心，但目的是阐明道理；模仿经书则纯粹是为了名。」先生说：「著述来阐明道理，是效法谁呢？」我说：「孔子删定、整理六经，就是为了阐明道理。」先生说：「那么模仿经书难道不也是效法孔子吗？」我说：「著述对道理有所发挥，模仿经书只是模仿外在形式，恐怕对道理没有帮助。」\n\n【虚文胜而实行衰】先生说：「你说的阐明道理，是要让人回归淳朴，落实到实际行动中呢？还是要把言辞修饰得漂亮，只在世上吵吵嚷嚷？天下大乱，是因为浮华的文辞占了上风，而实际的行动衰落了。如果道在天下明白了，六经根本不必去整理。孔子删述六经，是不得已的。从伏羲画八卦到文王、周公，中间讲《易》的，像《连山》《归藏》之类，纷纷杂杂，不知道有多少，《易》道大乱。孔子看到天下喜好文辞的风气越来越盛，知道这些说法将漫无边际，于是选取文王、周公的说法加以阐发，认为只有这个抓住了根本，于是那些纷乱的说法都废弃了，天下讲《易》的才统一起来。《书》《诗》《礼》《乐》《春秋》都是这样。孔子都是删削而加以整理纠正，那些杂说才被废弃。在《书》《诗》《礼》《乐》中，孔子何曾添加过一句话？现在的《礼记》各篇，都是后儒附会而成，已经不是孔子的原样了。至于《春秋》，虽说是孔子作的，其实都是鲁国史书的旧文，所谓『笔』，是照录旧文；所谓『削』，是删去繁冗，只有减少没有增加。孔子整理六经，是怕繁琐的文辞扰乱天下，只想简化还嫌不够，是要让天下人努力去掉浮文、追求实质，而不是用文辞去教化人。」\n\n【秦始皇焚书】「春秋以后，浮文越来越盛，天下越来越乱。秦始皇焚书有罪，是因为出于私心，又不该烧六经。如果他当时志在阐明道理，把那些违背经典、背离天理的说法都拿来烧掉，倒正好暗合孔子删述的用意。秦汉以后，文辞又日渐繁盛，想全部去掉，绝对做不到，只应效法孔子，选录那些接近正道的加以表彰，那些怪诞悖理的说法自然会慢慢被淘汰。我不知道文中子当时模仿经书的用意如何，但我非常认同他这件事，认为圣人复生也不会改变。天下之所以治理不好，只因为文辞繁盛而实行衰落，人人各出己见，以新奇相标榜，用来迷惑世俗、博取名声，只是扰乱天下人的聪明，涂塞天下人的耳目，让天下人纷纷争着修饰文辞，求得世人赏识，而不再知道有敦厚根本、崇尚实际、返璞归真的行为。这都是著书立说的人引起的。」\n\n【《春秋》要靠《左传》吗】我说：「著述也有不可缺少的，比如《春秋》，如果没有《左传》，恐怕也难懂。」先生说：「如果《春秋》一定要靠传才能懂，那就成了歇后语、谜语了，圣人何苦写这种艰深隐晦的文字？《左传》多是鲁史旧文，如果《春秋》需要它才能明白，孔子何必删掉？」我说：「程伊川也说『传是案卷，经是判决』，比如写『某人杀了某君』『某国攻打某国』，如果不清楚事情经过，恐怕也难判断。」先生说：「伊川这话，恐怕也是沿袭世俗儒者的说法，没领会圣人作经的用意。比如写『弑君』，弑君本身就是罪，何必还要追问弑君的细节？征伐应当由天子发出，写『伐国』，伐国本身就是罪，何必再问伐国的详情？圣人整理六经，只是要端正人心，只是要存天理、去人欲。对于存天理、去人欲的事，倒是常讲；有时因人请教，根据对方的程度来讲，也不肯多说，怕人只在言语上求，所以孔子说『我想不说话了』。至于那些放纵人欲、灭绝天理的事，又怎么肯详细告诉人呢？那是助长祸乱、引导奸邪。所以孟子说：『孔子的门徒，没有人谈论齐桓公、晋文公的事，因此后世没有流传。』这就是孔门的家法。世俗儒者只讲得一套霸道的学问，所以要了解许多阴谋诡计，满心都是功利，和圣人作经的用意正相反，怎么想得通？」于是叹道：「不是通达天德的人，很难和他讲这个道理啊！」\n\n【圣人删，后儒添】先生又说：「孔子说：『我还能看到史书中有空缺的地方。』孟子说：『完全相信《书》，不如没有《书》，我对《武成》篇只取两三片竹简罢了。』孔子删《尚书》，唐、虞、夏四五百年间只留几篇，难道这期间再没别的事了吗？圣人的用意可想而知。圣人只是要删去繁文，后儒却只想往上添。」\n\n【太古之治】我说：「圣人作经只为去人欲、存天理，像春秋五霸以后的事，圣人不想详细告诉人，这确实是对的。但尧舜以前的事，为什么几乎看不到？」先生说：「伏羲、黄帝时代，事情简略疏阔，流传下来的很少。从这也能想见那时完全是淳厚朴素、没有文采修饰的气象，这就是太古之治，后世比不上。」我说：「像《三坟》之类的书，也有流传的，孔子为什么删掉？」先生说：「即使有流传的，也随着世道变化逐渐不合时宜了。风气越来越开放，文采越来越盛，到了周朝末年，即使想变回夏、商的风俗，都已经挽回不了，何况唐虞？更何况羲黄时代？不过各个时代治理方式不同，背后的道却是一个。孔子对尧舜是继承发扬，对文王、武王是效法遵循。文王、武王的法度，就是尧舜之道，只是根据时代来治理，所以设施政令已经不同。即使是夏商的做法用到周朝，都已有不合之处，所以周公想兼取三代圣王的长处，遇到不合的地方，就仰头思考，夜以继日。何况太古的治理，哪还能实行？这本来就是圣人可以略去的。」先生又说：「一味讲无为，不能像三王那样根据时代来治理，而一定要用太古的风俗来推行，就是佛家和道家的学问；根据时代来治理，却不能像三王那样以道为根本，而是用功利之心去做，就是霸道以下的事业。后世儒者讲来讲去，讲的只是一套霸术。」","zs":[["文中子","隋代儒者王通，谥号文中子。他仿照六经著有《续六经》（已佚）和《中说》，被后人批评「拟经」僭越。"],["韩退之","唐代文学家韩愈，字退之，「唐宋八大家」之首。"],["譊譊","争辩吵嚷的样子。"],["《连山》《归藏》","传说中夏、商两代的《易》，与《周易》并称「三易」。"],["《九丘》《八索》","传说中的上古典籍，早已亡佚。"],["传是案，经是断","程颐的话，意思是《左传》记载事实如同案卷，《春秋》经文如同判决书。"],["桓文之事","齐桓公、晋文公称霸之事。出自《孟子·梁惠王上》。"],["伯者","即「霸者」。伯，通「霸」。"],["《三坟》","传说中伏羲、神农、黄帝之书。"]],"gl":[12,13,14],"q":"阳明为什么说天下大乱是因为「虚文胜而实行衰」？","a":"人们争相修饰文辞、标新立异来博取名声，而不去敦本尚实、身体力行。文字越多，离实行越远。","yong":"检查你的网站和产品资料：是在用漂亮词堆砌，还是在说客户真正需要的实情？删掉一半形容词试试。","con":"反方：阳明称赞秦始皇焚书「暗合删述之意」（只要焚的是邪说），这种思路容易为思想审查背书——由谁来判定什么是「反经叛理之说」？清代考据学者也批评阳明轻视文献与历史细节，导致「束书不观，游谈无根」的学风。","rec":"徐爱录","kj":[["i","","贤","耳文中子"],["r","矢","失","有拟经之"],["r","劾","效","道亦何所"],["r","迦","述","曰孔子删"],["r","仆","朴","者使其反"],["r","贝","见","仆还淳而"],["r","义昼","羲画","已也自伏"],["r","怞","怪","之则其诸"],["r","入","人","文盛实衰"],["r","仆","朴","本尚实反"],["r","弒","弑","是断如书"],["r","伄","伊","断先生曰"],["r","弒","弑","之意如书"],["r","弒","弑","书弒君即"],["r","弒","弑","必更问其"],["r","郄","却","繁文后儒"],["r","义","羲","见先生曰"],["r","觲","鲜","疏传之者"],["r","仆","朴","全是淳庞"],["r","义","羲","虞乎又况"],["r","二","一","同其道则"],["r","峈","略","人之所可"]]},{"n":12,"t":"三代之治在本不在末","yw":"又曰：「唐、虞以上之治，后世不可复也，略之可也；三代以下之治，后世不可法也，削之可也；惟三代之治可行。然而世之论三代者，不明其本而徒事其末，则亦不可复矣。」","bh":"先生又说：「唐尧、虞舜以前的治理，后世无法恢复，可以略去不谈；夏商周三代以后的治理，后世不值得效法，可以删去不提；只有三代的治理可以实行。但世上谈论三代的人，不明白它的根本，只在枝节上下功夫，那也就无法恢复了。」","zs":[["三代","夏、商、周三个朝代，儒家心目中的理想治世。"],["本、末","本指以道为本、正人心；末指具体的制度、礼仪形式。"]],"gl":[11,13],"q":"学习三代之治，要学什么？","a":"学它的根本（以道治国、正人心），而不是照搬具体制度形式。","yong":"学同行的成功案例，别光抄他的页面布局和话术，要看他背后是怎么理解客户的。","rec":"徐爱录","kj":[]},{"n":13,"t":"五经亦史","yw":"爱曰：「先儒论六经，以《春秋》为史。史专记事，恐与五经事体终或稍异。」先生曰：「以事言谓之史，以道言谓之经。事即道，道即事。《春秋》亦经，五经亦史。《易》是包牺氏之史，《书》是尧、舜以下史，《礼》《乐》是三代史。其事同，其道同，安有所谓异？」","bh":"我说：「前代儒者讨论六经，把《春秋》看作史书。史书专门记事，恐怕和其他五经的性质终究有些不同。」先生说：「从记事的角度说叫史，从载道的角度说叫经。事就是道，道就是事。《春秋》也是经，五经也是史。《易》是伏羲氏的史，《书》是尧舜以来的史，《礼》《乐》是夏商周三代的史。它们记的事同样，载的道也同样，哪有什么不同？」","zs":[["包牺氏","即伏羲。"],["五经亦史","这一观点后来被清代章学诚发展为著名的「六经皆史」说。"]],"gl":[11,14],"q":"「事即道，道即事」是什么意思？","a":"道不脱离具体的事而存在，事中就有道。所以经和史只是看的角度不同。","yong":"别把「理论学习」和「实际干活」分成两件事，干活就是在学道。","rec":"徐爱录","kj":[["i","","以","书是尧舜"]]},{"n":14,"t":"存迹示法，削事杜奸","yw":"又曰：「五经亦只是史，史以明善恶、示训戒。善可为训者，特存其迹以示法；恶可为戒者，存其戒而削其事以杜奸。」爱曰：「存其迹以示法，亦是存天理之本然；削其事以杜奸，亦是遏人欲于将萌否？」先生曰：「圣人作经，固无非是此意，然又不必泥着文句。」爱又问：「恶可为戒者，存其戒而削其事以杜奸，何独于《诗》而不删郑、卫？先儒谓『恶者可以惩创人之逸志』，然否？」先生曰：「《诗》非孔门之旧本矣。孔子云：『放郑声，郑声淫。』又曰：『恶郑声之乱雅乐也。』『郑、卫之音，亡国之音也。』此是孔门家法。孔子所定三百篇，皆所谓雅乐，皆可奏之郊庙，奏之乡党，皆所以宣畅和平，涵泳德性，移风易俗，安得有此？是长淫导奸矣。此必秦火之后，世儒附会，以足三百篇之数。盖淫泆之词，世俗多所喜传，如今闾巷皆然。『恶者可以惩创人之逸志』，是求其说而不得，从而为之辞。」","bh":"先生又说：「五经也只是史，史是用来辨明善恶、给人训诫的。好的可以作为榜样的，就特别保存它的事迹来示范；坏的可以作为警戒的，就保存警戒之意而删去具体事情，以防止奸邪被效仿。」我说：「保存事迹来示范，也就是保存天理的本来面目；删去事情来防止奸邪，也就是在人欲刚萌芽时就遏制它吧？」先生说：「圣人作经，当然都是这个用意，但也不必拘泥于字句。」我又问：「坏的可以作为警戒的，保存警戒而删去事情来防止奸邪，为什么唯独《诗经》不删掉郑国、卫国的诗？朱子说『坏的诗可以惩戒人放纵的心志』，对吗？」先生说：「现在的《诗经》已经不是孔门的原本了。孔子说：『要废弃郑国的音乐，郑国的音乐淫荡。』又说：『我厌恶郑声扰乱雅乐。』『郑卫之音，是亡国之音。』这就是孔门的家法。孔子编定的三百篇，都是所谓雅乐，都可以在祭祀天地祖先的场合演奏，在乡里演奏，都是用来抒发平和之气、涵养德性、移风易俗的，怎么会有这种诗？那是助长淫乱、引导奸邪。这一定是秦朝焚书之后，世俗儒者附会进去，用来凑足三百篇的数目。大概淫荡的诗句，世俗之人大多喜欢传唱，现在街头巷尾也都这样。『坏的诗可以惩戒人放纵的心志』，是想解释却解释不通，于是硬找了个说法。」","zs":[["郑卫","郑国和卫国的诗歌，即《诗经》中的《郑风》《卫风》等，旧说多情诗。"],["惩创人之逸志","朱熹《诗集传序》中的话，意思是恶诗可以让人引以为戒。"],["郊庙、乡党","郊庙是祭天、祭祖的场所；乡党是乡里。"],["秦火","秦始皇焚书。"]],"gl":[11,13],"q":"阳明怎么解释《诗经》里有「郑卫之音」？","a":"他认为那不是孔子原本的内容，是秦火之后世儒附会补进去凑数的。","con":"反方：这一判断缺乏文献证据，是用「孔子不会收录淫诗」的义理去倒推文本，属于以理改经。现代学者普遍认为郑卫诗本就是《诗经》原有的民间情歌，朱熹的「淫诗说」反而比阳明更忠实于文本。这是阳明「六经注我」式读经的局限。","rec":"徐爱录","kj":[["r","叨","明","是史史以"],["r","时","特","可为训者"],["r","逃","迹","者时存其"],["r","资","宣","党皆所以"],["r","拯偲","泳德","畅和平涵"],["r","萹","篇","以足三百"]]},{"n":15,"t":"主一是专主天理","yw":"陆澄问：「主一之功，如读书则一心在读书上，接客则一心在接客上，可以为主一乎？」先生曰：「好色则一心在好色上，好货则一心在好货上，可以为主一乎？是所谓逐物，非主一也。主一是专主一个天理。」","bh":"陆澄问：「『主一』的功夫，比如读书就一心在读书上，接待客人就一心在接待客人上，这能算主一吗？」先生说：「好色就一心在美色上，贪财就一心在财货上，这能算主一吗？这叫追逐外物，不是主一。主一是专心守住一个天理。」","zs":[["陆澄","字原静，浙江湖州人，阳明重要弟子。上卷第15至94条为他所记。"],["主一","程颐提出的修养方法：「主一之谓敬，无适之谓一」，即心专注于一处，不散乱。"],["逐物","心被外物牵着走。"]],"gl":[16,25],"q":"一心一意做事就是「主一」吗？","a":"不一定。一心一意去贪财好色也是专注，但那是逐物。主一是专主天理，做什么事时心都守着天理。","yong":"「专注」本身不是美德，专注于什么才重要。今天你最专注的那件事，背后的念头正吗？","rec":"陆澄录","kj":[["i","","一","可以为主"],["r","遂","逐","乎是所谓"]]},{"n":16,"t":"立志：念念存天理","yw":"问立志。先生曰：「只念念要存天理，即是立志。能不忘乎此，久则自然心中凝聚，犹道家所谓结圣胎也。此天理之念常存，驯至于美、大、圣、神，亦只从此一念存养扩充去耳。」","bh":"陆澄问怎样立志。先生说：「只要每个念头都想着保存天理，就是立志。能一直不忘这一点，时间久了心中自然凝聚，就像道家说的『结圣胎』。这个存天理的念头常常保持，逐渐达到美、大、圣、神的境界，也只是从这一念上存养扩充出去罢了。」","zs":[["结圣胎","道家内丹术语，指修炼中精气神凝结成丹。阳明借用来比喻心志凝聚。"],["美大圣神","《孟子·尽心下》：「充实之谓美，充实而有光辉之谓大，大而化之之谓圣，圣而不可知之之谓神。」"],["驯至","逐渐达到。"]],"gl":[15,30,118],"q":"阳明的「立志」是立一个目标吗？","a":"不是立外在目标，而是念念存天理。这个念头常存，自然凝聚、扩充。","yong":"你的「志」如果只是「年入百万」，那是欲望不是志。再往下挖一层：你想成为什么样的人？","rec":"陆澄录","kj":[["r","冢","家","凝聚犹道"]]},{"n":17,"t":"因病而药","yw":"日间工夫觉纷扰，则静坐；觉懒看书，则且看书。是亦因病而药。","bh":"白天做功夫觉得心里纷乱，就静坐；觉得懒得看书，就偏要去看书。这也是对症下药。","zs":[["因病而药","根据病症开药。阳明教法强调针对具体毛病，没有万能方。"]],"gl":[39,23],"q":"阳明为什么有时教静坐、有时教看书？","a":"因病而药：心乱就静坐收心，心懒就看书提神，针对当下的毛病。","yong":"脑子乱的时候别硬写方案，先停五分钟；懒得动的时候别等状态，先打开文件。","rec":"陆澄录","kj":[]},{"n":18,"t":"相下则益","yw":"处朋友，务相下则得益，相上则损。","bh":"和朋友相处，互相谦让、甘居其下，就能得到益处；互相争强、想压过对方，就会受损。","zs":[["相下","互相谦让，把自己放低。"]],"gl":[19],"q":"「相上则损」损在哪里？","a":"争着压过对方，就听不进对方的长处，双方都得不到进益，关系也受损。","yong":"和同行交流时，少证明自己懂得多，多问一句「你是怎么做到的」。","rec":"陆澄录","kj":[]},{"n":19,"t":"好名之病：大树遮了庄稼","yw":"孟源有自是好名之病，先生屡责之。一日警责方已，一友自陈日来工夫请正，源从傍曰：「此方是寻着源旧时家当。」先生曰：「尔病又发。」源色变，议拟欲有所辨。先生曰：「尔病又发。」因喻之曰：「此是汝一生大病根。譬如方丈地内种此一大树，雨露之滋，土脉之力，只滋养得这个大根。四傍纵要种些嘉谷，上面被此树叶遮覆，下面被此树根盘结，如何生长得成？须用伐去此树，纤根勿留，方可种植嘉种。不然，任汝耕耘培壅，只是滋养得此根。」","bh":"孟源有自以为是、喜好名声的毛病，先生多次批评他。有一天刚批评完，一位朋友讲述自己近来的功夫，请先生指正，孟源在旁边说：「这才算找到了我以前的家底。」先生说：「你的病又犯了。」孟源脸色一变，正想辩解。先生又说：「你的病又犯了。」于是给他打比方说：「这是你一生最大的病根。就像一丈见方的地里种了一棵大树，雨露的滋润、土地的养分，都只养了这棵大树的根。四周即使想种些好庄稼，上面被树叶遮住，下面被树根盘住，怎么长得成？必须把这棵树砍掉，连细根都不留，才能种好庄稼。不然，任凭你怎么耕耘培土，也只是在滋养这棵树的根。」","zs":[["孟源","字伯生，安徽滁州人，阳明弟子。"],["家当","家产、家底。孟源的意思是：这位朋友说的，正是我早就有的东西。"],["培壅","给植物根部培土。"]],"gl":[18,98,119],"q":"阳明为什么连说两遍「尔病又发」？","a":"孟源一插话就是显示自己早已懂了（好名），被指出后又想辩解（自是），两次都是病发。","yong":"下次被人指出问题，注意你第一反应是不是「我早知道了」或者「不是这样的」。那棵大树就在那。","con":"反方：当众连续点名批评弟子，这种教法在今天看来有羞辱之嫌，未必人人受得住。为阳明辩护的一面是：语录记载孟源事后确有转变，而且这种「当头棒喝」只用于他认为病根深重的人。","rec":"陆澄录","kj":[["r","曰","一日","生屡责之"],["i","","一","警责方已"],["r","诗","请","日来工夫"],["r","胍","脉","露之滋土"],["r","榖","谷","要种些嘉"],["r","力","方","纤根勿留"]]},{"n":20,"t":"著书如画像","yw":"问：「后世著述之多，恐亦有乱正学。」先生曰：「人心天理浑然，圣贤笔之书，如写真传神，不过示人以形状大略，使之因此而讨求其真耳；其精神意气、言笑动止，固有所不能传也。后世著述，是又将圣人所画摹仿誊写，而妄自分析加增，以逞其技，其失真愈远矣。」","bh":"陆澄问：「后世著作这么多，恐怕也会扰乱正学吧？」先生说：「人心中的天理是浑然一体的，圣贤把它写成书，就像给人画像，不过是给人看个大致形状，让人借此去寻求真人罢了；那人的精神气质、言谈笑貌、举止动作，本来就是画不出来的。后世的著作，又把圣人画的像拿来临摹抄写，还自作主张地分析、增添，来炫耀技巧，那就离真相越来越远了。」","zs":[["写真传神","画肖像画，传达神韵。"],["誊写","照原样抄写。"]],"gl":[11,31],"q":"圣贤之书和天理的关系像什么？","a":"像画像和真人：书只能给出大略形状，真精神要靠自己去求。后人再临摹画像，就更失真了。","yong":"这本《传习录》本身也只是一张画像。读完一条，去自己的生活里找那个「真人」。","rec":"陆澄录","kj":[["r","昼","画","将圣人所"]]},{"n":21,"t":"圣人之心如明镜","yw":"问：「圣人应变不穷，莫亦是预先讲求否？」先生曰：「如何讲求得许多？圣人之心如明镜，只是一个明，则随感而应，无物不照。未有已往之形尚在，未照之形先具者。若后世所讲，却是如此，是以与圣人之学大背。周公制礼作乐以文天下，皆圣人所能为，尧、舜何不尽为之，而待于周公？孔子删述六经以诏万世，亦圣人所能为，周公何不先为之，而有待于孔子？是知圣人遇此时，方有此事。只怕镜不明，不怕物来不能照。讲求事变，亦是照时事，然学者却须先有个明的工夫。学者惟患此心之未能明，不患事变之不能尽。」曰：「然则所谓『冲漠无朕，而万象森然已具』者，其言何如？」曰：「是说本自好，只不善看，亦便有病痛。」","bh":"陆澄问：「圣人能应对无穷的变化，莫非也是预先研究好的？」先生说：「哪里研究得了那么多？圣人的心像一面明镜，只是一个明亮，所以有什么来就照出什么，没有照不到的。从没有过去照过的影像还留在镜里，也没有还没照的影像先存在镜里。后世学者所讲的，却正是这样（预先储备），所以和圣人之学大相违背。周公制定礼乐来教化天下，这是圣人都能做的，尧舜为什么不全都做了，而要等周公来做？孔子删述六经来教导万世，这也是圣人能做的，周公为什么不先做了，而要等孔子来做？由此可知，圣人遇到那个时代，才有那件事。只怕镜子不明亮，不怕东西来了照不出来。研究事情的变化，也是照的时候的事，但学者必须先有使心明亮的功夫。学者只应担心这颗心不够明，不必担心事变应付不完。」陆澄说：「那么程子说的『空寂无形迹，而万物之理已经森然具备』，这话怎么样？」先生说：「这话本来很好，只是不善于理解，也会出毛病。」","zs":[["明镜","阳明常用比喻：心本明，私欲如尘垢；去掉尘垢，镜子自然照物。"],["冲漠无朕，而万象森然已具","程颐语。冲漠，空虚寂静；无朕，没有征兆迹象。意为本体虽然空寂，万理已经全备。"],["诏","教导、告示。"]],"gl":[23,62,68],"q":"圣人为什么不用预先研究所有情况？","a":"因为心如明镜，只要镜子明，什么来都能照。要下的功夫是让心明，而不是预存所有答案。","yong":"与其背一百个客户异议的话术，不如让自己真懂产品、真在乎客户。镜子亮了，现场自然会答。","con":"反方：这个比喻低估了专业知识的作用。医生、工程师面对突发情况，靠的恰恰是预先大量学习的案例和规则，而不只是「心明」。阳明的回应是他并不排斥讲求（「讲求事变，亦是照时事」），只是要分清主次。","rec":"陆澄录","kj":[["r","邞","却","后世所讲"],["r","邞","却","事然学者"],["r","日","曰","之不能尽"],["r","仲","冲","然则所谓"],["r","日","曰","其言何如"]]},{"n":22,"t":"善无尽，恶无尽","yw":"「义理无定在，无穷尽。吾与子言，不可以少有所得，而遂谓止此也。再言之十年、二十年、五十年，未有止也。」他日又曰：「圣如尧、舜，然尧、舜之上善无尽；恶如桀、纣，然桀、纣之下恶无尽。使桀、纣未死，恶宁止此乎？使善有尽时，文王何以『望道而未之见』？」","bh":"先生说：「义理没有固定的处所，也没有穷尽。我和你们讲学，不能稍有所得，就认为到此为止了。再讲上十年、二十年、五十年，也没有尽头。」另一天又说：「圣明如尧舜，但尧舜之上，善还没有穷尽；凶恶如桀纣，但桀纣之下，恶也没有穷尽。假如桀纣没死，他们的恶难道就停在那里吗？假如善有尽头，文王为什么还说『望见了道却好像没看见一样』？」","zs":[["桀、纣","夏桀、商纣，古代暴君的代表。"],["望道而未之见","《孟子·离娄下》：「文王视民如伤，望道而未之见。」形容文王对道永不满足的追求。"]],"gl":[30,21],"q":"阳明说善无尽，对修养有什么提醒？","a":"不能稍有所得就自满。修养没有终点，圣人也在不断求进。","yong":"你觉得自己「已经很懂 SEO 了」的那一刻，就是开始退步的那一刻。","rec":"陆澄录","kj":[["r","籿","纣","桀纣然桀"]]},{"n":23,"t":"事上磨练（核心条）","yw":"问：「静时亦觉意思好，才遇事便不同，如何？」先生曰：「是徒知养静，而不用克己工夫也。如此，临事便要倾倒。人须在事上磨，方立得住，方能静亦定，动亦定。」","bh":"陆澄问：「安静的时候也觉得心境很好，一遇到事情就不一样了，怎么办？」先生说：「这是只知道修养静心，却不用克制私欲的功夫。这样一来，遇到事情就会站不稳。人必须在事情上磨练，才能站得住，才能做到安静时心定，行动时心也定。」","zs":[["克己","克制自己的私欲。出自《论语·颜渊》「克己复礼为仁」。"],["倾倒","站不稳，倒下。"],["静亦定，动亦定","出自程颢《定性书》：「所谓定者，动亦定，静亦定。」"]],"gl":[17,28,39,62],"q":"为什么静坐时心很平静，一遇事就乱？","a":"只在静中养出来的平静没有经过考验，私欲没有被真正克去。必须在事上磨练，才能动静皆定。","yong":"把今天最烦的那件事（难缠客户、拖款、扯皮）当成练功房，不是障碍。","con":"反方：现代正念训练恰恰证明，静态练习（如冥想）能迁移到动态情境中，提升情绪调节能力，「养静」并非无用。阳明本人早年也教静坐（见第39条），他反对的是「只」养静、把静当目的。","rec":"陆澄录","kj":[["r","已","己","而不用克"],["r","诤","静","得住方能"]]},{"n":24,"t":"上达只在下学里","yw":"问上达工夫。先生曰：「后儒教人，才涉精微，便谓『上达』未当学，且说『下学』，是分下学、上达为二也。夫目可得见，耳可得闻，口可得言，心可得思者，皆下学也；目不可得见，耳不可得闻，口不可得言，心不可得思者，上达也。如木之栽培灌溉，是下学也；至于日夜之所息，条达畅茂，乃是上达，人安能预其力哉？故凡可用功、可告语者，皆下学，上达只在下学里。凡圣人所说，虽极精微，俱是下学。学者只从下学里用功，自然上达去，不必别寻个上达的工夫。」","bh":"陆澄问通达高深境界的功夫。先生说：「后世儒者教人，一涉及精微的道理，就说那是『上达』，现在还不该学，先讲『下学』，这是把下学和上达分成了两截。凡是眼睛能看见、耳朵能听见、嘴巴能说出、心里能想到的，都是下学；眼睛看不见、耳朵听不见、嘴巴说不出、心里想不到的，才是上达。比如种树，栽培浇灌是下学；至于树木日夜生长、枝条舒展茂盛，那是上达，人哪能插手呢？所以凡是能下功夫、能用话告诉人的，都是下学，上达就在下学里面。凡是圣人所说的话，即使极其精微，也都是下学。学者只要在下学上用功，自然就上达了，不必另外去找上达的功夫。」","zs":[["下学上达","《论语·宪问》：「下学而上达，知我者其天乎！」下学指学习人事，上达指通达天理。"],["预","参与、干预。"]],"gl":[30,25],"q":"有没有专门修「上达」的功夫？","a":"没有。凡能用功的都是下学，上达是下学做足后自然达到的，就像树自己长高，人不能直接拔。","yong":"别总想找什么「顶层心法」「底层逻辑」的捷径。把今天的基本功做扎实，境界自己会来。","rec":"陆澄录","kj":[["r","纔","才","后儒教人"]]},{"n":25,"t":"惟精惟一：舂米的比喻","yw":"问：「『惟精惟一』，是如何用功？」先生曰：「『惟一』是『惟精』主意，『惟精』是『惟一』功夫，非『惟精』之外复有『惟一』也。『精』字从『米』，姑以米譬之：要得此米纯然洁白，便是『惟一』意；然非加舂簸筛拣『惟精』之工，则不能纯然洁白也。舂簸筛拣是『惟精』之功，然亦不过要此米到纯然洁白而已。博学、审问、慎思、明辨、笃行者，皆所以为『惟精』而求『惟一』也。他如『博文』者即『约礼』之功，『格物致知』者即『诚意』之功，『道问学』即『尊德性』之功，『明善』即『诚身』之功，无二说也。」","bh":"陆澄问：「『惟精惟一』该怎么用功？」先生说：「『惟一』是『惟精』的目的，『惟精』是『惟一』的功夫，不是在『惟精』之外还另有一个『惟一』。『精』字是米字旁，姑且用米来比喻：要让米纯净洁白，这就是『惟一』的意思；但不经过舂、簸、筛、拣这些『惟精』的工序，米就不能纯净洁白。舂簸筛拣是『惟精』的功夫，目的也不过是让米纯净洁白而已。广博地学习、详细地询问、谨慎地思考、明白地辨别、切实地实行，都是为了做『惟精』的功夫来求得『惟一』。其他如『博文』就是『约礼』的功夫，『格物致知』就是『诚意』的功夫，『道问学』就是『尊德性』的功夫，『明善』就是『诚身』的功夫，都没有两种说法。」","zs":[["惟精惟一","《尚书·大禹谟》「人心惟危，道心惟微，惟精惟一，允执厥中」。"],["舂簸筛拣","舂：用杵捣去谷壳；簸：用簸箕扬去糠皮；筛：用筛子过滤；拣：挑出杂质。"],["明善、诚身","《中庸》：「诚身有道，不明乎善，不诚乎身矣。」"]],"gl":[9,5,26],"q":"「惟精」和「惟一」是什么关系？","a":"惟一是目的（米纯白），惟精是功夫（舂簸筛拣）。功夫就是为了达到那个目的，二者是一件事。","yong":"把你的「目标」和「每天的动作」对一下：每个动作是不是都在舂这同一袋米？","rec":"陆澄录","kj":[]},{"n":26,"t":"知行不可分作两事","yw":"知者行之始，行者知之成。圣学只一个功夫，知行不可分作两事。","bh":"知是行的开始，行是知的完成。圣人的学问只有一个功夫，知和行不能分成两件事。","zs":[["本条","是第5条「知行合一」的浓缩版，适合背诵。"]],"gl":[5,25],"q":"背出这一条。","a":"知者行之始，行者知之成。圣学只一个功夫，知行不可分作两事。","yong":"写在便签上，贴在显示器边。","rec":"陆澄录","kj":[]},{"n":27,"t":"圣人许谁","yw":"漆雕开曰：「吾斯之未能信。」夫子说之。子路使子羔为费宰，子曰：「贼夫人之子！」曾点言志，夫子许之。圣人之意可见矣。","bh":"孔子让漆雕开去做官，漆雕开说：「我对这件事还没有信心。」孔子很高兴。子路让子羔去做费邑的长官，孔子说：「这是害了人家的孩子！」曾点谈自己的志向，孔子赞许他。圣人的用意由此可见。","zs":[["漆雕开","孔子弟子。事见《论语·公冶长》。"],["子羔","孔子弟子高柴，当时学业未成。事见《论语·先进》。"],["曾点言志","见《论语·先进》「侍坐」章，曾点说想在暮春时节和朋友去沂水沐浴、在舞雩台吹风、唱着歌回家。孔子说「吾与点也」。"]],"gl":[29],"q":"这三件事合起来说明了什么？","a":"圣人看重的是先把自己的学问根本做实，而不是急于出去做事求功名。","yong":"别急着把没准备好的人（包括你自己）推上岗位，那是「贼夫人之子」。","rec":"陆澄录","kj":[]},{"n":28,"t":"宁静不是未发之中","yw":"问：「宁静存心时，可为『未发之中』否？」先生曰：「今人存心，只定得气。当其宁静时，亦只是气宁静，不可以为『未发之中』。」曰：「未便是中，莫亦是求中功夫？」曰：「只要去人欲、存天理，方是功夫。静时念念去人欲、存天理，动时念念去人欲、存天理，不管宁静不宁静。若靠那宁静，不惟渐有喜静厌动之弊，中间许多病痛，只是潜伏在，终不能绝去，遇事依旧滋长。以循理为主，何尝不宁静？以宁静为主，未必能循理。」","bh":"陆澄问：「宁静存心的时候，可以算是『未发之中』吗？」先生说：「现在的人存心，只是把气稳定住了。他宁静的时候，也只是气宁静，不能当作『未发之中』。」陆澄说：「即使还不是中，难道不也是求中的功夫吗？」先生说：「只有去人欲、存天理才是功夫。静的时候念念去人欲、存天理，动的时候也念念去人欲、存天理，不管宁静不宁静。如果依靠那份宁静，不仅会渐渐有喜静厌动的毛病，而且心中许多病痛只是潜伏着，始终不能根除，遇到事情照样滋长。以遵循天理为主，何尝不宁静？以宁静为主，却未必能遵循天理。」","zs":[["未发之中","《中庸》：「喜怒哀乐之未发，谓之中；发而皆中节，谓之和。」指情感未发动时心的中正状态。"],["气","这里指情绪、生理层面的状态。气定只是表面平静，不等于心中无私欲。"]],"gl":[23,39,36],"q":"心情平静是不是就达到了「中」？","a":"不是。那可能只是气定，私欲只是潜伏着，遇事还会冒出来。功夫在去人欲存天理，而不在求平静。","yong":"刷手机让你平静下来了吗？那只是气定。问题还在，明天照样冒出来。","con":"反方：现代心理学认为情绪调节（让气先静下来）是理性决策的前提，先平静再处理问题是有效策略，不该被贬低为「只定得气」。阳明的重点其实不在否定平静，而在提醒不能把平静当成终点。","rec":"陆澄录","kj":[["r","日","曰","未发之中"],["r","富","喜","不惟渐有"],["r","生","主","以循理为"]]},{"n":29,"t":"曾点的不器","yw":"问：「孔门言志，由、求任政事，公西赤任礼乐，多少实用。及曾皙说来，却似耍的事，圣人却许他，是意何如？」曰：「三子是有意必，有意必便偏着一边，能此未必能彼。曾点这意思却无意必，便是『素其位而行，不愿乎其外，素夷狄行乎夷狄，素患难行乎患难，无入而不自得』矣。三子所谓『汝器也』，曾点便有不器意。然三子之才各卓然成章，非若世之空言无实者，故夫子亦皆许之。」","bh":"陆澄问：「孔门弟子谈志向，子路、冉求想管理政事，公西赤想主持礼乐，多少还有些实际用处。到了曾皙说的，却像是玩耍的事，圣人反而赞许他，这是什么意思？」先生说：「那三位都有『意必』，有意必就会偏于一边，能做这个未必能做那个。曾点的意思却没有意必，就是『安于现在的位置去做事，不羡慕位置之外的东西；处在夷狄之地就按夷狄之地的情况去做，处在患难之中就按患难的情况去做，无论在哪里都自得其乐』。那三位就是孔子所说的『你是一件器具』，曾点却有『君子不器』的意思。不过那三位的才能都很出众、各有成就，不像世上那些空谈不实的人，所以孔子也都认可他们。」","zs":[["由、求、公西赤","子路（仲由）、冉求、公西华，孔子弟子。"],["曾皙","即曾点，曾参的父亲。原文「曾点」「曾皙」通用。"],["意必","《论语·子罕》「子绝四：毋意、毋必、毋固、毋我」。意是主观臆测，必是绝对肯定。"],["汝器也、不器","子贡问孔子：「赐也何如？」子曰：「女器也。」又：「君子不器。」器指有固定用途的器具。"]],"gl":[27,9],"q":"孔子为什么赞许曾点？","a":"因为曾点没有「意必」，不执着于某一种功用，能随所处之位安然自得，有「不器」的气象。","yong":"别把自己钉死在「我只是个做网站的」上。手头的角色可以是器，但心别成器。","rec":"陆澄录","kj":[["r","竹","皙","实用及曾"],["r","人","入","乎患难无"]]},{"n":30,"t":"立志如种树（核心条）","yw":"问：「知识不长进，如何？」先生曰：「为学须有本原，须从本原上用力，渐渐盈科而进。仙家说婴儿，亦善譬。婴儿在母腹时，只是纯气，有何知识？出胎后，方始能啼，既而后能笑，又既而后能识认其父母兄弟，又既而后能立能行，能持能负，卒乃天下之事无不可能。皆是精气日足，则筋力日强，聪明日开，不是出胎日便讲求推寻得来。故须有个本原。圣人到『位天地，育万物』，也只从『喜怒哀乐未发之中』上养来。后儒不明格物之说，见圣人无不知，无不能，便欲于初下手时讲求得尽，岂有此理？」又曰：「立志用功，如种树然。方其根芽，犹未有干；及其有干，尚未有枝；枝而后叶，叶而后花实。初种根时，只管栽培灌溉，勿作枝想，勿作叶想，勿作花想，勿作实想。悬想何益？但不忘栽培之功，怕没有枝叶花实？」","bh":"陆澄问：「知识没有长进，怎么办？」先生说：「做学问必须有个根本，必须在根本上用力，像水一样填满一个坑再往前流，逐步前进。道家讲婴儿的比喻，也很好。婴儿在母亲肚子里时，只是一团纯气，有什么知识？出生以后才会哭，然后才会笑，再后来才认得父母兄弟，再后来才能站、能走、能拿、能背，最后天下的事没有做不到的。这都是因为精气一天天充足，筋骨力气一天天增强，耳聪目明一天天开发，不是一出生就能讲求推究出来的。所以必须有个根本。圣人能达到『让天地各安其位、让万物生长发育』的境界，也只是从『喜怒哀乐未发之中』上涵养出来的。后世儒者不明白格物的道理，看到圣人无所不知、无所不能，就想在一开始下手时把一切都研究透，哪有这种道理？」先生又说：「立志用功，就像种树一样。刚长出根芽时，还没有树干；有了树干，还没有树枝；有了树枝才有树叶，有了树叶才有花果。刚种下根时，只管栽培浇水，不要想着枝，不要想着叶，不要想着花，不要想着果。空想有什么用？只要不忘记栽培的功夫，还怕没有枝叶花果吗？」","zs":[["盈科而进","《孟子·离娄下》：「原泉混混，不舍昼夜，盈科而后进。」科，坑洼。水流填满坑洼后再向前。"],["仙家说婴儿","道家常以婴儿比喻纯朴本真的状态，如《老子》「专气致柔，能婴儿乎」。"],["位天地，育万物","《中庸》：「致中和，天地位焉，万物育焉。」"]],"gl":[16,24,22,118],"q":"「勿作枝想，勿作叶想」，那目标还要不要？","a":"要立志，但功夫只在当下的栽培上。整天空想结果没有用，持续培根，枝叶花实自然会来。","yong":"新网站上线第一个月就天天盯着询盘数？那是在想花想果。把内容和外链这些「根」做足。","con":"反方：现代目标管理认为，清晰的阶段性目标和反馈（看枝叶长了没有）能提升动力、及时纠偏，完全不看结果可能导致方向错了也不知道。阳明的「勿作想」更多是针对急于求成的心态，而不是反对检查进展。","rec":"陆澄录","kj":[["i","","识","既而后能"],["d","识","","而后能认"],["r","寅","实","有枝叶花"]]},{"n":31,"t":"看书不明，反求心体","yw":"问：「看书不能明，如何？」先生曰：「此只是在文义上穿求，故不明。如此，又不如为旧时学问。他到看得多，解得去。只是他为学虽极解得明晓，亦终身无得。须于心体上用功，凡明不得，行不去，须反在自心上体当，即可通。盖四书、五经不过说这心体，这心体即所谓道心，体明即是道明，更无二。此是为学头脑处。」","bh":"陆澄问：「看书看不明白，怎么办？」先生说：「这只是在文字意义上钻牛角尖，所以不明白。这样的话，还不如去做以前那种（朱子式的）学问。那种学问书看得多，也能讲得通。只是他们做学问虽然讲得极其明白，终身也没有真正的收获。必须在心体上用功，凡是想不明白、做不下去的，都要回到自己心上去体会，就能通了。因为四书五经讲的不过就是这个心体，这个心体就是所谓道心，心体明白了，道也就明白了，没有两样。这是做学问的关键所在。」","zs":[["穿求","穿凿求索，生硬地钻研字面。"],["体当","体会、体认。"]],"gl":[20,3],"q":"看书看不懂时，阳明给的办法是什么？","a":"别只在字面上钻，要回到自己心上去体会：这句话说的是我心里的什么？","yong":"读到看不懂的条目，先别查注释，问自己：我生活里哪件事是这个样子？","rec":"陆澄录","kj":[]},{"n":32,"t":"心外无理，心外无事","yw":"「虚灵不昧，众理具而万事出。」心外无理，心外无事。","bh":"「心虚明灵动、不被蒙蔽，所有的道理都具备其中，万事都从这里生出。」心外没有理，心外没有事。","zs":[["虚灵不昧，众理具而万事出","这是朱熹《大学章句》注「明德」的话：「明德者，人之所得乎天，而虚灵不昧，以具众理而应万事者也。」阳明加以改动并引申。"]],"gl":[3,6,33],"q":"「心外无事」是说外面的事都不存在吗？","a":"不是。是说一切事都通过心的意念发动和关照才成为「事」，事的道理就在心中。","yong":"同样一封客户投诉邮件，你把它看成麻烦还是机会，这件「事」就完全不同。","rec":"陆澄录","kj":[["r","眛","昧","虚灵不"],["i","","具","不眛众理"]]},{"n":33,"t":"心与理不可用「与」字","yw":"或问：「晦庵先生曰：『人之所以为学者，心与理而已。』此语如何？」曰：「心即性，性即理，下一『与』字，恐未免为二。此在学者善观之。」","bh":"有人问：「朱熹先生说：『人之所以要做学问，不过是心与理罢了。』这话怎么样？」先生说：「心就是性，性就是理，加一个『与』字，恐怕难免把心和理分成两个了。这要学者善于体会。」","zs":[["晦庵","朱熹的号。"]],"gl":[3,32,34],"q":"阳明为什么挑剔一个「与」字？","a":"「心与理」暗示心和理是两样东西，这正是阳明反对的。他主张心即性、性即理，三者是一。","yong":"留意自己说话里的「与」：「工作与生活」「理想与现实」，是不是已经先把它们对立了？","rec":"陆澄录","kj":[]},{"n":34,"t":"恶人之心失其本体","yw":"或曰：「人皆有是心，心即理，何以有为善、有为不善？」先生曰：「恶人之心，失其本体。」","bh":"有人说：「人人都有这颗心，心就是理，为什么有人做善事、有人做坏事？」先生说：「恶人的心，丧失了它的本来面目。」","zs":[["本体","心的本来状态，即没有私欲遮蔽、纯乎天理的状态。"]],"gl":[3,8,10],"q":"既然心即理，恶从哪里来？","a":"恶不是心本来就有的，而是心被私欲遮蔽、失去本体的结果。","con":"反方：这个回答相当简略，没有解释心「为什么」会失其本体。如果本体纯善，私欲又从何而来？这是心学（乃至整个性善论）一直被追问的难题，后来王门内部也为此争论不休。","rec":"陆澄录","kj":[["r","矢","失","恶人之心"]]},{"n":35,"t":"理岂容分析","yw":"问：「『析之有以极其精而不乱，然后合之有以尽其大而无余』，此言如何？」先生曰：「恐亦未尽。此理岂容分析？又何须凑合得？圣人说『精一』，自是尽。」","bh":"陆澄问：「朱子说『把道理分析开来，能做到极其精细而不混乱；然后再综合起来，能做到极其广大而没有遗漏』，这话怎么样？」先生说：「恐怕也没有说透。天理哪容得分析？又何必再拼凑起来？圣人说『精一』，自然就说透了。」","zs":[["析之……无余","朱熹《大学或问》中的话。"]],"gl":[25,33],"q":"阳明对「先分析再综合」的方法怎么看？","a":"他认为天理浑然一体，不能拆开再拼。精一功夫本身就是整体的。","con":"反方：先分析再综合正是现代科学的基本方法，没有分析就没有精确知识。阳明这里说的「理」是道德天理，而非物理，用在道德修养上或许成立，但若推广到一切认知领域就站不住了。","rec":"陆澄录","kj":[]},{"n":36,"t":"省察与存养","yw":"省察是有事时存养，存养是无事时省察。","bh":"省察就是有事时的存养，存养就是无事时的省察。","zs":[["省察","反省检查自己的念头。"],["存养","存心养性，保持涵养本心。宋儒常把二者分为动时、静时两种功夫，阳明认为是一回事。"]],"gl":[28,39,23],"q":"省察和存养要分开练吗？","a":"不用。有事时边做边省察，就是存养；无事时保持存养，就是省察。是同一个功夫。","yong":"不用专门挤时间「修行」。开会时、谈判时，留意自己的念头，这就是功夫。","rec":"陆澄录","kj":[]},{"n":37,"t":"事变只在人情里","yw":"澄尝问象山在人情事变上做工夫之说。先生曰：「除了人情事变，则无事矣。喜怒哀乐，非人情乎？自视听言动，以至富贵贫贱、患难死生，皆事变也。事变亦只在人情里，其要只在『致中和』，『致中和』只在『谨独』。」","bh":"陆澄曾经问陆象山「在人情事变上做功夫」的说法。先生说：「除了人情和事变，就没有别的事了。喜怒哀乐，不是人情吗？从看听说动，到富贵贫贱、患难生死，都是事变。事变也只在人情里面，关键只在『致中和』，而『致中和』只在『谨独』。」","zs":[["象山","陆九渊，号象山，南宋心学代表。后世并称「陆王心学」。"],["谨独","即「慎独」，在别人看不到、只有自己知道的时候也谨慎不苟。"]],"gl":[23,28],"q":"「事变」和「人情」是什么关系？","a":"事变就在人情里：一切事都伴随着喜怒哀乐。处理事情的关键是让情绪发而中节，而这取决于独处时的功夫。","yong":"处理事情乱了阵脚，往往是情绪先乱了。先看住情绪，事情就好办一半。","rec":"陆澄录","kj":[]},{"n":38,"t":"一性而已，名至无穷","yw":"澄问：「仁、义、礼、智之名，因已发而有？」曰：「然。」他日澄曰：「恻隐、羞恶、辞让、是非，是性之表德邪？」曰：「仁、义、礼、智也是表德。性一而已，自其形体也谓之天，主宰也谓之帝，流行也谓之命，赋于人也谓之性，主于身也谓之心。心之发也，遇父便谓之孝，遇君便谓之忠，自此以往，名至于无穷，只一性而已。犹人一而已，对父谓之子，对子谓之父，自此以往，至于无穷，只一人而已。人只要在性上用功，看得一『性』字分明，即万理灿然。」","bh":"陆澄问：「仁、义、礼、智这些名称，是因为心已经发动才有的吗？」先生说：「是的。」另一天陆澄问：「恻隐、羞恶、辞让、是非这四种心，是性的外在表现吗？」先生说：「仁、义、礼、智也是外在表现。性只有一个，从它的形体说叫天，从它的主宰说叫帝，从它的流行说叫命，从它赋予人说叫性，从它主宰身体说叫心。心发动出来，遇到父亲就叫孝，遇到君主就叫忠，以此类推，名称可以无穷无尽，但其实只是一个性。就像一个人，对父亲来说叫儿子，对儿子来说叫父亲，以此类推，称呼无穷无尽，其实只是一个人。人只要在性上用功，把一个『性』字看清楚了，万般道理就都灿然明白了。」","zs":[["表德","表现在外的德行名目。"],["四端","《孟子》：恻隐之心是仁之端，羞恶之心是义之端，辞让之心是礼之端，是非之心是智之端。"]],"gl":[3,10],"q":"天、帝、命、性、心，是五个不同的东西吗？","a":"不是，只是一个东西从不同角度的不同名称，就像一个人既叫儿子又叫父亲。","yong":"你既是老板、程序员、销售、父亲，名头多不怕，心只有一个。","rec":"陆澄录","kj":[["r","市","谓","天主宰也"]]},{"n":39,"t":"省察克治：猫捕鼠","yw":"一日，论为学工夫。先生曰：「教人为学，不可执一偏。初学时心猿意马，拴缚不定，其所思虑多是人欲一边，故且教之静坐，息思虑。久之，俟其心意稍定，只悬空静守，如槁木死灰，亦无用，须教他省察克治。省察克治之功，则无时而可间，如去盗贼，须有个扫除廓清之意。无事时，将好色、好货、好名等私，逐一追究搜寻出来，定要拔去病根，永不复起，方始为快。常如猫之捕鼠，一眼看着，一耳听着，才有一念萌动，即与克去，斩钉截铁，不可姑容与他方便，不可窝藏，不可放他出路，方是真实用功，方能扫除廓清。到得无私可克，自有端拱时在。虽曰『何思何虑』，非初学时事。初学必须思，省察克治即是思诚，只思一个天理，到得天理纯全，便是『何思何虑』矣。」","bh":"有一天，讨论做学问的功夫。先生说：「教人做学问，不能执着于一种方法。初学的人心猿意马，拴也拴不住，所想的大多是人欲一类，所以先教他静坐，停止胡思乱想。时间久了，等他心意稍微安定，如果只是悬空静守，像枯木死灰一样，也没有用，必须教他省察克治。省察克治的功夫，没有一刻可以间断，就像清除盗贼，必须有彻底扫荡干净的决心。没事的时候，把好色、贪财、求名这些私心，一个一个追查搜寻出来，一定要拔掉病根，让它永远不再生起，才算痛快。要经常像猫捉老鼠一样，眼睛盯着，耳朵听着，刚有一个念头萌动，就立刻克除它，斩钉截铁，不能姑息纵容、给它方便，不能窝藏它，不能放它一条出路，这才是真实用功，才能彻底扫除干净。到了没有私欲可克的时候，自然会有垂衣拱手、从容无为的时候。虽然说『有什么可思虑的呢』，但那不是初学时的事。初学必须思，省察克治就是『思诚』，只思一个天理，到了天理纯全的时候，就是『何思何虑』了。」","zs":[["心猿意马","心像猴子、意像奔马，形容心神不定。"],["槁木死灰","出自《庄子·齐物论》，形容心如死水、毫无生机。"],["端拱","端坐拱手，形容无为而治、从容自在。"],["何思何虑","《周易·系辞下》：「天下何思何虑？天下同归而殊途，一致而百虑。」"],["思诚","《孟子·离娄上》：「诚者，天之道也；思诚者，人之道也。」"]],"gl":[17,23,28,36],"q":"阳明教静坐，又说静守无用，矛盾吗？","a":"不矛盾。静坐是给初学者收心的权宜之法，心定之后必须转入省察克治，否则就成了槁木死灰。","yong":"今晚花五分钟做「猫捕鼠」：回想今天哪个念头是好名、好利、怕丢面子？写下来。","con":"反方：现代心理学发现，强行压制念头往往适得其反（「白熊效应」：越不让想越会想）。阳明的「斩钉截铁」若理解为压抑，可能加剧内耗。比较好的理解是：看清念头、不跟着它走，而不是用意志力去硬压。","rec":"陆澄录","kj":[["r","纔","才","一耳听着"]]},{"n":40,"t":"怕鬼是心邪","yw":"澄问：「有人夜怕鬼者，奈何？」先生曰：「只是平日不能『集义』，而心有所慊，故怕。若素行合于神明，何怕之有？」子莘曰：「正直之鬼不须怕，恐邪鬼不管人善恶，故未免怕。」先生曰：「岂有邪鬼能迷正人乎？只此一怕，即是心邪，故有迷之者，非鬼迷也，心自迷耳。如人好色，即是色鬼迷；好货，即是货鬼迷；怒所不当怒，是怒鬼迷；惧所不当惧，是惧鬼迷也。」","bh":"陆澄问：「有人晚上怕鬼，怎么办？」先生说：「这只是因为平时不能『集义』，心里有愧，所以害怕。如果平时的行为对得起神明，有什么可怕的？」马子莘说：「正直的鬼不用怕，就怕邪鬼不管人是善是恶，所以难免害怕。」先生说：「哪有邪鬼能迷惑正直的人？就这一怕，心已经邪了，所以才有东西迷惑他，不是鬼迷了他，是他的心自己迷了。比如人好色，就是被色鬼迷了；贪财，就是被财鬼迷了；在不该发怒的时候发怒，是被怒鬼迷了；在不该害怕的时候害怕，是被惧鬼迷了。」","zs":[["集义","《孟子·公孙丑上》：「是集义所生者。」积累正义的行为，以养浩然之气。"],["慊","这里读 qiàn，不满足、有愧。"],["子莘","马明衡，字子莘，福建莆田人，阳明弟子。"]],"gl":[39,8],"q":"阳明说的「鬼」是什么？","a":"是心中的私欲和不当情绪：好色是色鬼，贪财是货鬼，乱发怒是怒鬼，乱害怕是惧鬼。","yong":"你最近最常被哪个「鬼」迷？焦虑鬼、面子鬼还是比较鬼？叫出它的名字，它就弱一半。","rec":"陆澄录","kj":[]},{"n":41,"t":"定是心之本体","yw":"定者，心之本体，天理也。动静，所遇之时也。","bh":"定，是心的本来状态，也就是天理。动和静，只是心所遇到的不同时候罢了。","zs":[["定","安定、不动摇。程颢《定性书》讲「动亦定，静亦定」。"]],"gl":[23,28],"q":"心的「定」取决于外面是动还是静吗？","a":"不取决于。定是心的本体，动静只是外在情境。心有天理做主，动静都定。","yong":"出差、赶工、被催，这些都是「动」。看你此刻的心定不定，和忙不忙没关系。","rec":"陆澄录","kj":[]},{"n":42,"t":"《中庸》首章括《大学》","yw":"澄问《学》《庸》同异。先生曰：「子思括《大学》一书之义，为《中庸》首章。」","bh":"陆澄问《大学》和《中庸》的异同。先生说：「子思把《大学》全书的意思，概括成了《中庸》的第一章。」","zs":[["子思","孔子之孙孔伋，相传《中庸》为他所作。"]],"gl":[28],"q":"阳明认为《大学》和《中庸》是什么关系？","a":"讲的是同一套道理，《中庸》首章就是《大学》全书的概括。","rec":"陆澄录","kj":[]},{"n":43,"t":"孔子如何为卫国正名","yw":"问：「孔子正名，先儒说『上告天子，下告方伯，废辄立郢』，此意如何？」先生曰：「恐难如此。岂有一人致敬尽礼，待我而为政，我就先去废他，岂人情天理？孔子既肯与辄为政，必已是他能倾心委国而听。圣人盛德至诚，必已感化卫辄，使知无父之不可以为人，必将痛哭奔走，往迎其父。父子之爱，本于天性，辄能悔痛真切如此，蒯聩岂不感动底豫？蒯聩既还，辄乃致国请戮。聩已见化于子，又有夫子至诚调和其间，当亦决不肯受，仍以命辄。群臣百姓又必欲得辄为君。辄乃自暴其罪恶，请于天子，告于方伯诸侯，而必欲致国于父。聩与群臣百姓，亦皆表辄悔悟仁孝之美，请于天子，告于方伯诸侯，必欲得辄而为之君。于是集命于辄，使之复君卫国。辄不得已，乃如后世上皇故事，率群臣百姓尊聩为太公，备物致养，而始退复其位焉。则君君、臣臣、父父、子子，名正言顺，一举而可为政于天下矣。孔子正名，或是如此。」","bh":"陆澄问：「孔子要『正名』，前代儒者解释为『上报天子，下告诸侯之长，废掉卫出公辄，改立公子郢』，这个说法怎么样？」先生说：「恐怕很难这样做。哪有一个人恭恭敬敬、礼数周到地等着我去帮他治理国家，我却先去废掉他的？这合乎人情天理吗？孔子既然肯帮辄治国，必定是辄已经能够倾心把国家托付给孔子、听从孔子。圣人德行盛大、至诚感人，必定已经感化了卫辄，让他明白没有父亲就不能做人，他必定会痛哭着奔走去迎接父亲回国。父子之爱出于天性，辄能如此真切地悔恨痛心，蒯聩难道不会被感动而和好如初？蒯聩回来后，辄就把国家交还给父亲，并请求治自己的罪。蒯聩已经被儿子感化，又有孔子在中间至诚调和，也必定不肯接受，仍然让辄做国君。群臣百姓也一定要辄做国君。辄就公开自己的罪过，向天子请示，向诸侯通告，一定要把国家交给父亲。蒯聩和群臣百姓也都表彰辄悔悟、仁孝的美德，向天子请示，向诸侯通告，一定要辄做国君。于是天命集中到辄身上，让他重新做卫国国君。辄不得已，就像后世尊奉太上皇的做法那样，率领群臣百姓尊蒯聩为太公，备齐物品奉养他，然后才回到君位上。这样就君像君、臣像臣、父像父、子像子，名正言顺，一下子就可以为天下树立治理的典范了。孔子的正名，或许是这样的。」","zs":[["正名","《论语·子路》：子路问孔子若到卫国执政先做什么，孔子说「必也正名乎」。"],["卫辄与蒯聩","卫灵公的太子蒯聩因谋杀南子失败逃亡，灵公死后，蒯聩之子辄继位（卫出公），拒绝父亲回国，父子争国。"],["郢","卫灵公的另一个儿子公子郢。"],["方伯","一方诸侯之长。"],["底豫","终于和乐。出自《孟子·离娄上》「瞽瞍底豫」。"],["上皇故事","如唐玄宗、宋徽宗等让位后被尊为太上皇的先例。"]],"gl":[44],"q":"阳明的「正名」方案和朱子一派有何不同？","a":"朱子一派主张直接废辄立郢；阳明主张以至诚感化辄，让父子自己和解，名分自然归正，不用强行废立。","con":"反方：这是阳明对历史的一种理想化推演，不是史实。真实的卫国父子争位持续多年，以流血收场，孔子最终也没能在卫国施政。把一切寄托于「至诚感化」，在现实政治中往往过于乐观。","rec":"陆澄录","kj":[["r","诗","请","辄乃致国"],["r","臣","百","聩与群臣"],["r","力","方","天子告于"],["r","戾","侯","于力伯诸"]]},{"n":44,"t":"儿子病危时的功夫","yw":"澄在鸿胪寺仓居，忽家信至，言儿病危，澄心甚忧闷不能堪。先生曰：「此时正宜用功。若此时放过，闲时讲学何用？人正要在此等时磨炼。父之爱子，自是至情，然天理亦自有个中和处，过即是私意。人于此处多认做天理当忧，则一向忧苦，不知已是『有所忧患，不得其正』。大抵七情所感，多只是过，少不及者。才过便非心之本体，必须调停适中始得。就如父母之丧，人子岂不欲一哭便死，方快于心？然却曰『毁不灭性』，非圣人强制之也，天理本体自有分限，不可过也。人但要识得心体，自然增减分毫不得。」","bh":"陆澄住在鸿胪寺的客舍里，忽然收到家信，说儿子病危，陆澄心里忧愁烦闷得受不了。先生说：「这时候正应该用功。如果这时候放过了，平时讲学有什么用？人正是要在这种时候磨练。父亲爱儿子，自然是最深的感情，但天理也自有一个中正平和的分寸，过了头就是私意。人在这种地方大多认为按天理就应当忧愁，于是一味忧愁痛苦，却不知道这已经是『心有忧患，就不能端正』了。大体上，人受七情感触，多半是过分，很少有不足的。一过分就不是心的本体了，必须调节到适中才行。就像父母去世，做子女的难道不想一哭就死去，心里才痛快？但礼却说『哀伤不能毁伤到危害生命』，这不是圣人强行规定的，而是天理本体自有分寸，不能过分。人只要认识了心的本体，自然一分一毫都不能增减。」","zs":[["鸿胪寺","明代掌管朝会、宾客礼仪的机构。仓居，指借住在寺中的房舍。"],["有所忧患，不得其正","《大学》：「身有所忿懥，则不得其正；有所恐惧，则不得其正；……有所忧患，则不得其正。」"],["七情","喜、怒、哀、惧、爱、恶、欲。"],["毁不灭性","《孝经》：「毁不灭性，此圣人之政也。」居丧哀伤不能伤及性命。"]],"gl":[23,37,58],"q":"儿子病危时忧愁，难道也不对吗？","a":"爱子之情是对的，但忧到不能自持就过了，过了就成私意。天理有分寸，要调到适中。","yong":"家里出事时你还能稳住，处理该处理的，这才是平时功夫的真考验。","con":"反方：这一条常被批评为不近人情。儿子病危时被老师要求「调停适中」，在今天看来几乎是情感压抑。当代哀伤心理学也认为，充分经历悲伤有助于恢复。为阳明辩护的一面是：他反对的是「忧到失去判断力」，并非不许悲伤，而且他本人在亲人去世时也痛哭过。","rec":"陆澄录","kj":[["r","助","功","时正宜用"],["i","","等","正要在此"],["r","己","已","忧苦不知"]]},{"n":45,"t":"有体即有用","yw":"不可谓未发之中常人俱有。盖『体用一源』，有是体即有是用，有未发之中，即有发而皆中节之和。今人未能有发而皆中节之和，须知是他未发之中亦未能全得。","bh":"不能说普通人都具有『未发之中』。因为『本体和作用出于同一个本源』，有这个本体就有这个作用，有了未发之中，就会有发出来都恰到好处的和。现在的人还做不到发出来都恰到好处，就要知道他的未发之中也还没有完全得到。","zs":[["体用一源","程颐《易传序》：「体用一源，显微无间。」"]],"gl":[28,58],"q":"怎么判断一个人内心的「中」是否完好？","a":"看他情感发出来是否中节。体用一源，发出来不中节，说明内在的中也没有全得。","yong":"别说「我本心是好的，只是脾气差」。脾气差，说明本心那里也还没修好。","rec":"陆澄录","kj":[]},{"n":46,"t":"易之辞象变占","yw":"《易》之辞，是『初九，潜龙勿用』六字；《易》之象，是初画；《易》之变，是值其画；《易》之占，是用其辞。","bh":"《易》的辞，是『初九，潜龙勿用』这六个字；《易》的象，是最下面那一画；《易》的变，是遇到那一画（阳爻变阴爻）；《易》的占，是用那句辞来判断吉凶。","zs":[["初九，潜龙勿用","《周易》乾卦第一爻的爻辞。"],["辞、象、变、占","《系辞》：「易有圣人之道四焉：以言者尚其辞，以动者尚其变，以制器者尚其象，以卜筮者尚其占。」"]],"gl":[50],"q":"以乾卦初爻为例，《易》的辞象变占分别是什么？","a":"辞是「初九潜龙勿用」六字；象是初画；变是遇到这一画；占是用这句辞来判断。","rec":"陆澄录","kj":[["r","昼","画","之象是初"],["r","昼","画","变是值其"]]},{"n":47,"t":"夜气","yw":"「夜气」是就常人说。学者能用功，则日间有事无事，皆是此气翕聚发生处。圣人则不消说「夜气」。","bh":"『夜气』是就普通人说的。学者如果能用功，那么白天有事没事，都是这清明之气聚集生发的地方。至于圣人，就不必说『夜气』了。","zs":[["夜气","《孟子·告子上》：人在夜里休息后，清晨未与外物接触时的清明之气，此时良心容易显现。"],["翕聚","收敛聚集。"]],"gl":[48],"q":"为什么圣人不用说「夜气」？","a":"普通人只在夜里清明，白天就被外物扰乱；学者用功后白天也清明；圣人时时清明，不必专说夜气。","yong":"早上脑子最清楚？那就把最重要的事放在早上。但目标是一整天都有早上的清明。","rec":"陆澄录","kj":[]},{"n":48,"t":"心无出入","yw":"澄问「操存舍亡」章。曰：「『出入无时，莫知其乡』，此虽就常人心说，学者亦须是知得心之本体亦元是如此，则操存功夫始没病痛。不可便谓出为亡，入为存。若论本体，元是无出无入的。若论出入，则其思虑运用是出，然主宰常昭昭在此，何出之有？既无所出，何入之有？程子所谓『腔子』，亦只是天理而已。虽终日应酬而不出天理，即是在腔子里；若出天理，斯谓之放，斯谓之亡。」又曰：「出入亦只是动静，动静无端，岂有乡邪？」","bh":"陆澄问《孟子》「操存舍亡」那一章。先生说：「『心的出去进来没有固定时间，没人知道它的去向』，这虽然是就普通人的心说的，学者也必须知道心的本体原本也是这样，那么操持存养的功夫才不会出毛病。不能就说心出去了是亡失，进来了是存在。如果论本体，心本来是无出无入的。如果论出入，那么心的思虑运用算是出，但主宰常常明明白白地在这里，有什么出？既然没有出，又有什么入？程子说的『腔子』，也只是天理罢了。即使整天应酬，只要不离开天理，就是在腔子里；如果离开了天理，那才叫放失，才叫亡失。」又说：「出入也只是动静，动静没有开端，哪有固定的去向？」","zs":[["操存舍亡","《孟子·告子上》：「操则存，舍则亡；出入无时，莫知其乡。惟心之谓与？」"],["乡","同「向」，方向、去处。"],["腔子","程颢：「心要在腔子里。」腔子即躯壳、胸腔。"]],"gl":[47,41],"q":"整天忙着应酬，心算不算「跑出去了」？","a":"不算。只要不离天理，思虑应酬都在「腔子里」；离了天理才叫放失。","yong":"忙不等于心散。忙的时候守着本心，就没跑出去；闲坐时胡思乱想，反倒是跑出去了。","rec":"陆澄录","kj":[["r","人","入","谓出为亡"],["r","人","入","无所出何"]]},{"n":49,"t":"仙佛与圣学","yw":"王嘉秀问：「佛以出离生死诱人入道，仙以长生久视诱人入道，其心亦不是要人做不好，究其极至，亦是见得圣人上一截，然非入道正路。如今仕者，有由科，有由贡，有由传奉，一般做到大官，毕竟非入仕正路，君子不由也。仙、佛到极处，与儒者略同，但有了上一截，遗了下一截，终不似圣人之全。然其上一截同者，不可诬也。后世儒者，又只得圣人下一截，分裂失真，流而为记诵、词章、功利、训诂，亦卒不免为异端。是四家者，终身劳苦，于身心无分毫益。视彼仙、佛之徒，清心寡欲，超然于世累之外者，反若有所不及矣。今学者不必先排仙、佛，且当笃志为圣人之学。圣人之学明，则仙、佛自泯。不然，则此之所学，恐彼或有不屑，而反欲其俯就，不亦难乎？鄙见如此，先生以为何如？」先生曰：「所论大略亦是。但谓上一截、下一截，亦是人见偏了如此。若论圣人大中至正之道，彻上彻下，只是一贯，更有甚上一截、下一截？『一阴一阳之谓道』，但『仁者见之便谓之仁，知者见之便谓之智，百姓又日用而不知，故君子之道鲜矣』。仁、智岂可不谓之道？但见得偏了，便有弊病。」","bh":"王嘉秀问：「佛家用超脱生死来引诱人入道，道家用长生不老来引诱人入道，他们的用心也不是要人去做坏事，追究到最高处，也见到了圣人学问的上半截，但不是入道的正路。就像现在做官的，有通过科举的，有通过贡举的，有通过皇帝特旨任命的，同样做到大官，但毕竟不是做官的正路，君子不走那些路。道家佛家到了极处，和儒家大致相同，但只有上半截，丢了下半截，终究不像圣人那样完整。不过他们上半截相同的地方，也不能抹杀。后世儒者又只得到圣人的下半截，支离破碎、失去真意，流变成了死记硬背、舞文弄墨、追求功利、烦琐训诂，最终也不免成为异端。这四种人，一辈子劳苦，对身心没有丝毫益处。看看那些道佛之徒，清心寡欲，超脱于世俗牵累之外，这四种人反而好像比不上了。现在的学者不必先去排斥道佛，而应当专心致志做圣人之学。圣人之学昌明了，道佛自然就消失了。否则，我们所学的东西，恐怕他们还看不上，反而要他们屈就过来，不是很难吗？我的浅见就是这样，先生认为怎么样？」先生说：「你所说的大体上也对。但说什么上半截、下半截，也是人的见解偏了才这样说。如果论圣人大中至正之道，从上到下贯通，只是一个，哪有什么上半截、下半截？『一阴一阳就是道』，但『仁者看到它就叫它仁，智者看到它就叫它智，百姓天天在用却不知道，所以君子之道很少有人真懂』。仁和智难道不能叫道吗？只是看偏了，就有弊病。」","zs":[["王嘉秀","字实夫，湖南沅陵人，阳明弟子，早年好道家养生。"],["长生久视","《老子》：「是谓深根固柢，长生久视之道。」"],["由科、由贡、由传奉","科举出身、地方贡生出身、皇帝绕过吏部直接任命（明代「传奉官」）。"],["训诂","解释古书字词。"],["一阴一阳之谓道","《周易·系辞上》。"]],"gl":[11,24],"q":"阳明同意「仙佛只有上一截」的说法吗？","a":"大体认可，但他认为说「上一截、下一截」本身就是见偏了：圣人之道彻上彻下，本来只是一个。","con":"反方：儒家批评佛家「遗了下一截」（不顾人伦事务），但大乘佛教讲「烦恼即菩提」、禅宗讲「担水砍柴无非妙道」，未必只有上一截。阳明之学也常被时人批评为「阳儒阴释」，他与佛学的距离比他自己承认的更近。","rec":"陆澄录","kj":[["r","贝","见","极至亦是"],["r","人","入","一截然非"],["r","人","入","官毕竟非"],["r","詀","诂","章功利训"],["r","冢","家","异端是四"],["r","祝","视","无分毫益"],["i","","一","截下一截"],["r","曰","日","智百姓又"]]},{"n":50,"t":"蓍龟皆易","yw":"蓍固是《易》，龟亦是《易》。","bh":"用蓍草占卜固然是《易》，用龟甲占卜也是《易》。","zs":[["蓍、龟","古代两种占卜方法。蓍草用来起卦（筮），龟甲用来灼烧看裂纹（卜）。"]],"gl":[46,13],"q":"这一条要说明什么？","a":"易是变易之道，不局限于某一种形式；凡是察变知几的，都可以说是易。","rec":"陆澄录","kj":[]},{"n":51,"t":"武王未尽善","yw":"问：「孔子谓武王未尽善，恐亦有不满意？」先生曰：「在武王自合如此。」曰：「使文王未没，毕竟如何？」曰：「文王在时，天下三分已有其二。若到武王伐商之时，文王若在，或者不致兴兵，必然这一分亦来归了。文王只善处纣，使不得纵恶而已。」","bh":"陆澄问：「孔子说武王（的音乐）还没有做到尽善，恐怕也是对武王有不满意的地方吧？」先生说：「在武王的处境，本来就应该这样做。」陆澄问：「假如文王还没有去世，结果会怎样？」先生说：「文王在世时，天下三分已经有了两分。如果到了武王伐商的时候文王还活着，或许就不至于动用武力，剩下那一分必定也会归顺。文王只会妥善地对待纣王，让他不能再放纵作恶罢了。」","zs":[["武王未尽善","《论语·八佾》：「子谓《韶》：尽美矣，又尽善也。谓《武》：尽美矣，未尽善也。」《韶》是舜的音乐，《武》是武王的音乐。"],["三分天下有其二","《论语·泰伯》称赞周文王「三分天下有其二，以服事殷」。"]],"gl":[43],"q":"阳明认为武王用兵是错的吗？","a":"不是错，在武王的处境本应如此。但若文王在，以德感化或许能不动兵，所以说「未尽善」。","rec":"陆澄录","kj":[["r","籿","纣","王只善处"]]},{"n":52,"t":"中只是天理，随时变易","yw":"问：「孟子言『执中无权犹执一』。」先生曰：「中只是天理，只是易，随时变易，如何执得？须是因时制宜，难预先定一个规矩在。如后世儒者要将道理一一说得无罅漏，立定个格式，此正是执一。」","bh":"陆澄问孟子说的「守着中间却不懂变通，就跟死守一点一样」。先生说：「中只是天理，只是变易，随时都在变化，怎么守得住？必须根据时势做适当安排，很难预先定下一个规矩。像后世儒者想把道理一一说得毫无漏洞，定好一个固定格式，这正是执一。」","zs":[["执中无权犹执一","《孟子·尽心上》：「执中无权，犹执一也。所恶执一者，为其贼道也，举一而废百也。」权，变通。"],["罅漏","缝隙和漏洞。"]],"gl":[21,67],"q":"阳明为什么反对给道理定下固定格式？","a":"因为中就是天理，随时变易。定死格式就是执一，反而违背了中。","yong":"你的 SOP 写得滴水不漏？好，但别把它当圣经。客户情况变了，就要权衡变通。","con":"反方：没有固定规则，「因时制宜」就可能变成随心所欲，谁来判断此时的「中」？规则和程序的价值恰恰在于防止个人判断失误。阳明会回答：判断者是良知，但良知需要长期功夫才可靠。","rec":"陆澄录","kj":[["r","于","子","问孟"],["r","有","是","生曰中只"]]},{"n":53,"t":"立志就是长立善念","yw":"唐诩问：「立志是常存个善念，要为善去恶否？」曰：「善念存时，即是天理。此念即善，更思何善？此念非恶，更去何恶？此念如树之根芽，立志者长立此善念而已。『从心所欲，不逾矩』，只是志到熟处。」","bh":"唐诩问：「立志是不是要常常保存一个善念，用来为善去恶？」先生说：「善念存在的时候，就是天理。这个念头就是善，还要另外想什么善？这个念头不是恶，还要去掉什么恶？这个念头就像树的根芽，立志就是长久地立住这个善念罢了。孔子说的『随心所欲而不越出规矩』，只是志向到了纯熟的地步。」","zs":[["唐诩","阳明弟子，生平不详。"],["从心所欲，不逾矩","《论语·为政》：「七十而从心所欲，不逾矩。」"]],"gl":[16,30],"q":"「从心所欲不逾矩」和立志有什么关系？","a":"那就是立志到了纯熟处：善念长立，心之所欲本身就合乎规矩。","yong":"好习惯练熟了，就不用天天靠意志力。那时你随心所欲，也不会出格。","rec":"陆澄录","kj":[["i","","善","理此念即"],["r","踰","逾","心所欲不"]]},{"n":54,"t":"收敛为主","yw":"精神、道德、言动，大率收敛为主，发散是不得已。天地人物皆然。","bh":"精神、道德、言行，大体上都以收敛为主，向外发散是不得已的。天地万物、人和物都是这样。","zs":[["收敛","内敛、含蓄、不外露。"]],"gl":[47,57],"q":"为什么要以收敛为主？","a":"精气收敛才能积蓄，过度发散则耗损。天地万物都是先蓄后发。","yong":"少发朋友圈、少开无效的会、少说没把握的话。能量留给真正要做的事。","rec":"陆澄录","kj":[]},{"n":55,"t":"文中子：良工心独苦","yw":"问：「文中子是如何人？」先生曰：「文中子庶几『具体而微』，惜其蚤死。」问：「如何却有续经之非？」曰：「续经亦未可尽非。」请问。良久，曰：「更觉『良工心独苦』。」","bh":"陆澄问：「文中子是什么样的人？」先生说：「文中子差不多算是『具备了圣人的全体，只是规模小一些』，可惜他死得太早。」陆澄问：「那他为什么会有续写经书的过错？」先生说：「续写经书也不能全盘否定。」陆澄请先生详细说说。先生过了很久才说：「更觉得『高明的工匠，苦心只有自己知道』。」","zs":[["具体而微","《孟子·公孙丑上》：「冉牛、闵子、颜渊则具体而微。」具备圣人的整体，只是规模较小。"],["蚤","同「早」。王通三十多岁去世。"],["良工心独苦","杜甫《题李尊师松树障子歌》：「良工心独苦。」"]],"gl":[11],"q":"阳明为什么说「良工心独苦」？","a":"他认为王通续经是为了明道、删繁就简，用心良苦，却被世人误解为僭越，只有自己知道其中苦心。","rec":"陆澄录","kj":[]},{"n":56,"t":"治生为先之说误人","yw":"许鲁斋谓儒者以治生为先之说，亦误人。","bh":"许衡说儒者应该把谋生放在首位，这种说法也会误导人。","zs":[["许鲁斋","元代理学家许衡，号鲁斋。他说「为学者，治生最为先务」。"],["治生","经营生计、谋生。"]],"gl":[49],"q":"阳明为什么认为「治生为先」误人？","a":"若把谋生放在首位，为学就被功利之心主导，失了头脑。","con":"反方：许衡的本意是儒者若无生计，就难免依附权贵或贪腐，治生恰恰是保持独立人格的基础。阳明晚年（见《传习录拾遗》）也承认「但言学者治生上，尽有工夫则可」，并不完全否定治生。对你这种自己开工作室的人来说，许衡这句话或许更实在。","rec":"陆澄录","kj":[]},{"n":57,"t":"精气神只是一件","yw":"问仙家元气、元神、元精。先生曰：「只是一件，流行为气，凝聚为精，妙用为神。」","bh":"陆澄问道家所说的元气、元神、元精。先生说：「只是一个东西：流动运行叫作气，凝聚起来叫作精，神妙作用叫作神。」","zs":[["元气、元神、元精","道家内丹学的核心概念，即「精气神」三宝。"]],"gl":[38,54],"q":"精、气、神是三样东西吗？","a":"只是一件东西的三种状态：流行为气，凝聚为精，妙用为神。","rec":"陆澄录","kj":[]},{"n":58,"t":"喜怒哀乐本体中和","yw":"喜怒哀乐，本体自是中和的，才自家着些意思，便过不及，便是私。","bh":"喜怒哀乐，本来自然就是中正平和的，只要自己一加进些私意，就会过分或者不足，这就是私心。","zs":[["着些意思","加上一点自己的私意、刻意。"]],"gl":[44,45],"q":"情绪的「过」或「不及」是怎么来的？","a":"情绪本来中和，是自己刻意掺进私意，才变得过分或不足。","yong":"发火时问一句：这火里有多少是事情本身该有的，有多少是我的面子、我的委屈？","rec":"陆澄录","kj":[["r","纔","才","是中和的"],["r","看","着","的纔自家"]]},{"n":59,"t":"哭则不歌","yw":"问：「『哭则不歌』。」先生曰：「圣人心体自然如此。」","bh":"陆澄问《论语》说孔子「这一天哭过就不再唱歌」。先生说：「圣人的心体自然就是这样。」","zs":[["哭则不歌","《论语·述而》：「子于是日哭，则不歌。」孔子在吊丧哭泣的这一天就不再唱歌。"]],"gl":[44,58],"q":"孔子哭过就不唱歌，是遵守礼节吗？","a":"不是刻意守礼，而是圣人心体自然如此：真哀伤过，自然唱不出来。","yong":"刚跟客户吵完架就嬉皮笑脸？要么吵架是演的，要么笑是装的。","rec":"陆澄录","kj":[]},{"n":60,"t":"克己要一毫不存","yw":"克己须要扫除廓清，一毫不存方是。有一毫在，则众恶相引而来。","bh":"克制私欲必须彻底扫除干净，一丝一毫都不留下才行。只要还有一丝一毫在，各种恶念就会互相牵引着跑来。","zs":[["廓清","彻底肃清。"]],"gl":[39,19],"q":"为什么克己要一毫不存？","a":"留下一点私欲，它就会牵引出更多恶念，像病根一样复发。","yong":"「就偷懒这一次」「就刷十分钟」。那一毫不清，后面全都跟着来了。","rec":"陆澄录","kj":[]},{"n":61,"t":"礼乐之本先于律吕之数","yw":"问《律吕新书》。先生曰：「学者当务为急，算得此数熟，亦恐未有用，必须心中先具礼乐之本方可。且如其书说冬用管以候气，然至冬至那一刻时，管灰之飞，或有先后须臾之间，焉知那管正值冬至之刻？须自心中先晓得冬至之刻始得。此便有不通处。学者须先从礼乐本原上用功。」","bh":"陆澄问《律吕新书》。先生说：「学者应当先做最紧要的事，就算把这些数字算得烂熟，恐怕也没什么用，必须心中先具备礼乐的根本才行。比如书中说用律管来测候节气，但到冬至那一刻，律管中的灰飞出来，可能有先后片刻之差，怎么知道哪根管正好对上冬至那一刻？必须自己心中先知道冬至那一刻才行。这就有说不通的地方。学者必须先从礼乐的本原上用功。」","zs":[["《律吕新书》","南宋蔡元定所著的音律学著作，朱熹为之作序。"],["管以候气","古代「葭灰候气」法：将芦苇灰放入律管埋在地下，某节气到时相应律管中的灰会飞出。"]],"gl":[67],"q":"阳明为什么说先算熟律吕之数也恐无用？","a":"因为数是末，礼乐之本在心。而且候气法自身有说不通处，最终还要靠心中先知。","con":"反方：这里阳明对候气法的质疑是对的（候气法确实不科学），但他由此推出「数无用」就过头了。音律学、天文历法恰恰需要精确计算，中国古代科学在这些领域的发展，正是靠蔡元定这类「算得此数熟」的人。","rec":"陆澄录","kj":[]},{"n":62,"t":"磨镜而非照镜","yw":"曰仁云：「心犹镜也。圣人心如明镜，常人心如昏镜。近世格物之说，如以镜照物，照上用功，不知镜尚昏在，何能照？先生之格物，如磨镜而使之明，磨上用功，明了后亦未尝废照。」","bh":"徐爱说：「心就像镜子。圣人的心像明亮的镜子，普通人的心像昏暗的镜子。近世（朱子一派）的格物学说，就像拿镜子去照东西，在照上下功夫，却不知道镜子还是昏暗的，怎么照得出来？先生的格物，就像磨镜子让它明亮，在磨上下功夫，镜子明亮之后也从来没有废弃照物。」","zs":[["曰仁","徐爱的字。这条是徐爱的话，被陆澄记下。"]],"gl":[21,7,6],"q":"「磨镜」和「照镜」分别比喻什么？","a":"照镜比喻朱子向外格物穷理；磨镜比喻阳明在心上去私欲。阳明的格物是先磨明，明了之后照物自然准确。","yong":"读一百本营销书是在「照」；反省自己哪里急功近利、哪里不诚，是在「磨」。","rec":"陆澄录","kj":[]},{"n":63,"t":"道无精粗：一间房","yw":"问道之精粗。先生曰：「道无精粗，人之所见有精粗。如这一间房，人初进来，只见一个大规模如此；处久，便柱壁之类，一一看得明白；再久，如柱上有些文藻，细细都看出来；然只是一间房。」","bh":"陆澄问道的精细和粗浅。先生说：「道没有精粗之分，是人的见识有精粗之分。比如这间房子，人刚进来时，只看到一个大致轮廓；待久了，柱子墙壁之类的，一一看得清楚；再待久一点，柱子上的花纹装饰，都能细细看出来；但始终只是这一间房子。」","zs":[["文藻","花纹、装饰。"]],"gl":[22,64],"q":"「道无精粗」怎么理解？","a":"道本身是完整一体的，看起来有粗有精，是因为人的认识在逐步深入，就像在同一间房里越看越细。","yong":"做了十年外贸的人，和新人看的是同一个市场，只是看到的细节不一样。","rec":"陆澄录","kj":[["r","贝","见","粗人之所"],["r","贝","见","初进来只"]]},{"n":64,"t":"私欲如尘，一日不扫","yw":"先生曰：「诸公近见时少疑问，何也？人不用力，莫不自以为已知，为学只循而行之是矣。殊不知私欲日生，如地上尘，一日不扫便又有一层。着实用功，便见道无终穷，愈探愈深，必使精白无一毫不彻方可。」","bh":"先生说：「各位最近来见我，很少有疑问，为什么？人不用力，没有不自以为已经懂了的，以为做学问只要照着去做就行了。殊不知私欲每天都在生出来，就像地上的灰尘，一天不扫就又多一层。切实用功，就会发现道没有穷尽，越探索越深，一定要做到精纯洁白、没有一丝一毫不透彻才行。」","zs":[["精白","精纯洁白。"]],"gl":[22,63,65],"q":"为什么没有疑问反而是坏事？","a":"没有疑问往往是因为没用力，自以为懂了。真用功的人会不断发现新问题，私欲也每天都在生。","yong":"如果你读这本书一路「嗯嗯都懂」，那多半是没在用。在生活里试一条，问题自然就来了。","rec":"陆澄录","kj":[["r","己","已","不自以为"],["r","看","着","又有一层"]]},{"n":65,"t":"走一段，认一段","yw":"问：「知至然后可以言诚意。今天理人欲知之未尽，如何用得克己工夫？」先生曰：「人若真实切己用功不已，则于此心天理之精微，日见一日，私欲之细微，亦日见一日。若不用克己工夫，终日只是说话而已，天理终不自见，私欲亦终不自见。如人走路一般，走得一段方认得一段，走到歧路处，有疑便问，问了又走，方渐能到得欲到之处。今人于已知之天理不肯存，已知之人欲不肯去，且只管愁不能尽知，只管闲讲，何益之有？且待克得自己无私可克，方愁不能尽知，亦未迟在。」","bh":"陆澄问：「《大学》说知识达到极致之后才能谈诚意。现在对天理人欲还没有完全知道，怎么能用克己的功夫？」先生说：「人如果真实地、切身地不停用功，那么对这颗心中天理的精微之处，就会一天比一天看得清楚，对私欲的细微之处，也会一天比一天看得清楚。如果不用克己的功夫，整天只是说说而已，天理始终不会自己显现，私欲也始终不会自己显现。就像人走路一样，走过一段才认得一段，走到岔路口有疑问就问，问了再走，才能逐渐到达想去的地方。现在的人对已经知道的天理不肯保存，对已经知道的人欲不肯去除，只管发愁不能全部知道，只管空谈，有什么用？等到把自己克制到没有私欲可克的时候，再发愁不能全部知道，也还不晚。」","zs":[["知至然后可以言诚意","《大学》：「物格而后知至，知至而后意诚。」朱子据此认为要先穷理致知，才能诚意。"]],"gl":[5,64,30],"q":"天理人欲还没认清，能不能先克己？","a":"能，而且必须。像走路一样，走一段认一段。先把已经知道的天理存住、已经知道的私欲去掉。","yong":"别等「把外贸 SEO 全学透了」再动手建站。先做你已经知道该做的，路走着走着就清楚了。","rec":"陆澄录","kj":[["r","宣","实","曰人若真"],["r","格","终","而已天理"],["r","胳","终","见私欲亦"],["r","贝","见","亦胳不自"],["r","己","已","处今人于"],["r","己","已","理不肯存"],["r","巨","且","何益之有"]]},{"n":66,"t":"道无方体","yw":"问：「道一而已，古人论道往往不同，求之亦有要乎？」先生曰：「道无方体，不可执着。若拘滞于文义上求道，远矣。如今人只说天，其实何尝见天？谓日月风雷即天，不可；谓人物草木不是天，亦不可。道即是天，若识得时，何莫而非道？人但各以其一隅之见，认定以为道止如此，所以不同。若解向里寻求，见得自己心体，即无时无处不是此道。亘古亘今，无终无始，更有甚同异？心即道，道即天，知心则知道、知天。」又曰：「诸君要实见此道，须从自己心上体认，不假外求始得。」","bh":"陆澄问：「道只有一个，古人谈论道却往往不同，探求道也有要领吗？」先生说：「道没有固定的方位和形体，不能执着。如果拘泥在文字意义上去求道，就差得远了。比如现在人们说天，其实何曾见过天？说日月风雷就是天，不对；说人物草木不是天，也不对。道就是天，如果认识了，什么不是道？人们只是各自凭一个角落里的见解，认定道就只是这样，所以说法不同。如果懂得向内寻求，看见自己的心体，那就无时无处不是这个道。从古到今，无终无始，还有什么同和异？心就是道，道就是天，认识了心，就认识了道、认识了天。」又说：「各位想真正见到这个道，必须从自己心上去体认，不借助外求才行。」","zs":[["方体","方位和形体。《周易·系辞》：「神无方而易无体。」"],["亘古亘今","从古到今，贯通古今。"]],"gl":[3,31,49],"q":"古人论道为什么说法不一？","a":"道无方体，每个人只凭一角之见认定道就是这样，所以不同。向内见到心体，就无所谓同异。","yong":"跟同行争论「SEO 到底该怎么做」时，想想你们是不是各站一个角落在说同一头大象。","rec":"陆澄录","kj":[["r","却","若","不可执着"],["r","鄎","即","亦不可道"],["r","旦","亘","不是此道"],["r","一旦","亘","此道旦古"]]},{"n":67,"t":"成就心体，用在其中","yw":"问：「名物度数，亦须先讲求否？」先生曰：「人只要成就自家心体，则用在其中。如养得心体，果有未发之中，自然有发而中节之和，自然无施不可。苟无是心，虽预先讲得世上许多名物度数，与己原不相干，只是装缀，临时自行不去。亦不是将名物度数全然不理，只要『知所先后，则近道』。」又曰：「人要随才成就，才是其所能为。如夔之乐，稷之种，是他资性合下便如此。成就之者，亦只是要他心体纯乎天理。其运用处，皆从天理上发来，然后谓之才。到得纯乎天理处，亦能不器。使夔、稷易艺而为，当亦能之。」又曰：「如『素富贵，行乎富贵；素患难，行乎患难』，皆是不器。此惟养得心体正者能之。」","bh":"陆澄问：「名物制度、礼仪数目这些具体知识，也需要先去研究吗？」先生说：「人只要成就自己的心体，功用就在其中了。如果养好了心体，真有了未发之中，自然就有发出来都恰到好处的和，自然做什么都可以。如果没有这颗心，就算预先把世上许多名物制度都研究了，也和自己本来不相干，只是装点门面，到时候自己用不出来。这也不是说对名物制度完全不理，只是要『知道先后次序，就接近道了』。」又说：「人要根据各自的才能来成就，才能是他能做的事。比如夔擅长音乐，稷擅长种植，是他们的天资本来就这样。成就他们，也只是要他们的心体纯乎天理。他们运用才能的地方，都从天理上发出来，这才叫作才。到了纯乎天理的地步，也就能不局限于一种用途。假如让夔和稷交换技艺去做，应该也能做得好。」又说：「比如『处在富贵中就按富贵的情况去做，处在患难中就按患难的情况去做』，这都是不器。只有养得心体端正的人才能做到。」","zs":[["名物度数","名物指各种事物的名称、类别；度数指制度、规格、数目。"],["知所先后，则近道","《大学》：「物有本末，事有终始，知所先后，则近道矣。」"],["夔、稷","夔是舜时的乐官，稷（后稷）是舜时的农官。"],["合下","本来、一开始。"]],"gl":[29,61,52],"q":"阳明是不是认为具体知识不重要？","a":"不是全然不理，而是讲先后：先成就心体，具体知识才能真正为己所用，否则只是装点门面。","yong":"技术栈可以学一堆，但如果你不真懂客户要什么，Astro、Tailwind 学得再熟也只是装缀。","rec":"陆澄录","kj":[["r","茍","苟","无施不可"],["r","薆","夔","能不器使"]]},{"n":68,"t":"有源之井","yw":"「与其为数顷无源之塘水，不若为数尺有源之井水，生意不穷。」时先生在塘边坐，傍有井，故以之喻学云。","bh":"「与其做几百亩没有源头的池塘水，不如做几尺有源头的井水，生机无穷无尽。」当时先生坐在池塘边，旁边有口井，所以用它来比喻做学问。","zs":[["顷","面积单位，一顷为一百亩。"],["生意","生机。"]],"gl":[30,31],"q":"「有源之井」比喻什么？","a":"比喻学问要有本原（心体），哪怕规模小，也生生不息；没有本原，看着再大也会干涸。","yong":"一个靠真专业积累口碑的小工作室，胜过一个靠投流撑起来的大摊子。","rec":"陆澄录","kj":[]},{"n":69,"t":"一日便是一元","yw":"问：「世道日降，太古时气象，如何复见得？」先生曰：「一日便是一元。人平旦时起坐，未与物接，此心清明景象，便如在伏羲时游一般。」","bh":"陆澄问：「世道一天天衰落，太古时代的气象怎么才能再见到？」先生说：「一天就是一个『元』（一个完整的世界周期）。人清晨起床坐着，还没和外物接触时，这颗心清澈明净的样子，就像在伏羲时代里游历一样。」","zs":[["一元","宋代邵雍以「元、会、运、世」计算宇宙周期，一元为十二万九千六百年。阳明说一日便是一元，意为一天就是一个小宇宙周期。"],["平旦","天刚亮的时候。底本作「平日一时」，据通行本改。"]],"gl":[47,11],"q":"太古气象要去哪里找？","a":"不必回到古代，每天清晨未与物接时，心的清明状态就是太古气象。","yong":"每天早上起来先别看手机。那几分钟清明，就是你的「伏羲时代」。","rec":"陆澄录","kj":[["r","日一","旦","一元人平"]]},{"n":70,"t":"心统五官，如君不坐吏部","yw":"问：「心要逐物，如何则可？」先生曰：「人君端拱清穆，六卿分职，天下乃治。心统五官，亦要如此。今眼要视时，心便逐在色上；耳要听时，心便逐在声上。如人君要选官时，便自去坐在吏部；要调军时，便自去坐在兵部。如此，岂惟失却君体，六卿亦皆不得其职。」","bh":"陆澄问：「心总是追着外物跑，怎样才好？」先生说：「君主端坐拱手、清静肃穆，六部大臣各司其职，天下才能治理好。心统领五官，也要这样。现在眼睛要看时，心就追到颜色上去了；耳朵要听时，心就追到声音上去了。这就像君主要选官时，就亲自跑去坐在吏部；要调兵时，就亲自跑去坐在兵部。这样一来，不但君主失了君主的体统，六部大臣也都没法履行职责了。」","zs":[["六卿","这里指明代的吏、户、礼、兵、刑、工六部。"],["五官","耳、目、口、鼻、身（形）。"],["清穆","清静肃穆。"]],"gl":[15,48],"q":"「心逐物」的毛病，阳明用什么比喻说明？","a":"君主亲自跑去各部门干活，结果君主失了体统，各部门也乱了。心应该像君主一样做主宰，让五官各司其职。","yong":"老板啥事都亲自盯，团队就废了；你的心被每条消息牵着走，你的判断也就废了。","rec":"陆澄录","kj":[]},{"n":71,"t":"知善知恶，充之遏之","yw":"善念发而知之，而充之；恶念发而知之，而遏之。知其充与遏者，志也，天聪明也。圣人只有此，学者当存此。","bh":"善念生起时能察觉它，并扩充它；恶念生起时能察觉它，并遏制它。那个知道要扩充、要遏制的，就是志，就是天赋的聪明。圣人只有这一点，学者应当保存这一点。","zs":[["天聪明","《尚书·皋陶谟》：「天聪明，自我民聪明。」这里指人天赋的明觉，即良知。"]],"gl":[8,39,53],"q":"「知其充与遏者」是什么？","a":"是志，是天聪明，也就是良知：知道哪个念头该扩充、哪个该遏制。","yong":"这就是后来「四句教」的雏形：知善知恶是良知，为善去恶是格物。","rec":"陆澄录","kj":[["r","众","其","而遏之知"]]},{"n":72,"t":"闲思杂虑的根","yw":"澄曰：「好色、好利、好名等心，固是私欲。如闲思杂虑，如何亦谓之私欲？」先生曰：「毕竟从好色、好利、好名等根上起，自寻其根便见。如汝心中决知是无有做劫盗的思虑，何也？以汝元无是心也。汝若于货、色、名、利等心，一切皆如不做劫盗之心一般，都消灭了，光光只是心之本体，看有甚闲思虑？此便是『寂然不动』，便是『未发之中』，便是『廓然大公』，自然『感而遂通』，自然『发而中节』，自然『物来顺应』。」","bh":"陆澄说：「好色、好利、好名这些心，当然是私欲。可是像那些闲思杂念，为什么也叫私欲？」先生说：「它们终究是从好色、好利、好名这些根上生出来的，自己去找找它的根就明白了。比如你心里确定没有去做强盗的念头，为什么？因为你本来就没有那个心。你如果对财货、美色、名声、利益这些心，都像不想做强盗的心一样，全部消灭干净，光光亮亮只剩下心的本体，看还有什么闲思杂念？这就是『寂然不动』，就是『未发之中』，就是『廓然大公』，自然就能『感而遂通』，自然就能『发而中节』，自然就能『物来顺应』。」","zs":[["寂然不动，感而遂通","《周易·系辞上》：「易无思也，无为也，寂然不动，感而遂通天下之故。」"],["廓然大公，物来顺应","程颢《定性书》：「君子之学，莫若廓然而大公，物来而顺应。」"]],"gl":[39,76,28],"q":"为什么闲思杂虑也算私欲？","a":"追根溯源，它们都从好色、好利、好名的根上生出来。就像你从不会有做强盗的念头，是因为根本没有那个心。","yong":"走神时追一下：我在想什么？多半是「那单能不能成」「别人怎么看我」。根就在那。","con":"反方：现代认知科学认为大脑的「默认模式网络」会自发产生走神，这是正常的神经活动，甚至与创造力有关，未必都源于私欲。把所有闲思都归为私欲，可能让人对正常的心理活动产生不必要的焦虑。","rec":"陆澄录","kj":[["r","雉","杂","欲如闲思"]]},{"n":73,"t":"志至气次","yw":"问「志至气次」。先生曰：「『志之所至，气亦至焉』之谓，非『极至次贰』之谓。『持其志』，则养气在其中；『无暴其气』，则亦持其志矣。孟子救告子之偏，故如此夹持说。」","bh":"陆澄问孟子说的「志至焉，气次焉」。先生说：「意思是『志所到之处，气也随之而到』，不是说『志是第一位，气是第二位』。『坚守志向』，培养气就在其中了；『不扰乱自己的气』，也就是坚守了志向。孟子是为了纠正告子的偏颇，所以这样从两头夹持着说。」","zs":[["志至气次","《孟子·公孙丑上》：「夫志，气之帅也；气，体之充也。夫志至焉，气次焉。故曰：持其志，无暴其气。」"],["极至次贰","最高的和次一等的。"],["夹持","从两边同时扶持、约束。"]],"gl":[81,16],"q":"志和气是主次关系吗？","a":"不是。志到气就到，持志就是养气，不暴气也就是持志，两者互相成全。","yong":"身体状态（气）不好时，意志（志）也撑不住；反过来也一样。别只练意志，也要睡够觉。","rec":"陆澄录","kj":[["r","日","曰","气次先生"]]},{"n":74,"t":"圣人如天，无所谓降","yw":"问：「先儒曰：『圣人之道，必降而自卑；贤人之言，则引而自高。』如何？」先生曰：「不然，如此却乃伪也。圣人如天，无往而非天，三光之上，天也，九地之下，亦天也，天何尝有降而自卑？此所谓『大而化之』也。贤人如山岳，守其高而已。然百仞者不能引而为千仞，千仞者不能引而为万仞，是贤人未尝引而自高也。引而自高，则伪矣。」","bh":"陆澄问：「程子说：『圣人讲道，一定会降低姿态让自己显得卑下；贤人说话，则会抬高自己。』这话怎么样？」先生说：「不对，这样就是虚伪了。圣人就像天，没有哪里不是天，日月星辰之上是天，九层地底之下也是天，天何曾降低自己？这就是所谓『大而化之』。贤人就像山岳，只是守住自己的高度罢了。但百仞高的山不能拉高成千仞，千仞高的山不能拉高成万仞，所以贤人从来没有抬高过自己。抬高自己，就是虚伪了。」","zs":[["先儒曰","这是程颐的话。"],["三光","日、月、星。"],["九地","极深的地下。"],["仞","古代长度单位，一仞约七八尺。"]],"gl":[22,63],"q":"阳明为什么说「降而自卑」「引而自高」都是伪？","a":"因为圣人如天本无高低，无所谓降；贤人如山，高就是那么高，也拉不高。刻意降低或抬高都是作假。","yong":"在客户面前既不必装谦虚，也不必吹牛。你有多少本事就是多少，真实最有力量。","rec":"陆澄录","kj":[["r","日","曰","如何先生"]]},{"n":75,"t":"伊川与延平论未发","yw":"问：「伊川谓『不当于喜怒哀乐未发之前求中』，延平却教学者看未发之前气象，何如？」先生曰：「皆是也。伊川恐人于未发前讨个中，把中做一物看，如吾向所谓认气定时做中，故令只于涵养省察上用功。延平恐人未便有下手处，故令人时时刻刻求未发前气象，使人正目而视惟此，倾耳而听惟此，即是『戒慎不睹，恐惧不闻』的工夫。皆古人不得已诱人之言也。」","bh":"陆澄问：「程伊川说『不应当在喜怒哀乐未发之前去求中』，李延平却教学者去体察未发之前的气象，这怎么解释？」先生说：「都对。伊川是怕人在未发之前去找一个中，把中当成一个东西来看，就像我以前说的把气定的时候当成中，所以让人只在涵养和省察上用功。延平是怕人一时找不到下手的地方，所以让人时时刻刻去求未发之前的气象，让人眼睛只看着这个、耳朵只听着这个，这就是『在没人看见的地方也戒慎，在没人听见的地方也恐惧』的功夫。这都是古人不得已用来引导人的话。」","zs":[["延平","李侗，号延平先生，朱熹的老师。他教人「默坐澄心，体认天理」，观喜怒哀乐未发时的气象。"],["戒慎不睹，恐惧不闻","《中庸》：「君子戒慎乎其所不睹，恐惧乎其所不闻。」"]],"gl":[28,76,17],"q":"伊川和延平的说法相反，阳明为什么说都对？","a":"两人都是针对不同毛病的权宜之说：伊川防人把中当成一物去找，延平防人无从下手。都是不得已的引导。","yong":"两个导师给你的建议相反？先看各自在纠正你的什么毛病。","rec":"陆澄录","kj":[["r","日","曰","何如先生"],["r","入","人","手处故令"],["r","末","未","时刻刻求"],["r","而","前","刻求末发"]]},{"n":76,"t":"中如明镜，病疟之喻","yw":"澄问：「喜怒哀乐之中和，其全体常人固不能有。如一件小事当喜怒者，平时无喜怒之心，至其临时，亦能中节，亦可谓之中和乎？」先生曰：「在一时之事，固亦可谓之中和，然未可谓之大本达道。人性皆善，中和是人人原有的，岂可谓无？但常人之心既有所昏蔽，则其本体虽亦时时发见，终是暂明暂灭，非其全体大用矣。无所不中，然后谓之大本；无所不和，然后谓之达道。惟天下之至诚，然后能立天下之大本。」曰：「澄于『中』字之义尚未明。」曰：「此须自心体认出来，非言语所能喻。中只是天理。」曰：「何者为天理？」曰：「去得人欲，便识天理。」曰：「天理何以谓之中？」曰：「无所偏倚。」曰：「无所偏倚，是何等气象？」曰：「如明镜然，全体莹彻，略无纤尘染着。」曰：「偏倚是有所染着，如着在好色、好利、好名等项上，方见得偏倚。若未发时，美色名利皆未相着，何以便知其有所偏倚？」曰：「虽未相着，然平日好色、好利、好名之心原未尝无。既未尝无，即谓之有；既谓之有，则亦不可谓无偏倚。譬之病疟之人，虽有时不发，而病根原不曾除，则亦不得谓之无病之人矣。须是平日好色、好利、好名等项一应私心，扫除荡涤，无复纤毫留滞，而此心全体廓然，纯是天理，方可谓之『喜怒哀乐未发之中』，方是天下之大本。」","bh":"陆澄问：「喜怒哀乐的中和，普通人当然不能完全具备。但比如一件小事，该喜或该怒的，平时心里并没有喜怒，到了事情来时，也能做到恰到好处，这也可以叫中和吗？」先生说：「在某一时某一事上，当然也可以叫中和，但还不能叫作天下的大本、达道。人性都是善的，中和是人人本来就有的，怎么能说没有？但普通人的心已经有所昏蔽，所以他的本体虽然也时时显现，终究是一会儿明一会儿灭，不是它的全体大用。处处都中，才能叫大本；处处都和，才能叫达道。只有天下最真诚的人，才能确立天下的大本。」陆澄说：「我对『中』字的含义还不明白。」先生说：「这必须从自己心上体认出来，不是言语能说明白的。中只是天理。」陆澄问：「什么是天理？」先生说：「去掉了人欲，就认识天理了。」陆澄问：「天理为什么叫作中？」先生说：「因为它没有偏向、没有倚靠。」陆澄问：「没有偏倚，是什么样的气象？」先生说：「就像明镜一样，整体晶莹透彻，没有一丝灰尘沾染。」陆澄问：「偏倚是有所沾染，比如沾染在好色、好利、好名上，才看得出偏倚。如果在未发的时候，美色名利都还没有沾上，怎么就知道它有偏倚呢？」先生说：「虽然还没有沾上，但平时好色、好利、好名的心从来没有消失过。既然从来没消失，就叫作有；既然叫作有，就不能说没有偏倚。就像得了疟疾的人，虽然有时不发作，但病根从来没有除掉，也不能说他是没病的人。必须把平时好色、好利、好名等一切私心，全部扫除洗净，没有一丝一毫残留，让这颗心整体空阔，纯是天理，才能叫作『喜怒哀乐未发之中』，才是天下的大本。」","zs":[["大本达道","《中庸》：「中也者，天下之大本也；和也者，天下之达道也。」"],["疟","疟疾，症状周期性发作，不发作时与常人无异。"]],"gl":[28,45,72,21],"q":"没遇到诱惑时心很平静，能说没有偏倚吗？","a":"不能。就像疟疾不发作时病根还在，好色好利好名之心平时潜伏着，也是有偏倚。必须连根扫除，才是未发之中。","yong":"没碰到大单时你说自己不贪？等真有回扣摆在面前再看。病根要趁不发作时就挖。","rec":"陆澄录","kj":[["r","蜼","虽","则其本体"],["r","看","着","利皆未相"]]},{"n":77,"t":"颜子没而圣学亡","yw":"问：「『颜子没而圣学亡』，此语不能无疑。」先生曰：「见圣道之全者惟颜子，观『喟然一叹』可见。其谓『夫子循循然善诱人，博我以文，约我以礼』，是见破后如此说。博文约礼如何是善诱人？学者须思之。道之全体，圣人亦难以语人，须是学者自修自悟。颜子『虽欲从之，末由也已』，即文王『望道未见』意。望道未见，乃是真见。颜子没，而圣学之正派遂不尽传矣。」","bh":"陆澄问：「先生说『颜回死后圣学就失传了』，这话我不能没有疑问。」先生说：「见到圣道全体的只有颜回，看他那一声『喟然长叹』就知道了。他说『老师循序渐进、善于引导人，用文献来丰富我，用礼来约束我』，这是看透之后才这样说的。博文约礼为什么是善于引导人？学者必须好好想想。道的全体，圣人也很难用语言告诉人，必须学者自己修养、自己领悟。颜回说『虽然想追随上去，却找不到路径』，就是文王『望见了道却好像没看见』的意思。望道未见，才是真正的看见。颜回死后，圣学的正宗就没有完整传下来了。」","zs":[["颜子","颜回，孔子最得意的弟子，早逝。"],["喟然一叹","《论语·子罕》：「颜渊喟然叹曰：仰之弥高，钻之弥坚；瞻之在前，忽焉在后。夫子循循然善诱人，博我以文，约我以礼，欲罢不能。既竭吾才，如有所立卓尔。虽欲从之，末由也已。」"],["末由","没有途径。底本作「未由」，据《论语》原文改。"]],"gl":[22,9,24],"q":"为什么说「望道未见，乃是真见」？","a":"真正看见道的人，才知道道无穷无尽、永远追不到底，所以觉得「未见」。自以为见到了的，反而没见到。","yong":"越懂行的人越觉得自己不懂。如果你觉得某个领域「也就这样」，多半还没入门。","rec":"陆澄录","kj":[["r","恩","思","人学者须"],["r","俉","悟","者自修自"],["r","未","末","虽欲从之"]]},{"n":78,"t":"心、知、意、物","yw":"问：「身之主为心，心之灵明是知，知之发动是意，意之所着为物，是如此否？」先生曰：「亦是。」","bh":"陆澄问：「身体的主宰是心，心的灵明是知，知的发动是意，意所附着的是物，是这样吗？」先生说：「也对。」","zs":[["参见第6条","第6条的表述是：身之主宰便是心，心之所发便是意，意之本体便是知，意之所在便是物。两处表述略有不同，阳明都认可。"]],"gl":[6,83],"q":"背出心、意、知、物四者的关系。","a":"身之主宰是心，心之所发是意，意之本体是知，意之所在是物。","rec":"陆澄录","kj":[["r","看","着","意意之所"]]},{"n":79,"t":"心常现在便是学","yw":"只存得此心常见在，便是学。过去未来事，思之何益？徒放心耳。","bh":"只要保持这颗心常常在当下，就是学问。过去的事、未来的事，想它有什么用？只是让心放逸罢了。","zs":[["见在","同「现在」，当下。"],["放心","放失的心。《孟子》：「学问之道无他，求其放心而已矣。」"]],"gl":[48,72],"q":"阳明说想过去未来是「放心」，那计划还要不要做？","a":"计划是当下该做的事，做计划时心在当下；反复后悔过去、焦虑未来，心就跑了。","yong":"失眠时脑子里放的是昨天的错和明天的会？那都是「放心」。把注意力拉回呼吸。","con":"反方：复盘过去和规划未来是成长和经营的必要功课，一概说「思之何益」容易被误解为不必反思和计划。阳明自己就是精于谋划的军事家，他反对的是无益的空想和反刍，而不是有目的的思考。","rec":"陆澄录","kj":[]},{"n":80,"t":"言语无序见心不存","yw":"言语无序，亦足以见心之不存。","bh":"说话颠三倒四、没有条理，也足以看出心不在了。","zs":[],"gl":[79],"q":"为什么从说话就能看出心在不在？","a":"心有主宰，说话自然有条理；心散乱了，话也就乱了。","yong":"给客户回邮件写得颠三倒四？先停下来，心收回来再写。","rec":"陆澄录","kj":[]},{"n":81,"t":"孟子与告子的不动心","yw":"尚谦问：「孟子之『不动心』，与告子异。」先生曰：「告子是硬把捉着此心，要他不动；孟子却是集义到自然不动。」又曰：「心之本体原自不动。心之本体即是性，性即是理。性元不动，理元不动。集义是复其心之本体。」","bh":"薛尚谦问：「孟子的『不动心』和告子的不同在哪里？」先生说：「告子是硬抓着这颗心，强迫它不动；孟子却是积累义行，到了自然不动。」又说：「心的本体本来就是不动的。心的本体就是性，性就是理。性本来不动，理本来不动。集义就是恢复心的本体。」","zs":[["尚谦","薛侃，字尚谦，广东揭阳人。上卷第95条以后为他所记。"],["不动心","《孟子·公孙丑上》：公孙丑问孟子四十岁是否动心，孟子说「我四十不动心」，又说「告子先我不动心」。"]],"gl":[73,40,23],"q":"告子和孟子的不动心区别在哪里？","a":"告子是硬压住心不让它动；孟子是积累义行，心自然安定不动。","yong":"面对压力，咬牙硬扛是告子式的；平时把事情做对、心里无愧，压力来了自然不慌，是孟子式的。","rec":"陆澄录","kj":[]},{"n":82,"t":"冲漠无朕即万象森然","yw":"万象森然时，亦冲漠无朕；冲漠无朕，即万象森然。冲漠无朕者，一之父；万象森然者，精之母。一中有精，精中有一。","bh":"万物纷然罗列的时候，也是空寂无形的；空寂无形，也就是万物纷然罗列。空寂无形，是『一』的父亲；万物纷然，是『精』的母亲。一中有精，精中有一。","zs":[["冲漠无朕，万象森然","见第21条注。"],["精、一","即「惟精惟一」。"]],"gl":[21,25],"q":"「冲漠无朕」和「万象森然」是先后两个阶段吗？","a":"不是。二者同时存在、互相包含：空寂中已有万象，万象中仍是空寂。就像惟精和惟一是同一功夫。","rec":"陆澄录","kj":[]},{"n":83,"t":"心外无物：孝亲便是物","yw":"心外无物，如吾心发一念孝亲，即孝亲便是物。","bh":"心外没有物，比如我的心生起一个孝顺父母的念头，那孝顺父母就是物。","zs":[],"gl":[6,78],"q":"举例说明「心外无物」。","a":"心发一念孝亲，孝亲这件事就是物。物是意念所在的事，所以不在心外。","rec":"陆澄录","kj":[]},{"n":84,"t":"口耳之学与义袭而取","yw":"先生曰：「今为吾所谓格物之学者，尚多流于口耳，况为口耳之学者，能反于此乎？天理人欲，其精微必时时用力省察克治，方日渐有见。如今一说话之间，虽只讲天理，不知心中倏忽之间已有多少私欲。盖有窃发而不知者，虽用力察之，尚不易见，况徒口讲而可得尽知乎？今只管讲天理来顿放着不循，讲人欲来顿放着不去，岂格物致知之学？后世之学，其极至只做得个义袭而取的工夫。」","bh":"先生说：「现在学我所说的格物之学的人，还大多停留在嘴上和耳朵上，更何况那些本来就是做口耳之学的人，能回到这上面来吗？天理和人欲的精微之处，必须时时用力省察克治，才能逐渐看清。比如现在说一番话的工夫，虽然嘴上讲的全是天理，却不知道心里转瞬之间已经冒出了多少私欲。有些私欲是暗中发动、自己都不知道的，即使用力去察看，还不容易看见，何况只是嘴上讲讲就能全部知道吗？现在只管讲天理，讲完就搁在那里不去遵循；讲人欲，讲完就搁在那里不去除掉，这哪是格物致知的学问？后世的学问，做到极致也只是做了个『偶然做了合义的事而据为己有』的功夫。」","zs":[["口耳之学","《荀子·劝学》：「小人之学也，入乎耳，出乎口。口耳之间则四寸耳，曷足以美七尺之躯哉？」"],["顿放","搁置、放在一边。"],["义袭而取","《孟子·公孙丑上》：「是集义所生者，非义袭而取之也。」指偶然做一件合义的事就想得到浩然之气，而不是长期积累。"]],"gl":[64,65,81],"q":"「口耳之学」的毛病是什么？","a":"只在嘴上讲天理、耳朵听天理，讲完就放着，不去遵循天理、去除人欲。心中私欲时时窃发，嘴上讲是看不见的。","yong":"你现在读这本书，是不是也在做「口耳之学」？读完这条，今天找一个私欲去掉它。","rec":"陆澄录","kj":[]},{"n":85,"t":"知止","yw":"问：「知止者，知至善只在吾心，元不在外也，而后志定。」曰：「然。」","bh":"陆澄问：「『知止』就是知道至善只在我心中，本来就不在外面，然后志向就安定了，对吗？」先生说：「对。」","zs":[["知止","《大学》：「知止而后有定。」"]],"gl":[2,91,92],"q":"「知止」知的是什么？","a":"知道至善只在自己心中，不在外面。知道了这一点，志向才能安定。","rec":"陆澄录","kj":[]},{"n":86,"t":"格者，正也（定义）","yw":"问格物。先生曰：「格者，正也，正其不正以归于正也。」","bh":"陆澄问格物。先生说：「格就是正，纠正那些不正的，使它回归到正。」","zs":[],"gl":[7,6],"q":"阳明对「格」的定义是？","a":"格者，正也，正其不正以归于正也。","yong":"这句值得背下来，是阳明格物说最简洁的定义。","rec":"陆澄录","kj":[]},{"n":87,"t":"格物无间动静","yw":"问：「格物于动处用功否？」先生曰：「格物无间动静，静亦物也。孟子谓『必有事焉』，是动静皆有事。」","bh":"陆澄问：「格物是在动的时候用功吗？」先生说：「格物不分动静，静也是物。孟子说『一定要有所事事』，就是说动的时候和静的时候都有事要做。」","zs":[["必有事焉","《孟子·公孙丑上》：「必有事焉而勿正，心勿忘，勿助长也。」意为养浩然之气要时时有所用功。"]],"gl":[36,23,41],"q":"静坐的时候还需要格物吗？","a":"需要。静也是物，静时有念头就要格。动静都有事，格物不分动静。","rec":"陆澄录","kj":[]},{"n":88,"t":"工夫难处在格物致知","yw":"工夫难处，全在格物致知上，此即诚意之事。意既诚，大段心亦自正，身亦自修。但正心修身工夫，亦各有用力处，修身是已发边，正心是未发边。心正则中，身修则和。","bh":"功夫最难的地方，全在格物致知上，这就是诚意的事。意诚了，心大体上也就自然端正了，身也就自然修养好了。但正心和修身的功夫，也各有用力的地方：修身是在已发的一边，正心是在未发的一边。心正就是中，身修就是和。","zs":[["八条目","《大学》的格物、致知、诚意、正心、修身、齐家、治国、平天下。"]],"gl":[6,89,28],"q":"正心和修身分别对应什么？","a":"正心对应未发，心正则中；修身对应已发，身修则和。","rec":"陆澄录","kj":[["r","日","已","处修身是"]]},{"n":89,"t":"万物一体之仁","yw":"自格物致知至平天下，只是一个明明德。虽亲民亦明德事也。明德是此心之德，即是仁。『仁者以天地万物为一体』，使有一物失所，便是吾仁有未尽处。","bh":"从格物致知到平天下，只是一个明明德。就连亲民也是明德的事。明德是这颗心的德性，也就是仁。『仁者把天地万物看作一体』，假如有一件东西不得其所，就是我的仁还有没尽到的地方。","zs":[["仁者以天地万物为一体","程颢语。阳明晚年的《大学问》对此有充分发挥。"]],"gl":[1,90,93],"q":"为什么「有一物失所，便是吾仁有未尽」？","a":"因为仁者与万物一体，万物中有一物不得其所，就像自己身体有一处不适，说明仁还没做到位。","yong":"客户买了你的产品却用得不顺？不是「他不会用」，是你的仁还没尽到。","rec":"陆澄录","kj":[]},{"n":90,"t":"不说亲民便似老佛","yw":"只说「明明德」而不说「亲民」，便似老、佛。","bh":"只说『明明
