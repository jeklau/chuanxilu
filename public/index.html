德』而不说『亲民』，就像道家和佛家了。","zs":[],"gl":[1,89,49],"q":"为什么只讲明德不讲亲民就像佛老？","a":"只修自己而不顾人伦和百姓，就是独善其身、离群出世，那是佛老的路子。","yong":"只顾提升自己、不管团队和客户，修得再好也是半截功夫。","rec":"陆澄录","kj":[]},{"n":91,"t":"至善者性","yw":"至善者，性。性元无一毫之恶，故曰至善。止之，是复其本然而已。","bh":"至善，就是性。性本来没有一丝一毫的恶，所以叫至善。止于至善，只是恢复它本来的样子罢了。","zs":[],"gl":[2,85,92],"q":"「止于至善」是要达到一个外在目标吗？","a":"不是。至善就是本性，止于至善只是恢复本来面目。","rec":"陆澄录","kj":[]},{"n":92,"t":"定静安虑得","yw":"问：「知至善即吾性，吾性具吾心，吾心乃至善所止之地，则不为向时之纷然外求，而定则不扰，不扰而静，静而不妄动则安，安则一心一意只在此处，千思万想，务求必得此至善，是能虑而得矣。如此说是否？」先生曰：「大略亦是。」","bh":"陆澄问：「知道至善就是我的本性，我的本性具备在我的心中，我的心就是至善所停留的地方，那么就不会像以前那样纷纷向外寻求，志向就安定了。安定了就不会纷扰而能静，静了就不会乱动而能安，安了就一心一意只在这里，千思万想，务求一定要得到这个至善，这就是能虑而后能得了。这样说对吗？」先生说：「大体上也对。」","zs":[["定静安虑得","《大学》：「知止而后有定，定而后能静，静而后能安，安而后能虑，虑而后能得。」"]],"gl":[85,91,2],"q":"《大学》「定静安虑得」的起点是什么？","a":"是「知止」：知道至善就在自己心中，不再向外纷纷寻求。","rec":"陆澄录","kj":[]},{"n":93,"t":"墨子兼爱为何不是仁","yw":"问：「程子云『仁者以天地万物为一体』，何墨氏『兼爱』反不得谓之仁？」先生曰：「此亦甚难言，须是诸君自体认出来始得。仁是造化生生不息之理，虽弥漫周遍，无处不是，然其流行发生，亦只有个渐，所以生生不息。如冬至一阳生，必自一阳生，而后渐渐至于六阳，若无一阳之生，岂有六阳？阴亦然。惟有渐，所以便有个发端处；惟其有个发端处，所以生；惟其生，所以不息。譬之木，其始抽芽，便是木之生意发端处；抽芽然后发干，发干然后生枝生叶，然后是生生不息。若无芽，何以有干有枝叶？能抽芽，必是下面有个根在，有根方生，无根便死，无根何从抽芽？父子兄弟之爱，便是人心生意发端处，如木之抽芽。自此而仁民，而爱物，便是发干生枝生叶。墨氏兼爱无差等，将自家父子兄弟与途人一般看，便自没了发端处，不抽芽便知得他无根，便不是生生不息，安得谓之仁？孝弟为仁之本，却是仁理从里面发生出来。」","bh":"陆澄问：「程子说『仁者把天地万物看作一体』，那为什么墨子的『兼爱』反而不能叫作仁？」先生说：「这也很难说清楚，必须各位自己体认出来才行。仁是天地造化生生不息的道理，虽然弥漫周遍、无处不在，但它的流行生发，也有一个渐进的过程，所以才能生生不息。比如冬至时一阳初生，必定从一阳生起，然后逐渐到六阳，如果没有一阳初生，哪来六阳？阴也是这样。正因为渐进，所以就有一个发端的地方；正因为有发端的地方，所以能生；正因为能生，所以不止息。拿树木来比，刚开始抽芽，就是树木生机的发端之处；抽芽之后长出树干，长出树干之后生出枝叶，然后才是生生不息。如果没有芽，哪来的干和枝叶？能抽芽，必定是下面有根，有根才能生，无根就死，没有根从哪里抽芽？父子兄弟之间的爱，就是人心生机的发端之处，就像树木抽芽。从这里推出去仁爱百姓、爱惜万物，就是长干、生枝、生叶。墨子的兼爱不分差等，把自己的父子兄弟和路人一样看待，就自己丢掉了发端之处，不抽芽就知道它没有根，就不是生生不息，怎么能叫作仁？孝悌是仁的根本，正是仁的道理从里面生发出来的。」","zs":[["墨氏兼爱","墨子主张「兼相爱」，爱无差等。孟子批评「墨氏兼爱，是无父也」。"],["一阳生","《周易》复卦，冬至时一阳爻在下初生，此后阳气逐月增长至乾卦六阳。"],["差等","等级次第。儒家主张「爱有差等」，由亲及疏。"]],"gl":[89,3,30],"q":"阳明为什么说墨子的兼爱不是仁？","a":"仁像树木生长，要从根芽（父子兄弟之爱）发端，再推及百姓万物。兼爱无差等，等于没有发端处，没有根，就不能生生不息。","yong":"想对所有客户一视同仁、平均用力？先把最核心的几个老客户服务到极致，口碑才能长出枝叶。","con":"反方：墨家会反驳说，「爱有差等」恰恰是裙带、偏私和派系的根源，也是中国传统社会「人情大于规则」的思想基础。现代伦理学中的普遍主义（如对陌生人的公平义务）更接近墨子，而非儒家。","rec":"陆澄录","kj":[["r","苦","差","氏兼爱无"]]},{"n":94,"t":"当理即无私心","yw":"问：「延平云『当理而无私心』，『当理』与『无私心』，如何分别？」先生曰：「心即理也。无私心即是当理，未当理便是私心。若析心与理言之，恐亦未善。」又问：「释氏于世间一切情欲之私都不染着，似无私心，但外弃人伦，却是未当理。」曰：「亦只是一统事，都只是成就他一个私己的心。」","bh":"陆澄问：「李延平说『合乎天理而没有私心』，『合乎天理』和『没有私心』，怎么区别？」先生说：「心就是理。没有私心就是合乎天理，不合乎天理就是有私心。如果把心和理分开来说，恐怕也不太妥当。」陆澄又问：「佛家对世间一切情欲私心都不沾染，好像没有私心，但他们抛弃人伦，却又像是不合乎天理。」先生说：「这也只是一回事，都只是成就他自己一个私己的心。」","zs":[["当理而无私心","李侗（延平）语，原意是仁者既要合乎天理，又要没有私心。"],["释氏","佛家。佛教创始人释迦牟尼，故称佛家为释氏。"]],"gl":[3,33,49],"q":"佛家不染情欲，为什么阳明还说它有私心？","a":"因为抛弃人伦、只求自己解脱，本身就是成就一个「私己」的心，所以既未当理，也非无私。","con":"反方：大乘佛教以「普度众生」为志，菩萨道恰恰是为他而非为己，说佛家只求「私己」并不公平。阳明对佛家的批评主要针对出家离世的形式，而非佛学全部义理。","rec":"陆澄录","kj":[]},{"n":95,"t":"持志如心痛","yw":"侃问：「持志如心痛，一心在痛上，安有工夫说闲语、管闲事？」先生曰：「初学工夫如此用亦好，但要使知『出入无时，莫知其乡』，心之神明原是如此，工夫方有着落。若只死死守着，恐于工夫上又发病。」","bh":"薛侃问：「坚守志向就像心口疼一样，一心都在疼上，哪有工夫说闲话、管闲事？」先生说：「初学时这样用功也好，但要让他知道『心的出入没有定时，不知道它往哪里去』，心的神明本来就是这样，功夫才有着落。如果只是死死地守着，恐怕在功夫上又会出毛病。」","zs":[["侃","薛侃，字尚谦。从本条起至第129条为薛侃所录。"],["持志如心痛","朱熹语：「持志如心痛，一心在痛上。」"]],"gl":[48,81,16],"q":"「持志如心痛」有什么问题？","a":"初学可以这样，但死死守着会成为新毛病。心本来活泼灵明、出入无时，功夫要顺着心的本性，而不是捆住它。","yong":"专注不是咬牙死盯。盯得太死，人会绷断。","rec":"薛侃录","kj":[["r","人","上","一心在痛"],["r","力","方","如此工夫"],["d","着","","死死守着"]]},{"n":96,"t":"讲求亦只是涵养","yw":"侃问：「专涵养而不务讲求，将认欲作理，则如之何？」先生曰：「人须是知学，讲求亦只是涵养；不讲求，只是涵养之志不切。」曰：「何谓知学？」曰：「且道为何而学？学个甚？」曰：「尝闻先生教，学是学存天理。心之本体即是天理，体认天理只要自心地无私意。」曰：「如此则只须克去私意便是，又愁甚理欲不明？」曰：「正恐这些私意认不真。」曰：「总是志未切。志切，目视耳听皆在此，安有认不真的道理？『是非之心，人皆有之』，不假外求。讲求亦只是体当自心所见，不成去心外别有个见？」","bh":"薛侃问：「只专注于涵养而不去讲求学问，恐怕会把私欲当成天理，那怎么办？」先生说：「人必须懂得怎么学，讲求学问也只是涵养；不去讲求，只是因为涵养的志向不够迫切。」薛侃问：「什么叫懂得怎么学？」先生说：「你先说说，为什么而学？学的是什么？」薛侃说：「曾听先生教导，学就是学存天理。心的本体就是天理，体认天理只要自己心里没有私意。」先生说：「这样的话只要克去私意就是了，还愁什么天理人欲分不清？」薛侃说：「正是怕这些私意认不清。」先生说：「总是因为志向不够迫切。志向迫切了，眼睛看的、耳朵听的都在这上面，哪有认不清的道理？『是非之心，人人都有』，不需要向外寻求。讲求也只是体会自己心中所见，难道还能到心外另有个见解？」","zs":[["是非之心，人皆有之","《孟子·告子上》。"],["体当","体会、体认。"]],"gl":[3,31,65],"q":"担心认不清私欲，阳明怎么回答？","a":"根本在志不切。志真切了，眼看耳听都在这上面，是非之心人人都有，自然认得清。","yong":"「我不知道这样做对不对」，很多时候是你心里知道，只是不想面对。","rec":"薛侃录","kj":[]},{"n":97,"t":"光景与效验都不是功夫","yw":"先生问在坐之友：「此来工夫何似？」一友举虚明意思。先生曰：「此是说光景。」一友叙今昔异同。先生曰：「此是说效验。」二友惘然，请是。先生曰：「吾辈今日用功，只是要为善之心真切。此心真切，见善即迁，有过即改，方是真切工夫。如此则人欲日消，天理日明。若只管求光景、说效验，却是助长外驰病痛，不是工夫。」","bh":"先生问在座的朋友：「近来功夫做得怎样？」一位朋友讲了心中虚静明澈的感受。先生说：「这是在说光景。」另一位朋友讲了自己今昔的变化。先生说：「这是在说效验。」两位朋友都很茫然，请教怎样才对。先生说：「我们今天用功，只是要为善的心真切。这颗心真切了，见到善就去学，有了过错就改，这才是真切的功夫。这样做，人欲一天天消减，天理一天天明白。如果只管追求光景、谈论效验，那反而是助长向外追逐的毛病，不是功夫。」","zs":[["光景","修炼中出现的某种境界感受，如虚明、空灵之类。"],["效验","功夫带来的效果、变化。"]],"gl":[22,30,64],"q":"为什么说「虚明意思」和「今昔异同」都不是功夫？","a":"一个是追求境界感受，一个是盘点成效，都是在功夫之外看结果，助长了向外追逐。真功夫只是见善即迁、有过即改。","yong":"别在朋友圈晒「我今天冥想到了某种状态」「我今年进步了多少」。那是说光景、说效验。","rec":"薛侃录","kj":[["r","翡","辈","先生曰吾"],["r","力","方","有过即改"]]},{"n":98,"t":"我心与晦庵之心未尝异","yw":"朋友观书，多有摘议晦庵者。先生曰：「是有心求异，即不是。吾说与晦庵时有不同者，为入门下手处有毫厘千里之分，不得不辩。然吾之心与晦庵之心，未尝异也。若其余文义解得明当处，如何动得一字？」","bh":"朋友们读书时，常常有挑剔、议论朱熹的。先生说：「如果是存心要和他不一样，那就不对了。我的学说和朱熹有时不同，是因为在入门下手的地方有毫厘千里的差别，不得不辨明。但我的心和朱熹的心，从来没有不同。至于其他那些文义解释得明白恰当的地方，怎么能改动一个字？」","zs":[["晦庵","朱熹。"],["摘议","挑毛病、议论。"]],"gl":[100,6],"q":"阳明批评朱子，弟子们也跟着批，阳明怎么看？","a":"他反对为了标新立异而批评。他与朱子的分歧只在入门下手处，心是相同的，朱子讲得对的地方一字不能改。","yong":"批评竞争对手或前辈之前，问问自己是在辨是非，还是在找存在感。","con":"阳明对朱子的态度其实有复杂的一面：他编过《朱子晚年定论》，把朱熹说成晚年转向心学，被罗钦顺等人指出年代考订有误。可见他在「有心求异」与「求同」之间也不免牵合。","rec":"薛侃录","kj":[["r","羲","义","若其余文"]]},{"n":99,"t":"精金之喻：成色不在分两（核心条）","yw":"希渊问：「圣人可学而至，然伯夷、伊尹于孔子才力终不同，其同谓之圣者安在？」先生曰：「圣人之所以为圣，只是其心纯乎天理，而无人欲之杂，犹精金之所以为精，但以其成色足而无铜铅之杂也。人到纯乎天理方是圣，金到足色方是精。然圣人之才力，亦有大小不同，犹金之分两有轻重。尧、舜犹万镒，文王、孔子犹九千镒，禹、汤、武王犹七八千镒，伯夷、伊尹犹四五千镒。才力不同，而纯乎天理则同，皆可谓之圣人；犹分两虽不同，而足色则同，皆可谓之精金。以五千镒者而入于万镒之中，其足色同也；以夷、尹而厕之尧、孔之间，其纯乎天理同也。盖所以为精金者，在足色而不在分两；所以为圣者，在纯乎天理而不在才力也。故虽凡人，而肯为学，使此心纯乎天理，则亦可为圣人；犹一两之金，比之万镒，分两虽悬绝，而其到足色处，可以无愧。故曰『人皆可以为尧、舜』者以此。学者学圣人，不过是去人欲而存天理耳，犹炼金而求其足色。金之成色所争不多，则煅炼之工省而功易成；成色愈下，则煅炼愈难。人之气质清浊粹驳，有中人以上，中人以下；其于道有生知安行，学知利行，其下者必须人一己百，人十己千，及其成功则一。后世不知作圣之本是纯乎天理，却专去知识才能上求圣人，以为圣人无所不知，无所不能，我须是将圣人许多知识才能逐一理会始得。故不务去天理上着工夫，徒弊精竭力，从册子上钻研，名物上考索，形迹上比拟，知识愈广而人欲愈滋，才力愈多而天理愈蔽。正如见人有万镒精金，不务煅炼成色，求无愧于彼之精纯，而乃妄希分两，务同彼之万镒，锡、铅、铜、铁杂然而投，分两愈增而成色愈下，既其梢末，无复有金矣。」时曰仁在傍，曰：「先生此喻，足以破世儒支离之惑，大有功于后学。」先生又曰：「吾辈用力，只求日减，不求日增。减得一分人欲，便是复得一分天理，何等轻快脱洒，何等简易！」","bh":"蔡希渊问：「圣人可以通过学习达到，但伯夷、伊尹和孔子相比，才能力量终究不同，他们同样被称为圣人，相同在哪里？」先生说：「圣人之所以是圣人，只是因为他的心纯是天理，没有人欲的杂质，就像精金之所以是精金，只是因为它成色十足，没有铜铅的杂质。人到了纯是天理才是圣人，金到了成色十足才是精金。但圣人的才力也有大小不同，就像金子的分量有轻有重。尧舜好比一万镒，文王孔子好比九千镒，禹、汤、武王好比七八千镒，伯夷、伊尹好比四五千镒。才力不同，但纯是天理是相同的，所以都可以叫圣人；就像分量虽不同，但成色十足是相同的，所以都可以叫精金。把五千镒放进一万镒里，成色是一样的；把伯夷、伊尹放在尧和孔子中间，纯是天理是一样的。因为精金之所以为精金，在于成色而不在于分量；圣人之所以为圣人，在于纯是天理而不在于才力。所以即使是普通人，只要肯学，让这颗心纯是天理，也可以成为圣人；就像一两金子和一万镒相比，分量虽然相差悬殊，但在成色十足这一点上，毫无愧色。所以说『人人都可以成为尧舜』，就是这个道理。学者学圣人，不过是去人欲、存天理罢了，就像炼金求它成色十足。金子成色差得不多，冶炼的功夫就省，容易成功；成色越差，冶炼就越难。人的气质有清有浊、有纯有杂，有中等以上的人，有中等以下的人；对于道，有生来就懂、安然实行的，有学了才懂、因有好处才实行的，下等的人必须别人做一次自己做一百次，别人做十次自己做一千次，但等到成功时，结果是一样的。后世的人不知道成为圣人的根本在于纯是天理，却专门在知识才能上求做圣人，以为圣人无所不知、无所不能，我必须把圣人那许多知识才能一一弄懂才行。所以不在天理上下功夫，白白耗尽精力，在书本上钻研，在名物上考证，在形迹上模仿，知识越广，人欲越滋长；才力越多，天理越被遮蔽。这正像看见别人有一万镒精金，不去冶炼提高自己的成色，以求不愧于别人的精纯，却妄想追求分量，一定要和别人的一万镒一样多，把锡、铅、铜、铁胡乱地投进去，分量越增加，成色越低下，到最后，就再也没有金子了。」当时徐爱在旁边，说：「先生这个比喻，足以破除世俗儒者支离破碎的迷惑，对后来的学者大有功劳。」先生又说：「我们用功，只求每天减少，不求每天增加。减去一分人欲，就是恢复了一分天理，多么轻快洒脱，多么简单容易！」","zs":[["希渊","蔡宗兖，字希渊，浙江山阴人，阳明早期弟子。"],["伯夷、伊尹","伯夷是商末孤竹国君之子，不食周粟而死，孟子称为「圣之清者」；伊尹是商汤的贤相，孟子称为「圣之任者」。"],["镒","古代重量单位，一镒为二十两（一说二十四两）。"],["人一己百，人十己千","《中庸》：「人一能之己百之，人十能之己千之。果能此道矣，虽愚必明，虽柔必强。」"],["支离","支离破碎，这是心学批评朱子学的常用词。"]],"gl":[107,30,22],"q":"成圣看的是「成色」还是「分量」？普通人能成圣吗？","a":"看成色（心纯乎天理），不看分量（才力大小）。所以一两的金子成色足也是精金，普通人只要心纯乎天理也可成圣。","yong":"你一个人的工作室比不过大公司的规模（分两），但每一单都做到问心无愧（成色），这就是精金。","con":"反方：把「圣」与才能完全切开，在道德上是激励，但也有代价。明末一些王学后人以「满街都是圣人」自许，轻视学问和能力，被批评为空疏误国。而且「人一己百」的说法也承认了气质差异，并非人人都有同样的起点。","rec":"薛侃录","kj":[["r","人","入","千镒者而"],["r","角","色","金者在足"],["r","此","比","一两之金"],["r","看","着","去天理上"],["r","逃","迹","上考索形"],["r","此","比","索形逃上"]]},{"n":100,"t":"朱子晚年之悔","yw":"士德问曰：「格物之说，如先生所教，明白简易，人人见得。文公聪明绝世，于此反有未审，何也？」先生曰：「文公精神气魄大，是他早年合下便要继往开来，故一向只就考索著述上用功。若先切己自修，自然不暇及此。到得德盛后，果忧道之不明，如孔子退修六籍，删繁就简，开示来学，亦大段不费甚考索。文公早岁便着许多书，晚年方悔是倒做了。」士德曰：「晚年之悔，如谓『向来定本之误』，又谓『虽读得书，何益于吾事』，又谓『此与守书籍，泥言语，全无交涉』，是他到此方悔从前用功之错，方去切己自修矣。」曰：「然。此是文公不可及处，他力量大，一悔便转，可惜不久即去世，平日许多错处皆不及改正。」","bh":"杨士德问：「格物的道理，像先生所教的那样，明白简易，人人都能懂。朱文公聪明绝顶，在这上面反而没有弄清楚，为什么？」先生说：「文公精神气魄宏大，他早年一开始就要继承前人、开导后学，所以一直只在考证著述上下功夫。如果先切身自修，自然没有空闲做这些。等到德行盛大以后，果真担忧道不明，就像孔子晚年退而修订六经那样，删繁就简，开导后学，也基本不用费什么考证功夫。文公早年就写了很多书，到晚年才后悔是做反了。」士德说：「朱子晚年的悔悟，比如他说『以前定本的错误』，又说『即使读了书，对我自身的事有什么益处』，又说『这和死守书本、拘泥言语，完全没有关系』，这是他到这时才后悔以前用功的错误，才去切身自修了。」先生说：「对。这是文公别人比不上的地方，他力量大，一后悔就能转过来，可惜不久就去世了，平时许多错处都来不及改正。」","zs":[["士德","杨骥，字士德，广东饶平人，阳明弟子。"],["文公","朱熹谥号「文」，故称朱文公。"],["合下","一开始、本来。"],["六籍","六经。"],["朱子晚年之悔","阳明曾编《朱子晚年定论》，选录朱熹书信中表示悔悟、强调切己工夫的段落，认为朱子晚年与心学相合。"]],"gl":[98,6,11],"q":"阳明认为朱熹的问题出在哪里？","a":"顺序做反了：早年就急于著书立说、考索文献，而不是先切己自修。","con":"反方：罗钦顺、陈建等人指出，《朱子晚年定论》所选的书信很多并非朱熹晚年所作，阳明的考订不严谨，有为己说找依据之嫌。阳明本人后来也承认「年岁早晚，诚有所未考」。","rec":"薛侃录","kj":[["r","悟","误","来定本之"]]},{"n":101,"t":"侃去花间草：无善无恶（核心条）","yw":"侃去花间草，因曰：「天地间何善难培，恶难去？」先生曰：「未培未去耳。」少间，曰：「此等看善恶，皆从躯壳起念，便会错。」侃未达。曰：「天地生意，花草一般，何曾有善恶之分？子欲观花，则以花为善，以草为恶；如欲用草时，复以草为善矣。此等善恶，皆由汝心好恶所生，故知是错。」曰：「然则无善无恶乎？」曰：「无善无恶者理之静，有善有恶者气之动。不动于气，即无善无恶，是谓至善。」曰：「佛氏亦无善无恶，何以异？」曰：「佛氏着在无善无恶上，便一切都不管，不可以治天下。圣人无善无恶，只是『无有作好』，『无有作恶』，不动于气。然『遵王之道』，『会其有极』，便自一循天理，便有个裁成辅相。」曰：「草既非恶，即草不宜去矣？」曰：「如此却是佛、老意见。草若是碍，何妨汝去？」曰：「如此又是作好作恶。」曰：「不作好恶，非是全无好恶，却是无知觉的人。谓之不作者，只是好恶一循于理，不去又着一分意思。如此，即是不曾好恶一般。」曰：「去草如何是一循于理，不着意思？」曰：「草有妨碍，理亦宜去，去之而已；偶未即去，亦不累心。若着了一分意思，即心体便有贻累，便有许多动气处。」曰：「然则善恶全不在物？」曰：「只在汝心，循理便是善，动气便是恶。」曰：「毕竟物无善恶？」曰：「在心如此，在物亦然。世儒惟不知此，舍心逐物，将格物之学错看了，终日驰求于外，只做得个『义袭而取』，终身行不着，习不察。」曰：「『如好好色，如恶恶臭』，则如何？」曰：「此正是一循于理，是天理合如此，本无私意作好作恶。」曰：「『如好好色，如恶恶臭』，安得非意？」曰：「却是诚意，不是私意。诚意只是循天理。虽是循天理，亦着不得一分意。故有所忿懥好乐，则不得其正，须是廓然大公，方是心之本体。知此即知未发之中。」伯生曰：「先生云『草有妨碍，理亦宜去』，缘何又是躯壳起念？」曰：「此须汝心自体当。汝要去草，是甚么心？周茂叔窗前草不除，是甚么心？」","bh":"薛侃在花丛间除草，于是说：「天地之间，为什么善这么难培养，恶这么难去除？」先生说：「只是没去培养、没去除掉罢了。」过了一会儿，先生说：「像这样看善恶，都是从自己的躯壳上起念头，就会出错。」薛侃没听懂。先生说：「天地的生机，花和草是一样的，哪有善恶之分？你想赏花，就把花当作善，把草当作恶；如果要用草的时候，又会把草当作善了。这类善恶，都是由你心里的好恶生出来的，所以知道是错的。」薛侃说：「那么就是无善无恶了？」先生说：「无善无恶，是理的静止状态；有善有恶，是气的发动。不被气所扰动，就是无善无恶，这就叫至善。」薛侃说：「佛家也讲无善无恶，有什么不同？」先生说：「佛家执着在无善无恶上，就什么都不管了，不能用来治理天下。圣人的无善无恶，只是『不刻意去喜好』『不刻意去厌恶』，不被气所扰动。但『遵循王道』，『归于中正』，自然完全遵循天理，就有了裁度成就、辅助天地的作为。」薛侃说：「草既然不是恶，那草就不该除了？」先生说：「这样想就是佛家道家的见解了。草如果碍事，你除掉它又何妨？」薛侃说：「这样又是刻意喜好、刻意厌恶了。」先生说：「不刻意好恶，不是完全没有好恶，那样就成了没知觉的人。所谓不刻意，只是好恶完全遵循天理，不再另外加上一分私意。这样，就和没有好恶一样。」薛侃说：「除草怎样才是完全遵循天理、不加私意？」先生说：「草有妨碍，按理也应该除掉，除掉就是了；偶尔没有马上除掉，也不放在心上。如果加上了一分私意，心体就有了牵累，就有了许多动气的地方。」薛侃说：「那么善恶完全不在物上？」先生说：「只在你的心上，遵循天理就是善，动了气就是恶。」薛侃说：「归根到底，物是无善无恶的？」先生说：「在心上是这样，在物上也是这样。世俗儒者正因为不懂这一点，舍弃了心去追逐物，把格物之学看错了，整天向外寻求，只做到了『偶然合义就据为己有』，一辈子做了也不明白、习惯了也不省察。」薛侃说：「『就像喜欢美色，就像厌恶恶臭』，又怎么说？」先生说：「这正是完全遵循天理，是天理本该如此，本来没有私意刻意好恶。」薛侃说：「『如好好色，如恶恶臭』，怎么能不是意呢？」先生说：「那是诚意，不是私意。诚意只是遵循天理。虽然是遵循天理，也加不得一分私意。所以心中有愤怒、喜好，心就不能端正，必须廓然大公，才是心的本体。懂了这个，就懂了未发之中。」孟伯生说：「先生说『草有妨碍，按理也应除掉』，为什么又说是从躯壳起念？」先生说：「这要你自己心里去体会。你要除草，是什么心？周敦颐窗前的草不除，是什么心？」","zs":[["去花间草","除去花丛中的杂草。底本作「去花问草」，据通行本改。"],["躯壳起念","从个人的身体、私利、喜好出发产生的念头。"],["无有作好，无有作恶","《尚书·洪范》：「无有作好，遵王之道；无有作恶，遵王之路。」「会其有极，归其有极。」"],["裁成辅相","《周易·泰卦·象传》：「后以财（裁）成天地之道，辅相天地之宜。」"],["行不着，习不察","《孟子·尽心上》：「行之而不著焉，习矣而不察焉。」"],["伯生","孟源，字伯生，即第19条那位「好名」的弟子。"],["周茂叔窗前草不除","周敦颐（字茂叔）窗前杂草不除，有人问他，他说「与自家意思一般」，即草的生意与自己的心意相通。"]],"gl":[19,72,5,317],"q":"花是善、草是恶吗？那除草对不对？","a":"花草本无善恶，善恶是从自己的好恶起念。草碍事可以除，按理去除就是了，不加私意、不动气；不能因为「草不是恶」就什么都不管，那是佛老。","yong":"你讨厌的那个客户、同行、规则，是它本身「恶」，还是挡了你的路？分清楚，该处理就处理，别带着火气。","con":"反方：「无善无恶者理之静」是后来「四句教」首句「无善无恶心之体」的先声，引发了王门后学数百年的争议。东林党人顾宪成批评它会导致「以无善无恶为宗，则人皆可以为善，亦可以为恶」，模糊道德界限。","rec":"薛侃录","kj":[["r","问","间","侃去花"],["r","埋","理","是一循于"],["r","看","着","循于埋不"],["r","抑","物","恶曰毕竟"],["r","绛","终","学错看了"],["r","看","着","循天理亦"],["r","念","忿","意故有所"]]},{"n":102,"t":"头脑工夫如舟之有舵","yw":"先生谓学者曰：「为学须得个头脑工夫，方有着落。纵未能无间，如舟之有舵，一提便醒。不然，虽从事于学，只做个义袭而取，只是行不着，习不察，非大本达道也。」又曰：「见得时，横说竖说皆是。若于此处通，彼处不通，只是未见得。」","bh":"先生对学者说：「做学问必须找到一个根本的功夫，才有着落。即使还不能做到时时不间断，也像船有了舵，一提起来就能清醒过来。不然，即使在做学问，也只是偶然合义、据为己有，做了也不明白、习惯了也不省察，不是大本达道。」又说：「真看清楚了，横着说竖着说都对。如果这里说得通，那里说不通，只是还没有真看清楚。」","zs":[["头脑","根本、关键。"]],"gl":[3,31,84],"q":"「如舟之有舵」比喻什么？","a":"有了头脑功夫，即使偶尔偏离，一提就醒，能回到正路上。没有头脑，学得再多也是随波漂流。","yong":"检验你是否真懂一个道理：换个角度、换个场景还说得通吗？","rec":"薛侃录","kj":[["r","看","着","工夫方有"]]},{"n":103,"t":"科举不累学，只患夺志","yw":"或问：「为学以亲故，不免业举之累。」先生曰：「以亲之故而业举为累于学，则治田以养其亲者，亦有累于学乎？先正云『惟患夺志』，但恐为学之志不真切耳。」","bh":"有人问：「做学问因为要奉养父母，免不了被准备科举考试所拖累。」先生说：「因为父母的缘故准备科举，就算拖累了学问，那么种田来奉养父母的人，也拖累了学问吗？前贤说『只怕被夺走志向』，只怕做学问的志向不够真切罢了。」","zs":[["业举","为科举考试做准备。"],["先正","前代贤人。这里指程颐，他说「科举之事，不患妨功，惟患夺志」。"]],"gl":[56,16],"q":"为了生计做事，会不会拖累修身？","a":"不会。就像种田养亲不碍学问一样，问题不在做什么事，而在志向是否被夺走。","yong":"做外贸、接单、改网站，都不碍你修身。怕的是做着做着，只剩下钱了。","rec":"薛侃录","kj":[]},{"n":104,"t":"有事无事都忙","yw":"崇一问：「寻常意思多忙，有事固忙，无事亦忙，何也？」先生曰：「天地气机，元无一息之停，然有个主宰，故不先不后，不急不缓，虽千变万化，而主宰常定。人得此而生，若主宰定时，与天运一般不息，虽酬酢万变，常是从容自在，所谓『天君泰然，百体从令』。若无主宰，便只是这气奔放，如何不忙？」","bh":"欧阳崇一问：「平常心里总是很忙乱，有事时当然忙，没事时也忙，为什么？」先生说：「天地间气的运行，本来就没有一刻停止，但有个主宰，所以不早不晚、不急不慢，虽然千变万化，主宰却常常安定。人禀受这个而生，如果主宰安定了，就和天的运行一样永不停息，即使应对千变万化，也总是从容自在，这就是所谓『心君安泰，全身听令』。如果没有主宰，就只是这股气奔腾放纵，怎么能不忙？」","zs":[["崇一","欧阳德，字崇一，江西泰和人，阳明重要弟子，后官至礼部尚书。"],["酬酢","应对、应酬。"],["天君泰然，百体从令","出自范浚《心箴》，朱熹收入《孟子集注》。天君指心。"]],"gl":[70,41,48],"q":"没事的时候也觉得忙，原因是什么？","a":"心没有主宰，只是气在奔放。有主宰时，即使应对万变也从容；没主宰时，闲着也心慌。","yong":"你那种「什么都没干却很累」的感觉，就是这个。不是事多，是心里没主。","rec":"薛侃录","kj":[["r","忌","息","运一般不"]]},{"n":105,"t":"为学大病在好名","yw":"先生曰：「为学大病在好名。」侃曰：「从前岁自谓此病已轻，此来精察，乃知全未。岂必务外为人？只闻誉而喜，闻毁而闷，即是此病发来。」曰：「最是。名与实对，务实之心重一分，则务名之心轻一分；全是务实之心，即全无务名之心。若务实之心如饥之求食，渴之求饮，安得更有工夫好名？」又曰：「『疾没世而名不称』，『称』字去声读，亦『声闻过情，君子耻之』之意。实不称名，生犹可补，没则无及矣。『四十五十而无闻』，是不闻道，非无声闻也。孔子云『是闻也，非达也』，安肯以此望人？」","bh":"先生说：「做学问的大毛病在于好名。」薛侃说：「从前一年我自认为这个毛病已经轻了，近来仔细省察，才知道一点没好。难道一定要追求外在、做给别人看才算好名吗？只要听到称赞就高兴，听到批评就郁闷，就是这个毛病发作了。」先生说：「说得太对了。名和实相对，务实的心重一分，求名的心就轻一分；全是务实的心，就完全没有求名的心了。如果务实的心像饿了找吃的、渴了找喝的那样迫切，哪还有工夫去好名？」先生又说：「『君子担心死后名不副实』，这个『称』字读去声（相称），也就是『名声超过实际，君子以为耻』的意思。实际配不上名声，活着还可以弥补，死了就来不及了。孔子说『四五十岁还无闻』，是说没有闻道，不是说没有名声。孔子说『那是有名声，不是通达』，怎么会用名声来期望人呢？」","zs":[["疾没世而名不称","《论语·卫灵公》：「君子疾没世而名不称焉。」通常解为君子担心死后名声不被称道；阳明读「称」为去声 chèn，解为名实相称。"],["声闻过情，君子耻之","《孟子·离娄下》。"],["四十五十而无闻","《论语·子罕》：「四十五十而无闻焉，斯亦不足畏也已。」"],["是闻也，非达也","《论语·颜渊》。"]],"gl":[19,97,107],"q":"怎么判断自己有没有「好名」的毛病？","a":"不一定要刻意炫耀才算。听到称赞就喜、听到批评就闷，就是好名之病在发作。","yong":"客户给了五星好评你开心一整天，差评你郁闷一整周？病根就在这。把心思放回「实」上。","rec":"薛侃录","kj":[["r","忘","望","安肯以此"]]},{"n":106,"t":"悔悟是药，留滞成病","yw":"侃多悔。先生曰：「悔悟是去病之药，以改之为贵。若留滞于中，则又因药发病。」","bh":"薛侃常常后悔。先生说：「悔悟是治病的药，但贵在改正。如果悔恨一直留在心里，就又因为药而生出病来了。」","zs":[],"gl":[97,79],"q":"后悔是好事还是坏事？","a":"悔悟是药，但贵在改。改了就放下；如果一直留在心里反复咀嚼，药就变成了病。","yong":"搞砸了一单？复盘、改进、放下。别在凌晨三点还在跟自己算账。","rec":"薛侃录","kj":[]},{"n":107,"t":"替圣人争分两","yw":"德章曰：「闻先生以精金喻圣，以分两喻圣人之分量，以煅炼喻学者之工夫，最为深切。惟谓尧、舜为万镒，孔子为九千镒，疑未安。」先生曰：「此又是躯壳上起念，故替圣人争分两。若不从躯壳上起念，即尧、舜万镒不为多，孔子九千镒不为少。尧、舜万镒，只是孔子的；孔子九千镒，只是尧、舜的，原无彼我。所以谓之圣，只论精一，不论多寡。只要此心纯乎天理处同，便同谓之圣。若是力量气魄，如何尽同得？后儒只在分两上较量，所以流入功利。若除去了比较分两的心，各人尽着自己力量精神，只在此心纯天理上用功，即人人自有，个个圆成，便能大以成大，小以成小，不假外慕，无不具足。此便是实实落落明善诚身的事。后儒不明圣学，不知就自己心地良知良能上体认扩充，却去求知其所不知，求能其所不能，一味只是希高慕大，不知自己是桀、纣心地，动辄要做尧、舜事业，如何做得？终年碌碌，至于老死，竟不知成就了个甚么，可哀也已！」","bh":"刘德章说：「听说先生用精金比喻圣人，用分量比喻圣人的才力，用冶炼比喻学者的功夫，非常深刻贴切。只是说尧舜是一万镒、孔子是九千镒，我觉得不太妥当。」先生说：「这又是从躯壳上起念，所以替圣人争分量。如果不从躯壳上起念，那么尧舜一万镒不算多，孔子九千镒不算少。尧舜的一万镒，也就是孔子的；孔子的九千镒，也就是尧舜的，本来没有你我之分。之所以叫作圣人，只论是否精纯专一，不论多少。只要这颗心纯乎天理这一点相同，就同样叫作圣人。至于力量气魄，怎么能完全相同？后世儒者只在分量上比较，所以流入功利。如果去掉了比较分量的心，每个人都尽自己的力量精神，只在这颗心纯乎天理上用功，那就人人自足、个个圆满，大的成就大的，小的成就小的，不需要羡慕外面，没有不完备的。这才是实实在在的明善诚身的事。后世儒者不明白圣学，不知道在自己心中的良知良能上体认扩充，却去追求知道自己不知道的、追求做到自己做不到的，一味好高骛远，不知道自己是桀纣的心地，动不动就想做尧舜的事业，怎么做得到？一年到头忙忙碌碌，直到老死，竟然不知道成就了个什么，真是可悲啊！」","zs":[["德章","刘德章，阳明弟子，生平不详。"],["良知良能","《孟子·尽心上》：「人之所不学而能者，其良能也；所不虑而知者，其良知也。」"]],"gl":[99,105,19],"q":"弟子替孔子抱不平（为何只有九千镒），阳明为什么批评他？","a":"这是从躯壳起念，在分量上比较。圣人只论纯乎天理，不论多寡；比较分两的心，正是功利之心。","yong":"别老拿自己的营收、粉丝数、客户规模跟别人比。大以成大，小以成小。","con":"反方：这一条否定比较，但人类的进步离不开比较和竞争；完全不比，也可能导致自满停滞。阳明针对的是「以名利比较代替修身」，并非否定见贤思齐。","rec":"薛侃录","kj":[["d","郋","","上起念即"],["r","尢","九","子的孔子"],["r","此","比","若除去了"],["r","籿","纣","自己是桀"]]},{"n":108,"t":"心不可以动静为体用","yw":"侃问：「先儒以心之静为体，心之动为用，如何？」先生曰：「心不可以动静为体用。动静，时也。即体而言用在体，即用而言体在用，是谓『体用一源』。若说静可以见其体，动可以见其用，却不妨。」","bh":"薛侃问：「前代儒者把心静的状态当作本体，把心动的状态当作作用，对吗？」先生说：「心不能用动静来区分体用。动静只是时间上的不同。就本体说，作用就在本体之中；就作用说，本体就在作用之中，这就叫『体用一源』。如果说在静中可以看见它的本体，在动中可以看见它的作用，倒是无妨。」","zs":[["体用一源","程颐《易传序》。"]],"gl":[41,45,87],"q":"静是体、动是用，对吗？","a":"不对。动静只是时，体用不可分：即体而言用在体，即用而言体在用。只能说静时可见其体、动时可见其用。","rec":"薛侃录","kj":[]},{"n":109,"t":"不是不可移，只是不肯移","yw":"问：「上智下愚，如何不可移？」先生曰：「不是不可移，只是不肯移。」","bh":"有人问：「最聪明的人和最愚笨的人，为什么不能改变？」先生说：「不是不能改变，只是不肯改变。」","zs":[["上智下愚","《论语·阳货》：「唯上知与下愚不移。」"]],"gl":[99,65],"q":"「下愚不移」是天生注定的吗？","a":"不是不能移，而是不肯移。改变的关键在意愿，不在天资。","yong":"说「我就这样了，改不了」的时候，换成「我不肯改」，看看还说得出口吗？","rec":"薛侃录","kj":[]},{"n":110,"t":"子夏子张论交","yw":"问「子夏门人问交」章。先生曰：「子夏是言小子之交，子张是言成人之交。若善用之，亦俱是。」","bh":"有人问《论语》「子夏的门人问交友之道」那一章。先生说：「子夏说的是少年人的交友之道，子张说的是成年人的交友之道。如果善于运用，两种说法都对。」","zs":[["子夏门人问交","《论语·子张》：子夏的门人问子张交友之道，子张问子夏怎么说，答「可者与之，其不可者拒之」。子张说：「君子尊贤而容众，嘉善而矜不能。」"]],"gl":[18],"q":"子夏和子张的交友观谁对？","a":"都对，适用对象不同：子夏「可者与之，不可者拒之」适合年轻人择友；子张「尊贤容众」适合成年人。","yong":"刚起步时，挑合作伙伴要严；做大了，要能容人。","rec":"薛侃录","kj":[["r","星","是","生曰子夏"]]},{"n":111,"t":"学而时习之","yw":"子仁问：「『学而时习之，不亦说乎？』先儒以学为『效先觉之所为』，如何？」先生曰：「学是学去人欲、存天理。从事于去人欲、存天理，则自正诸先觉，考诸古训，自下许多问辨思索、存省克治工夫，然不过欲去此心之人欲，存吾心之天理耳。若曰『效先觉之所为』，则只说得学中一件事，亦似专求诸外了。『时习』者，『坐如尸』，非专习坐也，坐时习此心也；『立如斋』，非专习立也，立时习此心也。『说』是『理义之说我心』之『说』，人心本自说理义，如目本说色，耳本说声，惟为人欲所蔽所累，始有不说。今人欲日去，则理义日洽浃，安得不说？」","bh":"栾子仁问：「『学了又时时温习，不是很快乐吗？』朱子把『学』解释为『效法先知先觉者的所作所为』，对吗？」先生说：「学就是学去人欲、存天理。从事于去人欲、存天理，自然会向先觉者求正、到古训中考证，自然要下许多询问辨析、思考探索、存养省察、克制私欲的功夫，但这些都不过是要去掉这颗心里的人欲、保存我心里的天理罢了。如果说『效法先觉者的所作所为』，那只说到了学中的一件事，而且好像是专门向外寻求了。『时习』，就像『坐着要像祭祀时的尸那样端正』，不是专门练习坐，而是坐的时候修习这颗心；『站着要像斋戒时那样恭敬』，不是专门练习站，而是站的时候修习这颗心。『说』就是孟子『理义让我的心喜悦』中的『悦』，人心本来就喜欢理义，就像眼睛本来就喜欢美色、耳朵本来就喜欢美声，只是因为被人欲遮蔽拖累，才有不喜悦的时候。现在人欲一天天去掉，理义就一天天融洽浸润，怎么会不喜悦？」","zs":[["子仁","栾惠，字子仁，阳明弟子。"],["效先觉之所为","朱熹《论语集注》：「学之为言效也……后觉者必效先觉之所为。」"],["坐如尸，立如斋","《礼记·曲礼上》。尸是古代祭祀时代表死者受祭的人，须端坐不动。"],["理义之说我心","《孟子·告子上》：「理义之悦我心，犹刍豢之悦我口。」说，同「悦」。"],["洽浃","融洽、浸润。"]],"gl":[24,3,9],"q":"「时习」习的是什么？「说」从哪里来？","a":"时习是时时刻刻在坐立行止中习此心；悦是因为人心本来喜欢理义，人欲去掉，理义融洽，自然喜悦。","yong":"学习如果只让你焦虑，多半是在「效先觉之所为」（模仿别人）。真学到了心上，会有一种踏实的喜悦。","rec":"薛侃录","kj":[["r","舀","习","问学而时"],["r","间","问","自下许多"],["d","事","","学中一件"],["r","羲","义","日去则理"]]},{"n":112,"t":"曾子三省与一贯","yw":"国英问：「曾子三省虽切，恐是未闻一贯时工夫。」先生曰：「一贯是夫子见曾子未得用功之要，故告之。学者果能忠恕上用力，岂不是一贯？『一』如树之根本，『贯』如树之枝叶，未种根，何枝叶之可得？体用一源，体未立，用安从生？谓『曾子于其用处，盖已随事精察而力行之，但未知其体之一』，此恐未尽。」","bh":"陈国英问：「曾子每天多次反省自己，虽然很切实，恐怕是还没有听到孔子『一以贯之』时的功夫吧？」先生说：「一以贯之，是孔子看到曾子还没有掌握用功的要领，所以才告诉他的。学者如果真能在忠恕上用功，难道不就是一贯吗？『一』就像树的根本，『贯』就像树的枝叶，没有种下根，哪来的枝叶？体用出于同一本源，本体没有确立，作用从哪里生出来？朱子说『曾子在作用方面，大概已经随事精细省察并努力实行了，只是还不知道本体是一』，这话恐怕没说透。」","zs":[["国英","陈桀，字国英，福建莆田人，阳明弟子。"],["曾子三省","《论语·学而》：「吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？」"],["一贯","《论语·里仁》：「子曰：参乎！吾道一以贯之。」曾子曰：「夫子之道，忠恕而已矣。」"],["曾子于其用处……","朱熹《论语集注》中的话。"]],"gl":[108,45,25],"q":"阳明为什么不同意朱子对「一贯」的解释？","a":"朱子认为曾子已在用上做足、只是不知体之一；阳明认为体用一源，体未立用不可能有，在忠恕上用功本身就是一贯。","yong":"每天复盘三件事：为人谋忠不忠、与人交信不信、学的用没用。这就是一贯的功夫。","rec":"薛侃录","kj":[["r","慷","源","得体用一"]]},{"n":113,"t":"子贡与颜回孰愈","yw":"黄诚甫问「汝与回也孰愈」章。先生曰：「子贡多学而识，在闻见上用力，颜子在心地上用功，故圣人问以启之。而子贡所对又只在知见上，故圣人叹惜之，非许之也。」","bh":"黄诚甫问《论语》「你和颜回谁强」那一章。先生说：「子贡博学多识，在见闻上用功，颜回在心地上用功，所以孔子用这个问题来启发子贡。但子贡的回答又只在知识见解上，所以孔子为他叹息惋惜，并不是赞许他。」","zs":[["黄诚甫","黄宗明，字诚甫，浙江鄞县人，阳明弟子。"],["汝与回也孰愈","《论语·公冶长》：孔子问子贡：「女与回也孰愈？」子贡答：「赐也何敢望回？回也闻一以知十，赐也闻一以知二。」孔子说：「弗如也，吾与女弗如也。」"]],"gl":[77,99],"q":"孔子说「吾与女弗如也」是在夸子贡谦虚吗？","a":"阳明认为不是。子贡的回答仍在比较知见多少（闻一知几），没领会颜回是在心地上用功，孔子是在叹惜他。","yong":"别人比你强，你第一反应是比「他懂多少」，还是看「他的心怎么用」？","rec":"薛侃录","kj":[["r","间","问","功故圣人"]]},{"n":114,"t":"不迁怒，不贰过","yw":"颜子不迁怒，不贰过，亦是有未发之中始能。","bh":"颜回不把怒气转移到别人身上，同样的错误不犯第二次，这也是因为他有了未发之中才能做到。","zs":[["不迁怒，不贰过","《论语·雍也》：孔子称赞颜回「不迁怒，不贰过」。"]],"gl":[76,45,77],"q":"颜回为什么能不迁怒、不贰过？","a":"因为他有未发之中：内心中正，怒气发了不留滞，过错改了不再犯。体用一源。","yong":"被客户气到了，回家别冲家人发火。那是迁怒，说明你心里的「中」还不够。","rec":"薛侃录","kj":[]},{"n":115,"t":"种德如种树，先去外好","yw":"种树者必培其根，种德者必养其心。欲树之长，必于始生时删其繁枝；欲德之盛，必于始学时去夫外好。如外好诗文，则精神日渐漏泄在诗文上去，凡百外好皆然。又曰：「我此论学，是无中生有的工夫，诸公须要信得及，只是立志。学者一念为善之志，如树之种，但勿助勿忘，只管培植将去，自然日夜滋长，生气日完，枝叶日茂。树初生时，便抽繁枝，亦须刊落，然后根干能大。初学时亦然，故立志贵专一。」","bh":"种树的人一定要培植树根，培养德行的人一定要涵养内心。想让树长大，必须在它刚生长时剪掉繁杂的枝条；想让德行盛大，必须在刚开始学习时去掉对外物的嗜好。比如嗜好诗文，精神就会一天天泄漏到诗文上去，一切外在嗜好都是这样。先生又说：「我这样讲学问，是无中生有的功夫，各位必须信得过，只是要立志。学者一个为善的念头，就像树的种子，只要不揠苗助长、也不忘记，只管培植下去，自然日夜生长，生气一天天完足，枝叶一天天茂盛。树刚长出来时就抽出繁杂的枝条，也必须剪掉，然后根和干才能长大。初学时也是这样，所以立志贵在专一。」","zs":[["勿助勿忘","《孟子·公孙丑上》：「必有事焉而勿正，心勿忘，勿助长也。」"],["刊落","删除、砍掉。"]],"gl":[30,16,53],"q":"为什么初学时要「去夫外好」？","a":"精神有限，外好会把精神泄漏出去，就像树刚长时的繁枝会分走养分，必须剪掉，根干才能长大。","yong":"刚起步的业务，别同时铺十条线。剪掉繁枝，先让一条根扎深。","con":"反方：阳明自己就是一流的诗人和书法家，年轻时「泛滥于词章」。完全断绝外好，也可能让人生过于单调。比较平衡的理解是：在根基未立时克制分心，而不是一辈子拒绝艺术。","rec":"薛侃录","kj":[]},{"n":116,"t":"日不足者日有余","yw":"因论先生之门，某人在涵养上用功，某人在识见上用功。先生曰：「专涵养者，日见其不足；专识见者，日见其有余。日不足者，日有余矣；日有余者，日不足矣。」","bh":"大家谈论先生门下的弟子，某人在涵养上用功，某人在见识上用功。先生说：「专门在涵养上用功的人，每天都觉得自己不足；专门在见识上用功的人，每天都觉得自己有余。每天觉得不足的，其实一天天有余了；每天觉得有余的，其实一天天不足了。」","zs":[],"gl":[64,77,22],"q":"为什么「日不足者，日有余」？","a":"涵养越深，越看到自己的不足，于是越进步；见识越多，越觉得自己什么都懂，于是心越满，反而退步。","yong":"每天觉得「今天也没做好」的人，往往一年后进步最大。","rec":"薛侃录","kj":[]},{"n":117,"t":"居敬穷理是一事","yw":"梁日孚问：「居敬、穷理是两事，先生以为一事，何如？」先生曰：「天地间只有此一事，安有两事？若论万殊，礼仪三百，威仪三千，又何止两？公且道居敬是如何？穷理是如何？」曰：「居敬是存养工夫，穷理是穷事物之理。」曰：「存养个甚？」曰：「是存养此心之天理。」曰：「如此亦只是穷理矣。」曰：「且道如何穷事物之理？」曰：「如事亲便要穷孝之理，事君便要穷忠之理。」曰：「忠与孝之理，在君亲身上？在自己心上？若在自己心上，亦只是穷此心之理矣。且道如何是敬？」曰：「只是主一。」「如何是主一？」曰：「如读书便一心在读书上，接事便一心在接事上。」曰：「如此则饮酒便一心在饮酒上，好色便一心在好色上，却是逐物，成甚居敬功夫？」日孚请问。曰：「一者，天理。主一是一心在天理上。若只知主一，不知一即是理，有事时便是逐物，无事时便是悬空。惟其有事无事，一心皆在天理上用功，所以居敬亦即是穷理。就穷理专一处说，便谓之居敬；就居敬精密处说，便谓之穷理。却不是居敬了，别有个心穷理；穷理时，别有个心居敬。名虽不同，功夫只是一事。就如《易》言『敬以直内，义以方外』，敬即是无事时义，义即是有事时敬，两句合说一件。如孔子言『修己以敬』，即不须言义；孟子言『集义』，即不须言敬。会得时，横说竖说，工夫总是一般。若泥文逐句，不识本领，即支离决裂，工夫都无下落。」问：「穷理何以即是尽性？」曰：「心之体，性也，性即理也。穷仁之理，真要仁极仁；穷义之理，真要义极义。仁、义只是吾性，故穷理即是尽性。如孟子说『充其恻隐之心，至仁不可胜用』，这便是穷理工夫。」日孚曰：「先儒谓『一草一木亦皆有理，不可不察』，如何？」先生曰：「夫我则不暇。公且先去理会自己性情，须能尽人之性，然后能尽物之性。」日孚悚然有悟。","bh":"梁日孚问：「居敬和穷理是两件事，先生认为是一件事，为什么？」先生说：「天地间只有这一件事，哪有两件事？如果论千差万别，礼仪有三百条，威仪有三千条，又何止两件？你先说说居敬是怎样的？穷理是怎样的？」日孚说：「居敬是存养的功夫，穷理是穷究事物的道理。」先生问：「存养什么？」日孚说：「存养这颗心中的天理。」先生说：「这样说也只是穷理了。」先生又说：「你说说怎样穷究事物的道理？」日孚说：「比如侍奉父母就要穷究孝的道理，侍奉君主就要穷究忠的道理。」先生说：「忠和孝的道理，在君主和父母身上，还是在自己心上？如果在自己心上，那也只是穷究这颗心的道理了。你再说说什么是敬？」日孚说：「就是主一。」「什么是主一？」日孚说：「比如读书就一心在读书上，处理事情就一心在处理事情上。」先生说：「这样的话，喝酒就一心在喝酒上，好色就一心在好色上，这是追逐外物，算什么居敬功夫？」日孚请先生指教。先生说：「一，就是天理。主一是一心在天理上。如果只知道主一，不知道一就是理，那么有事时就是追逐外物，没事时就是悬空无着。只有有事没事都一心在天理上用功，所以居敬也就是穷理。从穷理的专一处说，就叫居敬；从居敬的精密处说，就叫穷理。并不是居敬之后另外有个心去穷理，穷理时另外有个心去居敬。名称虽然不同，功夫只是一件事。就像《易经》说的『用敬来端正内心，用义来规范外行』，敬就是无事时的义，义就是有事时的敬，两句话合起来说的是一件事。比如孔子说『用敬来修养自己』，就不必再说义；孟子说『集义』，就不必再说敬。领会了，横说竖说，功夫总是一样的。如果拘泥于文字、逐句去理解，不认识根本，就会支离破碎，功夫都没有着落。」日孚问：「穷理为什么就是尽性？」先生说：「心的本体就是性，性就是理。穷究仁的道理，真要做到仁到了极点；穷究义的道理，真要做到义到了极点。仁和义只是我的本性，所以穷理就是尽性。就像孟子说的『扩充恻隐之心，仁就用之不尽』，这就是穷理的功夫。」日孚说：「程子说『一草一木也都有理，不可不去考察』，这怎么样？」先生说：「我可没那个空闲。你先去理会自己的性情，必须能够充分发挥人的本性，然后才能充分发挥物的本性。」日孚听了猛然醒悟。","zs":[["梁日孚","梁焯，字日孚，广东南海人。"],["居敬穷理","朱子学的两大功夫：居敬是持守内心的恭敬专一，穷理是格物以穷究事物之理。"],["礼仪三百，威仪三千","《中庸》：「礼仪三百，威仪三千。」"],["敬以直内，义以方外","《周易·坤卦·文言》。"],["夫我则不暇","《论语·宪问》：子贡评论别人，孔子说「赐也贤乎哉？夫我则不暇」。"],["尽人之性，尽物之性","《中庸》：「能尽人之性，则能尽物之性。」"]],"gl":[15,3,25,9],"q":"居敬和穷理为什么是一件事？","a":"主一是一心在天理上，穷理是穷此心之理，二者都是在心上存天理。从专一处说叫居敬，从精密处说叫穷理。","yong":"别把「修心」和「做事」分成两个时间段。做事专一于天理就是修心，修心精密就是做事。","con":"反方：「一草一木亦皆有理」的探究精神，正是自然科学的萌芽。阳明一句「夫我则不暇」把物理探究推到道德修养之后，有学者认为心学的兴盛在一定程度上压抑了明代对自然知识的兴趣。","rec":"薛侃录","kj":[["r","兴","与","之理曰忠"],["r","看","悬","事时便是"],["r","睢","虽","心居敬名"],["r","羲羲","义义","是无事时"],["r","璧","竖","得时横说"]]},{"n":118,"t":"知是理之灵处","yw":"惟乾问：「知如何是心之本体？」先生曰：「知是理之灵处。就其主宰处说便谓之心，就其禀赋处说便谓之性。孩提之童，无不知爱其亲，无不知敬其兄，只是这个灵能不为私欲遮隔，充拓得尽，便完完是他本体，便与天地合德。自圣人以下，不能无蔽，故须格物以致其知。」","bh":"冀惟乾问：「为什么说知是心的本体？」先生说：「知是理的灵明之处。从它主宰的一面说，就叫作心；从它禀受于天的一面说，就叫作性。小孩子没有不知道爱父母的，没有不知道敬兄长的，只要这个灵明不被私欲遮隔，扩充到底，就完完全全是他的本体，就与天地的德性相合。圣人以下的人，不能没有遮蔽，所以必须格物来致其良知。」","zs":[["惟乾","冀元亨，字惟乾，湖南武陵人。后因阳明平宸濠之乱受牵连，冤死狱中。底本作「惟干」，据通行本作「惟乾」。"],["孩提之童……","《孟子·尽心上》：「孩提之童，无不知爱其亲者；及其长也，无不知敬其兄也。」"],["与天地合德","《周易·乾卦·文言》：「夫大人者，与天地合其德。」"]],"gl":[8,6,78],"q":"「知」为什么是心之本体？","a":"知是理的灵明之处，就是良知。小孩天然知爱亲敬兄，不被私欲遮隔、扩充到底，就是完整的本体。","rec":"薛侃录","kj":[["r","干","乾","惟"]]},{"n":119,"t":"诚意之中，正心何在","yw":"守衡问：「《大学》工夫只是诚意，诚意工夫只是格物，修齐治平只诚意尽矣。又有正心之功，『有所忿懥好乐，则不得其正』，何也？」先生曰：「此要自思得之，知此则知未发之中矣。」守衡再三请。曰：「为学工夫有浅深，初时若不着实用意去好善恶恶，如何能为善去恶？这着实用意便是诚意。然不知心之本体原无一物，一向着意去好善恶恶，便又多了这分意思，便不是廓然大公。《书》所谓『无有作好作恶』，方是本体。所以说『有所忿懥好乐，则不得其正』。正心只是诚意工夫里面体当自家心体，常要鉴空衡平，这便是未发之中。」","bh":"守衡问：「《大学》的功夫只是诚意，诚意的功夫只是格物，修身、齐家、治国、平天下，只要诚意就全了。为什么又有正心的功夫，说『心中有愤怒、喜好，心就不能端正』？」先生说：「这要你自己思考才能得到，懂了这个就懂了未发之中。」守衡再三请教。先生说：「做学问的功夫有浅有深，开始时如果不切实用意去喜好善、厌恶恶，怎么能为善去恶？这切实用意，就是诚意。但如果不知道心的本体原本空无一物，一味刻意去好善恶恶，就又多了这一分意思，就不是廓然大公了。《尚书》说的『不刻意去喜好、不刻意去厌恶』，才是本体。所以说『心中有愤怒、喜好，心就不能端正』。正心只是在诚意功夫里面体会自己的心体，要常常像镜子一样空明、像秤一样平衡，这就是未发之中。」","zs":[["守衡","阳明弟子，姓氏生平不详。"],["忿懥","愤怒。"],["鉴空衡平","镜子空明无物，秤杆平衡不偏。朱熹语。"]],"gl":[101,88,76],"q":"诚意已经包括了一切，为什么还要正心？","a":"诚意是着实用意去好善恶恶；但用意太过，又多了一分意思，就不是廓然大公。正心就是在诚意中体认心体本来无一物，鉴空衡平。","yong":"「我一定要做个好人！」这股劲是诚意；但如果绷得太紧、处处较劲，就又偏了。","rec":"薛侃录","kj":[["r","念","忿","之功有所"],["r","看","着","初时若不"],["r","念","忿","以说有所"]]},{"n":120,"t":"独知之地：诚伪善恶界头","yw":"正之问：「戒惧是己所不知时工夫，慎独是己所独知时工夫，此说如何？」先生曰：「只是一个工夫。无事时固是独知，有事时亦是独知。人若不知于此独知之地用力，只在人所共知处用功，便是作伪，便是『见君子而后厌然』。此独知处便是诚的萌芽，此处不论善念恶念，更无虚假，一是百是，一错百错，正是王霸、义利、诚伪、善恶界头。于此一立立定，便是端本澄源，便是立诚。古人许多诚身的工夫，精神命脉全体只在此处，真是莫见莫显，无时无处，无终无始，只是此个工夫。今若又分戒惧为己所不知，即工夫便支离，亦有间断。既戒惧即是知，己若不知，是谁戒惧？如此见解，便要流入断灭禅定。」曰：「不论善念恶念，更无虚假，则独知之地，更无无念时邪？」曰：「戒惧亦是念。戒惧之念，无时可息。若戒惧之心稍有不存，不是昏瞶，便已流入恶念。自朝至暮，自少至老，若要无念，即是己不知，此除是昏睡，除是槁木死灰。」","bh":"黄正之问：「朱子说戒惧是自己不知道（心未发）时的功夫，慎独是只有自己知道（心已发）时的功夫，这个说法怎么样？」先生说：「只是一个功夫。没事的时候固然是独知，有事的时候也是独知。人如果不知道在这个独知之处用力，只在别人都知道的地方用功，就是作假，就是《大学》说的『小人见到君子后才躲躲闪闪地掩饰』。这个独知之处就是诚的萌芽，在这里不论善念恶念，都没有半点虚假，一处对就处处对，一处错就处处错，这正是王道与霸道、义与利、诚与伪、善与恶的分界线。在这里一下子立定了，就是端正根本、澄清源头，就是确立诚。古人许多诚身的功夫，精神命脉全都在这里，真是没有比这更显现的了，无时无处、无终无始，只是这个功夫。现在如果又把戒惧分为自己不知道时的功夫，功夫就支离破碎，也会有间断。既然戒惧了就是知道，自己如果不知道，是谁在戒惧？这种见解，就要流入断灭一切的禅定了。」正之问：「不论善念恶念都没有虚假，那么独知之处，就没有无念的时候吗？」先生说：「戒惧也是念。戒惧的念头，没有一刻可以停息。如果戒惧之心稍有不在，不是昏昧糊涂，就已经流入恶念了。从早到晚，从小到老，如果要无念，就是自己不知道了，那除非是昏睡，除非是枯木死灰。」","zs":[["正之","黄弘纲，字正之，江西雩都人，阳明弟子。"],["戒惧、慎独","《中庸》：「君子戒慎乎其所不睹，恐惧乎其所不闻。……故君子慎其独也。」朱熹将戒惧与慎独分为两种功夫。"],["见君子而后厌然","《大学》：「小人闲居为不善，无所不至，见君子而后厌然，掩其不善而著其善。」厌然，躲闪掩藏的样子。"],["莫见莫显","《中庸》：「莫见乎隐，莫显乎微，故君子慎其独也。」"],["断灭禅定","佛教中追求断绝一切念头的禅定，儒者常批评其流于虚寂。"]],"gl":[37,36,71],"q":"「独知之地」为什么是王霸义利的分界？","a":"那是只有自己知道的念头起处，没有半点虚假。在这里诚，就处处诚；在这里伪，做给人看的都是伪。","yong":"一个人在没人看见时怎么对待客户的数据、怎么写报价，就决定了他是做生意还是做买卖。","rec":"薛侃录","kj":[["r","贝","见","作伪便是"],["r","虚","处","体只在此"]]},{"n":121,"t":"养心莫善于诚","yw":"志道问：「荀子云『养心莫善于诚』，先儒非之，何也？」先生曰：「此亦未可便以为非。『诚』字有以工夫说者。诚是心之本体，求复其本体，便是思诚的工夫。明道说『以诚敬存之』，亦是此意。《大学》『欲正其心，先诚其意』。荀子之言固多病，然不可一例吹毛求疵。大凡看人言语，若先有个意见，便有过当处。『为富不仁』之言，孟子有取于阳虎，此便见圣贤大公之心。」","bh":"管志道问：「荀子说『修养心性，没有比诚更好的』，程子却批评他，为什么？」先生说：「这也不能马上认为是错的。『诚』字有从功夫上说的。诚是心的本体，求恢复这个本体，就是『思诚』的功夫。程明道说『用诚和敬来保存它』，也是这个意思。《大学》说『要端正心，先要使意念真诚』。荀子的话固然有很多毛病，但不能一概吹毛求疵。大凡看别人的言论，如果先有一个成见，就会有过分的地方。『为富不仁』这句话，孟子就从阳虎那里采用了，这就显出圣贤大公无私的心。」","zs":[["志道","阳明弟子。"],["养心莫善于诚","《荀子·不苟》。程颐批评说「荀子元不识诚」。"],["以诚敬存之","程颢《识仁篇》：「识得此理，以诚敬存之而已。」"],["为富不仁","《孟子·滕文公上》引阳虎语：「为富不仁矣，为仁不富矣。」阳虎是鲁国权臣，品行不端。"]],"gl":[98,120],"q":"荀子有很多毛病，他说的这句话也该否定吗？","a":"不该。不能因人废言，先有成见就会过当。孟子都能采用阳虎的话，这就是大公之心。","yong":"讨厌的竞争对手说了句对的话，承认它。","rec":"薛侃录","kj":[]},{"n":122,"t":"真己与躯壳之己","yw":"萧惠问：「己私难克，奈何？」先生曰：「将汝己私来，替汝克。」又曰：「人须有为己之心，方能克己；能克己，方能成己。」萧惠曰：「惠亦颇有为己之心，不知缘何不能克己？」先生曰：「且说汝有为己之心是如何。」惠良久曰：「惠亦一心要做好人，便自谓颇有为己之心。今思之，看来亦只是为得个躯壳的己，不曾为个真己。」先生曰：「真己何曾离着躯壳？恐汝连那躯壳的己也不曾为。且道汝所谓躯壳的己，岂不是耳、目、口、鼻、四肢？」惠曰：「正是为此，目便要色，耳便要声，口便要味，四肢便要逸乐，所以不能克。」先生曰：「『美色令人目盲，美声令人耳聋，美味令人口爽，驰骋田猎令人发狂』，这都是害汝耳、目、口、鼻、四肢的，岂得是为汝耳、目、口、鼻、四肢？若为着耳、目、口、鼻、四肢时，便须思量耳如何听，目如何视，口如何言，四肢如何动，必须非礼勿视、听、言、动，方才成得个耳、目、口、鼻、四肢，这个才是为着耳、目、口、鼻、四肢。汝今终日向外驰求，为名为利，这都是为着躯壳外面的物事。汝若为着耳、目、口、鼻、四肢，要非礼勿视、听、言、动时，岂是汝之耳、目、口、鼻、四肢自能勿视、听、言、动？须由汝心。这视、听、言、动，皆是汝心：汝心之视发窍于目，汝心之听发窍于耳，汝心之言发窍于口，汝心之动发窍于四肢。若无汝心，便无耳、目、口、鼻。所谓汝心，亦不专是那一团血肉。若是那一团血肉，如今已死的人，那一团血肉还在，缘何不能视、听、言、动？所谓汝心，却是那能视、听、言、动的，这个便是性，便是天理。有这个性，才能生这性之生理，便谓之仁。这性之生理，发在目便会视，发在耳便会听，发在口便会言，发在四肢便会动，都只是那天理发生，以其主宰一身，故谓之心。这心之本体，原只是个天理，原无非礼，这个便是汝之真己。这个真己是躯壳的主宰，若无真己，便无躯壳，真是有之即生，无之即死。汝若真为那个躯壳的己，必须用着这个真己，便须常常保守着这个真己的本体，戒慎不睹，恐惧不闻，惟恐亏损了他一些。才有一毫非礼萌动，便如刀割，如针刺，忍耐不过，必须去了刀，拔了针，这才是有为己之心，方能克己。汝今正是认贼作子，缘何却说有为己之心，不能克己？」","bh":"萧惠问：「自己的私欲很难克制，怎么办？」先生说：「把你的私欲拿来，我替你克。」又说：「人必须有为自己的心，才能克己；能克己，才能成就自己。」萧惠说：「我也很有为自己的心，不知道为什么不能克己？」先生说：「你先说说你为自己的心是怎样的。」萧惠过了好久才说：「我也一心想做个好人，就自以为很有为自己的心。现在想来，好像也只是为了躯壳的自己，不曾为真正的自己。」先生说：「真正的自己何曾离开过躯壳？恐怕你连那躯壳的自己也没有真为过。你说的躯壳的自己，难道不就是耳、目、口、鼻、四肢吗？」萧惠说：「正是为了这些：眼睛想看美色，耳朵想听美声，嘴巴想尝美味，四肢想要安逸享乐，所以不能克制。」先生说：「『五彩缤纷让人眼瞎，五音繁杂让人耳聋，五味浓厚让人口味败坏，纵马打猎让人心发狂』，这些都是伤害你耳目口鼻四肢的，怎么能说是为了你的耳目口鼻四肢？如果真是为了耳目口鼻四肢，就必须想想耳朵该怎么听、眼睛该怎么看、嘴巴该怎么说、四肢该怎么动，必须不合礼的不看、不听、不说、不做，才能成就耳目口鼻四肢，这才是真正为了耳目口鼻四肢。你现在整天向外追求，为名为利，这都是为了躯壳外面的东西。你如果为了耳目口鼻四肢，要做到非礼勿视听言动，难道是你的耳目口鼻四肢自己能做到不看不听不说不动吗？必须由你的心。这看、听、说、动，都是你的心：你心的看通过眼睛表现，你心的听通过耳朵表现，你心的说通过嘴巴表现，你心的动通过四肢表现。如果没有你的心，就没有耳目口鼻。所谓你的心，也不单是那一团血肉。如果是那一团血肉，现在已经死了的人，那一团血肉还在，为什么不能看听说动？所谓你的心，就是那个能看听说动的东西，这就是性，就是天理。有了这个性，才能生出这性的生生之理，这就叫作仁。这性的生生之理，表现在眼睛就会看，表现在耳朵就会听，表现在嘴巴就会说，表现在四肢就会动，都只是那天理在发生作用，因为它主宰一身，所以叫作心。这心的本体，原本只是个天理，原本没有不合礼的，这就是你的真己。这个真己是躯壳的主宰，没有真己就没有躯壳，真是有了它就生，没有它就死。你如果真为了那个躯壳的自己，就必须用这个真己，就必须常常保守这个真己的本体，在不被看见时也戒慎，在不被听见时也恐惧，唯恐对它有一点点亏损。刚有一丝一毫不合礼的念头萌动，就像刀割、像针刺一样，忍受不了，必须拿掉刀、拔出针，这才是有为己之心，才能克己。你现在正是把贼当成了儿子，怎么还说有为己之心却不能克己？」","zs":[["萧惠","阳明弟子，好道家佛家之学。"],["为己","《论语·宪问》：「古之学者为己，今之学者为人。」为己指为了修养自己，而非做给别人看。"],["美色令人目盲……","化用《老子》第十二章：「五色令人目盲，五音令人耳聋，五味令人口爽，驰骋畋猎令人心发狂。」爽，败坏。"],["非礼勿视听言动","《论语·颜渊》：「非礼勿视，非礼勿听，非礼勿言，非礼勿动。」"],["发窍","通过孔窍表现出来。"],["认贼作子","佛教语，把害自己的东西当成亲人。"]],"gl":[3,8,39,120],"q":"阳明说的「真己」是什么？和身体是什么关系？","a":"真己是能视听言动的那个心，即性、即天理。它是躯壳的主宰，不离躯壳；真为躯壳着想，就要守护真己，而不是放纵感官。","yong":"熬夜刷剧、暴饮暴食，你以为在「对自己好」，其实是在害躯壳。真为自己，就听真己的。","con":"反方：阳明把「心」等同于天理，而把感官欲望视为「贼」，这种身心观在现代看来有压抑身体之嫌。当代哲学和心理学更倾向于把欲望视为人性中正当的一部分，需要的是调节而非清除。","rec":"薛侃录","kj":[["r","东","克","私来替汝"],["r","顶","须","东又曰人"],["r","囗","口","不是耳目"],["r","囗","口","耳便要声"],["r","囗","口","美味令人"],["r","囗","口","害汝耳目"],["r","囗","口","为汝耳目"],["r","看","着","四肢若为"],["r","囗","口","为看耳目"],["r","祝囗","视口","听目如何"],["r","囗","口","得个耳目"],["r","囗","口","为着耳目"],["r","一逼","这","为名为利"],["r","囗","口","为着耳目"],["r","囗","口","汝之耳目"],["r","动","视","心汝心之"],["r","囗","口","言发窍于"],["r","囗","口","便无耳目"],["r","囗","口","会听发在"],["r","力","方","为己之心"]]},{"n":123,"t":"贵目贱心","yw":"有一学者病目，戚戚甚忧。先生曰：「尔乃贵目贱心。」","bh":"有一个学者眼睛生病，非常忧愁。先生说：「你这是看重眼睛而轻视心。」","zs":[["戚戚","忧愁的样子。"]],"gl":[122,44],"q":"眼睛病了忧愁，为什么是「贵目贱心」？","a":"为眼病忧愁到心神不宁，说明把眼睛看得比心还重，心被外物所役。","yong":"网站排名掉了，焦虑到睡不着？那是贵排名贱心。该改就改，心别跟着掉。","rec":"薛侃录","kj":[["r","二苖","尔","忧先生曰"]]},{"n":124,"t":"悔错用了三十年气力","yw":"萧惠好仙、释。先生警之曰：「吾亦自幼笃志二氏，自谓既有所得，谓儒者为不足学。其后居夷三载，见得圣人之学若是其简易广大，始自叹悔错用了三十年气力。大抵二氏之学，其妙与圣人只有毫厘之间。汝今所学，乃其土苴，辄自信自好若此，真鸱鸮窃腐鼠耳。」惠请问二氏之妙。先生曰：「向汝说圣人之学简易广大，汝却不问我悟的，只问我悔的！」惠惭谢，请问圣人之学。先生曰：「汝今只是了人事问，待汝辨个真要求为圣人的心，来与汝说。」惠再三请。先生曰：「已与汝一句道尽，汝尚自不会！」","bh":"萧惠喜好道家和佛家。先生警告他说：「我也从小就专心学习佛道两家，自认为已经有所收获，认为儒家不值得学。后来在贵州龙场住了三年，看到圣人之学是这样简易广大，才感叹后悔白白用错了三十年力气。大体来说，佛道两家的学问，它的精妙之处和圣人之学只有毫厘之差。你现在学的，只是他们的糟粕，就这样自信自喜，真像猫头鹰叼着一只腐烂的老鼠（还当宝贝）。」萧惠请教佛道两家的精妙之处。先生说：「刚才跟你说圣人之学简易广大，你不问我领悟了什么，却只问我后悔的东西！」萧惠惭愧地道歉，请教圣人之学。先生说：「你现在只是敷衍应付地问，等你真有了一颗要成为圣人的心，再来跟你说。」萧惠再三请教。先生说：「已经用一句话跟你说尽了，你自己还不明白！」","zs":[["土苴","糟粕、渣滓。"],["鸱鸮窃腐鼠","典出《庄子·秋水》：猫头鹰得到一只腐鼠，看到凤凰飞过，以为凤凰要抢，就仰头吓它。比喻把低贱的东西当成宝贝。"],["了人事","应付、敷衍了事。"],["一句道尽","指前面所说「圣人之学简易广大」，或指「辨个真要求为圣人的心」。"]],"gl":[49,94,122],"q":"萧惠问「二氏之妙」，阳明为什么不高兴？","a":"阳明刚说了自己悟到圣学简易广大、后悔学佛道，萧惠却偏问他后悔的东西，说明心思还在佛道上，没有真要求圣学的心。","yong":"向高手请教时，你问的是他「成功的核心」，还是他「走过的弯路里好玩的部分」？","rec":"薛侃录","kj":[["r","贝","见","居夷三载"]]},{"n":125,"t":"哑子吃苦瓜","yw":"刘观时问：「未发之中是如何？」先生曰：「汝但戒慎不睹，恐惧不闻，养得此心纯是天理，便自然见。」观时请略示气象。先生曰：「哑子吃苦瓜，与你说不得。你要知此苦，还须你自吃。」时曰仁在傍，曰：「如此才是真知，即是行矣。」一时在座诸友皆有省。","bh":"刘观时问：「未发之中是什么样子？」先生说：「你只要在没人看见时戒慎、没人听见时恐惧，把这颗心养得纯是天理，自然就看见了。」刘观时请先生大略描述一下它的气象。先生说：「哑巴吃苦瓜，没法跟你说。你要知道这个苦，还得你自己去吃。」当时徐爱在旁边，说：「这样才是真知，也就是行了。」当时在座的朋友都有所领悟。","zs":[["刘观时","阳明弟子，湖南武陵人。"]],"gl":[5,76,28],"q":"「哑子吃苦瓜」说明了什么？","a":"心体的境界只能亲自体验，无法用语言传达。亲自吃了才知苦，这样的知就是行，正是知行合一。","yong":"这本书里每一条，都是别人吃苦瓜的记录。不自己去吃，读一百遍也不知道苦。","rec":"薛侃录","kj":[]},{"n":126,"t":"知昼夜即知死生","yw":"萧惠问死生之道。先生曰：「知昼夜即知死生。」问昼夜之道。曰：「知昼则知夜。」曰：「昼亦有所不知乎？」先生曰：「汝能知昼？懵懵而兴，蠢蠢而食，行不着，习不察，终日昏昏，只是梦昼。惟『息有养，瞬有存』，此心惺惺明明，天理无一息间断，才是能知昼。这便是天德，便是通乎昼夜之道而知，更有甚么死生？」","bh":"萧惠问生死的道理。先生说：「知道白天黑夜，就知道生死。」萧惠问白天黑夜的道理。先生说：「知道白天就知道黑夜。」萧惠问：「白天也有不知道的吗？」先生说：「你能知道白天？迷迷糊糊地起床，傻傻地吃饭，做了也不明白、习惯了也不省察，整天昏昏沉沉，只是在白天做梦。只有『每一次呼吸都有涵养，每一个瞬间都有存守』，这颗心清醒明白，天理没有一刻间断，才是能知道白天。这就是天德，就是通晓昼夜之道而知，还有什么生死可言？」","zs":[["通乎昼夜之道而知","《周易·系辞上》：「通乎昼夜之道而知，故神无方而易无体。」"],["息有养，瞬有存","张载《正蒙·有德》：「言有教，动有法，昼有为，宵有得，息有养，瞬有存。」"],["惺惺","清醒、警觉。"]],"gl":[47,69,79],"q":"为什么说多数人「只是梦昼」？","a":"白天虽然醒着，却迷迷糊糊、行不着习不察，心没有主宰，跟做梦一样。只有心时时清明、天理不间断，才是真知昼。","yong":"今天你有几个小时是「醒着」的？不是指没睡觉，是指心在。","con":"反方：这一条对「死生」问题的回答相当回避：把生死问题转化为当下的清醒问题。萧惠问的是生死，阳明答的是修养。对于真正面对死亡焦虑的人，这种回答可能显得不够有温度，也没有回答死后怎样的问题。","rec":"薛侃录","kj":[["r","忌","息","天理无一"]]},{"n":127,"t":"性、道、教","yw":"马子莘问：「『修道之教』，旧说谓圣人品节吾性之固有，以为法于天下，若礼、乐、刑、政之属，此意如何？」先生曰：「道即性即命，本是完完全全，增减不得，不假修饰的，何须要圣人品节？却是不完全的物件。礼、乐、刑、政是治天下之法，固亦可谓之教，但不是子思本旨。若如先儒之说，下面由教入道的，缘何舍了圣人礼、乐、刑、政之教，别说出一段戒慎恐惧工夫？却是圣人之教为虚设矣。」子莘请问。先生曰：「子思性、道、教，皆从本原上说。天命于人，则命便谓之性；率性而行，则性便谓之道；修道而学，则道便谓之教。率性是诚者事，所谓『自诚明，谓之性』也；修道是诚之者事，所谓『自明诚，谓之教』也。圣人率性而行，即是道；圣人以下，未能率性，于道未免有过不及，故须修道。修道则贤知者不得而过，愚不肖者不得而不及，都要循着这个道，则道便是个教。此『教』字与『天道至教』、『风雨霜露，无非教也』之『教』同，『修道』字与『修道以仁』同。人能修道，然后能不违于道，以复其性之本体，则亦是圣人率性之道矣。下面戒慎恐惧便是修道的工夫，中和便是复其性之本体，如《易》所谓『穷理尽性以至于命』，中和位育便是尽性至命。」","bh":"马子莘问：「《中庸》说的『修道之谓教』，旧说认为是圣人对我们本性中固有的东西加以品评节制，作为天下的法度，比如礼、乐、刑、政之类，这个意思怎么样？」先生说：「道就是性，就是命，本来就是完完全全、增减不得、不需要修饰的，哪里需要圣人去品评节制？那样就成了不完整的东西了。礼乐刑政是治理天下的方法，当然也可以叫作教，但不是子思的本意。如果按照朱子的说法，下文讲由教入道的部分，为什么撇开圣人礼乐刑政的教化，另外说出一段戒慎恐惧的功夫？那圣人的教化就成了虚设了。」子莘请先生解释。先生说：「子思说的性、道、教，都是从本原上说的。天赋予人的，这个命就叫作性；顺着本性去做，这个性就叫作道；修养这个道去学习，这个道就叫作教。率性是『诚者』（圣人）的事，就是《中庸》说的『由真诚而明白，叫作性』；修道是『诚之者』（求诚的人）的事，就是『由明白而真诚，叫作教』。圣人顺着本性去做，就是道；圣人以下的人，不能完全顺着本性，对于道难免有过分或不及，所以必须修道。修道就能让贤人智者不至于过分，愚笨不肖的人不至于不及，大家都循着这个道，这个道就是教。这个『教』字和『天道是最好的教化』、『风雨霜露，无不是教化』的『教』一样，『修道』二字和『用仁来修道』的『修道』一样。人能修道，然后能不违背道，来恢复本性的本体，也就是圣人率性之道了。下文的戒慎恐惧就是修道的功夫，中和就是恢复本性的本体，就像《易经》说的『穷究事理、充分发挥本性，以至于通达天命』，中和、天地各安其位、万物生长发育，就是尽性至命。」","zs":[["修道之教","《中庸》首章：「天命之谓性，率性之谓道，修道之谓教。」"],["品节","品评节制、加以规范。朱熹《中庸章句》：「修，品节之也。……圣人因人物之所当行者而品节之，以为法于天下，则谓之教，若礼乐刑政之属是也。」"],["自诚明，自明诚","《中庸》：「自诚明，谓之性；自明诚，谓之教。」"],["天道至教","《礼记·礼器》。"],["风雨霜露，无非教也","《礼记·孔子闲居》。"],["修道以仁","《中庸》：「修身以道，修道以仁。」"],["穷理尽性以至于命","《周易·说卦》。"]],"gl":[3,28,120,38],"q":"阳明对「修道之谓教」的理解与朱子有何不同？","a":"朱子认为「教」是圣人制定的礼乐刑政；阳明认为「教」是常人修道以复性的功夫本身，戒慎恐惧就是修道。","con":"反方：朱子的解释把「教」落实到制度层面，重视外在规范对人的塑造，这一点在社会治理上有其合理性。阳明把「教」完全收归内心修养，有学者认为这削弱了儒家对制度建设的关注。","rec":"薛侃录","kj":[["r","对象","物件","不完全的"],["r","敢","教","是圣人之"],["r","肯","肖","而过愚不"]]},{"n":128,"t":"颜渊问为邦","yw":"黄诚甫问：「先儒以孔子告颜渊为邦之问，是立万世常行之道，如何？」先生曰：「颜子具体圣人，其于为邦的大本大原都已完备，夫子平日知之已深，到此都不必言，只就制度文为上说。此等处亦不可忽略，须要是如此方尽善。又不可因自己本领是当了，便于防范上疏阔，须是要『放郑声，远佞人』。盖颜子是个克己向里、德上用心的人，孔子恐其外面末节或有疏略，故就他不足处帮补说。若在他人，须告以『为政在人，取人以身，修身以道，修道以仁』，『达道九经』及『诚身』许多工夫，方始做得这个，方是万世常行之道。不然，只去行了夏时，乘了殷辂，服了周冕，作了《韶》舞，天下便治得？后人但见颜子是孔门第一人，又问个为邦，便把做天大事看了。」","bh":"黄诚甫问：「朱子认为孔子回答颜渊如何治国的问题，是确立了万世通行的大道，怎么理解？」先生说：「颜回已经具备了圣人的全体，他对治国的根本大原都已完备，孔子平时早已深知，到这时都不必再说，只在制度礼文上说说。这些地方也不能忽略，必须这样才算尽善。又不能因为自己根本已经正当了，就在防范上疏忽大意，必须要『废弃郑国的音乐，远离奸佞小人』。因为颜回是个克制自己、向内用功、在德行上用心的人，孔子怕他在外面的细节上有疏忽，所以就他不足的地方帮他补充说明。如果是对别人，就必须告诉他『治理政事在于得人，得人在于修身，修身在于行道，行道在于仁』，以及『五达道、九经』和『诚身』等许多功夫，才能做好治国这件事，这才是万世通行的大道。不然，难道只要实行夏朝的历法、乘坐商朝的车子、戴上周朝的礼帽、演奏《韶》乐，天下就能治理好吗？后人只看到颜回是孔门第一人，又问了治国的问题，就把这当成天大的事来看了。」","zs":[["颜渊问为邦","《论语·卫灵公》：「颜渊问为邦。子曰：行夏之时，乘殷之辂，服周之冕，乐则《韶》舞。放郑声，远佞人。郑声淫，佞人殆。」"],["辂","古代的大车。"],["为政在人……达道九经","均出自《中庸》第二十章。五达道指君臣、父子、夫妇、昆弟、朋友；九经指治天下的九项常道。"]],"gl":[14,113,127],"q":"孔子为什么只跟颜回讲制度礼文？","a":"因为颜回根本已立，孔子只就他不足之处（外在末节）帮补。对别人则必须先讲修身、诚身的根本。","yong":"带徒弟要因人施教：对基础扎实的人讲细节规范，对新手先讲做人做事的根本。","rec":"薛侃录","kj":[]},{"n":129,"t":"诚意为主，不必补敬字","yw":"蔡希渊问：「文公《大学》新本，先格致而后诚意工夫，似与首章次第相合。若如先生从旧本之说，即诚意反在格致之前，于此尚未释然。」先生曰：「《大学》工夫即是明明德，明明德只是个诚意，诚意的工夫只是格物致知。若以诚意为主，去用格物致知的工夫，即工夫始有下落，即为善去恶无非是诚意的事。如新本先去穷格事物之理，即茫茫荡荡，都无着落处，须用添个『敬』字，方才牵扯得向身心上来，然终是没根原。若须用添个『敬』字，缘何孔门倒将一个最紧要的字落了，直待千余年后要人来补出？正谓以诚意为主，即不须添『敬』字。所以举出个诚意来说，正是学问的大头脑处。于此不察，真所谓『毫厘之差，千里之缪』。大抵《中庸》工夫只是诚身，诚身之极便是至诚；《大学》工夫只是诚意，诚意之极便是至善。工夫总是一般。今说这里补个『敬』字，那里补个『诚』字，未免画蛇添足。」","bh":"蔡希渊问：「朱文公的《大学》新本，先讲格物致知，然后讲诚意功夫，似乎和第一章的次序相符。如果像先生那样依从旧本，诚意反而在格物致知之前，我对这一点还没有想通。」先生说：「《大学》的功夫就是明明德，明明德只是个诚意，诚意的功夫只是格物致知。如果以诚意为主，去用格物致知的功夫，功夫才有着落，为善去恶无非都是诚意的事。如果像新本那样先去穷究事物的道理，就茫茫然没有着落，必须添一个『敬』字，才能牵扯到身心上来，但终究没有根源。如果必须添一个『敬』字，为什么孔门反而把一个最紧要的字漏掉了，直到一千多年后要人来补上？正是因为以诚意为主，就不需要添『敬』字。之所以特别提出诚意来说，正是学问的最大关键。在这里不明察，真是所谓『差之毫厘，谬以千里』。大体上，《中庸》的功夫只是诚身，诚身到了极点就是至诚；《大学》的功夫只是诚意，诚意到了极点就是至善。功夫总是一样的。现在这里补个『敬』字，那里补个『诚』字，未免画蛇添足了。」","zs":[["《大学》新本与旧本","朱熹的《大学章句》调整了古本章节顺序，并补写「格物致知传」，强调先格物致知再诚意。阳明于正德十三年（1518）刊刻《大学古本》，主张以诚意为主。"],["敬","朱熹以「敬」为贯穿《大学》的功夫：「敬者，圣学之所以成始而成终者也。」"]],"gl":[6,1,117,25],"q":"阳明为什么说朱子补「敬」字是画蛇添足？","a":"朱子先向外格物，茫无着落，只好补个「敬」字拉回身心；阳明以诚意为主，格物致知本身就是诚意功夫，不需要再补。","yong":"一套方法如果需要不断打补丁才能用，可能是起点就错了。","con":"反方：朱子的新本是在文本有错简、缺文的判断上做的整理，有一定文献学依据；阳明恢复古本，是出于义理需要，而非更好的文献证据。现代学者对《大学》文本是否有错简仍有争论，两家各有道理。","rec":"薛侃录","kj":[["r","昼","画","诚字未免"]]},{"t":"身心意知物只是一件","yw":"正德乙亥，九川初见先生于龙江。先生与甘泉先生论『格物』之说，甘泉持旧说。先生曰：「是求之于外了。」甘泉曰：「若以格物理为外，是自小其心也。」九川甚喜旧说之是。先生又论『尽心』一章，九川一闻，却遂无疑。后家居，复以『格物』遗质。先生答云：「但能实地用功，久当自释。」山间乃自录《大学》旧本读之，觉朱子『格物』之说非是；然亦疑先生以意之所在为物，『物』字未明。己卯归自京师，再见先生于洪都。先生兵务倥偬，乘隙讲授，首问：「近年用功何如？」九川曰：「近年体验得『明明德』功夫只是『诚意』。自『明明德于天下』，步步推入根源，到『诚意』上再去不得，如何以前又有『格致』工夫？后又体验，觉得意之诚伪必先知觉乃可，以颜子『有不善未尝不知，知之未尝复行』为证，豁然若无疑，却又多了『格物』工夫。又思来吾心之灵，何有不知意之善恶？只是物欲蔽了，须格去物欲，始能如颜子未尝不知耳。又自疑功夫颠倒，与『诚意』不成片段。后问希颜，希颜曰：『先生谓格物致知是诚意功夫，极好。』九川曰：『如何是诚意功夫？』希颜令再思体看。九川终不悟，请问。」先生曰：「惜哉！此可一言而悟，惟濬所举颜子事便是了。只要知身、心、意、知、物是一件。」九川疑曰：「物在外，如何与身、心、意、知是一件？」先生曰：「耳、目、口、鼻、四肢，身也，非心安能视、听、言、动？心欲视、听、言、动，无耳、目、口、鼻、四肢亦不能。故无心则无身，无身则无心。但指其充塞处言之谓之身，指其主宰处言之谓之心，指心之发动处谓之意，指意之灵明处谓之知，指意之涉着处谓之物，只是一件。意未有悬空的，必着事物，故欲诚意，则随意所在某事而格之，去其人欲而归于理，则良知之在此事者，无蔽而得致矣。此便是诚意的功夫。」九川乃释然，破数年之疑。又问：「甘泉近亦信用《大学》古本，谓『格物』犹言『造道』，又谓穷理如穷其巢穴之穷，以身至之也，故格物亦只是随处体认天理，似与先生之说渐同。」先生曰：「甘泉用功，所以转得来。当时与说『亲民』字不须改，他亦不信。今论『格物』亦近，但不须换『物』字作『理』字，只还他一『物』字便是。」后有人问九川曰：「今何不疑『物』字？」曰：「《中庸》曰『不诚无物』，程子曰『物来顺应』，又如『物各付物』『胸中无物』之类，皆古人常用字也。」他日先生亦云然。","bh":"正德十年（1515），我（陈九川）在南京龙江第一次见到先生。先生和湛甘泉先生讨论『格物』，甘泉坚持朱子旧说。先生说：「这是向外求了。」甘泉说：「如果把格物理当成向外，那是把自己的心看小了。」我当时很赞同旧说。先生又讲《孟子》『尽心』一章，我一听就没有疑问了。后来回家住，又写信请教格物。先生回信说：「只要踏实用功，时间久了自然明白。」我在山中自己抄了《大学》古本来读，发觉朱子的格物说不对；但也怀疑先生把『意之所在』当作物，『物』字还没弄明白。\n\n正德十四年（1519）我从京城回来，在南昌再见先生。先生军务繁忙，抽空讲学，第一句就问：「近年用功怎样？」我说：「近年体会到『明明德』的功夫只是『诚意』。从『明明德于天下』一步步往根源推，推到『诚意』就推不下去了，为什么诚意之前还有『格物致知』的功夫？后来又体会到，意念是诚是伪，必须先能察觉才行，拿颜回『有不善没有不知道的，知道了就不再犯』来印证，豁然好像没疑问了，却又多出一个『格物』功夫。又想，我心的灵明怎会不知道意念的善恶？只是被物欲遮蔽了，必须格去物欲，才能像颜回那样没有不知道的。可又怀疑功夫次序颠倒了，和『诚意』连不成一片。后来问蔡希颜，希颜说：『先生说格物致知就是诚意的功夫，说得太好了。』我问：『怎么就是诚意的功夫？』希颜让我再想想。我始终不明白，于是请教先生。」\n\n先生说：「可惜！这一句话就能明白，你举的颜回那件事就是答案。只要知道身、心、意、知、物是一件事。」我怀疑说：「物在外面，怎么和身、心、意、知是一件？」先生说：「耳目口鼻四肢是身，没有心怎么能看听说动？心想看听说动，没有耳目口鼻四肢也不行。所以没有心就没有身，没有身就没有心。只是从充满形体的角度说叫身，从主宰的角度说叫心，从心的发动说叫意，从意的灵明说叫知，从意所涉及的说叫物，其实只是一件。意从来不是悬空的，一定落在某件事物上，所以要诚意，就在意念所在的那件事上去格它，去掉人欲回归天理，那么良知在这件事上就没有遮蔽、能够推致了。这就是诚意的功夫。」我这才释然，打破了几年的疑惑。\n\n我又问：「湛甘泉最近也相信《大学》古本了，说『格物』就是『到达道』，又说穷理的『穷』像穷追到巢穴的『穷』，是亲身到达那里，所以格物也就是随处体认天理，好像和先生的说法越来越接近。」先生说：「甘泉肯用功，所以能转过来。当年我跟他说『亲民』的『亲』不必改，他也不信。现在讲格物也接近了，但不必把『物』字换成『理』字，还它一个『物』字就对了。」后来有人问我：「你现在怎么不怀疑『物』字了？」我说：「《中庸》说『不诚无物』，程子说『物来顺应』，还有『物各付物』『胸中无物』之类，都是古人常用的字。」后来有一天先生也这么说。","zs":[["九川","陈九川，字惟濬，号明水，江西临川人。卷下开头约二十条为他所记。"],["甘泉","湛若水，号甘泉，广东增城人，与阳明同时的著名心学家，主张「随处体认天理」。两人既是好友又是论敌。"],["洪都","南昌。己卯年（1519）阳明正在南昌平定宁王朱宸濠之乱，所以说「兵务倥偬」。"],["希颜","蔡宗兖，字希渊，或作希颜。"],["物各付物","程颐语，意为让每个事物各得其所。"]],"gl":[206,207,86,78],"q":"阳明怎样回答「物在外，怎么和身心意知是一件」？","a":"身心互相依存，从充塞处说是身，主宰处说是心，发动处说是意，灵明处说是知，涉着处说是物，只是一件。意必落在事上，所以诚意就在那件事上格去人欲。","yong":"你的「工作」不在你外面。你对一个项目起心动念的那一刻，那个项目就成了你心里的「物」。","n":201,"rec":"陈九川录","kj":[["r","日","曰","旧说先生"],["r","贾","实","答云但能"],["r","入","久","贾地用功"],["r","闲方","间乃","当自释山"],["r","巳","己","物字未明"],["r","撝","伪","得意之诚"],["r","挌","格","曰先生谓"],["d","二","","诚意功夫"],["r","浚","濬","言而悟惟"],["r","挌","格","在某事而"],["i","","理","道又谓穷"],["r","醴","体","只是随处"],["d","气","","物各付物"]]},{"t":"念不可息，只是要正","yw":"九川问：「近年因厌泛滥之学，每要静坐，求屏息念虑，非惟不能，愈觉扰扰，如何？」先生曰：「念如何可息？只是要正。」曰：「当自有无念时否？」先生曰：「实无无念时。」曰：「如此，却如何言静？」曰：「静未尝不动，动未尝不静。戒谨恐惧即是念，何分动静？」曰：「周子何以言『定之以中正仁义而主静』？」曰：「无欲故静，是『静亦定，动亦定』的『定』字，主其本体也。戒惧之念是活泼泼地，此是天机不息处，所谓『维天之命，于穆不已』。一息便是死，非本体之念即是私念。」","bh":"我问：「近年因为厌倦了泛滥无归的学问，常常想静坐，求停止念头思虑，不但做不到，反而越来越纷扰，怎么办？」先生说：「念头怎么能停止？只是要让它端正。」我问：「应当有没有念头的时候吧？」先生说：「确实没有无念的时候。」我问：「这样的话，怎么讲静呢？」先生说：「静中未尝没有动，动中未尝没有静。戒慎恐惧就是念头，哪里分动静？」我问：「那周敦颐为什么说『用中正仁义来安定，而以静为主』？」先生说：「没有私欲所以静，这个静就是『静也定、动也定』的定，是以本体为主。戒惧的念头是活泼泼的，这是天机永不停息之处，就是《诗经》说的『天命运行，深远不止』。一停息就是死，不是本体的念头就是私念。」","zs":[["定之以中正仁义而主静","周敦颐《太极图说》：「圣人定之以中正仁义而主静，立人极焉。」自注：「无欲故静。」底本脱「仁义」，据通行本补。"],["维天之命，于穆不已","《诗经·周颂·维天之命》。"]],"gl":[203,204,120],"q":"静坐想要「无念」对吗？","a":"不对。人实无无念时，念不可息，只要正。戒惧之念本身就是活泼泼的天机，停了就是死。","yong":"冥想时脑子停不下来？不用硬停。看着念头，把歪的扳正就行。","con":"反方：佛教禅修和现代正念训练都承认，经过训练可以达到念头极少甚至短暂「无念」的状态，并对心理有益。阳明说「实无无念时」，更多是在反对以无念为目标的修法，而不是在描述心理事实。","n":202,"rec":"陈九川录","kj":[["r","戌","戒","未尝不静"],["i","","义","以中正仁"],["r","郥","即","本体之念"]]},{"t":"闻见而不流去","yw":"又问：「用功收心时，有声、色在前，如常闻见，恐不是专一？」曰：「如何欲不闻见？除是槁木死灰，耳聋目盲则可。只是虽闻见而不流去便是。」曰：「昔有人静坐，其子隔壁读书，不知其勤惰。程子称其甚敬。何如？」曰：「伊川恐亦是讥他。」","bh":"我又问：「用功收心的时候，有声音、颜色在面前，还像平常一样听得见看得见，恐怕不算专一吧？」先生说：「怎么能不听不看？除非是枯木死灰、耳聋眼瞎才行。只要虽然听见看见，心却不跟着跑掉就是了。」我问：「从前有人静坐，他儿子在隔壁读书，他都不知道儿子是勤是懒。程子称赞他非常『敬』。这怎么样？」先生说：「程伊川恐怕也是在讽刺他。」","zs":[["流去","心随着外物流散出去。"]],"gl":[202,204,15],"q":"收心时还能听见看见，算不算不专一？","a":"不算。闻见是正常的，只要心不跟着流去就是专一。连儿子勤惰都不知道，那不是敬，是麻木。","yong":"写方案时听到微信响，听见没关系，别点开就行。","n":203,"rec":"陈九川录","kj":[["r","地","他","恐亦是讥"]]},{"t":"心何尝有内外","yw":"又问：「静坐用功，颇觉此心收敛，遇事又断了，旋起个念头去事上省察，事过又寻旧功，还觉有内外，打不作一片。」先生曰：「此『格物』之说未透。心何尝有内外？即如惟濬今在此讲论，又岂有一心在内照管？这听讲说时专敬，即是那静坐时心。功夫一贯，何须更起念头？人须在事上磨练做功夫，乃有益。若只好静，遇事便乱，终无长进，那静时功夫亦差，似收敛而实放溺也。」后在洪都，复与于中、国裳论内外之说，渠皆云物自有内外，但要内外并着功夫，不可有间耳。以质先生，曰：「功夫不离本体，本体原无内外。只为后来做功夫的分了内外，失其本体了。如今正要讲明功夫不要有内外，乃是本体功夫。」是日俱有省。","bh":"我又问：「静坐用功时，觉得心很收敛；一遇到事情就断了，又起一个念头到事情上去省察；事情过了又去找原来的功夫，还是觉得有内有外，打不成一片。」先生说：「这是对『格物』还没理解透。心何曾有内外？就像你惟濬现在在这里讨论，难道另有一个心在里面照管？这听讲时的专注恭敬，就是静坐时的那颗心。功夫是一贯的，何必再另起念头？人必须在事上磨练做功夫，才有益处。如果只喜欢静，遇事就乱，终究没有长进，那静时的功夫也是错的，看起来收敛，其实是放纵沉溺。」后来在南昌，我又和夏于中、舒国裳讨论内外的问题，他们都说事物本来就有内外，只是要内外一起下功夫，不能有间断罢了。拿去请教先生，先生说：「功夫离不开本体，本体本来没有内外。只因为后来做功夫的人分了内外，就丢了本体。现在正是要讲明功夫不要分内外，这才是本体上的功夫。」那天大家都有所醒悟。","zs":[["于中","夏良胜，字于中。"],["国裳","舒芬，字国裳，正德年间状元。"],["放溺","放纵沉溺。"]],"gl":[23,202,87],"q":"静坐时心收敛、遇事就断，问题出在哪里？","a":"把功夫分成内外两截。心本无内外，听讲时的专敬就是静坐时的心，事上磨练和静坐是一个功夫。","yong":"别把「修心时间」和「干活时间」分开。干活时专注、不起私心，就是修心。","n":204,"rec":"陈九川录","kj":[["r","僣","濬","外即如惟"],["r","闲","间","夫不可有"],["r","篔","质","有闲耳以"],["r","先","失","分了内外"]]},{"t":"陆象山只是粗些","yw":"又问：「陆子之学何如？」先生曰：「濂溪、明道之后，还是象山，只是粗些。」九川曰：「看他论学，篇篇说出骨髓，句句似针膏肓，却不见他粗。」先生曰：「然。他心上用过功夫，与揣摹依仿、求之文义自不同，但细看有粗处，用功久当见之。」","bh":"我又问：「陆象山的学问怎样？」先生说：「周濂溪、程明道之后，还数陆象山，只是粗一些。」我说：「看他讲学，篇篇说到骨髓里，句句像针扎进要害，却看不出他粗。」先生说：「是的。他在心上下过功夫，和那些揣摩模仿、在文字上求意义的人自然不同，但细看有粗糙的地方，你用功久了自然会看到。」","zs":[["陆子","陆九渊，号象山。底本作「何加」，据通行本改「何如」。"],["濂溪、明道","周敦颐（号濂溪）、程颢（号明道）。"],["针膏肓","针刺到要害处。"]],"gl":[37],"q":"阳明怎么评价陆象山？","a":"在周濂溪、程明道之后数他最好，因为他真在心上用过功；但细看还有粗处。","n":205,"rec":"陈九川录","kj":[["r","加","如","子之学何"],["r","尥","他","先生曰然"],["r","扈","处","细看有粗"]]},{"t":"良知是你自家底准则（核心条）","yw":"庚辰往虔州再见先生，问：「近来功夫虽若稍知头脑，然难寻个稳当快乐处。」先生曰：「尔却去心上寻个天理，此正所谓理障。此间有个诀窍。」曰：「请问如何？」曰：「只是致知。」曰：「如何致？」曰：「尔那一点良知，是尔自家底准则。尔意念着处，他是便知是，非便知非，更瞒他一些不得。尔只不要欺他，实实落落依着他做去，善便存，恶便去，他这里何等稳当快乐！此便是『格物』的真诀，『致知』的实功。若不靠着这些真机，如何去格物？我亦近年体贴出来如此分明，初犹疑只依他恐有不足，精细看，无些小欠阙。」","bh":"正德十五年（1520），我到赣州再见先生，问：「近来功夫虽然好像稍微知道了些头绪，但很难找到一个稳当快乐的地方。」先生说：「你是到心上去找一个天理，这正是所谓的『理障』。这里有个诀窍。」我问：「请问是什么？」先生说：「只是致知。」我问：「怎么致？」先生说：「你那一点良知，是你自己的准则。你意念所到之处，对的它就知道对，错的它就知道错，一点也瞒不过它。你只要不欺骗它，踏踏实实依着它去做，善的就保存，恶的就去掉，这样多么稳当快乐！这就是『格物』的真正诀窍，『致知』的实际功夫。如果不依靠这点真机，怎么去格物？我也是近几年才体会得这样分明，起初还怀疑只依着它恐怕不够，仔细看来，一点欠缺都没有。」","zs":[["虔州","今江西赣州。阳明时任南赣巡抚。"],["理障","佛教术语，指执着于义理反而成为障碍。"],["真机","真正的枢机、关键。"]],"gl":[208,209,201,87],"q":"阳明说的「稳当快乐」从哪里来？","a":"不欺良知，实实落落依着它去做，善便存、恶便去。良知是自家准则，什么都瞒不过它。","yong":"做决定纠结时，问自己：我心里其实知道答案吗？多半知道，只是不想承认。","con":"反方：如果每个人的良知都是「自家准则」，不同人的良知判断冲突时怎么办？历史上很多人凭「良心」做出了互相对立甚至可怕的事。阳明会说那是良知被私欲遮蔽，但外人很难判断谁的良知是被遮蔽的，这正是心学最常被质疑的地方。","n":206,"rec":"陈九川录","kj":[["r","恼","脑","若稍知头"],["r","扈","处","稳当快乐"],["r","闲","间","谓理障此"],["d","知","","曰如何致"],["r","扈","处","尔意念着"],["r","地","他","知非更瞒"],["r","饥","机","着这些真"],["r","尥","他","犹疑只依"]]},{"t":"人胸中各有个圣人","yw":"在虔，与于中、谦之同侍。先生曰：「人胸中各有个圣人，只自信不及，都自埋倒了。」因顾于中曰：「尔胸中原是圣人。」于中起，不敢当。先生曰：「此是尔自家有的，如何要推？」于中又曰：「不敢。」先生曰：「众人皆有之，况在于中，却何故谦起来？谦亦不得。」于中乃笑受。又论：「良知在人，随你如何不能泯灭，虽盗贼亦自知不当为盗，唤他做贼，他还忸怩。」于中曰：「只是物欲遮蔽，良心在内，自不会失。如云自蔽日，日何尝失了！」先生曰：「于中如此聪明，他人见不及此。」","bh":"在赣州时，我和夏于中、邹谦之一起陪侍先生。先生说：「每个人心中都有一个圣人，只是自己不够自信，都自己把它埋没了。」于是看着于中说：「你心中原本就是圣人。」于中站起来，说不敢当。先生说：「这是你自己本来就有的，为什么要推辞？」于中又说：「不敢。」先生说：「人人都有，何况你于中，为什么谦虚起来？谦虚也推不掉。」于中这才笑着接受了。先生又讲：「良知在人心里，不管怎样都不会泯灭，即使是盗贼，也自己知道不应该做贼，叫他一声贼，他还会不好意思。」于中说：「只是被物欲遮蔽了，良心在里面，自然不会丢失。就像云遮住了太阳，太阳何曾丢了！」先生说：「于中这么聪明，别人见不到这一层。」","zs":[["谦之","邹守益，字谦之，江西安福人，阳明重要弟子。"],["忸怩","难为情、不好意思。"]],"gl":[206,208,313],"q":"阳明为什么说「谦亦不得」？","a":"圣人之心是人人本有的，不是夸赞，而是事实，推辞就是不自信，把它埋倒了。","yong":"别总说「我不行」。你心里那个知道对错的东西，跟圣人的是同一个。","n":207,"rec":"陈九川录","kj":[["r","尥怍娀地","他做贼他","当为盗唤"],["r","口","日","云自蔽日"],["r","矢","失","日口何尝"],["r","地","他","如此聪明"]]},{"t":"良知是试金石、指南针","yw":"先生曰：「这些子看得透彻，随他千言万语，是非诚伪，到前便明。合得的便是，合不得的便非，如佛家说『心印』相似，真是个试金石、指南针。」","bh":"先生说：「把这一点（良知）看透了，任凭他千言万语，是对是错、是真是假，一到面前就明白了。合得上的就对，合不上的就错，就像佛家说的『心印』一样，真是一块试金石、一根指南针。」","zs":[["这些子","这一点儿，指良知。"],["心印","禅宗语，指以心传心、不立文字的印证。"]],"gl":[206,209],"q":"良知像什么？","a":"像试金石、指南针：千言万语到面前，合得上良知的就是，合不上的就非。","yong":"听各路「专家」讲 SEO 新玩法时，拿你对客户真实需要的判断去对一下，合不上的就别跟。","n":208,"rec":"陈九川录","kj":[["r","台","合","得的便是"]]},{"t":"灵丹一粒，点铁成金","yw":"先生曰：「人若知得良知诀窍，随他多少邪思枉念，这里一觉，都自消融，真个是灵丹一粒，点铁成金。」","bh":"先生说：「人如果知道了良知这个诀窍，不管有多少邪念妄想，在这里一察觉，就都自然消融了，真是一粒灵丹，能点铁成金。」","zs":[["点铁成金","道家炼丹术语，比喻化腐朽为神奇。"]],"gl":[206,208,334],"q":"邪念来了怎么办？","a":"不用硬压，良知一觉察，它就自然消融。","yong":"想骂人时，察觉到「我想骂人」，那股火往往就下去一半。","n":209,"rec":"陈九川录","kj":[["r","章","得","曰人若知"],["r","心","知","若知章良"]]},{"t":"再用功半年看如何","yw":"崇一曰：「先生『致知』之旨，发尽精蕴，看来这里再去不得。」先生曰：「何言之易也！再用功半年看如何？又用功一年看如何？功夫愈久，愈觉不同，此难口说。」","bh":"欧阳崇一说：「先生『致知』的宗旨，已经把精义全部阐发出来了，看来这里再也往前走不了了。」先生说：「怎么说得这么轻易！你再用功半年看看怎样？再用功一年看看怎样？功夫越久，越觉得不同，这很难用嘴说清。」","zs":[["精蕴","精深的含义。"]],"gl":[211,222],"q":"「致知」的道理讲完了，就算学到头了吗？","a":"没有。功夫越久越觉不同，这不是讲出来的，是做出来的。","yong":"你觉得自己已经完全懂了某个技能？再干半年看看。","n":210,"rec":"陈九川录","kj":[["r","缢","蕴","旨发尽精"],["d","上","","言之易也"]]},{"t":"体来与听讲不同","yw":"先生问：「九川于『致知』之说体验如何？」九川曰：「自觉不同。往时操持常不得个恰好处，此乃是恰好处。」先生曰：「可知是体来与听讲不同。我初与讲时，知尔只是忽易，未有滋味。只这个要妙，再体到深处，日见不同，是无穷尽的。」又曰：「此『致知』二字，真是个千古圣传之秘，见到这里，『百世以俟圣人而不惑』。」","bh":"先生问：「九川，你对『致知』的说法体验得怎样？」我说：「自己觉得不同了。以前把持心的时候，总找不到恰到好处的地方，这就是恰到好处的地方了。」先生说：「可见亲身体会和听讲是不同的。我起初跟你讲时，知道你只是轻易听过，没有尝到滋味。就这个精要之处，再往深处体会，每天都会不一样，是没有穷尽的。」又说：「这『致知』两个字，真是千古圣人相传的秘诀，见到了这里，就是等一百代后的圣人来检验，也不会有疑惑。」","zs":[["百世以俟圣人而不惑","《中庸》语。"]],"gl":[210,206],"q":"「体来与听讲不同」说明了什么？","a":"道理听懂不等于真知，必须亲身体验才有滋味，而且越体越深、没有穷尽。","yong":"这本书你听我讲了一遍，那是「听讲」。去用一次，才是「体来」。","n":211,"rec":"陈九川录","kj":[["r","一逼","这","之秘见到"]]},{"t":"泄天机？","yw":"九川问曰：「伊川说到『体用一原，显微无间』处，门人已说是泄天机。先生『致知』之说，莫亦泄天机太甚否？」先生曰：「圣人已指以示人，只为后人掩匿，我发明耳，何故说泄？此是人人自有的，觉来甚不打紧一般。然与不用实功人说，亦甚轻忽，可惜彼此无益；与实用功而不得其要者提撕之，甚沛然得力。」","bh":"我问：「程伊川讲到『体用出于一源，显微没有间隔』时，门人已经说他泄露天机了。先生『致知』的说法，莫非泄露天机太过分了？」先生说：「圣人早已指给人看了，只因后人把它掩盖了，我不过是把它阐明出来罢了，怎么说是泄露？这是人人本来就有的，领会了觉得好像也没什么要紧的。但跟不肯切实用功的人说，他们也很轻视，可惜对双方都没有益处；跟切实用功却没抓住要领的人一点拨，就会非常充沛有力。」","zs":[["体用一原，显微无间","程颐《易传序》。"],["提撕","提醒、点拨。"]],"gl":[211,24],"q":"致良知的道理该跟谁讲？","a":"跟不用实功的人讲，他会轻忽，彼此无益；跟用实功却不得要领的人一点拨，就沛然得力。","yong":"给客户讲专业建议也是这样：对方没在做，讲了白讲；对方在做但卡住了，一句话就能点透。","n":212,"rec":"陈九川录","kj":[["r","穖","机","说是泄天"],["r","拨","机","莫亦泄天"],["r","揜","掩","只为后人"],["r","无","与","彼此无益"]]},{"t":"知来本无知","yw":"又曰：「知来本无知，觉来本无觉，然不知则遂沦埋。」","bh":"先生又说：「良知本来没有刻意的知，本来没有刻意的觉，但如果不知不觉，良知就被埋没了。」","zs":[["本条","意思较为玄妙。良知的知不是刻意的认知活动，而是自然的明觉；但人若完全昏昧，这份明觉也会被埋没。"]],"gl":[329,282],"q":"「知来本无知」怎么理解？","a":"良知的知是自然明觉，不是刻意去知；但若完全不知不觉，良知就会被埋没。","n":213,"rec":"陈九川录","kj":[]},{"t":"诱掖奖劝意多","yw":"先生曰：「大凡朋友，须箴规指摘处少，诱掖奖劝意多，方是。」后又戒九川云：「与朋友论学，须委曲谦下，宽以居之。」","bh":"先生说：「大凡朋友之间，必须劝诫指责少一些，引导鼓励多一些，才对。」后来又告诫我说：「和朋友讨论学问，必须委婉谦逊，宽厚待人。」","zs":[["箴规","劝诫规正。"],["诱掖","引导扶持。"]],"gl":[18,246],"q":"阳明主张朋友之间怎样相处？","a":"批评指摘少，引导鼓励多；讨论学问要委婉谦下、宽以待人。","yong":"带团队、指导客户改网站，先说哪里做得好，再说哪里可以改。","n":214,"rec":"陈九川录","kj":[]},{"t":"常快活便是功夫","yw":"九川卧病虔州。先生云：「病物亦难格，觉得如何？」对曰：「功夫甚难。」先生曰：「常快活便是功夫。」","bh":"我在赣州卧病。先生说：「生病这件事也很难格，你觉得怎样？」我回答：「功夫很难做。」先生说：「常常保持快活就是功夫。」","zs":[["病物","把生病当作要格的「物」。"]],"gl":[44,292],"q":"生病时怎么做功夫？","a":"常快活便是功夫。病也是一件事，在病中不被忧闷牵着走，就是格这个物。","yong":"感冒了、项目黄了、身体不舒服，别跟自己较劲。能保持心里不苦，就是功夫。","n":215,"rec":"陈九川录","kj":[]},{"t":"念头断了就接续","yw":"九川问：「自省念虑，或涉邪妄，或预料理天下事，思到极处，井井有味，便缱绻难屏。觉得早则易，觉迟则难，用力克治，愈觉扞格。惟稍迁念他事，则随两忘。如此廓清，亦似无害。」先生曰：「何须如此？只要在良知上着功夫。」九川曰：「正谓那一时不知。」先生曰：「我这里自有功夫，何缘得他来？只为尔功夫断了，便蔽其知。既断了，则继续旧功便是，何必如此？」九川曰：「直是难鏖，虽知丢他不去。」先生曰：「须是勇。用功久，自有勇。故曰『是集义所生者』。胜得容易，便是大贤。」","bh":"我问：「自我反省时，念头有时涉及邪妄，有时预先筹划天下大事，想到深处，津津有味，就缠绵难以摆脱。察觉得早还容易，察觉晚了就难，用力去克制，越觉得抵触不顺。只有稍微把念头转到别的事上，才会两边都忘掉。这样来清除，好像也没什么害处。」先生说：「何必这样？只要在良知上下功夫。」我说：「正是说那一时察觉不到。」先生说：「我这里自有功夫，那些念头怎么进得来？只因为你的功夫断了，就遮蔽了良知。既然断了，接上原来的功夫就是了，何必这样？」我说：「真是难以对付，虽然知道，也丢不掉它。」先生说：「必须有勇气。用功久了，自然有勇气。所以孟子说『浩然之气是积累义行而生的』。能轻易战胜它，就是大贤了。」","zs":[["缱绻","缠绵、难以分离。"],["扞格","抵触、格格不入。"],["鏖","苦战。"]],"gl":[209,39,334],"q":"用「转移注意力」来对付杂念，阳明为什么不赞成？","a":"那只是暂时忘掉，不是去根。正确的做法是在良知上下功夫，功夫断了就接上，用功久了自有勇气。","yong":"刷手机来忘掉焦虑，下次焦虑还会回来。直接看着它，用良知判断它，才是根治。","con":"反方：现代心理学认为，转移注意力（分心）是一种有效的短期情绪调节策略，尤其在情绪强烈时。阳明反对它，是因为他追求的是根除，而不是缓解，两者目标不同。","n":216,"rec":"陈九川录","kj":[["r","裹","里","生曰我这"],["r","纆","继","既断了则"],["r","贾","贤","易便是大"]]},{"t":"只要解心","yw":"九川问：「此功夫却于心上体验明白，只解书不通。」先生曰：「只要解心。心明白，书自然融会。若心上不通，只要书上文义通，却自生意见。」","bh":"我问：「这个功夫在心上体验得明白了，只是读书还是解释不通。」先生说：「只要解心。心明白了，书自然融会贯通。如果心上不通，只求书上文义通，反而会自己生出许多意见来。」","zs":[],"gl":[31,252],"q":"书读不懂时，先解书还是先解心？","a":"先解心。心明白，书自然融会；心不通只求文义通，反而生出偏见。","n":217,"rec":"陈九川录","kj":[["r","礼","体","却于心上"]]},{"t":"簿书讼狱之间，无非实学","yw":"有一属官，因久听讲先生之学，曰：「此学甚好，只是簿书讼狱繁难，不得为学。」先生闻之，曰：「我何尝教尔离了簿书讼狱，悬空去讲学？尔既有官司之事，便从官司的事上为学，才是真格物。如问一词讼，不可因其应对无状，起个怒心；不可因他言语圆转，生个喜心；不可恶其嘱托，加意治之；不可因其请求，屈意从之；不可因自己事务烦冗，随意苟且断之；不可因旁人谮毁罗织，随人意思处之。这许多意思皆私，只尔自知，须精细省察克治，惟恐此心有一毫偏倚，枉人是非，这便是格物致知。簿书讼狱之间，无非实学。若离了事物为学，却是着空。」","bh":"有一位下属官员，因为长期听先生讲学，说：「这学问很好，只是文书和诉讼案件太繁杂，没法做学问。」先生听了说：「我什么时候教你离开文书诉讼，悬空去讲学了？你既然有官府的事务，就在官府的事上做学问，这才是真正的格物。比如审理一桩诉讼，不能因为当事人应对无礼，就生出怒心；不能因为他说话圆滑动听，就生出喜心；不能因为讨厌他托人说情，就故意从重处治；不能因为他苦苦请求，就违心顺从；不能因为自己事务繁忙，就随意草率判决；不能因为旁人诋毁罗织罪名，就随别人的意思处理。这许多念头都是私意，只有你自己知道，必须精细地省察克治，唯恐这颗心有一丝一毫偏倚，冤枉了别人的是非，这就是格物致知。文书诉讼之间，无一不是实实在在的学问。如果离开了事物去做学问，反而是落空了。」","zs":[["簿书讼狱","文书档案和诉讼案件，指日常政务。"],["谮毁罗织","诬陷诽谤、捏造罪名。"],["着空","落空、不着实际。"]],"gl":[23,204,103],"q":"工作太忙没时间修身，阳明怎么回答？","a":"就在工作上修。审案时不因怒、喜、厌、求、忙、谗而偏，省察这些私意，就是格物致知。","yong":"处理客户投诉、报价、催款时，留意你有没有因为对方态度差而故意刁难，因为对方嘴甜而放水。这就是你的「簿书讼狱」。","n":218,"rec":"陈九川录","kj":[["r","纔","才","事上为学"],["r","杜","枉","一毫偏倚"],["r","闲","间","书讼狱之"]]},{"t":"好恶从之从个甚么","yw":"虔州将归，有诗别先生云：「良知何事系多闻？妙合当时已种根。好恶从之为圣学，将迎无处是乾元。」先生曰：「若未来讲此学，不知说『好恶从之』从个甚么？」敷英在座，曰：「诚然。尝读先生《大学古本序》，不知所说何事。及来听讲许时，乃稍知大意。」","bh":"我将要从赣州回去，写诗告别先生说：「良知和博闻多识有什么关系？它的妙处在于当下就已种下了根。顺从良知的好恶就是圣学，不迎不送（不预设、不留恋）就是天道。」先生说：「如果没来听讲这门学问，不知道说『好恶从之』是顺从个什么？」敷英在座，说：「确实是这样。我曾经读先生的《大学古本序》，不知道说的是什么。等来听了一阵子讲，才稍微知道了大意。」","zs":[["将迎","《庄子·应帝王》：「至人之用心若镜，不将不迎，应而不藏。」将，送；迎，迎接。"],["乾元","《周易》：「大哉乾元，万物资始。」指天道本原。"],["种根","底本作「种恨」，据文意改。"],["敷英","阳明弟子，生平不详。"]],"gl":[221,208],"q":"阳明为什么说没听讲就不知「好恶从之」从个甚么？","a":"「好恶从之」是顺从良知的好恶，不是顺从私欲。没有真体认良知，这四个字就会被误解成随心所欲。","n":219,"rec":"陈九川录","kj":[["r","恨","根","当时已种"],["r","干","乾","迎无处是"]]},{"t":"博闻多识是伤食之病","yw":"于中、国裳辈同侍食。先生曰：「凡饮食只是要养我身，食了要消化。若徒蓄积在肚里，便成痞了，如何长得肌肤？后世学者博闻多识，留滞胸中，皆伤食之病也。」","bh":"夏于中、舒国裳等人陪先生吃饭。先生说：「凡是吃东西，只是为了养我的身体，吃了要消化。如果只是堆积在肚子里，就成了积食的病，怎么长得出肌肉皮肤？后世学者博闻多识，都滞留在胸中，这都是消化不良的病。」","zs":[["痞","中医指腹中结块、胀满之症。"],["蓄积","底本作「蓄横」，据通行本改。"]],"gl":[217,252,99],"q":"「伤食之病」比喻什么？","a":"读书只求记得多，不消化、不用到身心上，就像吃了不消化，反成病痞。","yong":"收藏了一百篇「外贸干货」不看不用？那就是伤食。消化一篇，用到网站上，比收藏一百篇强。","n":220,"rec":"陈九川录","kj":[["r","横","积","化若徒蓄"],["r","加","如","便成痞了"],["r","官","肤","何长得肌"],["r","擘","学","肌官后世"]]},{"t":"圣人亦是学知，众人亦是生知","yw":"先生曰：「圣人亦是『学知』，众人亦是『生知』。」问曰：「何如？」曰：「这良知人人皆有，圣人只是保全，无些障蔽，兢兢业业，亹亹翼翼，自然不息，便也是学，只是生的分数多，所以谓之『生知安行』。众人自孩提之童，莫不完具此知，只是障蔽多，然本体之知自难泯息，虽问学克治，也只凭他，只是学的分数多，所以谓之『学知利行』。」","bh":"先生说：「圣人也是『学而知之』，普通人也是『生而知之』。」有人问：「这怎么说？」先生说：「这个良知人人都有。圣人只是把它保全了，没有一点遮蔽，小心谨慎、勤勉不懈，自然不停息，这也是学，只是天生的成分多，所以叫『生知安行』。普通人从孩童起，没有不完整具备这个良知的，只是遮蔽多，但本体的良知自然难以泯灭，即使是求学和克己，也只是凭着它，只是学的成分多，所以叫『学知利行』。」","zs":[["亹亹翼翼","勤勉不倦、恭敬谨慎。底本作「叠叠翼翼」，据通行本改。"],["分数","成分、比例。"]],"gl":[206,99,291],"q":"为什么说「圣人亦是学知，众人亦是生知」？","a":"良知人人生来具备（所以众人也是生知）；圣人保全良知也要兢兢业业（所以圣人也是学知）。区别只在生与学的分数多少。","yong":"别把「天赋」和「努力」对立。天赋人人都有一份，努力是保全它的方式。","n":221,"rec":"陈九川录","kj":[["r","日","曰","先生"],["r","叠叠","亹亹","兢兢业业"],["r","敷","数","是生的分"],["i","","以","分敷多所"],["r","髓","体","蔽多然本"],["r","冶","治","虽问学克"],["r","敷","数","是学的分"]]},{"n":222,"t":"一节之知即全体之知","yw":"黄以方问：「先生格致之说，随时格物以致其知，则知是一节之知，非全体之知也，何以到得『溥博如天，渊泉如渊』地位？」先生曰：「人心是天、渊。心之本体无所不该，原是一个天，只为私欲障碍，则天之本体失了；心之理无穷尽，原是一个渊，只为私欲窒塞，则渊之本体失了。如今念念致良知，将此障碍窒塞一齐去尽，则本体已复，便是天、渊了。」乃指天以示之曰：「比如面前见天，是昭昭之天，四外见天，也只是昭昭之天。只为许多房子墙壁遮蔽，便不见天之全体。若撤去房子墙壁，总是一个天矣。不可道眼前天是昭昭之天，外面又不是昭昭之天也。于此便见一节之知即全体之知，全体之知即一节之知，总是一个本体。」","bh":"黄以方问：「先生的格物致知之说，是随时在事物上格物来推致良知，那么这个知只是一部分的知，不是全体的知，怎么能达到《中庸》说的『广博如天，深邃如渊』的境界？」先生说：「人心就是天，就是渊。心的本体无所不包，原本就是一个天，只因为私欲阻碍，天的本体就失去了；心中的道理无穷无尽，原本就是一个渊，只因为私欲堵塞，渊的本体就失去了。现在念念致良知，把这些阻碍堵塞全部去除干净，本体就恢复了，就是天、就是渊了。」于是指着天给他看，说：「比如眼前看见的天，是明亮的天；到四周去看天，也只是明亮的天。只因为有许多房子墙壁遮挡，就看不到天的全体。如果拆掉房子墙壁，总是一个天。不能说眼前的天是明亮的天，外面的就不是明亮的天了。由此就可以看出，一部分的知就是全体的知，全体的知就是一部分的知，总是一个本体。」","zs":[["黄以方","黄直，字以方，江西金溪人。本条起至第236条为他所记。"],["溥博如天，渊泉如渊","《中庸》第三十一章，形容圣人德行的广大深远。"],["致良知","底本作「致真知」，据通行本改。"]],"gl":[201,206,63],"q":"每次只在一件事上致良知，怎么能达到全体？","a":"良知本体就像天，眼前看到的一片天和四周的天是同一个天。去掉私欲遮蔽，一节之知就是全体之知。","yong":"今天把一封客户邮件回得问心无愧，你用的就是完整的良知，不是「一部分」。","rec":"黄直录","kj":[["r","恪","格","之说随时"],["r","真","良","今念念致"],["r","眧眧","昭昭","天也只是"],["r","跟","眼","矣不可道"],["r","郥","即","一节之知"],["r","郥","即","全体之知"]]},{"n":223,"t":"功业气节只是循天理","yw":"先生曰：「圣贤非无功业气节，但其循着这天理，则便是道，不可以事功气节名矣。」","bh":"先生说：「圣贤并非没有功业和气节，只是他们遵循着天理，那就是道，不能用事功和气节来称呼他们。」","zs":[["气节","坚持正义、不屈不挠的品格。"]],"gl":[99,107],"q":"为什么不能用「功业气节」来称道圣贤？","a":"功业气节只是循天理的结果，圣贤之所以是圣贤，在于循天理本身，而不是那些外在的名目。","rec":"黄直录","kj":[]},{"n":224,"t":"发愤忘食，乐以忘忧","yw":"「『发愤忘食』，是圣人之志如此，真无有已时；『乐以忘忧』，是圣人之道如此，真无有戚时。恐不必云得不得也。」","bh":"「『发愤用功就忘了吃饭』，这是圣人的志向如此，真是没有停止的时候；『快乐起来就忘了忧愁』，这是圣人的道如此，真是没有忧戚的时候。恐怕不必说什么得到没得到。」","zs":[["发愤忘食，乐以忘忧","《论语·述而》：「其为人也，发愤忘食，乐以忘忧，不知老之将至云尔。」朱熹注解释为「未得则发愤而忘食，已得则乐之而忘忧」。阳明不赞成用「得不得」来分。"]],"gl":[15,30],"q":"阳明为什么不同意用「未得、已得」来解释这两句？","a":"发愤是圣人的志，时时都在；乐是圣人的道，时时都在。两者同时存在，不是先未得后已得。","yong":"真正热爱一件事，拼的时候和乐的时候是同时的，不是熬到成功才开心。","rec":"黄直录","kj":[]},{"n":225,"t":"各随分限所及","yw":"先生曰：「我辈致知，只是各随分限所及。今日良知见在如此，只随今日所知扩充到底；明日良知又有开悟，便从明日所知扩充到底。如此方是精一功夫。与人论学，亦须随人分限所及。如树有这些萌芽，只把这些水去灌溉，萌芽再长，便又加水。自拱把以至合抱，灌溉之功皆是随其分限所及。若些小萌芽，有一桶水在，尽要倾上，便浸坏他了。」","bh":"先生说：「我们致良知，只是各自按照自己能达到的程度。今天良知所见是这样，就按今天所知的扩充到底；明天良知又有新的领悟，就按明天所知的扩充到底。这样才是精一的功夫。和别人讨论学问，也必须按照对方能达到的程度。就像树刚有一点萌芽，就只浇这么一点水，萌芽再长大，就再加水。从一手可握到两臂合抱，浇水的功夫都是按它能承受的程度。如果只是一点小萌芽，却把一整桶水都倒上去，就把它泡坏了。」","zs":[["分限","限度、能力范围。"],["拱把","两手合围或一手可握，形容树木细小。"],["见在","即现在。"]],"gl":[30,22,10],"q":"致良知要一下子做到圆满吗？","a":"不用。今天知道多少就扩充到底，明天有新悟再扩充。教人也一样，按对方的分限给水，多了反而泡坏。","yong":"给刚入行的员工或客户讲 SEO，别一上来倒一桶水。他现在能吸收多少就给多少。","rec":"黄直录","kj":[["i","","致","生曰我辈"],["r","名","各","辈知只是"],["r","晨","良","到底明日"],["r","慨","溉","些水去灌"],["r","壤","坏","倾上便浸"]]},{"n":226,"t":"立言宗旨：一念发动即是行（核心条）","yw":"问知行合一。先生曰：「此须识我立言宗旨。今人学问，只因知、行分作两件，故有一念发动，虽是不善，然却未曾行，便不去禁止。我今说个『知行合一』，正要人晓得一念发动处便即是行了。发动处有不善，就将这不善的念克倒了，须要彻根彻底，不使那一念不善潜伏在胸中。此是我立言宗旨。」","bh":"有人问知行合一。先生说：「这必须了解我说这句话的宗旨。现在人做学问，只因为把知和行分成两件事，所以有一个念头发动了，虽然是不善的，但因为还没有去做，就不去禁止它。我现在提出『知行合一』，正是要人明白：一个念头发动的地方，就已经是行了。发动处如果有不善，就要把这个不善的念头克倒，必须彻根彻底，不让那一个不善的念头潜伏在心里。这就是我立言的宗旨。」","zs":[["立言宗旨","提出这个说法的根本用意。"]],"gl":[5,26,71],"q":"阳明提出「知行合一」的真正用意是什么？","a":"让人明白一念发动处就是行，不能因为「还没做」就放过不善的念头，要当下克倒、彻根彻底。","yong":"心里骂了客户一句，没说出口，阳明会说：那已经是行了。当场把它克掉。","con":"反方：把念头等同于行为，在道德上要求极高，在法律和日常伦理中都不成立（我们不因人「想」而惩罚他）。这种标准若用来要求他人，容易变成诛心之论；若用来要求自己，也可能导致过度自责。阳明的本意是自我修养的功夫，不宜用于评判别人。","rec":"黄直录","kj":[["d","言","","须识我立"],["r","猣","发","故有一念"],["r","虚","处","一念发动"],["r","猣","发","即是行了"],["r","虚","处","行了猣动"],["r","上上","立","中此是我"]]},{"n":227,"t":"圣人只是知个天理","yw":"「圣人无所不知，只是知个天理；无所不能，只是能个天理。圣人本体明白，故事事知个天理所在，便去尽个天理。不是本体明后，却于天下事物都便知得，便做得来也。天下事物，如名物度数、草木鸟兽之类，不胜其烦，圣人虽是本体明了，亦何缘能尽知得？但不必知的，圣人自不消求知；其所当知的，圣人自能问人。如『子入太庙，每事问』之类。先儒谓『虽知亦问，敬谨之至』，此说不可通。圣人于礼乐名物不必尽知，然他知得一个天理，便自有许多节文度数出来。不知能问，亦即是天理节文所在。」","bh":"「圣人无所不知，只是知道一个天理；无所不能，只是能够做到一个天理。圣人的本体明白，所以每件事都知道天理在哪里，就去把天理做到极致。并不是本体明白之后，对天下的事物都知道、都会做了。天下的事物，比如名称制度、草木鸟兽之类，繁多得数不清，圣人即使本体明白了，又怎么能全部知道？只是不必知道的，圣人自然不去求知；应当知道的，圣人自然会去问人。比如『孔子进太庙，每件事都问』之类。朱子说『孔子即使知道也问，这是恭敬谨慎到了极点』，这个说法讲不通。圣人对礼乐名物不必全都知道，但他知道一个天理，自然就有许多礼节规矩出来。不知道就能去问，这本身就是天理和礼节的所在。」","zs":[["子入太庙，每事问","《论语·八佾》。"],["节文度数","礼仪的细节和规格。"]],"gl":[67,3,61],"q":"孔子入太庙每事问，是明知故问以示恭敬吗？","a":"阳明认为不是，是真的不知道就问。圣人不必尽知名物度数，只知天理；不知能问，本身就是天理。","yong":"老板不必什么都懂。懂得在不懂的时候去问，就是你最该有的「专业」。","rec":"黄直录","kj":[["r","须","虽","其烦圣人"],["r","闲","问","圣人自能"],["r","序","每","子入太庙"],["r","间","问","太庙序事"]]},{"n":228,"t":"善恶只是一物","yw":"问：「先生尝谓善恶只是一物。善恶两端，如冰炭相反，如何谓只一物？」先生曰：「至善者，心之本体。本体上才过当些子，便是恶了，不是有一个善，却又有一个恶来相对也。故善恶只是一物。」直因闻先生之说，则知程子所谓『善固性也，恶亦不可不谓之性』，又曰『善恶皆天理，谓之恶者，本非恶，但于本性上过与不及之间耳』，其说皆无可疑。","bh":"有人问：「先生曾说善和恶只是一个东西。善和恶是两个极端，像冰和炭一样相反，怎么说只是一个东西？」先生说：「至善是心的本体。在本体上稍微过当一点，就是恶了，不是有一个善，又另外有一个恶和它相对。所以善恶只是一个东西。」我（黄直）因为听了先生的说法，就明白了程子说的『善固然是性，恶也不能不说是性』，又说『善恶都是天理，所谓恶，本来不是恶，只是在本性上过了或不及罢了』，这些说法都没有疑问了。","zs":[["善固性也……","程颢语，见《二程遗书》卷一。"]],"gl":[101,58,229],"q":"善恶像冰炭相反，阳明为什么说是一物？","a":"恶不是另一个实体，只是本体（至善）上的过当或不及。就像同一锅汤，咸淡适中是好，盐放多了是坏，不是另有一锅坏汤。","yong":"自信过头是自负，节俭过头是吝啬。你的很多毛病，其实是某个优点用过了。","con":"反方：把恶仅看作「过与不及」，可能低估了恶的独立性和严重性。像蓄意的残忍、恶意的欺骗，很难说只是某种善的「过当」。这是儒家性善论在解释「根本恶」时常受的质疑。","rec":"黄直录","kj":[["r","同","何","炭相反如"],["r","闲","间","与不及之"]]},{"n":229,"t":"好善如好好色，便是圣人","yw":"先生尝谓：「人但得好善如好好色，恶恶如恶恶臭，便是圣人。」直初闻之，觉甚易，后体验得来，此个功夫着实是难。如一念虽知好善恶恶，然不知不觉，又夹杂去了。才有夹杂，便不是好善如好好色、恶恶如恶恶臭的心。善能实实的好，是无一念不善矣；恶能实实的恶，是无念及恶矣。如何不是圣人？故圣人之学，只是一诚而已。","bh":"先生曾说：「人只要能喜欢善就像喜欢美色一样，厌恶恶就像厌恶臭味一样，就是圣人。」我起初听了，觉得很容易，后来亲身体验，才知道这个功夫确实很难。比如一个念头虽然知道要好善恶恶，但不知不觉中又夹杂了别的东西。一有夹杂，就不是好善如好好色、恶恶如恶恶臭的心了。对善能实实在在地喜欢，那就没有一个念头不善了；对恶能实实在在地厌恶，那就没有一个念头会涉及恶了。这怎么不是圣人？所以圣人的学问，只是一个诚字罢了。","zs":[["分条说明","底本把这一条和上一条连在一起，中间有一个「○」分隔。通行本分为两条（陈荣捷第228、229条），这里从通行本分开。"]],"gl":[5,228,119],"q":"「好善如好好色」为什么听起来容易、做起来难？","a":"一念虽知好善恶恶，但不知不觉就夹杂了别的念头（面子、利益），一夹杂就不是真好真恶了。所以圣学只是一个诚。","yong":"你说你喜欢做好产品，那你对客户的差评和对竞品的好评，是真心看待还是夹杂了面子？","rec":"黄直录","kj":[["r","礼","体","觉甚易后"],["r","同","何","及恶矣如"]]},{"n":230,"t":"率性与修道","yw":"问《修道说》言『率性之谓道』属圣人分上事，『修道之谓教』属贤人分上事。先生曰：「众人亦率性也，但率性在圣人分上较多，故『率性之谓道』属圣人事。圣人亦修道也，但修道在贤人分上多，故『修道之谓教』属贤人事。」又曰：「《中庸》一书，大抵皆是说修道的事。故后面凡说君子，说颜渊，说子路，皆是能修道的；说小人，说贤知愚不肖，说庶民，皆是不能修道的；其他言舜、文、周公、仲尼，至诚至圣之类，则又圣人之自能修道者也。」","bh":"有人问：先生的《修道说》里说『率性之谓道』属于圣人分内的事，『修道之谓教』属于贤人分内的事，这是什么意思？先生说：「普通人也率性，只是率性在圣人那里比较多，所以『率性之谓道』属于圣人的事。圣人也修道，只是修道在贤人那里比较多，所以『修道之谓教』属于贤人的事。」又说：「《中庸》这本书，大体上都是讲修道的事。所以后面凡是讲君子、讲颜渊、讲子路的，都是能修道的；讲小人、讲贤智者和愚笨不肖者、讲平民的，都是不能修道的；其他讲舜、文王、周公、孔子，至诚至圣之类的，又是圣人中自己能修道的。」","zs":[["《修道说》","阳明所作短文。"]],"gl":[127,265,266],"q":"「率性」和「修道」分属圣人和贤人，是绝对的吗？","a":"不是。众人也率性，圣人也修道，只是各自分量多少不同。","rec":"黄直录","kj":[["r","日","曰","上事先生"],["r","日","曰","贤人事又"],["r","放","故","修道的事"],["r","它","他","修道的其"]]},{"n":231,"t":"三更时的静与释氏之静","yw":"问：「儒者到三更时分，扫荡胸中思虑，空空静静，与释氏之静只一般，两下皆不用，此时何所分别？」先生曰：「动静只是一个。那三更时分空空静静的，只是存天理，即是如今应事接物的心。如今应事接物的心，亦是循此理，便是那三更时分空空静静的心。故动静只是一个，分别不得。知得动静合一，释氏毫厘差处亦自莫掩矣。」","bh":"有人问：「儒者到了三更半夜，扫除心中的思虑，空空静静的，和佛家的静一样，两边都不用心，这时候有什么区别？」先生说：「动和静只是一个。那三更时分空空静静的，只是存天理，也就是现在应事接物的心。现在应事接物的心，也是遵循这个天理，就是那三更时分空空静静的心。所以动静只是一个，分不开。懂得了动静合一，佛家那毫厘之差的地方也就掩盖不住了。」","zs":[],"gl":[41,87,108],"q":"儒者夜里的静和佛家的静有什么区别？","a":"儒者的静是存天理，和白天应事的心是同一个；佛家的静要离开事物。懂得动静合一，区别就显出来了。","rec":"黄直录","kj":[["r","日","曰","分别先生"],["r","诗","时","个那三更"]]},{"n":232,"t":"矜持太过与太直率","yw":"门人在座，有动止甚矜持者。先生曰：「人若矜持太过，终是有弊。」曰：「矜持太过，如何有弊？」曰：「人只有许多精神，若专在容貌上用功，则于中心照管不及者多矣。」有太直率者，先生曰：「如今讲此学，却外面全不检束，又分心与事为二矣。」","bh":"有门人在座，举止非常拘谨。先生说：「人如果拘谨太过，终究是有弊病的。」有人问：「拘谨太过，有什么弊病？」先生说：「人只有那么多精神，如果专门在容貌上用功，那么对内心就会有很多照顾不到的地方。」又有一个太随便的门人，先生说：「现在讲这门学问，却在外面完全不加约束，又是把心和事分成两件了。」","zs":[["矜持","拘谨、刻意端庄。"]],"gl":[4,122],"q":"太拘谨和太随便，各错在哪里？","a":"太拘谨：精神都耗在外表，内心照管不到。太随便：以为修心就不必管外面，又把心与事分成两件。","yong":"见客户时绷得太紧，你会顾不上听对方说什么；穿拖鞋去谈生意，也不叫「真性情」。","rec":"黄直录","kj":[["r","日衿得","曰矜持","终是有弊"],["r","日","曰","如何有弊"],["r","茌","在","精神若专"],["r","刖","则","貌上用功"]]},{"n":233,"t":"作文为文所累","yw":"门人作文送友行，问先生曰：「作文字不免费思，作了后又一二日常记在怀。」曰：「文字思索亦无害，但作了常记在怀，则为文所累，心中有一物矣，此则未可也。」又作诗送人。先生看诗毕，谓曰：「凡作文字要随我分限所及，若说得太过了，亦非修辞立诚矣。」","bh":"有门人写文章送朋友远行，问先生说：「写文章免不了费心思，写完后还一两天常常挂在心上。」先生说：「写文章要思考，这也没什么害处；但写完了还常常挂在心上，就被文章所累了，心中有了一个东西，这就不行了。」那门人又写诗送人。先生看完诗，对他说：「凡是写文章，要按照自己真实所能达到的程度；如果说得太过分了，也就不是『修辞立其诚』了。」","zs":[["修辞立诚","《周易·乾卦·文言》：「修辞立其诚，所以居业也。」"]],"gl":[225,20],"q":"写完文章总惦记着，问题在哪里？","a":"被文字所累，心中留了一物。另外，写文章要随自己实际分限，说过了头就不诚。","yong":"给客户写的网站文案，别用「全球领先」「行业第一」。说过头了就不是修辞立诚。","rec":"黄直录","kj":[["r","茌","在","二日常记"],["r","日","曰","看诗毕谓"]]},{"n":234,"t":"朱子格物少头脑","yw":"「文公『格物』之说，只是少头脑。如所谓『察之于念虑之微』，此一句不该与『求之文字之中，验之于事为之着，索之讲论之际』混作一例看，是无轻重也。」","bh":"「朱文公的『格物』之说，只是缺少了一个根本。比如他说的『在念头的细微处省察』，这一句不应该和『在文字中探求，在行事的显著处检验，在讲论中索求』混为一类，这样就没有轻重之分了。」","zs":[["察之于念虑之微……","朱熹《大学或问》中讲格物的几种途径。"]],"gl":[6,129],"q":"阳明批评朱子格物的哪一点？","a":"朱子把「察念虑之微」和读书、验事、讲论并列，没有轻重。阳明认为察念虑才是头脑，其他都要从这里出发。","rec":"黄直录","kj":[]},{"n":235,"t":"有所忿懥：不可「有所」","yw":"问「有所忿懥」一条。先生曰：「忿懥几件，人心怎能无得？只是不可『有所』耳。凡人忿懥，着了一分意思，便怒得过当，非廓然大公之体了。故有所忿懥，便不得其正也。如今于凡忿懥等件，只是个物来顺应，不要着一分意思，便心体廓然大公，得其本体之正了。且如出外见人相斗，其不是的，我心亦怒；然虽怒，却此心廓然，不曾动些子气。如今怒人，亦得如此，方才是正。」","bh":"有人问《大学》『心有所忿懥』那一条。先生说：「愤怒这几种情绪，人心怎么能没有？只是不能『有所』（执着留滞）罢了。凡人发怒，加进了一分私意，就会怒得过分，不是廓然大公的本体了。所以心有所忿懥，就不能端正。现在对于愤怒之类的情绪，只要来了就顺应它，不加一分私意，心体就廓然大公，得到本体的端正了。比如在外面看见有人打架，对那不对的一方，我心里也会愤怒；但虽然愤怒，这颗心却是空阔的，一点气都没有动。现在对人发怒，也要这样，才是正。」","zs":[["有所忿懥","《大学》：「身有所忿懥，则不得其正。」"]],"gl":[119,58,101],"q":"阳明说人可以发怒吗？","a":"可以，忿懥人心不能没有。只是不可「有所」，即不能加进私意、留滞不去。像看见别人打架时那样，怒而心不动气。","yong":"对客户的无理要求可以生气，但生气完就处理事情，别带着火写回复，也别记仇三天。","rec":"黄直录","kj":[["r","畿","几","生曰忿懥"],["r","几","凡","可有所耳"],["r","鬫","斗","外见人相"],["r","纔","才","得如此方"]]},{"n":236,"t":"佛氏着相，吾儒不着相","yw":"先生尝言：「佛氏不着相，其实着了相；吾儒着相，其实不着相。」请问。曰：「佛怕父子累，却逃了父子；怕君臣累，却逃了君臣；怕夫妇累，却逃了夫妇：都是为个君臣、父子、夫妇着了相，便须逃避。如吾儒有个父子，还他以仁；有个君臣，还他以义；有个夫妇，还他以别：何曾着父子、君臣、夫妇的相？」","bh":"先生曾说：「佛家说不执着于相，其实执着了相；我们儒家看似执着于相，其实不执着于相。」有人请问。先生说：「佛家怕父子关系牵累，就逃离了父子；怕君臣关系牵累，就逃离了君臣；怕夫妇关系牵累，就逃离了夫妇：这都是因为对君臣、父子、夫妇执着了相，才必须逃避。像我们儒家，有父子关系，就以仁对待它；有君臣关系，就以义对待它；有夫妇关系，就以礼别对待它：何曾执着于父子、君臣、夫妇的相？」","zs":[["着相","佛教术语，执着于事物的外在形相。"],["别","夫妇有别，指夫妇各有分工、相互尊重。"]],"gl":[94,49,231],"q":"阳明为什么说佛家反而「着相」？","a":"因为怕被关系牵累而逃避，恰恰说明把那些关系看得太重。儒家坦然面对，以仁义礼对待，反而不被它们所困。","yong":"因为怕麻烦就躲着难缠的客户，说明你被他困住了。坦然按规矩办，反倒没事。","con":"反方：佛教出家的本意是为了专心修道、解脱生死，并非单纯「怕累」而逃避。而且在家修行的居士佛教、大乘「不离世间觉」的思想，都不主张逃避人伦。阳明的批评针对的是出家形式，不能代表佛教全部。","rec":"黄直录","kj":[["r","懦","儒","逃避如吾"],["r","尥","他","个君臣还"]]},{"n":237,"t":"去了恶念便是善念","yw":"黄勉叔问：「心无恶念时，此心空空荡荡的，不知亦须存个善念否？」先生曰：「既去恶念，便是善念，便复心之本体矣。譬如日光被云来遮蔽，云去光已复矣。若恶念既去，又要存个善念，即是日光之中添燃一灯。」","bh":"黄勉叔问：「心里没有恶念的时候，这颗心空空荡荡的，不知道是不是也必须存一个善念？」先生说：「既然去掉了恶念，就是善念，就恢复了心的本体。好比阳光被云遮住了，云散了阳光就恢复了。如果恶念已经去掉，又要存一个善念，那就是在阳光下再点一盏灯。」","zs":[["黄勉叔","黄修易，字勉叔。本条起至第247条为他所记。"]],"gl":[228,72],"q":"去掉恶念后，还要刻意存善念吗？","a":"不用。去恶念就是善念，就像云散了阳光自现；再刻意存善念，是在阳光下点灯，多此一举。","yong":"不用每天给自己打鸡血喊口号。把拖后腿的念头清掉，好状态自己就回来了。","rec":"黄修易录","kj":[]},{"n":238,"t":"浊水澄清","yw":"问：「近来用功，亦颇觉妄念不生，但腔子里黑窣窣的，不知如何打得光明？」先生曰：「初下手用功，如何腔子里便得光明？譬如奔流浊水，才贮在缸里，初然虽定，也只是昏浊的。须俟澄定既久，自然渣滓尽去，复得清来。汝只要在良知上用功，良知存久，黑窣窣自能光明也。今便要责效，却是助长，不成工夫。」","bh":"有人问：「最近用功，也觉得妄念不太生了，但心里黑漆漆的，不知道怎样才能变得光明？」先生说：「刚开始下手用功，心里怎么可能马上光明？比如奔流的浑水，刚装进缸里，开始虽然静止了，也还是浑浊的。必须等它沉淀久了，自然渣滓全部沉下去，又变得清澈了。你只要在良知上用功，良知存养久了，黑漆漆的自然会光明。现在就想要见效，却是揠苗助长，不成功夫。」","zs":[["黑窣窣","黑漆漆、昏暗不明的样子。"],["责效","要求立刻见效。"]],"gl":[30,243],"q":"用功后心里还是「黑窣窣」的，怎么办？","a":"像浊水入缸，要等澄定久了才清。只管在良知上用功，不要急着要效果，急了就是助长。","yong":"新站上线三个月没流量就慌？水还没澄清呢。继续做正确的事。","rec":"黄修易录","kj":[["r","窸窸","窣窣","腔子里黑"],["r","绕聍","才贮","奔流浊水"],["r","矣","俟","昏浊的须"],["r","入","久","功良知存"],["r","窸窸","窣窣","知存入黑"]]},{"n":239,"t":"有根本的学问","yw":"先生曰：「吾教人『致良知』，在『格物』上用功，却是有根本的学问，日长进一日，愈久愈觉精明。世儒教人事事物物上去寻讨，却是无根本的学问。方其壮时，虽暂能外面修饰，不见有过，老则精神衰迈，终须放倒。譬如无根之树，移栽水边，虽暂时鲜好，终久要憔悴。」","bh":"先生说：「我教人『致良知』，在『格物』上用功，是有根本的学问，一天比一天长进，越久越觉得精明。世俗儒者教人到每件事物上去寻求，是没有根本的学问。在他年轻力壮时，虽然暂时能在外面修饰，看不出过错，到老了精神衰退，终究要倒下。好比没有根的树，移栽到水边，虽然暂时新鲜好看，终究要枯萎。」","zs":[],"gl":[68,30,244],"q":"阳明怎么区分「有根本」和「无根本」的学问？","a":"有根本的学问越久越精明；无根本的学问靠外面修饰，年轻时撑得住，老了就倒，像无根的树。","yong":"靠话术和包装撑起来的业务，经不起时间；靠真本事和诚信积累的，越老越值钱。","rec":"黄修易录","kj":[["r","貂","进","学问日长"],["r","庄","壮","学问方其"],["i","","修","暂能外面"]]},{"n":240,"t":"志道据德依仁游艺：盖房子","yw":"问「志于道」一章。先生曰：「只『志道』一句，便含下面数句功夫，自住不得。譬如做此屋，『志于道』是念念要去择地鸠材，经营成个区宅；『据德』却是经画已成，有可据矣；『依仁』却是常常住在区宅内，更不离去；『游艺』却是加些画采，美此区宅。艺者，义也，理之所宜者也。如诵诗、读书、弹琴、习射之类，皆所以调习此心，使之熟于道也。苟不知道而游艺，却如无状小子，不先去置造区宅，只管要去买画挂做门面，不知将挂在何处？」","bh":"有人问《论语》「志于道」那一章。先生说：「只『志于道』一句，就包含了下面几句的功夫，停也停不下来。比如盖这座房子，『志于道』是念念想着去选地、聚集材料，经营建成一座住宅；『据于德』是规划已经完成，有了可以依据的地方；『依于仁』是常常住在住宅里，不再离开；『游于艺』是加上些彩画，美化这座住宅。艺，就是义，是理所适宜的东西。比如诵诗、读书、弹琴、射箭之类，都是用来调养这颗心，使它熟悉于道的。如果不知道道而去游于艺，就像不懂事的小孩，不先去建造住宅，只管去买画来挂着装门面，却不知道要挂在哪里？」","zs":[["志于道","《论语·述而》：「志于道，据于德，依于仁，游于艺。」"],["鸠材","聚集材料。"],["艺者，义也","阳明的训释，把「艺」解为「义」，即合宜之理。"]],"gl":[16,30,115],"q":"「志于道」和「游于艺」是什么关系？","a":"志道像盖房，游艺像挂画。先有房子才有地方挂画；不知道就去游艺，是没房子先买画。","yong":"网站还没有扎实的产品内容，就先砸钱做动画特效和 3D 展示？那是没盖房先买画。","rec":"黄修易录","kj":[["r","付","可","画已成有"]]},{"n":241,"t":"读书不为科举所累","yw":"问：「读书所以调摄此心，不可缺的。但读之之时，一种科目意思牵引而来，不知何以免此？」先生曰：「只要良知真切，虽做举业，不为心累；虽有累，亦易觉，克之而已。且如读书时，良知知得强记之心不是，即克去之；有欲速之心不是，即克去之；有夸多斗靡之心不是，即克去之。如此，亦只是终日与圣贤印对，是个纯乎天理之心。任他读书，亦只是调摄此心而已，何累之有？」曰：「虽蒙开示，奈资质庸下，实难免累。窃闻穷通有命，上智之人恐不屑此；不肖为声利牵缠，甘心为此，徒自苦耳。欲屏弃之，又制于亲，不能舍去，奈何？」先生曰：「此事归辞于亲者多矣，其实只是无志。志立得时，良知千事万事只是一事。读书作文，安能累人？人自累于得失耳！」因叹曰：「此学不明，不知此处担搁了几多英雄汉！」","bh":"有人问：「读书是用来调养这颗心的，不可缺少。但读的时候，一种为科举考试的念头就被牵引过来，不知怎样才能避免？」先生说：「只要良知真切，即使准备科举，也不会被心所累；即使有累，也容易察觉，克除它就是了。比如读书时，良知知道死记硬背的心不对，就克除它；有急于求成的心不对，就克除它；有夸耀博学、争比辞藻的心不对，就克除它。这样，也就是整天和圣贤相互印证，是一颗纯乎天理的心。任凭怎么读书，也只是调养这颗心罢了，有什么累？」那人说：「虽然承蒙开导，无奈资质平庸，实在难免受累。我听说穷困显达都有命，上等聪明的人恐怕不屑于做这些事；不肖的人被名利牵缠，甘心去做，只是自讨苦吃。想放弃它，又被父母所制约，不能舍弃，怎么办？」先生说：「把这件事推到父母身上的人很多，其实只是没有志向。志向立定了，良知面对千件事万件事也只是一件事。读书作文，怎么能累人？是人自己被得失所累罢了！」于是感叹说：「这门学问不明白，不知道在这里耽误了多少英雄好汉！」","zs":[["举业","为科举考试而做的学业。"],["夸多斗靡","夸耀知识多、比拼辞藻华丽。"],["印对","相互印证对照。"]],"gl":[103,233,16],"q":"为了考试读书，会不会害了修身？","a":"不会，只要良知真切：读书时把强记、欲速、夸多斗靡之心一一克去。推说「父母逼的」，其实是没有志。","yong":"为了拿证书学东西也没问题。学的时候把「赶紧拿证」「拿出去炫」的心放下，就是在修身。","con":"反方：把一切归于「只是无志」，忽视了家庭压力、经济处境等真实的结构性约束。对一个明代寒门士子来说，不考科举可能意味着全家生计无着。阳明自己出身官宦之家，这样说未免有些「何不食肉糜」。","rec":"黄修易录","kj":[["r","同","何","而来不知"],["r","主","生","以免此先"],["r","荣","业","切虽做举"],["r","负","资","蒙开示奈"],["r","纤","缠","为声利牵"],["r","徙","徒","甘心为此"],["r","苫","苦","为此徙自"]]},{"n":242,"t":"生之谓性与头脑","yw":"问：「『生之谓性』，告子亦说得是，孟子如何非之？」先生曰：「固是性，但告子认得一边去了，不晓得头脑。若晓得头脑，如此说亦是。孟子亦曰『形色，天性也』，这也是指气说。」又曰：「凡人信口说，任意行，皆说此是依我心性出来，此是所谓『生之谓性』，然却要有过差。若晓得头脑，依吾良知上说出来，行将去，便自是停当。然良知亦只是这口说，这身行，岂能外得气，别有个去行去说？故曰：『论性不论气，不备；论气不论性，不明。』气亦性也，性亦气也，但须认得头脑是当。」","bh":"有人问：「告子说『生来就有的叫性』，也说得对，孟子为什么批评他？」先生说：「那当然是性，但告子只认识到一边，不懂得根本。如果懂得根本，这样说也对。孟子也说『形体容貌是天性』，这也是指气说的。」先生又说：「凡人随口说话、随意做事，都说这是依我的心性发出来的，这就是所谓『生之谓性』，但却会出差错。如果懂得根本，依着我的良知说出来、做出来，自然就妥当了。但良知也只是靠这张嘴说、这个身体做，怎么能离开气，另外有个东西去做去说？所以程子说：『论性不论气，不完备；论气不论性，不明白。』气也是性，性也是气，只是必须认得根本才行。」","zs":[["生之谓性","《孟子·告子上》告子语。"],["形色，天性也","《孟子·尽心上》。"],["论性不论气……","程颐语，见《二程遗书》卷六。"]],"gl":[38,57,273],"q":"「随心所欲就是依本性」对吗？","a":"不对。随意说、任意行会有过差，因为没认得头脑。依良知去说去行才停当。但良知也离不开气（身体），二者要统一。","yong":"「我就是这个性格」不是借口。性格是气，良知才是头脑。","rec":"黄修易录","kj":[["r","岩","岂","说这身行"]]},{"n":243,"t":"不可助长：跌倒了就起来走","yw":"又曰：「诸君功夫，最不可『助长』。上智绝少，学者无超入圣人之理。一起一伏，一进一退，自是功夫节次。不可以我前日用得功夫了，今却不济，便要矫强做出一个没破绽的模样，这便是『助长』，连前些子功夫都坏了。此非小过。譬如行路的人，遭一蹶跌，起来便走，不要欺人做那不曾跌倒的样子出来。诸君只要常常怀个『遁世无闷，不见是而无闷』之心，依此良知，忍耐做去，不管人非笑，不管人毁谤，不管人荣辱，任他功夫有进有退，我只是这致良知的主宰不息，久久自然有得力处，一切外事亦自能不动。」又曰：「人若着实用功，随人毁谤，随人欺慢，处处得益，处处是进德之资；若不用功，只是魔也，终被累倒。」","bh":"先生又说：「各位做功夫，最不能『揠苗助长』。上等智慧的人极少，学者没有一步跳进圣人境界的道理。一起一伏，一进一退，本来就是功夫的次第。不能因为前些天功夫用得好，今天却不行了，就勉强装出一副没有破绽的样子，这就是『助长』，连之前那些功夫都坏了。这不是小过错。好比走路的人，摔了一跤，爬起来接着走，不要骗人装作没摔倒的样子。各位只要常常怀着『隐居避世而不苦闷，不被人认可也不苦闷』的心，依着这个良知，忍耐着做下去，不管别人讥笑，不管别人毁谤，不管别人给荣辱，任凭功夫有进有退，我只要这个致良知的主宰不停息，时间长了自然会有得力的地方，一切外面的事也自然不能动摇我。」又说：「人如果切实用功，任凭别人毁谤、任凭别人欺侮怠慢，处处都有收获，处处都是增进德行的资本；如果不用功，这些就只是魔障，最终被拖累倒下。」","zs":[["助长","《孟子·公孙丑上》揠苗助长的故事。"],["遁世无闷，不见是而无闷","《周易·乾卦·文言》。"]],"gl":[238,30,105],"q":"功夫退步了，最糟糕的反应是什么？","a":"矫强装出没破绽的样子，这是助长，连前面的功夫都坏了。跌倒了就起来走，别装没跌过。","yong":"这本书读了几天又断了？别装作没断，也别自责，接着读下一条。","rec":"黄修易录","kj":[["d","便","","的模样这"]]},{"n":244,"t":"良知即是天植灵根","yw":"先生一日出游禹穴，顾田间禾曰：「能几何时，又如此长了！」范兆期在旁曰：「此只是有根。学问能自植根，亦不患无长。」先生曰：「人孰无根？良知即是天植灵根，自生生不息，但着了私累，把此根戕贼蔽塞，不得发生耳。」","bh":"先生有一天出游禹穴，看着田里的禾苗说：「才过了多久，又长这么高了！」范兆期在旁边说：「这只是因为有根。学问如果能自己扎下根，也不怕不长进。」先生说：「人谁没有根？良知就是上天种下的灵根，自然生生不息，只是被私欲拖累，把这根伤害了、遮蔽堵塞了，不能生长罢了。」","zs":[["禹穴","在浙江绍兴会稽山，相传为大禹葬地。"],["范兆期","范引年，阳明弟子。"],["戕贼","伤害。"]],"gl":[239,30,93],"q":"学问要「自植根」，阳明怎么纠正？","a":"根不用自己去植，良知就是天植灵根，人人都有。问题是被私欲伤害遮蔽，只要去掉私累，它自然生长。","rec":"黄修易录","kj":[["r","同","何","禾曰能几"],["r","茌","在","了范兆期"],["r","恨","根","私累把此"],["r","寒","塞","恨戕贼蔽"]]},{"n":245,"t":"学须反己","yw":"一友常易动气责人。先生警之曰：「学须反己。若徒责人，只见得人不是，不见自己非。若能反己，方见自己有许多未尽处，奚暇责人？舜能化得象的傲，其机括只是不见象的不是。若舜只要正他的奸恶，就见得象的不是矣。象是傲人，必不肯相下，如何感化得他？」是友感悔。曰：「你今后只不要去论人之是非，凡当责辩人时，就把做一件大己私克去，方可。」","bh":"有一位朋友常常容易动气责备别人。先生警告他说：「做学问必须反求自己。如果只是责备别人，就只看到别人的错，看不到自己的错。如果能反求自己，才会看到自己有许多没做好的地方，哪有空去责备别人？舜能感化象的傲慢，关键只在于不去看象的错。如果舜只想纠正象的奸恶，就会看到象的错了。象是个傲慢的人，一定不肯服软，怎么能感化他？」这位朋友感动而悔悟。先生说：「你以后只不要去议论别人的是非，凡是想要责备辩驳别人的时候，就把它当作一个大私欲克除掉，才行。」","zs":[["象","舜的异母弟，傲慢凶狠，多次想害死舜，舜始终善待他。"],["机括","关键、枢纽。"]],"gl":[296,14,18],"q":"舜为什么能感化傲慢的象？","a":"因为舜不去看象的不是，只反求自己。若一心要纠正象，象必然对抗，就感化不了。","yong":"下次想在群里怼人之前，先把「想怼人」这个念头当成私欲克掉。","con":"反方：「不论人之是非」若推到极致，可能让人对真正的不公保持沉默。现代伦理学认为，指出错误、追究责任在某些情况下是道德义务。阳明的话针对的是好责人的个人习气，不宜理解为放弃一切批评。","rec":"黄修易录","kj":[["r","已","己","是不见自"],["r","瑕","暇","未尽处奚"],["r","同","何","肯相下如"],["i","","凡","人之是非"],["r","辨","辩","是非当责"]]},{"n":246,"t":"因病而药，不怀鄙薄","yw":"先生曰：「凡朋友问难，纵有浅近粗疏，或露才扬己，皆是病发。当因其病而药之可也，不可便怀鄙薄之心，非君子与人为善之心矣。」","bh":"先生说：「凡是朋友来提问辩难，即使问得浅近粗疏，或者显露才华、抬高自己，都是病发作了。应当根据他的病来给他开药，不能就怀着鄙视轻薄的心，那就不是君子与人为善的心了。」","zs":[["与人为善","《孟子·公孙丑上》：「取诸人以为善，是与人为善者也。」"]],"gl":[214,17,245],"q":"别人问了个很浅的问题，或者在炫耀，该怎么对待？","a":"把它当成病发，对症下药，不能鄙薄他。","yong":"客户问了个「这都不懂」的问题，别翻白眼。他不懂才找你，耐心讲就是你的价值。","rec":"黄修易录","kj":[]},{"n":247,"t":"卜筮是理，理亦是卜筮","yw":"问：「《易》，朱子主卜筮，程《传》主理，何如？」先生曰：「卜筮是理，理亦是卜筮。天下之理孰有大于卜筮者乎？只为后世将卜筮专主在占卦上看了，所以看得卜筮似小艺。不知今之师友问答，博学、审问、慎思、明辨、笃行之类，皆是卜筮。卜筮者，不过求决狐疑，神明吾心而已。《易》是问诸天，人有疑，自信不及，故以《易》问天；谓人心尚有所涉，惟天不容伪耳。」","bh":"有人问：「对《易经》，朱子主张是占卜之书，程颐的《易传》主张讲义理，哪个对？」先生说：「占卜就是理，理也就是占卜。天下的道理哪有比占卜更大的？只因为后世把占卜专门看成摇卦，所以把占卜看成小技艺。却不知道现在师友之间的问答，广博地学、详细地问、慎重地思、明白地辨、切实地行之类，都是占卜。占卜不过是求得解决疑惑，让我的心神明白罢了。《易经》是向天发问，人有疑惑，自己信不过自己，所以用《易》来问天；这是说人心还有所牵涉，只有天容不得虚伪。」","zs":[["程《传》","程颐的《周易程氏传》，以义理解《易》。"],["朱子主卜筮","朱熹《周易本义》认为《易》本为卜筮之书。"]],"gl":[46,50],"q":"阳明怎样调和朱子和程颐对《易》的看法？","a":"卜筮就是理：凡是求决疑惑、让心神明白的，如师友问答、学问思辨，都是卜筮。占卦只是其中一种。","yong":"你找同行请教、做市场调研，都是在「卜筮」：求决狐疑，让自己的心明白。","rec":"黄修易录","kj":[["r","间","问","而已易是"]]},{"n":248,"t":"义即是良知","yw":"黄勉之问：「『无适也，无莫也，义之与比』，事事要如此否？」先生曰：「固是事事要如此，须是识得个头脑乃可。义即是良知，晓得良知是个头脑，方无执着。且如受人馈送，也有今日当受的，他日不当受的；也有今日不当受的，他日当受的。你若执着了今日当受的，便一切受去；执着了今日不当受的，便一切不受去：便是『适』『莫』，便不是良知的本体，如何唤得做『义』？」","bh":"黄勉之问：「『对天下的事，没有一定要怎样，也没有一定不要怎样，只依义而行』，每件事都要这样吗？」先生说：「当然每件事都要这样，但必须认得那个根本才行。义就是良知，懂得良知是根本，才不会执着。比如接受别人的馈赠，有今天应当接受、改天不应当接受的；也有今天不应当接受、改天应当接受的。你如果执着于今天应当接受，就什么都接受；执着于今天不应当接受，就什么都不接受：这就是『适』『莫』，就不是良知的本体，怎么能叫作『义』？」","zs":[["黄勉之","黄省曾，字勉之，江苏吴县人。本条起为他所记（通行本此后还有钱德洪所录，底本未分）。"],["无适也，无莫也，义之与比","《论语·里仁》。适，专主；莫，不肯。"]],"gl":[52,6,206],"q":"收不收客户的礼，有没有一条固定规矩？","a":"没有死规矩。义就是良知，今日当受的未必他日当受，执着于一条规矩就是「适莫」。","yong":"客户送礼收不收、给不给折扣，没有万能公式。每次问良知：此刻此人此事，该不该？","con":"反方：完全不立规则、事事凭良知判断，在组织管理中很危险：它给了自我合理化很大空间。现代合规制度恰恰是为了防止「这次情况特殊」的判断。阳明的说法适合个人修养，用在机构治理上需要配合明确规则。","rec":"黄省曾录","kj":[]},{"n":249,"t":"思无邪一言该贯","yw":"问：「『思无邪』一言，如何便盖得三百篇之义？」先生曰：「岂特三百篇？六经只此一言便可该贯，以至穷古今天下圣贤的话，『思无邪』一言也可该贯。此外便有何说？此是一了百当的功夫。」","bh":"有人问：「『思无邪』一句话，怎么就能概括《诗经》三百篇的意思？」先生说：「何止三百篇？六经只这一句话就可以贯通，以至于古往今来天下圣贤所说的话，『思无邪』一句话也可以贯通。除此之外还有什么可说的？这是一了百了的功夫。」","zs":[["思无邪","《论语·为政》：「《诗》三百，一言以蔽之，曰：思无邪。」"],["该贯","概括贯通。"]],"gl":[229,25],"q":"「思无邪」为什么能贯通六经？","a":"所有圣贤的话，归根到底都是要人念头纯正、没有私邪。抓住这一点就一了百当。","rec":"黄省曾录","kj":[]},{"n":250,"t":"道心惟微，人心惟危","yw":"问道心、人心。先生曰：「『率性之谓道』，便是道心。但着些人的意思在，便是人心。道心本是无声无臭，故曰『微』。依着人心行去，便有许多不安稳处，故曰『惟危』。」","bh":"有人问道心和人心。先生说：「『顺着本性去做就是道』，这就是道心。只要掺进了一点人为的私意，就是人心。道心本来无声无味，所以说『微』。依着人心去做，就有许多不安稳的地方，所以说『危险』。」","zs":[["人心惟危，道心惟微","《尚书·大禹谟》。参见第10条。"]],"gl":[10,230],"q":"道心和人心的区别在哪里？","a":"率性就是道心；掺进人的私意就成了人心。道心无声无臭所以微，人心不安稳所以危。","rec":"黄省曾录","kj":[["r","为","谓","曰率性之"]]},{"n":251,"t":"施教不可躐等","yw":"问：「『中人以下，不可以语上也』，愚的人与之语上，尚且不进，况不与之语，可乎？」先生曰：「不是圣人终不与语，圣人的心，忧不得人人都做圣人，只是人的资质不同，施教不可躐等。中人以下的人，便与他说性说命，他也不省得，也须慢慢琢磨他起来。」","bh":"有人问：「孔子说『中等以下的人，不可以跟他讲高深的道理』，愚笨的人跟他讲高深的，他尚且进步不了，何况不跟他讲，这样行吗？」先生说：「不是圣人始终不跟他讲，圣人的心，恨不得人人都成为圣人，只是人的资质不同，施教不能越级。中等以下的人，就算跟他讲性、讲命，他也不明白，也必须慢慢打磨他，让他提升起来。」","zs":[["中人以下，不可以语上也","《论语·雍也》。"],["躐等","越级、不按次序。"]],"gl":[225,109],"q":"孔子说中人以下不可语上，是放弃他们吗？","a":"不是。圣人恨不得人人成圣，只是施教不可躐等，要从对方能懂的地方慢慢琢磨。","yong":"给不懂技术的客户讲网站，别一上来讲 Core Web Vitals。先讲「为什么客户打开慢就走了」。","rec":"黄省曾录","kj":[["i","","也","可以语上"]]},{"n":252,"t":"读书只要晓得，晓得已落第二义","yw":"一友问：「读书不记得，如何？」先生曰：「只要晓得，如何要记得？要晓得，已是落第二义了，只要明得自家本体。若徒要记得，便不晓得；若徒要晓得，便明不得自家的本体。」","bh":"一位朋友问：「读书记不住，怎么办？」先生说：「只要懂得，何必要记得？要懂得，已经落到第二层意思了，最要紧的是明白自己的本体。如果只是要记得，就不会懂得；如果只是要懂得，就不能明白自己的本体。」","zs":[["第二义","次要的、非根本的意义。"]],"gl":[17,20,31],"q":"读书记得、晓得、明本体，三者是什么关系？","a":"记得不如晓得，晓得不如明自家本体。只求记，就不晓；只求晓，就明不了本体。","yong":"这本书你不用背。看懂一条，用到自己身上，比背下十条强。","rec":"黄省曾录","kj":[]},{"n":253,"t":"逝者如斯，活泼泼地","yw":"问：「『逝者如斯』，是说自家心性活泼泼地否？」先生曰：「然。须要时时用致良知的功夫，方才活泼泼地，方才与他川水一般。若须臾间断，便与天地不相似。此是学问极至处，圣人也只如此。」","bh":"有人问：「孔子站在河边说『逝去的就像这河水一样』，是说自己的心性活泼泼的吗？」先生说：「是的。必须时时用致良知的功夫，才能活泼泼的，才能和那河水一样。如果片刻间断，就和天地不相似了。这是学问的最高处，圣人也只是这样。」","zs":[["逝者如斯","《论语·子罕》：「子在川上曰：逝者如斯夫，不舍昼夜。」"]],"gl":[202,330],"q":"「逝者如斯」在阳明这里是什么意思？","a":"心性像流水一样活泼泼、不间断。时时致良知，才能与天地流行相似。","rec":"黄省曾录","kj":[["r","夬","夫","良知的功"],["r","闲","间","般若须臾"]]},{"n":254,"t":"做千百年的禽兽","yw":"问「志士仁人」章。先生曰：「只为世上人都把生身命子看得太重，不问当死不当死，定要宛转委曲保全，以此把天理却丢去了。忍心害理，何者不为？若违了天理，便与禽兽无异，便偷生在世上百千年，也不过做了千百年的禽兽。学者要于此等处看得明白。比干、龙逢，只为他看得分明，所以能成就得他的仁。」","bh":"有人问《论语》「志士仁人」那一章。先生说：「只因世上的人都把自己的身体性命看得太重，不问该死不该死，一定要委曲求全地保住性命，因此把天理丢掉了。狠心伤天害理，什么事做不出来？如果违背了天理，就和禽兽没有区别，即使在世上苟活千百年，也不过是做了千百年的禽兽。学者要在这种地方看清楚。比干、关龙逄，只因为他们看得分明，所以才能成就他们的仁。」","zs":[["志士仁人","《论语·卫灵公》：「志士仁人，无求生以害仁，有杀身以成仁。」"],["比干、龙逢","比干因劝谏商纣被剖心；关龙逄因劝谏夏桀被杀。"]],"gl":[44,126],"q":"阳明怎样看待「保命」和「天理」的冲突？","a":"把性命看得太重，就会委曲求全、丢掉天理，什么坏事都做得出来，活得再久也是禽兽。","con":"反方：这种「舍生取义」的绝对化在历史上也曾被用来鼓励无谓的牺牲，甚至成为统治者要求臣民殉节的工具。现代伦理更重视生命本身的价值，认为在大多数情况下，保全生命与坚守道德并不需要你死我活地对立。","rec":"黄省曾录","kj":[["r","同","何","忍心害理"],["r","茌","在","异便偷生"],["r","也","他","龙逢只为"]]},{"n":255,"t":"毁谤自外来","yw":"问：「叔孙武叔毁仲尼，大圣人如何犹不免于毁谤？」先生曰：「毁谤自外来的，虽圣人如何免得？人只贵于自修，若自己实实落落是个圣贤，纵然人都毁他，也说他不着，却若浮云掩日，如何损得日的光明？若自己是个象恭色庄、不坚不介的，纵然没一个人说他，他的恶慝终须一日发露。所以孟子说『有求全之毁，有不虞之誉』。毁誉在外的，安能避得？只要自修何如尔。」","bh":"有人问：「叔孙武叔诋毁孔子，像孔子这样的大圣人，怎么还免不了被毁谤？」先生说：「毁谤是从外面来的，即使是圣人又怎么能避免？人只贵在自我修养，如果自己踏踏实实是个圣贤，即使所有人都诋毁他，也说不中他，就像浮云遮住太阳，怎么损害得了太阳的光明？如果自己是个外表恭敬端庄、内心却不坚定不正直的人，即使没有一个人说他，他的恶也终有一天会暴露出来。所以孟子说『有意想不到的称誉，也有求全责备的诋毁』。毁誉是外在的，怎么能避免？只看自己修养得怎样罢了。」","zs":[["叔孙武叔毁仲尼","《论语·子张》。叔孙武叔是鲁国大夫。"],["象恭色庄","外表恭敬端庄，实则虚伪。"],["恶慝","底本作「恶意」，据通行本改。"],["有不虞之誉，有求全之毁","《孟子·离娄上》。"]],"gl":[105,243,312],"q":"被人毁谤了，阳明怎么看？","a":"毁谤自外来，圣人也免不了。真是圣贤，毁谤如浮云掩日，伤不了光明；关键只在自修。","yong":"被同行在网上黑了？先看自己有没有真问题。没有，就继续干活，云自己会散。","rec":"黄省曾录","kj":[["r","同","何","虽圣人如"],["r","揜","掩","却若浮云"],["r","意","慝","他他的恶"]]},{"n":256,"t":"厌外物而求静","yw":"刘君亮要在山中静坐。先生曰：「汝若以厌外物之心去求之静，是反养成一个骄惰之气了。汝若不厌外物，复于静处涵养，却好。」","bh":"刘君亮要到山里去静坐。先生说：「你如果是带着厌恶外物的心去求静，反而会养成一种骄傲懒惰的习气。你如果不厌恶外物，又在静处涵养，那倒是好的。」","zs":[["刘君亮","阳明弟子，生平不详。"]],"gl":[203,23,262],"q":"去山里静坐有什么问题？","a":"问题不在静坐，在动机：如果出于厌恶外物，会养成骄惰之气；不厌外物而在静中涵养，就好。","yong":"想辞职去大理躺平？先问自己是在逃避，还是真需要休整。","rec":"黄省曾录","kj":[]},{"n":257,"t":"握扇：圣学不是捆缚苦楚","yw":"王汝中、省曾侍坐。先生握扇命曰：「你们用扇。」省曾起对曰：「不敢。」先生曰：「圣人之学，不是这等捆缚苦楚的，不是装做道学的模样。」汝中曰：「观『仲尼与曾点言志』一章略见。」先生曰：「然。以此章观之，圣人何等宽洪包含气象！且为师者问志于群弟子，三子皆整顿以对。至于曾点，飘飘然不看那三子在眼，自去鼓起瑟来，何等狂态！及至言志，又不对师之问目，都是狂言。设在伊川，或斥骂起来了。圣人乃复称许他，何等气象！圣人教人，不是个束缚他通做一般，只如狂者便从狂处成就他，狷者便从狷处成就他，人之才气如何同得？」","bh":"王汝中、黄省曾陪先生坐着。先生拿着扇子吩咐说：「你们扇扇子吧。」省曾站起来回答：「不敢。」先生说：「圣人的学问，不是这样捆绑拘束、苦不堪言的，不是装出一副道学家的样子。」汝中说：「从『孔子和曾点谈志向』那一章就大略可以看出来。」先生说：「是的。从这一章来看，圣人是何等宽宏包容的气象！而且老师向众弟子问志向，那三位都端端正正地回答。到了曾点，飘飘然不把那三位放在眼里，自顾自地弹起瑟来，多么狂放！到他说志向时，又不回答老师问的题目，全是狂言。如果换成程伊川，恐怕就要斥骂起来了。圣人却反而称赞他，这是何等气象！圣人教人，不是把人束缚成一个样子，狂放的人就从狂放处成就他，狷介的人就从狷介处成就他，人的才气怎么能一样？」","zs":[["王汝中","王畿，字汝中，号龙溪，浙江山阴人，阳明晚年最重要的弟子之一，以「四无说」著名。"],["狂者、狷者","《论语·子路》：「狂者进取，狷者有所不为也。」"]],"gl":[29,27,232],"q":"老师让学生扇扇子，学生说「不敢」，阳明为什么不满意？","a":"圣学不是捆缚苦楚、装道学模样。圣人教人因材成就，狂者从狂处、狷者从狷处成就。","yong":"带团队别要求所有人一个样。外向的让他去谈客户，内向的让他去抠细节。","rec":"黄省曾录","kj":[["r","日","曰","省曾起对"],["r","瓢","飘","至于曾点"],["r","彧","或","设在伊川"],["r","尥","他","是个束缚"],["r","地","他","狷处成就"]]},{"n":258,"t":"圣人只怕人不简易","yw":"先生语陆元静曰：「元静少年亦要解五经，志亦好博。但圣人教人，只怕人不简易，他说的皆是简易之规。以今人好博之心观之，却似圣人教人差了。」","bh":"先生对陆元静说：「元静年轻时也想注解五经，志向也是好博。但圣人教人，只怕人不简易，他说的都是简易的规矩。用今天人好博的心来看，反倒好像圣人教人教错了。」","zs":[["陆元静","即陆澄，字原静（或作元静），卷上第15–94条的记录者。"]],"gl":[99,11],"q":"圣人教人的特点是什么？","a":"简易。好博的人反而觉得圣人教错了。","yong":"能用一句话讲清楚的，别写三页。这对网站文案也适用。","rec":"黄省曾录","kj":[]},{"n":259,"t":"圣学真血脉","yw":"先生曰：「孔子无不知而作，颜子有不善未尝不知，此是圣学真血脉路。」","bh":"先生说：「孔子没有不知道就去做的事，颜回有了不善没有不察觉的，这是圣学的真正血脉。」","zs":[["无不知而作","《论语·述而》：「盖有不知而作之者，我无是也。」"],["有不善未尝不知","《周易·系辞下》称颜回：「有不善未尝不知，知之未尝复行也。」"]],"gl":[201,114],"q":"圣学的真血脉是什么？","a":"孔子不知不作，颜回有不善必知，都是良知时时明觉。","rec":"黄省曾录","kj":[]},{"n":260,"t":"必为圣人之志","yw":"何廷仁、黄正之、李侯璧、汝中、德洪侍坐。先生顾而言曰：「汝辈学问不得长进，只是未立志。」侯璧起而对曰：「珙亦愿立志。」先生曰：「难说不立，未是必为圣人之志耳。」对曰：「愿立必为圣人之志。」先生曰：「你真有圣人之志，良知上更无不尽。良知上留得些子别念挂带，便非必为圣人之志矣。」洪初闻时，心若未服，听说到此，不觉悚汗。","bh":"何廷仁、黄正之、李侯璧、王汝中、钱德洪陪先生坐着。先生看着他们说：「你们学问没有长进，只是因为没有立志。」李侯璧站起来回答：「我李珙也愿意立志。」先生说：「不能说你没立志，只是还不是一定要成为圣人的志。」侯璧回答：「我愿意立一定要成为圣人的志。」先生说：「你真有圣人之志，良知上就不会有一点没做尽的地方。良知上只要还留着一点别的念头挂着，就不是一定要成为圣人的志了。」我（钱德洪）刚听时，心里好像还不服，听到这里，不觉惊出一身冷汗。","zs":[["何廷仁","字性之，江西雩都人。"],["李侯璧","李珙，字侯璧。"],["德洪","钱德洪，字洪甫，号绪山，浙江余姚人，阳明晚年重要弟子，《传习录》卷下和《年谱》的主要编订者。"]],"gl":[16,53,330],"q":"「必为圣人之志」的标准是什么？","a":"良知上不留一点别念挂带。只要还挂着一点私念，就不是真立了志。","yong":"你说「我想做好这个项目」，那你心里还挂着多少「万一搞砸了丢人」「做这么多值不值」？","rec":"黄省曾录","kj":[["r","卡小上止","未立","长进只是"],["i","","此","服听说到"]]},{"n":261,"t":"良知是造化的精灵","yw":"先生曰：「良知是造化的精灵。这些精灵，生天生地，成鬼成帝，皆从此出，真是与物无对。人若复得他完完全全，无少亏欠，自不觉手舞足蹈，不知天地间更有何乐可代。」","bh":"先生说：「良知是天地造化的精灵。这些精灵，生成天、生成地，成就鬼神、成就上帝，都从这里出来，真是与万物没有对立。人如果能把它完完全全地恢复，没有一点亏欠，自然会不知不觉手舞足蹈，不知道天地间还有什么快乐能代替它。」","zs":[["造化","天地自然创造化育万物的功能。"],["与物无对","没有任何东西能与它相对立，即绝对的。"]],"gl":[274,269,292],"q":"阳明为什么说良知「生天生地」？","a":"在他看来，天地万物的意义都在良知的灵明中显现，良知是造化的精灵、绝对的本源。","con":"反方：这是心学最具形而上色彩、也最受批评的说法之一。如果字面理解为「良知创造了天地」，就是彻底的唯心论；即使理解为「天地的意义由良知显现」，也很难经验地验证。这里的「良知」已远超道德意识，成了宇宙本体，许多学者认为这是心学走向玄虚的起点。","rec":"黄省曾录","kj":[["r","闲","间","不知天地"]]},{"n":262,"t":"只是致良知三字无病","yw":"一友静坐有见，驰问先生。答曰：「吾昔居滁时，见诸生多务知解，口耳异同，无益于得，姑教之静坐。一时窥见光景，颇收近效。久之，渐有喜静厌动，流入枯槁之病，或务为玄解妙觉，动人听闻。故迩来只说『致良知』。良知明白，随你去静处体悟也好，随你去事上磨练也好，良知本体原是无动无静的，此便是学问头脑。我这个话头，自滁州到今，亦较过几番，只是『致良知』三字无病。医经折肱，方能察人病理。」","bh":"一位朋友静坐时有所感悟，赶来请教先生。先生回答说：「我以前在滁州时，看到学生们大多只追求知识理解，在口耳之间争论异同，对真正有所得没有益处，就姑且教他们静坐。一时间他们窥见了一些境界，很收到了一些近效。时间长了，渐渐有了喜静厌动、流于枯寂的毛病，有的人专门追求玄妙的理解和觉悟，用来耸动别人的听闻。所以近来只说『致良知』。良知明白了，随你去静处体悟也好，随你去事上磨练也好，良知本体原本就是无动无静的，这就是学问的头脑。我这个话头，从滁州到现在，也比较过好几次，只有『致良知』三个字没有毛病。好比医生自己多次折断手臂，才能明察别人的病理。」","zs":[["居滁","正德八年（1513）阳明任南京太仆寺少卿，驻滁州，从游者甚众。"],["医经折肱","《左传》：「三折肱知为良医。」比喻经历多了才有经验。"]],"gl":[39,23,256],"q":"阳明为什么从教静坐改为只说「致良知」？","a":"静坐见效快，但久了会喜静厌动、流于枯槁或玄虚。致良知动静皆宜，是他反复比较后找到的唯一无病的话头。","yong":"别迷信某一种「方法论」。好方法要动静都能用、不容易走偏。","rec":"黄省曾录","kj":[["r","藽","窥","静坐一时"]]},{"n":263,"t":"内外两忘","yw":"一友问：「功夫欲得此知时时接续，一切应感处反觉照管不及；若去事上周旋，又觉不见了。如何则可？」先生曰：「此只认良知未真，尚有内外之间。我这里功夫不由人急心，认得良知头脑是当，去朴实用功，自会透彻。到此便是内外两忘，又何心事不合一？」","bh":"一位朋友问：「做功夫想要让良知时时连续，可是在一切应对感触的地方反而照顾不过来；如果去事情上周旋，又觉得良知不见了。怎样才好？」先生说：「这只是认良知还没认真切，还有内外的分隔。我这里的功夫不是靠人着急的，认准了良知这个头脑，去朴实用功，自然会透彻。到那时就是内外两忘，心和事怎么会不合一？」","zs":[],"gl":[204,231],"q":"事上周旋时良知就不见了，问题在哪？","a":"认良知未真，还有内外之隔。认准头脑朴实用功，到时内外两忘，心事合一。","rec":"黄省曾录","kj":[["r","闲","间","有内外之"],["r","恼","脑","得良知头"]]},{"n":264,"t":"透得真机","yw":"又曰：「功夫不是透得这个真机，如何得他充实光辉？若能透得时，不由你聪明知解接得来，须胸中渣滓浑化，不使有毫发沾带始得。」","bh":"先生又说：「功夫如果不能透悟这个真机，怎么能让它充实而有光辉？如果能透悟的话，不是靠你的聪明和知解能接得上的，必须心中的渣滓全部化掉，不留一丝一毫沾带才行。」","zs":[["充实光辉","《孟子·尽心下》：「充实之谓美，充实而有光辉之谓大。」"]],"gl":[206,263],"q":"透得真机靠聪明吗？","a":"不靠聪明知解，要靠胸中渣滓化尽、没有一毫沾带。","rec":"黄省曾录","kj":[]},{"n":265,"t":"命即是性，性即是道，道即是教","yw":"先生曰：「『天命之谓性』，命即是性；『率性之谓道』，性即是道；『修道之谓教』，道即是教。」","bh":"先生说：「『天所赋予的叫作性』，命就是性；『顺着性去做叫作道』，性就是道；『修养道叫作教』，道就是教。」","zs":[],"gl":[127,230,266],"q":"《中庸》首三句在阳明这里是什么关系？","a":"命、性、道、教只是一个东西：命即是性，性即是道，道即是教。","rec":"黄省曾录","kj":[]},{"n":266,"t":"良知是你的明师","yw":"问：「如何道即是教？」曰：「道即是良知。良知原是完完全全，是的还他是，非的还他非，是非只依着他，更无有不是处，这良知还是你的明师。」问：「『不睹不闻』是说本体，『戒慎恐惧』是说功夫否？」先生曰：「此处须信得本体原是不睹不闻的，亦原是戒慎恐惧的，戒慎恐惧不曾在不睹不闻上加得些子。见得真时，便谓戒慎恐惧是本体，不睹不闻是功夫亦得。」","bh":"有人问：「为什么道就是教？」先生说：「道就是良知。良知原本是完完全全的，对的还它对，错的还它错，是非只依着它，就再没有不对的地方，这个良知还是你的明师。」又问：「『不被看见、不被听见』是说本体，『戒慎恐惧』是说功夫吗？」先生说：「这里必须相信本体原本就是不睹不闻的，也原本就是戒慎恐惧的，戒慎恐惧并没有在不睹不闻上增加一点什么。见得真切时，就说戒慎恐惧是本体，不睹不闻是功夫，也可以。」","zs":[["不睹不闻、戒慎恐惧","《中庸》：「君子戒慎乎其所不睹，恐惧乎其所不闻。」"]],"gl":[265,120,206],"q":"为什么说良知是「明师」？","a":"良知是非分明、完完全全，依着它就没有不是处。最好的老师就在自己心里。","rec":"黄省曾录","kj":[["r","真","良","即是良知"],["r","真","良","不是处这"],["r","礼","体","闻是说本"]]},{"n":267,"t":"知昼即知夜：睡觉时的良知","yw":"问：「『通乎昼夜之道而知』。」先生曰：「良知原是知昼知夜的。」又问：「人睡熟时，良知亦不知了。」曰：「不知何以一叫便应？」曰：「良知常知，如何有睡熟时？」曰：「向晦宴息，此亦造化常理。夜来天地混沌，形色俱泯，人亦耳目无所睹闻，众窍俱翕，此即良知收敛凝一时。天地既开，庶物露生，人亦耳目有所睹闻，众窍俱辟，此即良知妙用发生时。可见人心与天地一体，故『上下与天地同流』。今人不会宴息，夜来不是昏睡，即是妄思魇寐。」曰：「睡时功夫如何用？」先生曰：「知昼即知夜矣。日间良知是顺应无滞的，夜间良知即是收敛凝一的，有梦即先兆。」","bh":"有人问《易经》「通晓昼夜之道而知」。先生说：「良知原本就是知昼知夜的。」又问：「人睡熟的时候，良知也不知道了吧。」先生说：「不知道的话，为什么一叫就应？」那人问：「良知常知，怎么会有睡熟的时候？」先生说：「天黑了就休息，这也是天地造化的常理。夜里天地混沌一片，形状颜色都消失了，人也耳目没有所见所闻，各个孔窍都闭合了，这就是良知收敛凝聚的时候。天地开明了，万物显露生长，人也耳目有所见所闻，各个孔窍都打开了，这就是良知妙用发生的时候。可见人心和天地是一体的，所以说『上下与天地一同流转』。现在的人不会休息，夜里不是昏睡，就是胡思乱想、做噩梦。」那人问：「睡觉时的功夫怎样用？」先生说：「知道白天就知道夜晚了。白天良知是顺应万物而无所滞留的，夜里良知就是收敛凝聚的，做梦就是先兆。」","zs":[["向晦宴息","《周易·随卦·象传》：「君子以向晦入宴息。」天黑了就进屋休息。"],["上下与天地同流","《孟子·尽心上》。"],["魇寐","做噩梦、梦中惊悸。"]],"gl":[126,268,47],"q":"睡觉时良知在不在？","a":"在。一叫便应就是证明。夜里良知收敛凝一，白天妙用发生，与天地开合同步。","yong":"晚上睡不好，常常是白天心太散。白天顺应无滞，夜里才能收敛。","con":"反方：「一叫便应」证明的是听觉系统在睡眠中仍有反应，这是生理机制，未必能证明「良知」（道德明觉）在睡眠中持续。阳明把生理意识和道德良知混为一谈，在概念上不够严谨。","rec":"黄省曾录","kj":[["r","画","昼","问通乎"],["r","画","昼","知原是知"],["r","间","问","知夜的又"],["r","岓","所","亦耳目无"],["r","慏","俱","睹闻众窍"],["r","无","有","人亦耳目"],["r","赌","睹","耳目无所"],["r","北郥","此即","众窍俱辟"],["r","郥","即","不是昏睡"],["r","黡","魇","郥是妄思"],["r","画","昼","先生曰知"],["r","闲","间","知夜矣日"],["r","湍","滞","是顺应无"]]},{"n":268,"t":"事物纷扰时常如夜气","yw":"又曰：「良知在夜气发的，方是本体，以其无物欲之杂也。学者要使事物纷扰之时，常如夜气一般，就是『通乎昼夜之道而知』。」","bh":"先生又说：「良知在夜气中发出来的，才是本体，因为它没有物欲的夹杂。学者要让事物纷扰的时候，也常常像夜气那样清明，这就是『通晓昼夜之道而知』。」","zs":[["夜气","参见第47条。"]],"gl":[47,267,69],"q":"怎样「通乎昼夜之道」？","a":"让白天事物纷扰时，心也像夜气那样清明无杂。","yong":"开会吵成一团时，想想清晨刚醒那一刻的清明，把那份清明带进会议室。","rec":"黄省曾录","kj":[["r","力","方","夜气发的"],["r","画","昼","就是通乎"]]},{"n":269,"t":"仙家说虚，佛氏说无","yw":"先生曰：「仙家说到虚，圣人岂能虚上加得一毫实？佛氏说到无，圣人岂能无上加得一毫有？但仙家说虚，从养生上来；佛氏说无，从出离生死苦海上来：却于本体上加却这些子意思在，便不是他虚无的本色了，便于本体有障碍。圣人只是还他良知的本色，更不着些子意在。良知之虚，便是天之太虚；良知之无，便是太虚之无形。日月风雷，山川民物，凡有貌象形色，皆在太虚无形中发用流行，未尝作得天的障碍。圣人只是顺其良知之发用，天地万物俱在我良知的发用流行中，何尝又有一物超于良知之外，能作得障碍？」","bh":"先生说：「道家讲到虚，圣人怎能在虚上再加一丝一毫的实？佛家讲到无，圣人怎能在无上再加一丝一毫的有？但道家讲虚，是从养生出发的；佛家讲无，是从脱离生死苦海出发的：这就在本体上加进了这一点私意，就不是虚无的本色了，就对本体有了障碍。圣人只是还良知的本色，不加一点私意。良知的虚，就是天的太虚；良知的无，就是太虚的无形。日月风雷、山川人物，凡是有形貌颜色的，都在太虚无形中发生作用、流行运转，从来没有成为天的障碍。圣人只是顺着良知的发用，天地万物都在我良知的发用流行之中，哪里还有一个东西超出良知之外，能成为障碍？」","zs":[["太虚","张载哲学术语，指无形无象的宇宙本体。"]],"gl":[49,270,261],"q":"阳明认为儒家与佛道在「虚无」上差在哪里？","a":"虚无本身不错，但道家为养生说虚、佛家为出离生死说无，都在本体上加了私意。圣人只还良知本色，不着一点意。","con":"反方：说道家「从养生上来」、佛家「从出离生死上来」，是对两家的简化。道家的虚无有其宇宙论和政治哲学的深意，佛家的空观也不只是为了个人解脱。阳明以「有私意」批评两家，而心学自身也常被批评为借用了禅宗的思路。","rec":"黄省曾录","kj":[["r","僊","仙","先生曰"],["i","","实","加得一毫"],["r","僊","仙","一毫有但"],["r","苫","苦","出离生死"],["i",
